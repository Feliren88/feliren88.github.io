hero:
  - "I'm an applied scientist working on <a href='https://arxiv.org/abs/2312.06942' target='_blank' rel='noreferrer'><strong>AI control</strong></a>. Labs are starting to deploy agents behind monitors, a second model that watches each action and flags anything dangerous. The catch rate of that monitor is the number a lot of safety cases now rest on. I test whether it survives inputs the red team never sampled, and I measure what gets missed when it does not."
  - "At Monash University, I'm working with <a href='https://research.monash.edu/en/persons/risqi-saputra/' target='_blank' rel='noreferrer'>Associate Professor Risqi Saputra</a> and <a href='https://research.monash.edu/en/persons/taufiq-asyhari/' target='_blank' rel='noreferrer'>Professor Taufiq Asyhari</a> on <a href='/research/'>conformal prediction for vision-language navigation</a>. That work taught me the habit I care most about now, which is asking what a guarantee is actually conditional on and which assumption fails first under pressure. Monitoring guarantees mostly have not been asked that question."
  - "The other input I bring is access. Southeast Asia is one of the most linguistically and visually diverse regions in the world and it is almost absent from the data and benchmarks that define what modern AI can do. I've spent years building datasets and adaptation methods there with <a href='https://seacrowd.github.io/' target='_blank' rel='noreferrer'>SEACrowd</a> and through my <a href='/research/'>own research</a>. For this agenda that is not an inclusion argument. It is an attack surface, and a source of the exact input distributions monitors have never been tested against."

sections:
  - title: 'Research Agenda'
    content: "One claim, three ways of attacking it. A monitor's miss rate is only characterised on the distribution its red team sampled, and nobody has measured how it degrades along the axes they did not vary. If it degrades sharply, control safety cases are quoting a number that does not survive deployment. Each of these sits in the gap between two communities that rarely talk to each other, which is usually where the tractable and neglected work hides."
    cards:
      - title: 'Monitors are only characterised where they were tested'
        description: "Deployed agents sit behind a second model that reads each action and scores it for suspicion. That monitor's miss rate gets measured against attacks a red team wrote, on inputs a red team chose. Shift the input language, shift the modality, stretch the trajectory past the monitor's window, and nobody knows what the miss rate becomes. In <a href='https://www.aisi.gov.uk/blog/stress-testing-asynchronous-monitoring-of-ai-coding-agents' target='_blank' rel='noreferrer'>UK AISI's stress test of asynchronous monitoring</a>, a first-round monitor missed up to 67% of attacks and fell to 6% only after three rounds of iterating against the attacks it had already seen. That is a number earned on one distribution. I hold the attack fixed and vary the input instead, which is the cheaper axis and the one nobody has swept."
      - title: 'Probes and steering have an unmeasured transfer rate'
        description: "Linear probes and activation steering, following <a href='https://arxiv.org/abs/2310.01405' target='_blank' rel='noreferrer'>representation engineering</a>, are becoming the core instruments for reading a model's internal state for deception, refusal, or harmful intent. Almost all of that validation is English text. A probe that reads honesty in English and returns noise in Indonesian does not announce itself. It fails silently, and the safety case never notices it has stopped working. This is the internals version of the same question, and unlike most things in interpretability it is directly measurable."
      - title: 'What a safety guarantee is actually conditional on'
        description: "Control protocols report empirical safety and usefulness curves with no statement about coverage. <a href='https://arxiv.org/abs/2402.10978' target='_blank' rel='noreferrer'>Distribution-free methods</a> can supply that statement, but their assumptions break under exactly the adversarial shift that safety cares about. I work on naming which assumption fails first and what the bound degrades to when it does. This is where my uncertainty quantification background earns its place, as a tool I reach for rather than a topic I identify with."
      - title: 'Where it gets tested'
        description: "These have to survive contact with systems that were not built for the test. I run them on <a href='https://control-arena.aisi.org.uk/' target='_blank' rel='noreferrer'>ControlArena</a>, UK AISI's open library for control experiments, rather than a harness of my own, so anyone can rerun what I claim. The inputs come from work I already know: agent trajectories in vision-language navigation, the subject of my thesis; multimodal models for earth observation, published in IEEE and Remote Sensing of Environment; open multilingual models for Southeast Asia with <a href='https://seacrowd.github.io/' target='_blank' rel='noreferrer'>SEACrowd</a> and SEA-VL. The distributions that English-first, benchmark-first evaluation never sees."
