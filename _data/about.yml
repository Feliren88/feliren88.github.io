hero:
  - "I'm an applied scientist working on <a href='https://arxiv.org/abs/2312.06942' target='_blank' rel='noreferrer'><strong>AI control</strong></a>. Labs are starting to deploy agents behind monitors, a second model that watches each action and flags anything dangerous. The catch rate of that monitor is the number a lot of safety cases now rest on. I test whether it survives inputs the red team never sampled, and I measure what gets missed when it does not."
  - "At Monash University, I'm working with <a href='https://research.monash.edu/en/persons/risqi-saputra/' target='_blank' rel='noreferrer'>Associate Professor Risqi Saputra</a> and <a href='https://research.monash.edu/en/persons/taufiq-asyhari/' target='_blank' rel='noreferrer'>Professor Taufiq Asyhari</a> on <a href='/research/'>conformal prediction for vision-language navigation</a>. That work left me with one habit. When I see a guarantee, I ask what it depends on, and which of those things breaks first. Monitoring is where I want to ask it next."
  - "The other input I bring is access. Southeast Asia is one of the most linguistically and visually diverse regions in the world and it is almost absent from the data and benchmarks that define what modern AI can do. I've spent years building datasets and adaptation methods there with <a href='https://seacrowd.github.io/' target='_blank' rel='noreferrer'>SEACrowd</a> and through my <a href='/research/'>own research</a>. For this agenda that is not an inclusion argument. It is an attack surface, and a source of the exact input distributions monitors have never been tested against."

sections:
  - title: 'Research Agenda'
    content: "A monitor gets tested before it ships, and the test gives you a number: how often it catches a dangerous action. Every such number comes with conditions attached. A set of attacks, and a set of inputs. Change the language, change the modality, let the task run longer, and we do not yet know whether the number holds. Finding out is useful either way. If it holds, that strengthens the safety case. If it drops, we have learned something we needed to know. That is what I work on, and the three problems below are where I think it can be answered."
    cards:
      - title: 'Monitors are only characterised where they were tested'
        description: "Deployed agents sit behind a second model that reads each action and scores it for suspicion. To know how well that monitor works, you measure it against a set of attacks, on a set of inputs. Shift the input language, shift the modality, let the task run past the monitor's window, and the measurement has to be redone. <a href='https://www.aisi.gov.uk/blog/stress-testing-asynchronous-monitoring-of-ai-coding-agents' target='_blank' rel='noreferrer'>UK AISI's stress test of asynchronous monitoring</a> shows how much room there is. A first-round monitor missed up to 67% of attacks. After three rounds of iterating, the worst case was 6%. Iterating against known attacks moves the number a long way, so it is worth knowing what moving the inputs does. I hold the attack fixed and vary the input instead."
      - title: 'Probes and steering have an unmeasured transfer rate'
        description: "Linear probes and activation steering, following <a href='https://arxiv.org/abs/2310.01405' target='_blank' rel='noreferrer'>representation engineering</a>, are becoming the core instruments for reading a model's internal state for deception, refusal, or harmful intent. Almost all of that validation is English text. A probe that reads honesty in English and returns noise in Indonesian does not announce itself. It fails silently, and the safety case never notices it has stopped working. This is the internals version of the same question, and unlike most things in interpretability it is directly measurable."
      - title: 'What a safety guarantee is actually conditional on'
        description: "Control protocols report how safe and how useful a system was in testing. What they do not yet report is coverage: the conditions under which those numbers are promised to hold. <a href='https://arxiv.org/abs/2402.10978' target='_blank' rel='noreferrer'>Distribution-free methods</a> can supply that promise. Their own assumptions also break under adversarial shift, which is the setting safety cares about most. So the work is to say which assumption goes first, and what you are left with when it does. This is where my background in uncertainty quantification earns its place, as a tool rather than a topic."
      - title: 'Where it gets tested'
        description: "These ideas have to survive contact with systems that were not built for the test. I run them on <a href='https://control-arena.aisi.org.uk/' target='_blank' rel='noreferrer'>ControlArena</a>, UK AISI's open library for control experiments, rather than a harness of my own. That way anyone can rerun what I claim. The inputs come from work I already know. Agent trajectories from my thesis on vision-language navigation. Multimodal models for earth observation, published in IEEE and Remote Sensing of Environment. Open multilingual models for Southeast Asia, built with <a href='https://seacrowd.github.io/' target='_blank' rel='noreferrer'>SEACrowd</a> and SEA-VL. These are the inputs that English-first, benchmark-first evaluation never sees."
