hero:
  - "I'm an applied scientist working on <strong>calibration under safety alignment</strong>. Training a model to be safe has a cost, and some of it lands on calibration, meaning how well a model's confidence tracks whether it is right. A model that loses that defers badly, so you keep it on small problems. I want safe models to be more useful, and my starting position is that the current tradeoff is worse than it needs to be."
  - "At Monash University, I'm working with <a href='https://research.monash.edu/en/persons/risqi-saputra/' target='_blank' rel='noreferrer'>Associate Professor Risqi Saputra</a> and <a href='https://research.monash.edu/en/persons/taufiq-asyhari/' target='_blank' rel='noreferrer'>Professor Taufiq Asyhari</a> on <a href='/research/'>conformal prediction for vision-language navigation</a>. That work left me with one habit. When I see a guarantee, I ask what it depends on, and which of those things breaks first. It is also the tool I want to point at this problem. A model whose calibration has slipped still needs some way to defer, and that deferral should come with a bound."
  - "The other input I bring is access. Southeast Asia is one of the most linguistically and visually diverse regions in the world and it is almost absent from the data and benchmarks that define what modern AI can do. I've spent years building datasets and adaptation methods there with <a href='https://seacrowd.github.io/' target='_blank' rel='noreferrer'>SEACrowd</a> and through my <a href='/research/'>own research</a>. Safety training data is overwhelmingly English text. If its cost falls unevenly, this is where you would see it first. Measuring that takes data and native fluency. I have both."

sections:
  - title: 'Research Agenda'
    content: "Making a model safer costs something, and the literature calls it the <a href='https://aclanthology.org/2024.emnlp-main.35/' target='_blank' rel='noreferrer'>alignment tax</a>. It gets reported as one number averaged over a test set, but I think it is a distribution over inputs whose shape nobody has measured. If the cost is largest where the safety data was thinnest, then a model we call safety aligned is aligned unevenly, and we would not see it, because we measure where the data already was."
    cards:
      - title: 'Calibration is where the safety tax gets paid'
        description: "Safety training shifts what a model outputs, and its confidence is a property of that output. The capability cost is well studied, from <a href='https://aclanthology.org/2024.emnlp-main.35/' target='_blank' rel='noreferrer'>Lin et al. (EMNLP 2024)</a> on the alignment tax to <a href='https://arxiv.org/abs/2503.00555' target='_blank' rel='noreferrer'>Huang et al.</a> on reasoning. The calibration cost has had less attention. <a href='https://proceedings.iclr.cc/paper_files/paper/2025/file/29fb6e1456b3d8b57ede5c45aa2c6537-Paper-Conference.pdf' target='_blank' rel='noreferrer'>Leng et al. (ICLR 2025)</a> show RLHF drives models to verbalise overconfidence, and <a href='https://arxiv.org/abs/2510.17426' target='_blank' rel='noreferrer'>Hu et al. (ACL 2026 Findings)</a> call the loss severe. That is the cost I care about, because calibration decides how much you can delegate."
      - title: 'The cost is probably not spread evenly'
        description: "Safety training data is overwhelmingly English text. There is no particular reason its cost should fall evenly across inputs that were unevenly represented in it. So I measure the calibration change per language and per modality rather than averaged, because an average over a distribution you never sampled is not really a measurement. This is the experiment I am running now, and it is useful either way. If the cost is uniform, that is worth knowing and it makes the problem simpler. If it is not, then some users are getting a worse-calibrated model than the benchmark suggests."
      - title: 'Getting the deference back, with something you can bound'
        description: "Measuring a problem is half a contribution. The other half is recovery. <a href='https://arxiv.org/abs/2510.17426' target='_blank' rel='noreferrer'>Hu et al. (ACL 2026 Findings)</a> restore some calibration by merging model weights from before and after alignment. I want to know whether you can do it at the other end, by putting an abstention layer with <a href='https://proceedings.mlr.press/v235/mohri24a.html' target='_blank' rel='noreferrer'>distribution-free coverage (ICML 2024)</a> on top of a model whose calibration has already been degraded, and what that costs in usefulness. This is where uncertainty quantification earns its place, as a tool aimed at a specific failure rather than a subject of its own."
      - title: 'Where it gets tested'
        description: "These ideas have to survive contact with systems that were not built for the test. I start by replicating a published result in a setup I can run end to end, because building on numbers I have not reproduced myself is how you waste a year. The inputs come from work I already know. Agent trajectories from my thesis on vision-language navigation. Multimodal models for earth observation, published in IEEE and Remote Sensing of Environment. Open multilingual models for Southeast Asia, built with <a href='https://seacrowd.github.io/' target='_blank' rel='noreferrer'>SEACrowd</a> and SEA-VL. These are the inputs that English-first, benchmark-first evaluation never sees."
