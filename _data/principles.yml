# The Life Operating Principle — /principles/
# Consumed by _pages/principles.md. Each situation becomes a searchable, filterable
# card and feeds the "what do I do now" console at the top of the page.
#
# id       : stable slug, used as the anchor and in the console
# trigger  : the state you are in when you need this
# group    : one of  pressure | work | money | people | self | decide
# ask      : the question to ask instead of the obvious one
# donts    : things not to do (optional)
# steps    : ordered actions (optional)
# body     : supporting prose (optional, array of paragraphs)
# rule     : the compressed rule worth memorising
# reversible: true | false | null  — whether decisions in this state are usually reversible

situations:
  - id: angry
    trigger: When angry
    group: pressure
    ask: What boundary was actually crossed, and what outcome do I want?
    donts:
      - Send the message now
      - Resign now
      - Threaten or retaliate
      - Embarrass someone publicly
      - Make a permanent decision to solve a temporary feeling
    steps:
      - Stop communicating for now.
      - Write down exactly what happened.
      - Separate the actual offence from your interpretation of it.
      - Name the boundary that was crossed.
      - Decide what outcome you actually want.
      - Communicate the boundary once you are calm.
      - Escalate only if the behaviour continues.
    rule: Anger provides information. Decide your response separately.
    reversible: false
    viz:
      type: split
      in: "What happened"
      out:
        - k: "The actual offence"
          on: true
        - k: "Your interpretation of it"
          on: false

  - id: afraid
    trigger: When afraid
    group: pressure
    ask: What exactly am I afraid will happen?
    body:
      - Fear produces two bad reflexes. Avoid everything, or control everything. Do neither automatically.
      - Classify the fear as probable, possible, unlikely, imagined, or preventable. Protect against the realistic downside and stop there.
    rule: Manage risk. Do not worship safety.
    viz:
      type: bands
      cap: "Protect against the realistic downside and stop there."
      mark: 0
      items:
        - "probable"
        - "possible"
        - "unlikely"
        - "imagined"
        - "preventable"

  - id: confused
    trigger: When confused
    group: pressure
    ask: What is the actual decision in front of me?
    body:
      - Do not solve ten problems at once. Write down what you know, what you do not know, what information would genuinely change the decision, and what information is merely comforting to collect.
      - Set a deadline. When enough evidence exists, decide.
    rule: More thinking helps only while it can still change the decision.
    viz:
      type: split
      in: "Everything in your head"
      out:
        - k: "Would change the decision"
          on: true
        - k: "Comforting to collect"
          on: false

  - id: overwhelmed
    trigger: When overwhelmed
    group: pressure
    ask: What must be protected today?
    body:
      - Reduce the time horizon. You are not solving your whole life this week.
    steps:
      - Physical safety
      - Health
      - Sleep
      - Essential money
      - Legal obligations
      - Important relationships
      - The next necessary action
    rule: Under overload, protect the foundation before optimising the future.
    viz:
      type: stack
      cap: "Protect the foundation before optimising the future."
      items:
        - "The next necessary action"
        - "Important relationships"
        - "Legal obligations"
        - "Essential money"
        - "Sleep"
        - "Health"
        - "Physical safety"

  - id: exhausted
    trigger: When exhausted
    group: self
    ask: Is this a conclusion, or is this fatigue?
    body:
      - I do not trust major conclusions reached while exhausted. I restore sleep, food, movement, quiet and basic routine first, then reconsider.
    rule: Do not redesign your life while depleted.
    viz:
      type: gate
      before: "A major conclusion"
      stop: "Sleep, food, movement, quiet"
      after: "Reconsider"
      cap: "Do not redesign your life while depleted."

  - id: emergency
    trigger: When something has just gone wrong
    group: pressure
    ask: What is the order of operations here?
    steps:
      - Stabilise.
      - Understand.
      - Decide.
      - Act.
    body:
      - Never reverse that order. Do not make a major decision merely to stop an uncomfortable feeling.
    rule: Stabilise first. Understand second. Decide third. Act fourth.
    viz:
      type: order
      cap: "Never reverse that order."
      items:
        - "Stabilise"
        - "Understand"
        - "Decide"
        - "Act"

  - id: career
    trigger: When making a career decision
    group: work
    ask: Three years from now, what will I own or know because I took this?
    body:
      - Never evaluate a role on salary and title alone. Ask whether it increases at least two of capability, judgement, network, ownership, reputation, autonomy, or future earning power.
      - Be careful with more money plus more responsibility plus no new leverage. That combination is a golden cage.
    rule: Do not confuse being needed with progressing.
    viz:
      type: chips
      cap: "More money plus more responsibility plus no new leverage is a golden cage."
      groups:
        - k: "Does it increase at least two of these?"
          on: true
          items:
            - "Capability"
            - "Judgement"
            - "Network"
            - "Ownership"
            - "Reputation"
            - "Autonomy"
            - "Future earning power"

  - id: unbearable-work
    trigger: When work becomes unbearable
    group: work
    ask: What exactly is broken?
    body:
      - Before asking whether to quit, name the component. Manager, role, company, industry, pay, workload, autonomy, values, geography, or your own expectations.
      - Do not demolish the whole structure if one part can be repaired. Do not keep repairing something whose basic architecture is wrong.
    rule: Fix the component when possible. Leave the system when necessary.
    viz:
      type: chips
      cap: "Fix the component when possible. Leave the system when necessary."
      groups:
        - k: "Name the component"
          on: true
          items:
            - "Manager"
            - "Role"
            - "Company"
            - "Industry"
            - "Pay"
            - "Workload"
            - "Autonomy"
            - "Values"
            - "Geography"
            - "Your own expectations"

  - id: promotion
    trigger: When offered a promotion
    group: work
    ask: Am I being given greater authority, or only greater responsibility?
    body:
      - Responsibility without authority is dangerous. Responsibility without compensation is exploitation. Authority without competence is dangerous.
      - Authority with competence, resources and accountability is the version worth having.
    rule: Never accept importance merely because it flatters your identity.
    viz:
      type: split
      in: "What is being offered"
      out:
        - k: "Greater authority"
          on: true
        - k: "Only greater responsibility"
          on: false

  - id: business
    trigger: When starting a business
    group: work
    ask: What assumption can I test cheaply this month?
    donts:
      - Start because you hate your boss
      - Start merely because you want freedom
    body:
      - Work through the real questions. Is there a real customer? A real problem? Will someone pay? Can the economics work? What is your unfair advantage? How long can you survive if growth is slow?
    rule: Experiment cheaply before believing expensively.
    viz:
      type: test
      claim: "An assumption"
      probe: "A cheap test this month"
      result: "Evidence"
      cap: "Experiment cheaply before believing expensively."

  - id: partners
    trigger: When choosing business partners
    group: work
    ask: How does this person behave under pressure?
    body:
      - Brilliance alone is insufficient. Evaluate ethics, emotional stability, incentives, financial discipline, communication, reliability and reputation.
      - Before you begin, agree ownership, responsibilities, decision rights, compensation, how disagreements get settled, and exit terms.
    rule: Trust people emotionally. Structure agreements professionally.
    viz:
      type: chips
      cap: "Trust people emotionally. Structure agreements professionally."
      groups:
        - k: "Evaluate"
          on: false
          items:
            - "Ethics"
            - "Emotional stability"
            - "Incentives"
            - "Financial discipline"
            - "Communication"
            - "Reliability"
            - "Reputation"
        - k: "Agree before you begin"
          on: true
          items:
            - "Ownership"
            - "Responsibilities"
            - "Decision rights"
            - "Compensation"
            - "How disagreements settle"
            - "Exit terms"

  - id: invest
    trigger: When considering an investment
    group: money
    ask: Would losing this amount alter my life?
    donts:
      - Invest because everyone else is making money
      - Invest because you fear missing out
      - Invest because someone sounds confident
      - Invest because you need a large return
      - Invest to recover a previous loss
    body:
      - Understand how money is made here, how it can be lost, the liquidity, the concentration, the leverage, and the worst case.
    rule: Never risk something essential to obtain something nonessential.
    viz:
      type: chips
      cap: "Never risk something essential to obtain something nonessential."
      groups:
        - k: "Understand"
          on: true
          items:
            - "How money is made here"
            - "How it can be lost"
            - "Liquidity"
            - "Concentration"
            - "Leverage"
            - "The worst case"
        - k: "Not a reason"
          on: false
          items:
            - "Everyone else is earning"
            - "Fear of missing out"
            - "Someone sounds confident"
            - "To recover a loss"

  - id: money-up
    trigger: When money increases
    group: money
    ask: Am I buying freedom or buying obligations?
    body:
      - Do not raise your lifestyle to match the new number straight away. Put the increase into safety, freedom, assets, knowledge and bargaining power first.
      - Avoid building a life that forces you to keep doing work you will eventually hate.
    rule: Use money to build freedom from bad choices.
    viz:
      type: split
      in: "The increase"
      out:
        - k: "Safety, freedom, assets, bargaining power"
          on: true
        - k: "Lifestyle raised to match"
          on: false

  - id: money-down
    trigger: When money decreases
    group: money
    ask: What is the machine that can rebuild, and am I protecting it?
    body:
      - Cut unnecessary fixed costs, status spending, ego spending, and commitments that return little.
      - Preserve housing, health, food, essential insurance, productive tools, critical relationships, and your capacity to earn again.
    rule: During contraction, protect the machine that can rebuild.
    viz:
      type: chips
      cap: "Protect the machine that can rebuild."
      groups:
        - k: "Cut"
          on: false
          items:
            - "Unnecessary fixed costs"
            - "Status spending"
            - "Ego spending"
            - "Low-return commitments"
        - k: "Preserve"
          on: true
          items:
            - "Housing"
            - "Health"
            - "Food"
            - "Essential insurance"
            - "Productive tools"
            - "Critical relationships"
            - "Capacity to earn"

  - id: purchase
    trigger: When making a major purchase
    group: money
    ask: Would I still want this if nobody knew I owned it?
    body:
      - Wait when excitement is unusually high. Then ask what freedom you are exchanging for it.
      - The real price includes maintenance, debt, attention, storage, insurance, and sometimes an inability to leave a job.
    rule: Count the full price, including the freedom you give up.
    viz:
      type: chips
      cap: "Count the full price, including the freedom you give up."
      groups:
        - k: "The sticker"
          on: false
          items:
            - "The price you were quoted"
        - k: "Also the price"
          on: true
          items:
            - "Maintenance"
            - "Debt"
            - "Attention"
            - "Storage"
            - "Insurance"
            - "Being unable to leave a job"

  - id: negotiate
    trigger: When negotiating
    group: money
    ask: What is my credible alternative?
    body:
      - Know your preferred outcome, your minimum acceptable outcome, your alternatives, and what you are willing to walk away from.
      - The strongest person in the room is rarely the loudest. It is the one who can leave.
    rule: Options create bargaining power.
    viz:
      type: scale
      a: "This offer"
      b: "Your credible alternative"
      cap: "The strongest person in the room is the one who can leave."

  - id: relationship-start
    trigger: When entering a relationship
    group: people
    ask: What patterns does this person's behaviour reveal?
    body:
      - Chemistry begins the connection. Judge its long-term potential through reliability, honesty, conflict behaviour, accountability, financial behaviour, treatment of people with less power, respect for boundaries, apologies, and consistency between words and actions.
      - Attraction tells you to approach. Character tells you whether to stay.
    rule: Choose long-term partners by their repeated behaviour.
    viz:
      type: split
      in: "What each one tells you"
      out:
        - k: "Character: whether to stay"
          on: true
        - k: "Attraction: whether to approach"
          on: false

  - id: infatuated
    trigger: When deeply attracted to someone
    group: people
    ask: Am I building a future faster than I am accumulating evidence?
    body:
      - Stay curious about who they actually are. Do not explain away repeated bad behaviour because the connection feels exceptional.
    rule: Compatibility requires evidence beyond emotional intensity.
    viz:
      type: trend
      fast: "The future you are building"
      slow: "The evidence you have"
      cap: "Compatibility requires evidence beyond emotional intensity."

  - id: conflict
    trigger: When relationship conflict begins
    group: people
    ask: Can I say this while it is still small?
    steps:
      - Say what happened.
      - Say how it affected you.
      - Say what you need.
      - Ask what they need.
    body:
      - Do not silently accumulate evidence against someone.
    rule: Early honesty is cheaper than late resentment.
    viz:
      type: order
      cap: "Early honesty is cheaper than late resentment."
      items:
        - "Say what happened"
        - "Say how it affected you"
        - "Say what you need"
        - "Ask what they need"

  - id: stay-or-leave
    trigger: When deciding whether to stay or leave
    group: people
    ask: If nothing changed for three years, would I willingly choose this?
    body:
      - Ignore one unusually good day. Ignore one unusually bad day. Look at the pattern.
      - Then ask whether the problem is painful but repairable, or structural and repeatedly denied.
      - Do not stay on sunk cost alone. Do not leave merely because intimacy takes effort.
    rule: Judge the full pattern across many conversations.
    reversible: false
    viz:
      type: pattern
      lo: "one unusually bad day"
      hi: "one unusually good day"
      cap: "Judge the full pattern across many conversations."

  - id: family
    trigger: When dealing with family
    group: people
    ask: Am I supporting them, or repeatedly rescuing them from something they refuse to address?
    body:
      - Respect does not require unlimited access. Love does not require permanent obedience.
      - Help people without becoming responsible for every consequence of their decisions.
    rule: Compassion without boundaries eventually becomes resentment.
    viz:
      type: split
      in: "What is being asked of you"
      out:
        - k: "Support"
          on: true
        - k: "Rescue from something they refuse to address"
          on: false

  - id: friends
    trigger: When dealing with friends
    group: people
    ask: Is there reciprocity over time?
    body:
      - It does not need to be equal every week. Over a year there should be mutual concern, effort, honesty, respect and goodwill.
      - Do not stay loyal to people who punish your growth. Do not drop good people because your circumstances improved.
    rule: Protect relationships that want both your wellbeing and your growth.
    viz:
      type: scale
      a: "What you give"
      b: "What you receive"
      cap: "Not equal every week. Over a year there should be reciprocity."

  - id: power
    trigger: When dealing with powerful people
    group: people
    ask: What do they want, control, and fear?
    body:
      - Do not become submissive because they have status. Do not become rebellious because they have authority.
      - Study their incentives and find where your interests genuinely overlap. Stay respectful without surrendering judgement.
    rule: Understand power without becoming psychologically owned by it.
    viz:
      type: hub
      center: "Them"
      cap: "Stay respectful without surrendering judgement."
      nodes:
        - "What they want"
        - "What they control"
        - "What they fear"

  - id: criticised
    trigger: When someone criticises you
    group: self
    ask: Is any part of this true?
    body:
      - Take the useful information and discard the hostility. If it is accurate, improve. If it is inaccurate but consequential, clarify. If it is inaccurate and irrelevant, move on.
    rule: Accept that you cannot control every interpretation of you.
    viz:
      type: split
      in: "The criticism"
      out:
        - k: "Accurate: improve"
          on: true
        - k: "Inaccurate but consequential: clarify"
          on: false
        - k: "Inaccurate and irrelevant: move on"
          on: false

  - id: embarrassed
    trigger: When publicly embarrassed
    group: self
    ask: Am I about to make the recovery worse than the event?
    body:
      - Correct important factual errors. Take responsibility where it belongs. Do not overexplain. Then keep behaving consistently.
      - Most reputational repair comes from consistent future behaviour. One perfect statement cannot do that work alone.
    rule: Behave your way out. Do not talk your way out.
    viz:
      type: gate
      before: "The event"
      stop: "Do not overexplain"
      after: "Consistent future behaviour"
      cap: "Behave your way out. Do not talk your way out."

  - id: lie
    trigger: When tempted to lie
    group: self
    ask: What future problem am I creating to avoid today's discomfort?
    body:
      - Small lies carry ongoing maintenance costs. Tell the truth tactfully and early where you can.
    rule: Do not borrow comfort from the future at compound interest.
    viz:
      type: trend
      fast: "The maintenance cost"
      slow: "Today's discomfort avoided"
      cap: "Do not borrow comfort from the future at compound interest."

  - id: betrayed
    trigger: When someone betrays your trust
    group: people
    ask: What needs protecting before I react?
    steps:
      - Protect money, accounts, legal position, information, reputation and physical safety.
      - Document the facts.
      - Then decide whether the relationship can be repaired.
    rule: Protection first. Judgement second. Revenge never as strategy.
    viz:
      type: order
      cap: "Protection first. Judgement second. Revenge never as strategy."
      items:
        - "Protect"
        - "Document the facts"
        - "Then judge the relationship"

  - id: relocate
    trigger: When relocating
    group: decide
    ask: What version of me does this environment encourage?
    body:
      - Liking a city is the small question. Consider people, professional opportunity, cost, culture, safety, lifestyle, relationships, learning and future mobility.
      - Places change behaviour by changing what counts as normal.
    rule: Environments edit you slowly and without asking.
    viz:
      type: chips
      cap: "Environments edit you slowly and without asking."
      groups:
        - k: "The small question"
          on: false
          items:
            - "Do I like the city"
        - k: "The real questions"
          on: true
          items:
            - "People"
            - "Professional opportunity"
            - "Cost"
            - "Culture"
            - "Safety"
            - "Lifestyle"
            - "Relationships"
            - "Learning"
            - "Future mobility"

  - id: mentors
    trigger: When choosing people to learn from
    group: self
    ask: Do I actually want their life, or only their results?
    body:
      - Someone can be brilliant at making money and terrible at living. Someone can be famous and privately miserable. Someone can be accomplished and destructive to everyone near them.
    rule: Never copy a strategy without examining the life it produces.
    viz:
      type: split
      in: "What you are copying"
      out:
        - k: "Their life"
          on: true
        - k: "Only their results"
          on: false

  - id: learning
    trigger: When learning something difficult
    group: self
    ask: Can I use this yet, or have I only read about it?
    steps:
      - Learn
      - Practise
      - Produce
      - Get feedback
      - Correct
      - Repeat
    body:
      - Capability grows when you apply information in practice.
    rule: If you cannot use it, you do not own it yet.
    viz:
      type: loop
      cap: "If you cannot use it, you do not own it yet."
      nodes:
        - "Learn"
        - "Practise"
        - "Produce"
        - "Feedback"
        - "Correct"

  - id: procrastinating
    trigger: When procrastinating
    group: self
    ask: What discomfort am I avoiding?
    body:
      - It is usually uncertainty, possible failure, boredom, embarrassment, complexity, or commitment.
      - Shrink the first step until avoiding it takes more effort than doing it. Then begin.
    rule: Name the discomfort and the task gets smaller.
    viz:
      type: funnel
      wide: "The whole task"
      narrow: "A first step so small that avoiding it costs more"
      cap: "Name the discomfort and the task gets smaller."

  - id: perfectionism
    trigger: When perfectionism appears
    group: self
    ask: Does this need precision, or only completion?
    body:
      - Some mistakes are expensive. Most are harmless. Spend perfection only where errors genuinely matter.
    rule: Precision is a resource. Allocate it intelligently.
    viz:
      type: split
      in: "This piece of work"
      out:
        - k: "Errors genuinely matter: precision"
          on: false
        - k: "Harmless: completion"
          on: false

  - id: health
    trigger: When health starts deteriorating
    group: self
    ask: What can be paused, delegated, simplified or stopped?
    body:
      - Protect the physical system that makes every other ambition possible. Get proper care, avoid self-diagnosis, and reduce the load.
    rule: Health is the foundation that makes success possible.
    viz:
      type: rings
      core: "Health"
      mid: "Every other ambition"
      outer: "The load you can pause, delegate, simplify or stop"
      cap: "Health is the foundation that makes success possible."

  - id: lonely
    trigger: When lonely
    group: self
    ask: Am I about to lower my standards because this is familiar?
    body:
      - Loneliness lowers standards. Build connection deliberately through friends, family, communities, hobbies, professional groups, volunteering and shared learning.
    rule: Temporary loneliness is sometimes the cost of leaving the wrong environment first.
    viz:
      type: split
      in: "Loneliness"
      out:
        - k: "Build connection deliberately"
          on: true
        - k: "Lower your standards because it is familiar"
          on: false

  - id: bored
    trigger: When bored
    group: self
    ask: Do I need challenge, learning, creativity, people, movement, or rest?
    body:
      - Do not destroy something stable simply to feel alive. Add novelty deliberately before creating chaos by accident.
    rule: Add novelty deliberately while preserving what still works.
    viz:
      type: chips
      cap: "Add novelty deliberately before creating chaos by accident."
      groups:
        - k: "What is actually missing"
          on: true
          items:
            - "Challenge"
            - "Learning"
            - "Creativity"
            - "People"
            - "Movement"
            - "Rest"

  - id: jealous
    trigger: When jealous
    group: self
    ask: What does this reveal that I want?
    body:
      - Separate what you genuinely desire from what you want others to see you possessing.
      - Use envy as information. Never as a decision-maker.
    rule: Use envy to identify a desire, then decide whether that desire deserves pursuit.
    viz:
      type: split
      in: "The envy"
      out:
        - k: "What you genuinely want"
          on: true
        - k: "What you want to be seen possessing"
          on: false

  - id: comparing
    trigger: When comparing yourself to others
    group: self
    ask: Am I moving towards a life I respect?
    body:
      - Compare trajectories over time. You rarely know another person's starting point, debt, support, private suffering, luck, sacrifices or hidden advantages.
    rule: Compare trajectories over time.
    viz:
      type: chips
      cap: "Compare trajectories over time."
      groups:
        - k: "What you see"
          on: false
          items:
            - "Their result"
        - k: "What you do not see"
          on: true
          items:
            - "Their starting point"
            - "Debt"
            - "Support"
            - "Private suffering"
            - "Luck"
            - "Sacrifices"
            - "Hidden advantages"

  - id: praised
    trigger: When praised
    group: self
    ask: Is this steering me, or just pleasing me?
    body:
      - Enjoy it. But if praise sets your direction, criticism will also control you.
    rule: Receive validation without becoming dependent on it.
    viz:
      type: split
      in: "Praise"
      out:
        - k: "Steering your direction"
          on: false
        - k: "Just pleasing you"
          on: false

  - id: succeeding
    trigger: When succeeding
    group: self
    ask: What exactly is succeeding?
    body:
      - This is one of the most dangerous moments. Income can rise while health deteriorates, relationships weaken, curiosity disappears, freedom shrinks and responsibility becomes unbearable.
    rule: Measure the whole life across every important dimension.
    viz:
      type: chips
      cap: "Income can rise while every other dimension falls."
      groups:
        - k: "What exactly is succeeding?"
          on: true
          items:
            - "Income"
            - "Health"
            - "Relationships"
            - "Curiosity"
            - "Freedom"
            - "Responsibility"

  - id: failing
    trigger: When failing
    group: self
    ask: What did reality just teach me?
    body:
      - Separate bad strategy, bad timing, bad execution, insufficient skill, insufficient resources, random bad luck, and a fundamentally bad idea. They have different fixes.
    rule: A mistake becomes expensive only when you refuse to learn from it.
    viz:
      type: chips
      cap: "They have different fixes."
      groups:
        - k: "Which one was it?"
          on: true
          items:
            - "Bad strategy"
            - "Bad timing"
            - "Bad execution"
            - "Insufficient skill"
            - "Insufficient resources"
            - "Random bad luck"
            - "A bad idea"

  - id: repeating
    trigger: When something repeatedly fails
    group: self
    ask: What role do I keep playing in this?
    body:
      - After the third serious repetition, stop calling it bad luck. Ask what warning you ignored, what assumption keeps returning, what kind of person or environment keeps producing this, and what boundary should have existed earlier.
    rule: Repeated pain usually points to a problem in the system.
    viz:
      type: loop
      exit: "After the third time, look at the system"
      cap: "Repeated pain usually points to a problem in the system."
      nodes:
        - "It happens"
        - "You explain it"
        - "It happens again"

  - id: opportunities
    trigger: When opportunities suddenly multiply
    group: decide
    ask: Do these reinforce each other, or fragment me?
    body:
      - Opportunity has a hidden cost, and the cost is fragmentation. Prefer one direction that compounds over five unrelated ones that consume attention.
    rule: A good opportunity can still be the wrong opportunity.
    viz:
      type: funnel
      wide: "Five unrelated directions"
      narrow: "One direction that compounds"
      cap: "A good opportunity can still be the wrong opportunity."

  - id: two-goods
    trigger: When choosing between two good options
    group: decide
    ask: Which one is harder to recreate later?
    body:
      - Ask which teaches more, puts better people around you, increases ownership, preserves flexibility, and exposes you to valuable problems.
    rule: Choose according to the long-term options each path preserves.
    viz:
      type: scale
      a: "Easy to recreate later"
      b: "Hard to recreate later"
      cap: "Choose according to the options each path preserves."

  - id: irreversible
    trigger: When the decision is hard to reverse
    group: decide
    ask: What evidence would I need to be confident, and do I have it?
    body:
      - Marriage. Major debt. Children. Selling a company. Personal guarantees. Major legal commitments. Permanent relocation. Ending an important relationship.
      - Slow down. Get independent perspectives. Consider the downside honestly. Do not let urgency created by another person replace your own judgement.
    rule: The harder a decision is to reverse, the higher the evidence threshold.
    reversible: false
    viz:
      type: threshold
      label: "Evidence needed before you commit"
      lo: "easy to undo"
      hi: "hard to undo"
      cap: "The harder a decision is to reverse, the higher the threshold."
      mark: 0.86

  - id: reversible
    trigger: When the decision is easy to reverse
    group: decide
    ask: What is the smallest test that produces real information?
    body:
      - A pilot project, a short contract, a small investment of time, a temporary relocation, a prototype, a trial collaboration.
      - Months of speculation lose to one cheap experiment.
    rule: Reversible decisions deserve speed. Irreversible ones deserve patience.
    reversible: true
    viz:
      type: test
      claim: "The question"
      probe: "The smallest real test"
      result: "Real information"
      cap: "Months of speculation lose to one cheap experiment."

  - id: changed
    trigger: When circumstances suddenly change
    group: decide
    ask: If I were starting today with what I now know, would I choose the same strategy?
    body:
      - Do not defend the old plan out of habit. Plans exist to serve reality, and reality owes your plan nothing.
    rule: Accept the facts and update the plan.
    viz:
      type: split
      in: "The facts changed"
      out:
        - k: "Update the plan"
          on: true
        - k: "Defend the old plan out of habit"
          on: false

  - id: wrong
    trigger: When you were wrong
    group: decide
    ask: Was it information, reasoning, ego, incentives, wishful thinking, or fear?
    body:
      - Say it plainly. I was wrong. Then find the cause and change the process that produced the conclusion.
    rule: Being wrong is temporary. Refusing to update makes it permanent.
    viz:
      type: bands
      cap: "Find the cause, then change the process that produced it."
      mark: -1
      items:
        - "information"
        - "reasoning"
        - "ego"
        - "incentives"
        - "wishful thinking"
        - "fear"

  - id: everyone-agrees
    trigger: When everyone agrees with you
    group: decide
    ask: What would have to be true for my entire view to be wrong?
    body:
      - Become slightly suspicious. Go and find someone intelligent who disagrees, especially before a major financial, professional or strategic commitment.
    rule: Treat unanimous agreement as a reason to check for missing dissent.
    viz:
      type: split
      in: "Unanimous agreement"
      out:
        - k: "A reason to look for missing dissent"
          on: true
        - k: "Confirmation that you are right"
          on: false

  - id: everyone-disagrees
    trigger: When everyone disagrees with you
    group: decide
    ask: What cheap test would let reality settle this?
    body:
      - Do not assume you are visionary. You may simply be wrong. Search for evidence and let reality arbitrate.
    rule: Independence requires your own reasoning and a willingness to agree when the evidence supports agreement.
    viz:
      type: test
      claim: "Your view"
      probe: "A cheap test"
      result: "Let reality arbitrate"
      cap: "You may simply be wrong. Search for evidence."

  - id: going-well
    trigger: When life is going exceptionally well
    group: pressure
    ask: What am I building for the period when this stops?
    body:
      - Prepare quietly. Maintain savings, health, relationships, skills, humility and alternatives.
      - Good periods create the resources that difficult periods spend.
    rule: Do not consume everything prosperity gives you.
    viz:
      type: split
      in: "What this period gives"
      out:
        - k: "Savings, health, skills, alternatives"
          on: true
        - k: "Consumed now"
          on: false

  - id: going-badly
    trigger: When life is going badly
    group: pressure
    ask: What is the smallest mission I can succeed at this week?
    steps:
      - Stop unnecessary damage.
      - Regain stability.
      - Recover information.
      - Rebuild options.
    body:
      - Do not demand that one decision repair everything at once.
    rule: Survival first. Positioning second. Expansion third.
    viz:
      type: order
      cap: "Do not demand that one decision repair everything at once."
      items:
        - "Stop the damage"
        - "Regain stability"
        - "Recover information"
        - "Rebuild options"

# The eight-step sequence for when nothing above fits
sequence:
  - key: STOP
    line: Wait before you respond.
    detail: Unless delay creates immediate danger, pause until you can assess the situation clearly.
  - key: SEE
    line: Write down what happened.
    detail: Record only what you observed. Leave out blame, predictions and guesses about motives.
  - key: SEPARATE
    line: Separate facts from interpretation.
    detail: Label each statement as fact, fear, assumption, pride or someone else's opinion.
  - key: SECURE
    line: Protect the essentials first.
    detail: Secure your health, money, legal position, reputation and important relationships before making a larger decision.
  - key: SPEAK
    line: Address the conversation you have delayed.
    detail: State the issue clearly to the person involved. Waiting can make the problem harder to resolve.
  - key: SAMPLE
    line: Run a small, reversible test.
    detail: Choose the least costly action that will give you useful information.
  - key: SELECT
    line: Choose using what the test showed.
    detail: Base the decision on observed results. Your mood at the time is weak evidence.
  - key: SCALE
    line: Increase your commitment when the evidence supports it.
    detail: Commit more time, money or attention only after the smaller test succeeds.

# The five things to protect
protect:
  - key: Health
    icon: protect-health
    short: Health
    line: Without it, every other advantage becomes harder to use.
  - key: Integrity
    icon: protect-integrity
    short: Integrity
    line: Protect the trust that lets people rely on your word and work.
  - key: Financial runway
    icon: protect-runway
    short: Runway
    line: Savings give you time to reject bad terms and make a considered decision.
  - key: Your best relationships
    icon: protect-relationships
    short: People
    line: Protect the people who provide honest help and accept it from you in return.
  - key: The ability to walk away
    icon: protect-exit
    short: Exit
    line: Never build a life where one employer, customer, person, debt, status symbol or institution controls your future.

