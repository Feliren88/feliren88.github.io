# Learning contract shared by /interview/ and every syllabus page.
#
# The interview syllabus remains the concise study surface. These entries add
# the pieces that make it a course: a concrete mission, explicit prerequisites,
# an observable success condition, and the high-trust sources a track rests on.
#
# `sources` is ordered: the first entry is where a reader new to the track
# should start. A track lists a second or third only when it genuinely draws on
# more than one text, which the module notes then cite by equation number.

mission:
  outcome: "Explain the idea and the assumptions it needs. Then answer without notes and describe when your answer may fail."
  method: "Study one module and explain it in your own words. After a break, answer its question without notes. Then explore a related track."
  evidence: "Read an unfamiliar equation and identify each object's type and role. Then explain each operation, what stays fixed, and the assumptions behind the result. Connect the calculation to code, and distinguish an exact identity from an approximation."

tracks:
  - id: bayesian-statistics
    prerequisites: ["Algebra", "Conditional probability"]
    sources:
      - title: "Bayes Rules! An Introduction to Applied Bayesian Modeling"
        author: "Johnson, Ott, and Dogucu"
        url: "https://www.bayesrulesbook.com/"
        use: "Learn how to choose a prior, update it with data, check the model, and share information across groups."

  - id: frequentist-statistics
    prerequisites: ["Algebra", "Probability and random variables"]
    sources:
      - title: "NIST/SEMATECH e-Handbook of Statistical Methods"
        author: "NIST"
        url: "https://www.itl.nist.gov/div898/handbook/"
        use: "Learn how to estimate quantities, test claims, design experiments, and check statistical assumptions."

  - id: machine-learning
    prerequisites: ["Probability", "Linear algebra", "Basic calculus"]
    sources:
      - title: "The Elements of Statistical Learning"
        author: "Hastie, Tibshirani, and Friedman"
        url: "https://doi.org/10.1007/978-0-387-84858-7"
        use: "Study standard prediction methods, regularisation to control complexity, evaluation, and the theory of learning from data."

  - id: deep-learning
    prerequisites: ["Machine learning", "Linear algebra", "Calculus"]
    sources:
      - title: "Deep Learning"
        author: "Goodfellow, Bengio, and Courville"
        url: "https://www.deeplearningbook.org/"
        use: "Learn how neural networks train, how regularisation limits overfitting, and how different network designs work."

  - id: linear-algebra
    prerequisites: ["Algebra", "Functions and graphs"]
    sources:
      - title: "Introduction to Linear Algebra"
        author: "Gilbert Strang"
        url: "https://math.mit.edu/~gs/linearalgebra/"
        use: "Study vector spaces, ways to decompose matrices, eigenvalues, and the geometry behind the calculations."

  - id: calculus
    prerequisites: ["Algebra", "Functions and graphs"]
    sources:
      - title: "Calculus, Volume 1"
        author: "OpenStax"
        url: "https://openstax.org/details/books/calculus-volume-1"
        use: "Study limits, rates of change, accumulated area, and the foundations for functions with several inputs."

  - id: math
    prerequisites: ["Basic algebra"]
    sources:
      - title: "The Open Logic Text"
        author: "Open Logic Project"
        url: "https://builds.openlogicproject.org/"
        use: "Learn how to read notation and work with sets, functions, logic, and mathematical statements."

  - id: math-proof
    prerequisites: ["Sets and functions", "Propositional logic"]
    sources:
      - title: "Book of Proof"
        author: "Richard Hammack"
        url: "https://richardhammack.github.io/BookOfProof/"
        use: "Learn how to prove claims using direct arguments, contradiction, and induction. Also learn how examples can disprove claims."

  - id: computer-science
    prerequisites: ["Comfort reading code", "Basic algebra"]
    sources:
      - title: "Algorithms, 4th Edition"
        author: "Sedgewick and Wayne"
        url: "https://algs4.cs.princeton.edu/home/"
        use: "Study algorithms, data structures, graphs, and how time and memory needs grow with input size."

  - id: operating-systems
    prerequisites: ["Programming in C or Python", "Basic computer architecture"]
    sources:
      - title: "Operating Systems: Three Easy Pieces"
        author: "Arpaci-Dusseau and Arpaci-Dusseau"
        url: "https://pages.cs.wisc.edu/~remzi/OSTEP/"
        use: "Use for processes, scheduling, virtual memory, concurrency and file systems, free online."
      - title: "OS & DBMS Foundation, visual diagrams"
        author: "100NikhilBro"
        url: "https://github.com/100NikhilBro/os_dbms"
        use: "Use for a one-page diagram per topic when revising."

  - id: databases
    prerequisites: ["Basic set notation", "Some SQL"]
    sources:
      - title: "CMU 15-445/645 Database Systems"
        author: "Pavlo"
        url: "https://15445.courses.cs.cmu.edu/"
        use: "Use for storage, indexing, query execution, concurrency control and recovery, with recorded lectures."
      - title: "Database System Concepts"
        author: "Silberschatz, Korth and Sudarshan"
        url: "https://db-book.com/"
        use: "Use for the relational model, normalisation and transactions."
      - title: "OS & DBMS Foundation, visual diagrams"
        author: "100NikhilBro"
        url: "https://github.com/100NikhilBro/os_dbms"
        use: "Use for a one-page diagram per topic when revising."

  - id: computer-networks
    prerequisites: ["Binary numbers", "Basic programming"]
    sources:
      - title: "Computer Networking: A Top-Down Approach"
        author: "Kurose and Ross"
        url: "https://gaia.cs.umass.edu/kurose_ross/index.php"
        use: "Use for application, transport, network and link layers, with interactive exercises."
      - title: "Networks Foundation, visual diagrams"
        author: "100NikhilBro"
        url: "https://github.com/100NikhilBro/networks-foundation"
        use: "Use for a one-page diagram per topic when revising."

  - id: design-patterns
    prerequisites: ["Programming in one object-oriented language", "Writing unit tests"]
    sources:
      - title: "Design Patterns catalogue"
        author: "Refactoring.Guru"
        url: "https://refactoring.guru/design-patterns/catalog"
        use: "Use for the intent, structure and trade-offs of each of the 22 classic patterns."
      - title: "Refactoring: Improving the Design of Existing Code"
        author: "Fowler"
        url: "https://martinfowler.com/books/refactoring.html"
        use: "Use for code smells and the catalogue of behaviour-preserving refactorings."

  - id: transformers
    prerequisites: ["Deep learning", "Linear algebra", "Probability"]
    sources:
      - title: "Attention Is All You Need"
        author: "Vaswani et al."
        url: "https://arxiv.org/abs/1706.03762"
        use: "Read the original transformer paper for attention, masks that block later tokens, and position information."

  - id: llm-training
    prerequisites: ["Transformers", "Optimisation", "Distributed systems basics"]
    sources:
      - title: "Training Compute-Optimal Large Language Models"
        author: "Hoffmann et al."
        url: "https://arxiv.org/abs/2203.15556"
        use: "Study how training data, model size, and available computation affect language model performance."

  - id: nlp
    prerequisites: ["Probability", "Linear algebra", "Basic machine learning"]
    sources:
      - title: "Speech and Language Processing"
        author: "Jurafsky and Martin"
        url: "https://web.stanford.edu/~jurafsky/slp3/"
        use: "Study how text becomes tokens, how models predict language, and how to label, parse, and evaluate text."

  - id: computer-vision
    prerequisites: ["Linear algebra", "Calculus", "Deep learning basics"]
    sources:
      - title: "Computer Vision: Algorithms and Applications"
        author: "Richard Szeliski"
        url: "https://doi.org/10.1007/978-3-030-34372-9"
        use: "Study how images form, how to detect visual patterns, how geometry works, and how models label pixels."

  - id: multimodality
    prerequisites: ["Embeddings", "Transformers", "Representation learning"]
    sources:
      - title: "Learning Transferable Visual Models From Natural Language Supervision"
        author: "Radford et al."
        url: "https://arxiv.org/abs/2103.00020"
        use: "Learn how matching images and text train shared representations, then study how to evaluate those representations."

  - id: embedding
    prerequisites: ["Linear algebra", "Basic probability"]
    sources:
      - title: "Efficient Estimation of Word Representations in Vector Space"
        author: "Mikolov et al."
        url: "https://arxiv.org/abs/1301.3781"
        use: "Read the original word2vec objectives and the experiments supporting its learned word vectors."

  - id: edge-ai
    prerequisites: ["Deep learning", "Computer systems basics"]
    sources:
      - title: "TinyML: Current Progress, Research Challenges, and Future Roadmap"
        author: "Dutta and Bharali"
        url: "https://arxiv.org/abs/2103.13569"
        use: "Study the limits of small devices, ways to run models on them, and problems that remain unresolved."

  - id: image-generation
    prerequisites: ["Deep learning", "Probability", "Computer vision basics"]
    sources:
      - title: "Denoising Diffusion Probabilistic Models"
        author: "Ho, Jain, and Abbeel"
        url: "https://arxiv.org/abs/2006.11239"
        use: "Read how diffusion models add noise during training and use learned predictions to generate samples."

  - id: uncertainty-estimation
    prerequisites: ["Probability", "Statistics", "Model evaluation"]
    sources:
      - title: "Information Theory, Inference, and Learning Algorithms"
        author: "MacKay"
        url: "https://www.inference.org.uk/itprnn/book.pdf"
        use: "Study entropy as a measure of uncertainty, evidence for comparing models, and uncertainty estimated from posterior curvature."
      - title: "A Gentle Introduction to Conformal Prediction and Distribution-Free Uncertainty Quantification"
        author: "Angelopoulos and Bates"
        url: "https://arxiv.org/abs/2107.07511"
        use: "Study prediction sets with coverage guarantees, the separate data used to calibrate them, and their assumptions."
      - title: "Uncertainty measures: The big picture"
        author: "Cuzzolin"
        url: "https://arxiv.org/abs/2104.06839"
        use: "Study lower and upper probabilities and credal sets, collections of plausible probability distributions."

  - id: mechanistic-interpretability
    prerequisites: ["Transformers", "Linear algebra", "Neural network internals"]
    sources:
      - title: "A Mathematical Framework for Transformer Circuits"
        author: "Elhage et al."
        url: "https://transformer-circuits.pub/2021/framework/index.html"
        use: "Learn how transformer components process information and how researchers analyse their interactions."

  - id: ai-safety
    prerequisites: ["Machine learning systems", "Basic probability", "Model evaluation"]
    sources:
      - title: "Concrete Problems in AI Safety"
        author: "Amodei et al."
        url: "https://arxiv.org/abs/1606.06565"
        use: "Study unintended failures, poorly specified rewards, human oversight, and changes between training and deployment data."

  - id: machine-learning-research
    prerequisites: ["Machine learning", "Statistics", "Experimental design"]
    sources:
      - title: "The ML Reproducibility Checklist"
        author: "Pineau et al."
        url: "https://www.cs.mcgill.ca/~jpineau/ReproducibilityChecklist.pdf"
        use: "Check whether your claims, experiments, and reporting give other researchers enough information to repeat the work."

  - id: north-star-metrics
    prerequisites: ["Basic product analytics", "A/B testing"]
    sources:
      - title: "Choosing Your North Star Metric"
        author: "Rachitsky, for Future (a16z)"
        url: "https://future.com/north-star-metrics/"
        use: "Use for the 6 kinds of north star, the survey of companies, and input metrics."

  - id: prompt-engineering
    prerequisites: ["LLM fundamentals", "Clear task specification"]
    sources:
      - title: "Pre-train, Prompt, and Predict"
        author: "Liu et al."
        url: "https://arxiv.org/abs/2107.13586"
        use: "Study how prompting methods differ and how prompts can adapt a trained model to a task."

  - id: agentic-ai
    prerequisites: ["Prompt engineering", "APIs and tools", "Basic system design"]
    sources:
      - title: "ReAct: Synergizing Reasoning and Acting in Language Models"
        author: "Yao et al."
        url: "https://arxiv.org/abs/2210.03629"
        use: "Study how an agent alternates between reasoning, tool actions, and observations of the results."

  - id: mlops
    prerequisites: ["Machine learning", "Software delivery", "Monitoring basics"]
    sources:
      - title: "Rules of Machine Learning"
        author: "Google"
        url: "https://developers.google.com/machine-learning/guides/rules-of-ml"
        use: "Learn how to introduce models into production, choose useful metrics, build pipelines, and handle operational failures."

  - id: data-engineering
    prerequisites: ["Databases", "Distributed systems basics", "SQL"]
    sources:
      - title: "The Dataflow Model"
        author: "Akidau et al."
        url: "https://research.google/pubs/the-dataflow-model-a-practical-approach-to-balancing-correctness-latency-and-cost-in-massive-scale-unbounded-out-of-order-data-processing/"
        use: "Study event time, progress estimates called watermarks, rules that trigger results, and correct handling of late data."

  - id: network-and-security
    prerequisites: ["Operating systems basics", "Client-server requests"]
    sources:
      - title: "Zero Trust Architecture, SP 800-207"
        author: "NIST"
        url: "https://csrc.nist.gov/pubs/sp/800/207/final"
        use: "Study identity checks, access rules, and trust boundaries in a network where location alone does not imply trust."

  - id: information-theory
    prerequisites: ["Probability and conditional distributions", "Calculus and optimisation", "Linear algebra", "Basic machine learning"]
    sources:
      - title: "Elements of Information Theory"
        author: "Thomas M. Cover and Joy A. Thomas"
        url: "https://doi.org/10.1002/047174882X"
        use: "Study entropy, information inequalities, coding and rate-distortion theory."
      - title: "Information Theory, Inference, and Learning Algorithms"
        author: "David J. C. MacKay"
        url: "https://www.cambridgebookshop.co.uk/products/information-theory-inference-and-learning-algorithms"
        use: "Connect compression, Bayesian inference and learning through worked calculations."
      - title: "Probabilistic Machine Learning"
        author: "Kevin P. Murphy"
        url: "https://probml.github.io/pml-book/"
        use: "Study probabilistic models, approximate inference and uncertainty estimation."
      - title: "Deep Learning"
        author: "Goodfellow, Bengio and Courville"
        url: "https://www.deeplearningbook.org/"
        use: "Connect likelihood and divergences with representation learning and generative models."
      - title: "The information bottleneck method"
        author: "Tishby, Pereira and Bialek"
        url: "https://arxiv.org/abs/physics/0004057"
        use: "Read the original objective for preserving relevant information in compressed representations."
      - title: "Information-theoretic analysis of generalization capability of learning algorithms"
        author: "Xu and Raginsky, NeurIPS 2017"
        url: "https://proceedings.neurips.cc/paper/2017/hash/ad71c82b22f4f65b9398f76d8be4c615-Abstract.html"
        use: "Check Theorem 1 and its uniform sub-Gaussian loss assumption before applying the expected-gap bound."
      - title: "Generative Adversarial Nets"
        author: "Goodfellow and colleagues, NeurIPS 2014"
        url: "https://papers.neurips.cc/paper/5423-generative-adversarial-nets"
        use: "Check Equation 6 for the optimal-discriminator relationship with Jensen-Shannon divergence."
