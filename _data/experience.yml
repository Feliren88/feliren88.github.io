    title: 'SEACrowd - Researcher, Multimodal & Vision-Language'
    location: 'Open-science research collective · seacrowd.github.io'
    description: "I build open AI resources for Southeast Asia, a region still underrepresented in mainstream training data. My work covers datasets, benchmarks, and adaptation methods. It has produced two peer-reviewed studies with more than 50 researchers across five countries, including SEA-VL at ACL 2025 and a study of diffusion model adaptation."

  - dates: 'FEB 2025 – NOV 2025'
    title: 'Artefact - Senior Data Scientist'
    location: 'French AI consulting · Founding technical member, Jakarta office'
    description: "As the first technical hire in Jakarta, I turned research methods into tools that Media Directors could use for APAC budget decisions. The methods included conformal prediction, calibrated uncertainty, and LLM evaluation. I built the office's engineering base from scratch, including forecasting, RAG-based insight tools, and observability."

  - dates: 'DEC 2022 – JAN 2025'
    title: 'Monash University - Research Associate'
    location: 'Global research consortium: Monash, UQ, UCL, Nottingham'
    description: "I designed ProCANet, a progressive cross-attention model that combines multispectral satellite bands for flood segmentation. I also built geospatial pipelines to train and test it across sensors and regions. The result is a map that can inform government flood planning and response. I published the work as first author in IEEE GRSL and contributed to a Remote Sensing of Environment paper on mining-footprint segmentation with a fine-tuned foundation model."

  - dates: 'JUN 2021 – JUN 2023'
    title: 'GDP Labs (GLAIR.ai) - Senior Data Scientist / ML Engineer'
    location: 'AI consulting, backed by a major Indonesian conglomerate'
    description: "I built and maintained ML systems used by major Indonesian banks for biometric authentication and credit decisions. I worked across model design and production operations, then expanded into fraud detection, audited credit scoring, and demand forecasting for financial clients. Reliability was a core requirement throughout."

  - dates: 'JAN 2021 – JUN 2021'
    title: 'Jakarta Smart City - Data Scientist'
    location: "Indonesia's smart city government initiative"
    description: "I used probabilistic time-series models to forecast municipal waste and guide city-wide resource planning. I also used citizen complaint data to study the effect of Jakarta's plastic bag ban. I presented the findings at an IEEE-sponsored conference."

