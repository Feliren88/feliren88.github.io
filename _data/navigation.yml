# The site's navigation. One source of truth for the header and the footer.
#
# Rendered by _includes/site-nav.html, which both _includes/site-header.html and
# _includes/site-footer.html call. Adding an entry here puts the link in both
# places and marks it active on its own pages. There is no second list to update.
#
# `owns` lists URL prefixes that belong to an item without being under its href.
# A long-form note lives at its own top-level URL but reads as part of Writings,
# so /stoic/ should light up the Writings link. Matching is by prefix, and the
# href itself is always matched exactly, so `/` does not claim every page.
#
# A page matching no item falls back to the FIRST item below, so About is lit.
# That is what the old JavaScript did, and it is why the order here matters
# beyond display order. See the header of _includes/site-nav.html.
#
# Every long-form note linked from /writings/ belongs under `owns`. When a new
# note goes up there, add its prefix below too, or its page falls back to About.

primary:
  - label: About
    href: /

  - label: Research
    href: /research/

  - label: Use Cases
    href: /usecases/

  - label: Writings
    href: /writings/
    owns:
      - /essays/
      - /high-agency
      - /principles
      - /curious
      - /stoic
      - /game-theory
      - /success-failure
      - /life-challenges
      - /read-people
      - /communication
      - /self-love
      - /small-talk
      - /story
      - /uncertainty-and-emotions

  - label: Work With Me
    href: /contact/
