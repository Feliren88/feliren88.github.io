eyebrow: 'APPLIED SCIENTIST · AI CONTROL · MONITORING FOR MULTIMODAL AGENTS'
name: 'Vicky Feliren'
lead1: 'I work on whether AI monitoring actually holds. Labs are deploying agents behind monitors, a second model watching each action and scoring it for anything dangerous. Those monitors get built and red-teamed on English text. I test what happens when the input is not that, and I measure what gets missed.'
lead2: 'Multimodal agents, non-English input, long trajectories. The parts of the input distribution nobody sampled. Published in academic conferences and journals, and building open AI infrastructure for Southeast Asia.'
