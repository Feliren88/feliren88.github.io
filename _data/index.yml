eyebrow: 'APPLIED SCIENTIST · AI SAFETY · CALIBRATION & ALIGNMENT'
name: 'Vicky Feliren'
lead1: 'I work to make safe models more useful. Safety training can weaken a model’s sense of what it knows. When that happens, the model defers poorly, which limits the work we can trust it to do.'
lead2: 'I measure where that cost falls and how to recover it. I focus on languages beyond English and inputs beyond text, where the cost may be greatest and remains poorly measured.'
