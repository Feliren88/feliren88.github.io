eyebrow: 'APPLIED SCIENTIST · CALIBRATION & SAFETY ALIGNMENT · MULTIMODAL AGENTS'
name: 'Vicky Feliren'
lead1: 'I work on making safe models more useful, not less. Training a model to be safe costs it some calibration, and calibration is how a model knows what it knows. Lose it and the model defers badly, so you keep it on small problems.'
lead2: 'I measure where that cost falls and work on getting it back. Mostly outside English, mostly outside text, where it looks worst and has been measured least.'
