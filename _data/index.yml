eyebrow: 'APPLIED SCIENTIST · AI SAFETY · CALIBRATION & ALIGNMENT'
name: 'Vicky Feliren'
lead1: 'I work on making safe models more useful. Safety training costs a model some of its sense of what it knows. A model that has lost that defers badly, so you keep it on small problems.'
lead2: 'I measure where that cost lands and how to get it back. Mostly outside English, mostly outside text, where it looks worst and has been measured least.'
