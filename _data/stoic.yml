  - id: when-something-unpleasant-lands-on-you-and-you-d
    situation: "When something unpleasant lands on you and you do not know what to do first"
    group: adversity
    source: encheiridion
    ref: "10"
    quote: "With every accident, ask yourself what abilities you have for making a proper use of it. If you see an attractive person, you will find that self-restraint is the ability you have against your desire. If you are in pain, you will find fortitude. If you hear unpleasant language, you will find patience."
    take: "Every event arrives with a matching capacity, and the question is which one this needs. Abusive words ask for patience, pain asks for endurance. Naming the faculty gives you something to do instead of a reaction to have."
    search: "every accident yourself abilities making proper attractive person find self restraint ability against desire pain fortitude hear unpleasant language patience thus habituated appearances things hurry away along"
    viz:
      type: split
      in: "What landed on you"
      cap: "Every event arrives with a matching capacity."
      out:
        - k: "Abusive words: patience"
          sel: true
        - k: "Pain: endurance"
          sel: true

