- key: mining-multispectral
  kind: geospatial
  tag: 'Q1 · IF: 11.4'
  title: "Multi-modal deep learning approaches to semantic segmentation of mining footprints with multispectral satellite imagery"
  description: 'Mapped mining areas at 37 sites worldwide using deep learning and multispectral satellite images.'
  venue: 'Remote Sensing of Environment, Volume 318, Article 114584, 2025'
  year: "2025"
  publisher: 'Elsevier'
  url: 'https://doi.org/10.1016/j.rse.2024.114584'
  doi: '10.1016/j.rse.2024.114584'
  date: "2025-03-01T00:00:00Z"
  volume: "318"
  issn: '0034-4257'
  keywords: ['semantic segmentation', 'mining detection', 'multispectral satellite imagery', 'remote sensing', 'deep learning', 'geospatial AI', 'U-Net', 'SegFormer', 'land cover mapping', 'satellite imagery']
  authors: ["Muhamad Risqi U. Saputra", "Irfan Dwiki Bhaswara", "Bahrul Ilmi Nasution", "Michelle Ang Li Ern", "Nur Laily Romadhotul Husna", "Tahjudil Witra", "Vicky Feliren", "John R. Owen", "Deanna Kemp", "Alex M. Lechner"]
  abstract: 'Earlier remote sensing studies often covered one mine, one type of mining feature, or only the outer boundary of several mines. We studied 37 mining sites worldwide, covering commodities from gold to coal. We built a multispectral dataset with refined boundaries, shapes, and class labels, then trained models to separate mining and non-mining land. We tested U-Net, DeepLabV3+, FPN, SegFormer, and the IBM-NASA Prithvi model across several band combinations and transfer-learning setups. An ImageNet-pretrained FPN with a DenseNet-121 backbone performed best when trained on RGB and near-infrared bands. We also assessed performance across climate groups and mining commodities.'

