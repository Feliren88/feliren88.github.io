- key: mining-multispectral
  kind: geospatial
  tag: 'Q1 · IF: 11.4'
  title: "Multi-modal deep learning approaches to semantic segmentation of mining footprints with multispectral satellite imagery"
  description: 'Semantic segmentation of global mining footprints using multispectral satellite imagery across 37 locations worldwide.'
  venue: 'Remote Sensing of Environment, Volume 318, Article 114584, 2025'
  year: "2025"
  publisher: 'Elsevier'
  url: 'https://doi.org/10.1016/j.rse.2024.114584'
  doi: '10.1016/j.rse.2024.114584'
  keywords: ['semantic segmentation', 'mining detection', 'multispectral satellite imagery', 'remote sensing', 'deep learning', 'geospatial AI', 'U-Net', 'SegFormer', 'land cover mapping', 'satellite imagery']
  authors: ["Muhamad Risqi U. Saputra", "Irfan Dwiki Bhaswara", "Bahrul Ilmi Nasution", "Michelle Ang Li Ern", "Nur Laily Romadhotul Husna", "Tahjudil Witra", "Vicky Feliren", "John R. Owen", "Deanna Kemp", "Alex M. Lechner"]
  abstract: 'Existing remote sensing applications in mining are often of limited scope, typically mapping multiple mining land covers for a single mine or only mapping mining extents or a single feature (e.g., tailings dam) for multiple mines across a region. Many of these works have a narrow focus on specific mine land covers rather than encompassing the variety of mining and non-mining land use in a mine site. This study presents a pioneering effort in performing deep learning-based semantic segmentation of 37 mining locations worldwide, representing a range of commodities from gold to coal, using multispectral satellite imagery, to automate mapping of mining and non-mining land covers. Due to the absence of a dedicated training dataset, we crafted a customized multispectral dataset for training and testing deep learning models, leveraging and refining existing datasets in terms of boundaries, shapes, and class labels. We trained and tested multimodal semantic segmentation models, particularly based on U-Net, DeepLabV3+, Feature Pyramid Network (FPN), SegFormer, and IBM-NASA foundational geospatial model (Prithvi) architecture, with a focus on evaluating different model configurations, input band combinations, and the effectiveness of transfer learning. In terms of multimodality, we utilized various image bands, including Red, Green, Blue, and Near Infra-Red (NIR) and Normalized Difference Vegetation Index (NDVI), to determine which combination of inputs yields the most accurate segmentation. Results indicated that among different configurations, FPN with DenseNet-121 backbone, pre-trained on ImageNet, and trained using both RGB and NIR bands, performs the best. We concluded the study with a comprehensive assessment of the model performance based on climate classification categories and diverse mining commodities.'

