# Research landscape and research direction on /research/.
#
# `directions` are the open questions of the research direction. They render as
# the cards in the "Research direction" section and as the dashed nodes at the
# centre of the map. `from` lists the past work each question builds on.
#
# The map uses a 1000 x 700 viewBox. Nodes are centred on (x, y).
# `clusters` are the tinted regions; each `path` is a hand-placed organic shape.
# `topics` are outlined pills. `work` items are filled pills. An item with `pub`
# takes its title, venue, summary and link from `_data/publications.yml`; any
# other item carries its own `title`, `venue`, `desc` and `url`. Each work item
# draws a dashed line to every topic in its `topics` list. Colours live in
# css/research-landscape.css.

directions:
  - id: d-traj
    x: 500
    y: 262
    label: 'Route guarantees<br>after decision rules change'
    title: 'Do route guarantees survive a change in decision rules?'
    desc: 'An agent changes its future inputs when it waits or asks for help. ENCP bounds the risk of proposed action sets missing a correct action along a route. However, it requires stated sampling assumptions. Therefore, I want to test whether new rules for seeking help preserve those assumptions.'
    from: [encp-vln, vln]
  - id: d-cost
    x: 395
    y: 372
    label: 'Withholding answers<br>as error costs change'
    title: 'When should a model withhold an answer?'
    desc: 'A model may report useful confidence yet ignore changes in the cost of an error. Therefore, I want rules that adjust when the model answers or withholds an answer. These rules should also work with costs absent from training.'
    from: [crossmodal, fraud]
  - id: d-shift
    x: 605
    y: 372
    label: 'Reliable monitors<br>when inputs change'
    title: 'When should a monitor withhold its own judgement?'
    desc: 'A monitor uses model signals to detect errors or attacks. However, its signal can fail when languages, sensors, or the model’s decision rules change. Therefore, I want to test when a monitor can recognise that its own judgement needs review.'
    from: [goal-hijack, crossmodal, cultural, remote]
  - id: d-deploy
    x: 500
    y: 482
    label: 'Reliable decisions<br>in deployed systems'
    title: 'What makes a reliability claim usable in practice?'
    desc: 'Fraud screening, flood mapping, and policy analysis use imperfect predictions. Therefore, I want guarantees that specify the decision, its costs, and the data conditions they require.'
    from: [fraud, remote, urban]

