# Research landscape on /research/.
#
# Coordinates are in the map's 1000 x 640 viewBox. Nodes are centred on (x, y).
# `clusters` are the tinted regions; each `path` is a hand-placed organic shape.
# `topics` are outlined pills. `papers` are filled pills keyed to
# `_data/publications.yml` by `key`; each links to the paper's project page when
# it has one and to the paper otherwise. A paper draws a dashed line to every
# topic in its `topics` list. Colours live in css/research-landscape.css.

