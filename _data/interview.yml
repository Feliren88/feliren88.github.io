  # ── Judgement ────────────────────────────────────────────────────────────
  - id: uncertainty-quantification
    name: Uncertainty Quantification
    group: judgement
    blurb: "Whether a model's confidence means anything, and what you do when it does not."
    scope: "Owns calibration, coverage and abstention. Hands posterior computation to Bayesian statistics and deployment gating to AI safety."
    links: [bayesian-statistics, ai-safety]
    modules:
      - name: What kind of uncertainty
        why: "The decomposition decides which fix is available to you."
        covers:
          - Aleatoric versus epistemic uncertainty
          - Distributional shift and model misspecification
          - Uncertainty from data, model, and optimisation
          - Why the decomposition is not clean in practice
          - What each type licenses you to do
          - Predictive versus parameter uncertainty
        check: "Give a real example where more data removes the uncertainty, and one where it does not."
        viz:
          type: tree
          root: Uncertainty
          branches:
          - k: Aleatoric
            items:
            - Noise in the world
            - More data will not remove it
          - k: Epistemic
            items:
            - Gaps in the model
            - More data helps
      - name: Calibration
        why: "The central measurement of the field, and easy to get subtly wrong."
        covers:
          - Reliability diagrams and confidence histograms
          - "Expected calibration error, its bin dependence and estimator bias"
          - Adaptive binning, class-wise and top-label ECE
          - Brier score and its decomposition
          - Proper scoring rules, log loss, sharpness under calibration
          - Calibration versus accuracy versus discrimination
        check: "Why can two models with identical accuracy and identical ECE behave very differently in deployment?"
        viz:
          type: curve
          shape: diag
          x: Stated confidence
          "y": Observed accuracy
          a: Perfectly calibrated
          b: Overconfident
      - name: Recalibration
        why: "The cheap fix everyone should try first."
        covers:
          - Temperature scaling and why it preserves accuracy
          - Vector and matrix scaling
          - Platt scaling and isotonic regression
          - Histogram binning and beta calibration
          - Calibration sets, size requirements, and reuse
          - Recalibration failing under distribution shift
        check: "Temperature scaling fixed calibration on validation and failed in production. Explain."
        viz:
          type: flow
          steps:
          - Trained model
          - Held-out set
          - Fit a temperature
          - Calibrated model
      - name: Conformal prediction
        why: "The one method with a finite-sample guarantee, and your own research tool."
        covers:
          - Exchangeability and what it demands
          - "Split conformal: calibration set, quantile, coverage guarantee"
          - Nonconformity scores and their effect on set size
          - Marginal versus conditional coverage
          - "Classification sets: APS, RAPS"
          - "Regression: conformalised quantile regression"
          - Weighted conformal under covariate shift
          - Conformal risk control and beyond-coverage guarantees
          - Adaptive and online conformal for drifting streams
        check: "State the split conformal guarantee precisely, including what it does not promise per input."
        viz:
          type: flow
          steps:
          - Calibration set
          - Score every point
          - Take the quantile
          - Build the set
          - Coverage holds
      - name: Bayesian and ensemble approximations
        why: "The practical alternatives, with honest cost accounting."
        covers:
          - Monte Carlo dropout and its criticisms
          - Deep ensembles, diversity, and cost
          - Snapshot ensembles and SWAG
          - Laplace approximation and last-layer Bayes
          - Evidential deep learning and the objections to it
          - Cheap approximations that hold up under shift
        check: "You can afford one extra forward pass at serving time. What uncertainty method do you pick?"
        viz:
          type: compare
          cols:
          - k: Deep ensemble
            items:
            - Several full models
            - Most compute
          - k: Monte Carlo dropout
            items:
            - One model, many passes
          - k: Laplace
            items:
            - Curvature at the optimum
            - One extra pass
      - name: Abstention and selective prediction
        why: "The decision layer where uncertainty finally pays off."
        covers:
          - Selective risk, coverage, and the risk-coverage curve
          - Area under the risk-coverage curve
          - Threshold selection under a cost model
          - Deferral to a human and cascade systems
          - "Out-of-distribution detection: max softmax, energy, Mahalanobis, kNN"
          - Open-set recognition and novelty
          - Measuring the value of abstention to the product
        check: "Design an abstention policy for a medical triage model and justify the threshold."
        viz:
          type: curve
          shape: rise
          x: Coverage
          "y": Risk
          a: Abstain on the hard cases
          b: Answer everything
      - name: Uncertainty for language models
        why: "The frontier, and where your own work sits."
        covers:
          - Token probability, sequence likelihood, length normalisation
          - Semantic entropy and meaning-level uncertainty
          - Verbalised confidence and its unreliability
          - Self-consistency and sampling-based signals
          - Hallucination detection versus uncertainty
          - Calibration change after instruction tuning and RLHF
          - Conformal methods for open-ended generation
        check: "How would you measure whether safety training changed a model's calibration?"
        viz:
          type: parts
          centre: Can I trust this answer
          around:
          - Token probability
          - Semantic entropy
          - Self-consistency
          - Stated confidence
    traps:
      - Reporting ECE with a fixed 15 bins and no sensitivity check
      - Claiming conformal gives per-input coverage
      - Using the calibration set twice
      - Treating high softmax confidence as evidence of correctness
    drills:
      - Plot a reliability diagram for a model you trained
      - Implement split conformal in 20 lines and verify empirical coverage
      - Break exchangeability on purpose and watch coverage fail
      - Build a risk-coverage curve and pick a threshold from a cost model

  - id: mechanistic-interpretability
    name: Mechanistic Interpretability
    group: judgement
    blurb: "Whether you can make a causal claim about a network's internals and defend it."
    scope: "Owns internals and causal analysis. Hands the architecture to transformers and the safety case to AI safety."
    links: [transformers, ai-safety]
    modules:
      - name: The framing
        why: "The field has a specific standard of evidence, and interviews test whether you hold it."
        covers:
          - What counts as a mechanistic explanation
          - Features versus neurons
          - Superposition and polysemanticity
          - Privileged bases and why they matter
          - The residual stream as a channel that layers read and write
          - Interpretability illusions and correlation traps
        check: "Why can a neuron fire for two unrelated concepts, and what does that imply for interpretation?"
        viz:
          type: scale
          lo: One neuron, one concept
          hi: Concepts spread across neurons
          stops:
          - Monosemantic
          - Polysemantic
          - Superposition
          'on': 2
      - name: The toolkit
        why: "You will be asked which tool answers which question."
        covers:
          - Logit lens and tuned lens
          - "Activation patching and causal tracing"
          - Path patching and attribution patching
          - "Ablation: zero, mean, resample, and why the choice matters"
          - Direct logit attribution
          - Causal scrubbing and hypothesis testing
          - Probing classifiers and their limits
        check: "Compare zero ablation and resample ablation. When does zero ablation mislead you?"
        viz:
          type: flow
          steps:
          - Pick a behaviour
          - Form a hypothesis
          - Patch or ablate
          - Measure the effect
          loop: true
      - name: Circuits found so far
        why: "Concrete results are the shared reference points of the field."
        covers:
          - Induction heads and in-context learning
          - Indirect object identification and name mover heads
          - Copy suppression and backup heads
          - Grokking and modular addition
          - Docstring and greater-than circuits
          - What evidence makes a circuit claim credible
        check: "Describe the induction head mechanism and the evidence that it is causal."
        viz:
          type: parts
          centre: Induction head
          around:
          - Reads the previous token
          - Matches an earlier copy
          - Copies what followed it
          - Gives in-context learning
      - name: Sparse dictionary learning
        why: "The current main line of work, so expect depth."
        covers:
          - Sparse autoencoders and the reconstruction-sparsity trade
          - "Variants: top-k, gated, JumpReLU"
          - Dead features, shrinkage, and feature absorption
          - Feature splitting across dictionary sizes
          - Transcoders and crosscoders
          - "Evaluating a dictionary: loss recovered, interpretability scores, downstream use"
          - Known limitations and the recent critiques
        check: "Your SAE reconstructs well and its features are uninterpretable. What went wrong?"
        viz:
          type: flow
          steps:
          - Activations
          - Encode sparsely
          - Decode
          - Compare the reconstruction
      - name: Steering and editing
        why: "The applied edge of interpretability."
        covers:
          - Activation addition and steering vectors
          - Refusal directions and single-direction findings
          - "Model editing: ROME, MEMIT, and their generalisation failures"
          - Representation engineering
          - Fine-tuning versus steering as an intervention
          - Side effects and how to measure them
        check: "You found a direction that controls refusal. What experiments before you claim it is the refusal mechanism?"
        viz:
          type: compare
          cols:
          - k: Steering
            items:
            - Add a direction at runtime
            - Reversible
          - k: Editing
            items:
            - Change the weights
            - Permanent
          - k: Fine-tuning
            items:
            - Retrain
            - Broadest side effects
      - name: Interpretability for safety
        why: "The reason labs fund this work, and the framing that connects to your agenda."
        covers:
          - What a safety case built on interpretability would need
          - Deception and situational awareness detection
          - Faithfulness of chain of thought
          - Auditing games and blind evaluation
          - Scaling interpretability to frontier models
          - Honest accounting of what the field cannot yet do
        check: "What would have to be true for interpretability to gate a deployment decision?"
        viz:
          type: stack
          layers:
          - Gate a deployment
          - Explain a behaviour
          - Locate a feature
          - Read activations
    traps:
      - Presenting a correlational probe as a mechanism
      - Reading feature labels without a causal check
      - Cherry-picking one prompt as evidence of a circuit
      - Overstating what SAEs currently deliver
    drills:
      - Run activation patching on a small model and locate a known head
      - Train an SAE on one layer and manually label 20 features
      - Reproduce the induction head result on a two-layer model
      - Write one claim, then write the experiment that would refute it

  - id: ai-safety
    name: AI Safety
    group: judgement
    blurb: "Whether you have a position, and whether it survives the strongest objection."
    scope: "Owns risk framing, alignment methods and evaluation. Draws on mechanistic interpretability and uncertainty quantification as tools."
    links: [uncertainty-quantification, mechanistic-interpretability]
    modules:
      - name: The landscape
        why: "A broad interview will open here, and vagueness reads badly."
        covers:
          - Misuse, misalignment, and systemic risk
          - Near-term harms and long-horizon concerns as one agenda
          - Who does what across labs, government, and academia
          - Capability versus propensity
          - Threat models worth taking seriously, and the weak arguments
          - Where reasonable researchers disagree
        check: "Give your one-minute answer to what AI safety means, then defend it against the strongest counterargument."
        viz:
          type: tree
          root: Risk
          branches:
          - k: Misuse
            items:
            - People use it to cause harm
          - k: Misalignment
            items:
            - The model pursues the wrong goal
          - k: Systemic
            items:
            - Harm from scale and dependence
      - name: Alignment methods
        why: "You need to explain what current techniques do and where they stop."
        covers:
          - RLHF and its known limits
          - Constitutional AI and rule-based feedback
          - Debate and recursive reward modelling
          - Weak-to-strong generalisation
          - Scalable oversight and amplification
          - Deliberative and specification-following approaches
        check: "Why is human feedback insufficient once models exceed human performance on a task?"
        viz:
          type: scale
          lo: A human can check the work
          hi: A human cannot check the work
          stops:
          - Direct feedback
          - Assisted oversight
          - Scalable oversight
          'on': 1
      - name: Failure modes
        why: "The vocabulary of the field, and where precision counts."
        covers:
          - Reward hacking and specification gaming
          - Goal misgeneralisation versus capability misgeneralisation
          - Sycophancy and preference gaming
          - Deceptive alignment and the arguments for and against
          - Situational awareness and evaluation awareness
          - Sandbagging and strategic underperformance
          - Emergent behaviour claims and how to test them
        check: "Distinguish reward hacking from goal misgeneralisation with a concrete example of each."
        viz:
          type: compare
          cols:
          - k: Reward hacking
            items:
            - The goal was measured badly
          - k: Goal misgeneralisation
            items:
            - The goal was learned narrowly
          - k: Sycophancy
            items:
            - Agreement got rewarded
      - name: Evaluation and red teaming
        why: "The practical work most safety roles actually do."
        covers:
          - Dangerous capability evaluations
          - Red teaming, manual and automated
          - "Jailbreaks: many-shot, encoding, persona, multi-turn"
          - Refusal training and the over-refusal cost
          - Eval gaming, contamination, and eval awareness
          - Responsible scaling policies and capability thresholds
          - Building an eval that would change a decision
        check: "Design an evaluation for a capability you believe is dangerous. State the threshold and the response."
        viz:
          type: flow
          steps:
          - Name the capability
          - Build the eval
          - Set a threshold
          - Decide the response
          loop: true
      - name: Robustness and control
        why: "The assumption that alignment might fail, handled engineering-first."
        covers:
          - Adversarial robustness and its limits
          - Control evaluations and untrusted models
          - Monitoring, tripwires, and anomaly detection
          - Sandboxing and permission design for agents
          - Defence in depth across the deployment stack
          - Incident response and rollback
        check: "Assume the model is misaligned but not superhuman. What deployment controls still work?"
        viz:
          type: stack
          layers:
          - Human approval
          - Monitoring
          - Sandboxing
          - Least privilege
      - name: Honesty, calibration and abstention
        why: "Your own contribution, so this section must be the sharpest."
        covers:
          - Truthfulness versus helpfulness tension
          - Knowing when to abstain as a safety property
          - The alignment tax on calibration
          - Where the cost concentrates, by language and modality
          - Measuring the shape of the tax rather than its average
          - Recovery methods and what they give up
        check: "Argue that calibration is a safety property, not a nice-to-have, in three sentences."
        viz:
          type: parts
          centre: The alignment tax on calibration
          around:
          - Reported as one average
          - Really a spread over inputs
          - Varies by language
          - Varies by modality
      - name: Policy and practice
        why: "Even research roles expect awareness of the surrounding system."
        covers:
          - Model cards, system cards, transparency reporting
          - Deployment gating and staged release
          - Open weights debate, both sides stated fairly
          - Evaluation standards and third-party audits
          - Incident reporting and shared learning
          - Regulation landscape at a high level
        check: "State the strongest argument for open weights and the strongest against, then say where you land."
        viz:
          type: flow
          steps:
          - Evaluate
          - Document
          - Gate the release
          - Monitor
          - Report
          loop: true
    traps:
      - Talking about risk with no threat model attached
      - Framing gaps as other organisations' mistakes
      - Claiming certainty on questions the field has not settled
      - Treating safety and capability as strictly opposed
    drills:
      - Write your safety position in 200 words and cut it to 100
      - Red team one open model for an afternoon and log what worked
      - Reproduce one published eval and note where it is fragile
      - Steelman the position you disagree with most, out loud

  - id: machine-learning-research
    name: Machine Learning Research
    group: judgement
    blurb: "Whether you pick questions worth answering and run experiments that could prove you wrong."
    scope: "Owns research taste, method and communication. Applies to whichever technical track the role sits in."
    links: [ai-safety, uncertainty-quantification]
    modules:
      - name: Choosing a question
        why: "Taste is what a research interview is actually measuring."
        covers:
          - Mapping a literature quickly and honestly
          - Gap versus novelty, and why a gap alone is weak
          - Designing a claim where either result is publishable
          - Writing your own kill criteria before you start
          - Stating your credence and updating it
          - Scope that fits the compute you actually have
        check: "Describe a project where the negative result would still have been worth reporting."
        viz:
          type: matrix
          x:
          - The answer is known
          - The answer is unknown
          "y":
          - Somebody acts on it
          - Nobody acts on it
          cells:
          - Engineering task
          - Worth doing
          - Not worth writing
          - Curiosity only
      - name: Experiment design
        why: "The difference between evidence and a demo."
        covers:
          - Hypothesis, prediction, and the observation that would refute it
          - Baselines, and tuning them as hard as your method
          - Ablations that isolate one variable
          - Controls, seeds, and variance budgeting
          - Compute planning and the smallest informative scale
          - Deciding in advance what counts as success
        check: "Your method beats the baseline by 1 point. What would you run before believing it?"
        viz:
          type: flow
          steps:
          - Hypothesis
          - Prediction
          - Baseline
          - Ablation
          - Verdict
      - name: Statistics for papers
        why: "Where reviewers and interviewers both push hardest."
        covers:
          - Seed variance and how many runs you need
          - Error bars, confidence intervals, and honest plots
          - Multiple comparisons across many benchmarks
          - Effect size over significance theatre
          - Cherry-picking, and how to notice your own
          - Reporting compute and cost
        check: "You have three seeds and overlapping error bars. What do you claim?"
        viz:
          type: scale
          lo: One run
          hi: Enough runs
          stops:
          - One seed
          - Three seeds
          - Enough to see the spread
          'on': 2
      - name: Reproducibility
        why: "A cheap signal of seriousness."
        covers:
          - Code release, configs, and environment pinning
          - Dataset cards and licence clarity
          - Random seed and determinism handling
          - Reporting failures and negative results
          - Making a result reproducible by someone hostile to it
          - Artefact evaluation norms
        check: "What would a stranger need to reproduce your last result exactly?"
        viz:
          type: stack
          layers:
          - The reported result
          - Configs and seeds
          - Environment
          - Data and code
      - name: Writing
        why: "The output of research is a paper somebody can act on."
        covers:
          - Abstract structure and the one-sentence claim
          - Mapping every claim to its evidence
          - Figures that carry the argument
          - Related work as positioning, not a list
          - Limitations written as the work, not as apology
          - Titles, framing, and the reader you are writing for
        check: "Compress your last project into one sentence a reviewer would remember."
        viz:
          type: flow
          steps:
          - Claim
          - Evidence
          - Figure
          - Limitation
      - name: Review and rebuttal
        why: "Community membership, and interviewers often ask about it."
        covers:
          - Reviewing well and what a useful review contains
          - Reading reviews without defensiveness
          - Rebuttal strategy and choosing which points to fight
          - Venue norms and timelines across NeurIPS, ICML, ICLR, ACL, CVPR
          - Preprints, arXiv practice, and scooping
          - Authorship and credit conversations
        check: "A reviewer misunderstood your method. Draft the first two sentences of the rebuttal."
        viz:
          type: flow
          steps:
          - Read the reviews
          - Sort by weight
          - Answer the load-bearing ones
          - Revise
      - name: The research interview
        why: "This is the round that decides research hires."
        covers:
          - A ten-minute talk on your own work, no slides needed
          - Defending one design choice under pressure
          - "The 'what would you do with ten times the compute' question"
          - Naming the weakest part of your own paper
          - Proposing what you would work on in the first six months
          - Asking questions that show you read their work
        check: "Present your strongest paper in ten minutes, then answer why the main baseline is fair."
        viz:
          type: flow
          steps:
          - Ten-minute talk
          - Defend a choice
          - Name the weakness
          - Say what is next
    traps:
      - Under-tuning the baseline you are beating
      - Reporting a single seed as a result
      - Framing limitations as apologies rather than the next step
      - Proposing work that ignores the team's actual agenda
    drills:
      - Write a one-page proposal with a stated kill criterion
      - Re-run someone else's baseline until you match their number
      - Give your ten-minute talk to a non-specialist and time it
      - Review one paper properly and compare with the public reviews

  - id: prompt-engineering
    name: Prompt Engineering
    group: judgement
    blurb: "Whether you treat prompts as an engineering surface with tests, or as guesswork."
    scope: "Owns instruction design and measurement. Hands the loop and tools to agentic AI, and weight updates to LLM training."
    links: [agentic-ai, llm-training]
    modules:
      - name: The basics that still matter
        why: "Most production gains come from doing these carefully."
        covers:
          - Clear instructions, task, audience, and output contract
          - Role and context setting, and when it does nothing
          - "Zero-shot, few-shot, and choosing examples"
          - Delimiters and structure for long inputs
          - Ordering effects, recency and primacy
          - Negative instructions and why they underperform
          - Model-specific behaviour and prompt portability
        check: "Rewrite a vague instruction into a testable one, and say what you would measure."
        viz:
          type: flow
          steps:
          - Task
          - Context
          - Examples
          - Output contract
      - name: Reasoning
        why: "The area with the most folklore, so precision stands out."
        covers:
          - Chain of thought, and when it helps
          - Self-consistency and majority voting
          - Decomposition, least-to-most, plan then solve
          - Reasoning models and why they need different prompting
          - Reasoning that hurts on simple tasks
          - Faithfulness of stated reasoning
        check: "Name a task where chain of thought lowers accuracy, and explain why."
        viz:
          type: compare
          cols:
          - k: Reasoning helps
            items:
            - Multi-step maths
            - Planning
          - k: Reasoning hurts
            items:
            - Simple lookup
            - Tight latency budget
      - name: Context construction
        why: "Long context rewards careful budgeting of what you include."
        covers:
          - System prompt design and stable structure
          - Where to place retrieved content and why
          - Lost in the middle, and mitigation
          - Context rot across long conversations
          - Token budgeting and compaction
          - Cache-friendly prompt layout, stable prefixes
        check: "You have 100k tokens of documents and a 32k budget. Describe your selection strategy."
        viz:
          type: scale
          lo: Nothing in context
          hi: Everything in context
          stops:
          - Too little
          - Selected
          - Too much
          'on': 1
      - name: Structured output
        why: "Every production integration needs this to be reliable."
        covers:
          - JSON schema and typed output contracts
          - Constrained decoding and grammars
          - Tool and function schemas as prompts
          - Parsing, validation, and repair loops
          - Partial output and streaming considerations
          - Failure handling when the schema is violated
        check: "Your JSON output breaks 2% of the time. Give three fixes ordered by cost."
        viz:
          type: flow
          steps:
          - Schema
          - Generate
          - Validate
          - Repair
          loop: true
      - name: Measurement
        why: "The line between prompt engineering and prompt guessing."
        covers:
          - Building the eval set before the prompt
          - Pairwise comparison and rubric grading
          - LLM-as-judge, its biases, and calibration against humans
          - Regression suites and prompt versioning
          - Automatic prompt optimisation, DSPy-style search
          - Statistical significance on small eval sets
        check: "How many examples do you need to tell two prompts apart, and how would you decide?"
        viz:
          type: flow
          steps:
          - Build the eval set
          - Change one thing
          - Compare
          - Keep or revert
          loop: true
      - name: Robustness
        why: "Where prompting meets security."
        covers:
          - Prompt injection through retrieved or tool content
          - Delimiter hygiene and untrusted-content marking
          - Instruction hierarchy and conflicting instructions
          - Jailbreak resistance and refusal tuning
          - Over-refusal and false positives
          - Behaviour change after a model upgrade
        check: "A retrieved document contains instructions. Describe your defence, and its limits."
        viz:
          type: parts
          centre: Untrusted text arrives in the prompt
          around:
          - Mark where it starts
          - Keep instructions above it
          - Limit what the tools can do
          - Test with an injection
      - name: Choosing the right lever
        why: "Senior candidates are judged on knowing when to stop prompting."
        covers:
          - Prompt versus few-shot versus retrieval versus fine-tune versus agent loop
          - Cost, latency and maintenance of each
          - When a prompt has hit its ceiling
          - When the problem is the data, not the prompt
          - Migration cost between models
          - Documenting a prompt as a product artefact
        check: "At what point do you stop iterating on a prompt and fine-tune instead?"
        viz:
          type: scale
          lo: Cheapest to change
          hi: Most expensive to change
          stops:
          - Prompt
          - Few-shot
          - Retrieval
          - Fine-tune
          'on': 0
    traps:
      - Claiming a prompt improvement with no eval set
      - Stacking instructions that contradict each other
      - Assuming a prompt transfers across model families
      - Treating chain of thought as free accuracy
    drills:
      - Write 30 eval examples before touching the prompt
      - Run the same prompt on three model families and diff the failures
      - Build a regression suite that runs on every prompt edit
      - Attack your own prompt with injected instructions

  # ── Systems ──────────────────────────────────────────────────────────────
  - id: agentic-ai
    name: Agentic AI
    group: systems
    blurb: "Whether you can build a loop that finishes the task and stops when it should."
    scope: "Owns the agent loop, tools and evaluation. Hands instruction design to prompt engineering and permissioning to network and security."
    links: [prompt-engineering, network-and-security]
    modules:
      - name: The loop
        why: "Every agent framework is a variation on this, so know the primitive."
        covers:
          - Observe, plan, act, observe again
          - ReAct and interleaved reasoning
          - Plan-and-execute versus reactive stepping
          - Reflection and self-critique steps
          - Termination conditions and step budgets
          - Loop detection and progress checks
        check: "Write the pseudocode for a minimal tool-using agent, including its stopping rule."
        viz:
          type: flow
          steps:
          - Observe
          - Plan
          - Act
          - Observe the result
          loop: true
      - name: Tools
        why: "Most agent failures are tool failures."
        covers:
          - Tool schema design and naming
          - Descriptions as prompts, and their effect on selection
          - Error messages the model can act on
          - Idempotency, retries, and side effects
          - Sandboxing and permission scopes
          - Model Context Protocol and tool servers
          - Tool count, overlap, and selection accuracy
        check: "The agent calls the wrong tool half the time. Give four changes before touching the model."
        viz:
          type: parts
          centre: One tool call
          around:
          - The schema it reads
          - The arguments it fills
          - The error it can act on
          - The permission it needs
      - name: Memory and context
        why: "The binding constraint on long tasks."
        covers:
          - Short-term scratchpad versus persistent memory
          - Retrieval over past steps and artefacts
          - Summarisation and compaction strategies
          - State serialisation and resumption
          - Context budgeting across a long trajectory
          - Deciding what to forget
        check: "A task needs 300 steps and the context holds 30. Describe your memory design."
        viz:
          type: stack
          layers:
          - The current step
          - Recent steps
          - Summary of the run
          - Stored artefacts
      - name: Planning and control
        why: "Where cost and reliability are decided."
        covers:
          - Task decomposition and subtask granularity
          - Orchestrator and worker patterns
          - Verifier loops and check steps
          - Budget control, token and wall-clock
          - Parallel versus sequential steps
          - Escalation to a human
        check: "How do you stop an agent that is confidently making no progress?"
        viz:
          type: tree
          root: The task is long
          branches:
          - k: Decompose
            items:
            - Subtasks
          - k: Verify
            items:
            - Check each step
          - k: Budget
            items:
            - Stop at a limit
      - name: Multi-agent systems
        why: "Popular, often unnecessary, and you should be able to say when."
        covers:
          - Role specialisation and when it helps
          - Message passing and shared state
          - Debate and critic patterns
          - Coordination cost and duplicated work
          - Failure propagation across agents
          - When one agent with better tools wins
        check: "Give a task where multi-agent beats single-agent, and one where it clearly loses."
        viz:
          type: compare
          cols:
          - k: One agent
            items:
            - Simplest
            - No coordination cost
          - k: Many agents
            items:
            - Work in parallel
            - Coordination cost
            - Failures spread
      - name: Evaluation
        why: "Agent evaluation is harder than model evaluation and interviewers know it."
        covers:
          - End-to-end task success rate
          - Trajectory analysis and partial credit
          - "Benchmarks: SWE-bench, WebArena, tau-bench, and their limits"
          - Rubric-based judging of process
          - Cost per solved task
          - Regression suites and flakiness
        check: "Your agent solves 40% of tasks. How do you find out where the other 60% break?"
        viz:
          type: flow
          steps:
          - Run the task
          - Read the trajectory
          - Find the break
          - Fix
          - Run again
          loop: true
      - name: Reliability and safety
        why: "Agents have privileges, which changes the risk profile."
        covers:
          - Prompt injection through tool output and web content
          - Confused deputy and privilege escalation
          - Least privilege and scoped credentials
          - Human in the loop and approval gates
          - Audit logs and reproducing a trajectory
          - Rollback and irreversible actions
        check: "Your agent can send email and read the web. Name the attack and design the defence."
        viz:
          type: stack
          layers:
          - Approval for irreversible steps
          - Audit log
          - Scoped credentials
          - Sandbox
    traps:
      - Adding agents when the problem needed one better tool
      - No step budget, so failures cost real money
      - Evaluating on final answer only, with no trajectory view
      - Giving broad credentials because scoping was inconvenient
    drills:
      - Build a three-tool agent with no framework, then read one framework's source
      - Log every trajectory and read 20 failures by hand
      - Inject an instruction into a tool result and watch what happens
      - Measure cost per solved task, not just success rate

  - id: mlops
    name: MLOps
    group: systems
    blurb: "Whether the model still works in six months and someone other than you can fix it."
    scope: "Owns lifecycle, serving and monitoring. Hands pipeline internals to data engineering."
    links: [data-engineering, machine-learning]
    modules:
      - name: Lifecycle and reproducibility
        why: "The base expectation for any production role."
        covers:
          - Problem framing to retirement, as one loop
          - Experiment tracking and run metadata
          - Versioning code, data, config, and model together
          - Model registry, stages, and promotion
          - Environment pinning and containers
          - Reproducing a six-month-old prediction
        check: "A regulator asks why the model made a decision last March. What do you need to answer?"
        viz:
          type: flow
          steps:
          - Frame
          - Train
          - Register
          - Deploy
          - Monitor
          loop: true
      - name: Data for ML systems
        why: "Training-serving skew is the classic production bug."
        covers:
          - Feature stores, online and offline
          - Point-in-time correctness and time travel
          - Training-serving skew, causes and detection
          - Backfills and reprocessing
          - Data validation at the pipeline boundary
          - Label delay and feedback loops
        check: "Offline AUC is 0.85 and online performance is poor. List the skew sources you would check."
        viz:
          type: compare
          cols:
          - k: At training time
            items:
            - Features from history
            - Whole table at once
          - k: At serving time
            items:
            - Features as the request arrives
            - One row
      - name: Training infrastructure
        why: "Cost control is a real part of the job."
        covers:
          - Containers and orchestration, Kubernetes basics
          - "Workflow tools: Airflow, Kubeflow, Ray, Metaflow"
          - GPU scheduling, queues, and sharing
          - Spot instances and checkpoint recovery
          - Distributed training operations
          - Cost attribution and budgets
        check: "Training costs tripled with no accuracy gain. Where do you look?"
        viz:
          type: flow
          steps:
          - Queue
          - Schedule
          - Train
          - Checkpoint
          - Recover
          loop: true
      - name: Serving
        why: "Latency and cost questions appear in almost every system round."
        covers:
          - Batch, online, and streaming inference
          - Latency budgets, p50 versus p99
          - "Model servers: Triton, TorchServe, vLLM, TGI"
          - Autoscaling, cold starts, and warm pools
          - Quantisation, distillation, and caching for cost
          - Load testing and capacity planning
          - Multi-model serving and routing
        check: "You must serve a 7B model at 200ms p99 on a fixed budget. Walk through the design."
        viz:
          type: scale
          lo: Cheapest
          hi: Fastest to answer
          stops:
          - Batch
          - Micro-batch
          - Online
          'on': 2
      - name: Deployment strategy
        why: "How you ship without breaking things."
        covers:
          - Shadow deployment and offline replay
          - Canary and progressive rollout
          - Blue-green and instant rollback
          - A/B testing a model change
          - Feature flags and kill switches
          - Rollback triggers defined in advance
        check: "Design the rollout plan for a model that touches revenue."
        viz:
          type: flow
          steps:
          - Shadow
          - Canary
          - Full rollout
          - Rollback ready
      - name: Monitoring
        why: "The part that decides whether you find out first or the customer does."
        covers:
          - Input drift, prediction drift, and performance decay
          - Monitoring with delayed or missing labels
          - Proxy metrics and guardrails
          - Alert design and avoiding fatigue
          - Service level objectives for ML systems
          - Incident response and postmortems
          - Automated retraining and its risks
        check: "Labels arrive 30 days late. How do you know today whether the model is broken?"
        viz:
          type: tree
          root: Something changed
          branches:
          - k: Inputs
            items:
            - Data drift
          - k: Outputs
            items:
            - Prediction drift
          - k: Outcome
            items:
            - Performance decay
      - name: Governance
        why: "Increasingly the difference between a demo and a deployment."
        covers:
          - Lineage from prediction to training data
          - Model cards and documentation
          - Access control and PII handling
          - Audit trails and approval workflows
          - Fairness monitoring in production
          - Deprecation and model retirement
        check: "What documentation would you require before a model touches customer money?"
        viz:
          type: stack
          layers:
          - Approval
          - Documentation
          - Access control
          - Lineage
    traps:
      - Monitoring accuracy only, and only when labels arrive
      - Retraining automatically with no gate
      - Treating notebooks as a deployment artefact
      - Ignoring cost until finance asks
    drills:
      - Deploy one small model end to end, including rollback
      - Write the runbook for your own model failing at 2am
      - Simulate drift and confirm your monitor fires
      - Price your inference per thousand requests

  - id: data-engineering
    name: Data Engineering
    group: systems
    blurb: "Whether the numbers are right, arrive on time, and cost what you said they would."
    scope: "Owns storage, pipelines and streaming. Hands model lifecycle to MLOps."
    links: [mlops]
    modules:
      - name: Storage and file layout
        why: "Most query cost problems are layout problems."
        covers:
          - OLTP versus OLAP workloads
          - Row versus columnar storage
          - "Formats: Parquet, ORC, Avro, and when each fits"
          - Partitioning, clustering, and small-file problems
          - Compression and encoding choices
          - "Table formats: Iceberg, Delta Lake, Hudi, and what they add"
          - Schema evolution
        check: "A query scans 2TB to return 100 rows. Give three layout changes and the expected effect."
        viz:
          type: compare
          cols:
          - k: Row store
            items:
            - Reads whole records
            - Suits writes
          - k: Column store
            items:
            - Reads a few columns
            - Suits scans
      - name: Data modelling
        why: "Where analytics teams either trust you or work around you."
        covers:
          - Normalisation and denormalisation trade-offs
          - Star and snowflake schemas
          - Fact and dimension design, grain
          - Slowly changing dimensions, types 1 to 3
          - Wide tables and the one-big-table pattern
          - Semantic layers and metric definitions
        check: "Model an events dataset for a team that asks unpredictable questions. Defend the grain."
        viz:
          type: parts
          centre: Fact table
          around:
          - Grain
          - Dimensions
          - Measures
          - Keys
      - name: Batch processing
        why: "SQL and Spark are the two most commonly tested skills."
        covers:
          - "SQL depth: window functions, CTEs, join strategies, anti-joins"
          - Query plans and reading them
          - "Spark: partitions, shuffle, broadcast joins, skew handling"
          - Adaptive query execution and caching
          - Incremental processing and idempotent writes
          - Cost tuning and cluster sizing
        check: "One Spark stage takes 90% of the runtime. Diagnose it."
        viz:
          type: flow
          steps:
          - Read
          - Shuffle
          - Join
          - Aggregate
          - Write
      - name: Streaming
        why: "The area where correctness gets subtle."
        covers:
          - "Kafka: topics, partitions, offsets, consumer groups, rebalancing"
          - Delivery semantics, at-least-once versus exactly-once
          - Event time versus processing time
          - Watermarks and late data
          - Windowing, tumbling, sliding, session
          - Stateful processing and checkpointing
          - Flink and Spark Structured Streaming differences
        check: "Events arrive an hour late. Explain what a watermark does to your aggregates."
        viz:
          type: flow
          steps:
          - The event happens
          - It arrives late
          - The watermark passes
          - The window closes
      - name: Orchestration and quality
        why: "Reliability is the product."
        covers:
          - DAG design, dependencies, and retries
          - Idempotency and safe reruns
          - Backfills without double counting
          - "Data contracts and schema enforcement"
          - "Testing: dbt tests, Great Expectations, assertions"
          - Lineage and impact analysis
          - Freshness and volume alerting
        check: "A source changed a column type overnight. How does your pipeline behave, and how should it?"
        viz:
          type: flow
          steps:
          - Extract
          - Validate
          - Transform
          - Test
          - Publish
          loop: true
      - name: Architecture
        why: "The system design round for data roles."
        covers:
          - Lakehouse and medallion layering
          - ETL versus ELT
          - Change data capture
          - Batch and streaming in one architecture
          - Warehouse selection and cost models
          - Governance, cataloguing, and access control
          - Build versus buy
        check: "Design ingestion for 50 sources with mixed freshness needs. State your assumptions first."
        viz:
          type: stack
          layers:
          - Serving tables
          - Curated tables
          - Cleaned tables
          - Raw landing
      - name: The system design round
        why: "It is a conversation about trade-offs."
        covers:
          - Clarifying volume, velocity, latency, and budget
          - Stating assumptions out loud
          - Sketching components before details
          - Naming the bottleneck and the failure mode
          - Cost estimates with real numbers
          - What you would build first and what you would defer
        check: "Design a pipeline for 10TB a day with a one-hour freshness target. Talk through it in 30 minutes."
        viz:
          type: flow
          steps:
          - Ask the volume
          - Ask the latency
          - Ask the budget
          - Sketch it
          - Name the bottleneck
    traps:
      - Designing before asking about volume and latency
      - Ignoring small-file and skew problems
      - Claiming exactly-once with no idempotency story
      - Backfills that silently double count
    drills:
      - Write the same aggregation three ways and compare query plans
      - Break a Spark job with skew on purpose, then fix it
      - Run a Kafka consumer group and force a rebalance
      - Design one pipeline on paper, then price it

  - id: network-and-security
    name: Network and Security
    group: systems
    blurb: "Whether you can reason about an attacker who wants your model, your data, or your credentials."
    scope: "Owns networking, application security and ML-specific attacks. Hands agent permissioning to agentic AI."
    links: [agentic-ai]
    modules:
      - name: Networking
        why: "The base layer under every distributed system question."
        covers:
          - OSI and TCP/IP layers
          - "TCP handshake, congestion control, and what a timeout means"
          - UDP and when it wins
          - DNS resolution and caching
          - "HTTP/1.1, HTTP/2, HTTP/3, keep-alive, head-of-line blocking"
          - "TLS handshake, certificates, chains, and pinning"
          - NAT, firewalls, load balancers, reverse proxies, CDNs
          - VPNs and private networking
        check: "Trace what happens from typing a URL to the first byte, and name where it can fail."
        viz:
          type: stack
          layers:
          - Application
          - Transport
          - Network
          - Link
      - name: Security foundations
        why: "The framing that makes the rest coherent."
        covers:
          - Confidentiality, integrity, availability
          - "Threat modelling: STRIDE, attack trees, trust boundaries"
          - Least privilege and defence in depth
          - Authentication versus authorisation
          - "OAuth 2.0, OIDC, and JWT pitfalls"
          - Session management and token lifetimes
          - Secrets management and rotation
        check: "Draw the trust boundaries for an ML service that reads customer data."
        viz:
          type: parts
          centre: Trust boundary
          around:
          - Who is asking
          - What they may do
          - What crosses the line
          - What gets logged
      - name: Cryptography in practice
        why: "Not to invent it, but to avoid misusing it."
        covers:
          - Symmetric versus asymmetric encryption
          - Hashing versus encryption versus encoding
          - Password storage, salting, and key derivation functions
          - Digital signatures and certificate chains
          - Key management and PKI
          - Common misuse, ECB mode, reused nonces, homemade schemes
        check: "Explain why hashing a password with SHA-256 alone is not enough."
        viz:
          type: tree
          root: What do you actually need
          branches:
          - k: Secrecy
            items:
            - Encryption
          - k: Integrity
            items:
            - Hashing
            - Signatures
          - k: Identity
            items:
            - Certificates
      - name: Application security
        why: "The attacks you will actually meet."
        covers:
          - "OWASP Top 10, current edition"
          - Injection, SQL and command
          - Cross-site scripting and content security policy
          - Cross-site request forgery
          - Server-side request forgery, and why it hurts cloud systems
          - Insecure deserialisation
          - Dependency and supply chain risk, SBOMs
        check: "Your service fetches a user-supplied URL. Name the risk and the mitigation."
        viz:
          type: flow
          steps:
          - Untrusted input
          - Validate
          - Encode on output
          - Least privilege
      - name: Infrastructure and cloud
        why: "Where most real breaches happen now."
        covers:
          - IAM policies, roles, and privilege escalation paths
          - Network segmentation and security groups
          - Container isolation and escape risks
          - Secrets in images, environment variables, and logs
          - Logging, SIEM, and detection
          - Incident response phases
        check: "An access key leaked in a public repository. Walk through the first hour."
        viz:
          type: scale
          lo: Narrow access
          hi: Broad access
          stops:
          - One resource
          - One service
          - The whole account
          'on': 0
      - name: Machine learning security
        why: "The intersection that makes you unusual as a candidate."
        covers:
          - Training data poisoning and backdoors
          - Model extraction and stealing
          - Membership inference and memorisation
          - Adversarial examples and evasion
          - Prompt injection, direct and indirect
          - Tool abuse and confused deputy in agents
          - Unsafe model artefacts, pickle files, arbitrary code on load
        check: "Someone can query your model 100k times. What can they learn, and how do you limit it?"
        viz:
          type: parts
          centre: The model is the target
          around:
          - Poisoned training data
          - Stolen weights
          - Extracted training examples
          - Injected instructions
      - name: Privacy
        why: "The compliance layer that constrains model design."
        covers:
          - PII, sensitive categories, and data minimisation
          - GDPR concepts, lawful basis, and the right to erasure
          - Anonymisation versus pseudonymisation
          - Differential privacy basics and the privacy budget
          - Federated learning and its assumptions
          - Data residency and cross-border transfer
        check: "A user requests deletion and their data is in a trained model. What do you actually do?"
        viz:
          type: scale
          lo: Identifiable
          hi: Protected
          stops:
          - Raw personal data
          - Pseudonymised
          - Aggregated
          - Differentially private
          'on': 3
    traps:
      - Confusing authentication with authorisation
      - Trusting client-side validation
      - Loading a model checkpoint from an untrusted source
      - Treating differential privacy as automatic anonymity
    drills:
      - Capture a TLS handshake in Wireshark and name each message
      - Threat model one of your own services on paper
      - Run a dependency audit on a real project and triage the findings
      - Write the prompt injection that would break your own agent
