# Interview revision syllabi — /interview/ and one page per topic.
# Hand-written. House style applies: British spelling, short sentences, no em dashes.
#
# Each topic renders twice:
#   - as a card on the /interview/ hub (name, blurb, slug, modules count)
#   - as its own page at /<slug>/ via _layouts/syllabus.html
#
# Field contract per topic:
#   id       slug and permalink, must be unique across the whole site
#   name     display title
#   group    hub grouping key: foundations | models | systems | judgement
#   blurb    one sentence, what an interview on this actually tests
#   scope    what this track owns, and what it hands to a neighbouring track
#   modules  ordered study units. Each has name, why, covers[], check
#   links    other topic ids this one hands work to; the hub map draws these
#   traps    mistakes that cost points in a live interview
#   drills   things to do with your hands, never things to read
#
# `check` is the question you should be able to answer cold, no notes.
#
# Every module carries a `viz:` block that js/components/interview.js turns into
# a diagram at the top of that module. Eight archetypes:
#
#   flow     ordered stages, `loop: true` closes the cycle
#   compare  two or three columns of contrasting items
#   stack    layers, last entry is the base
#   matrix   two by two; `cells` reads top-left, top-right, bottom-left, bottom-right
#   scale    a spectrum with labelled stops, `on` marks one
#   parts    a centre with labelled parts around it
#   tree     a root question with branches
#   curve    SVG axes with two curves; `shape` is u, diverge, diag or rise
#
# Labels are lifted from that module's own covers, why or check. A diagram
# restates the module. It never adds a claim, and it carries no numbers.

topics:
  # ── Foundations ──────────────────────────────────────────────────────────
  - id: bayesian-statistics
    name: Bayesian Statistics
    group: foundations
    blurb: "Whether you can reason about a parameter you never get to observe."
    scope: "Owns priors, posteriors, and how you compute them. Hands calibration and coverage guarantees to uncertainty quantification."
    links: [uncertainty-quantification]
    modules:
      - name: Probability as belief
        why: "Every later answer rests on whether you can say what a probability refers to."
        beats:
          - >-
              Start with what you already believe. It is allowed to be vague.
          - >-
              Data arrives. It has an opinion of its own, and it does not care about
              yours.
          - >-
              Combine the two. Tomorrow this becomes the prior you start from.
        scene:
          kind: "narrowing"
          before: "Before the data"
          after: "After the data"
        plain:
          - >-
              A probability here is a strength of belief. You start with a belief, you
              see some data, and you end with a better belief. That is the whole loop.
          - >-
              Bayes rule is the arithmetic for that update. The trap is the base rate.
              If a disease is rare, most positive tests are still wrong, even with an
              accurate test.
        covers:
          - Sample space, events, conditional probability
          - "Bayes rule: prior, likelihood, evidence, posterior"
          - Joint, marginal and conditional distributions
          - Exchangeability and what de Finetti's theorem buys you
          - The likelihood principle and where it bites
          - Credible interval versus confidence interval
        check: "A test is 99% accurate and the disease affects 1 in 10,000. Give the posterior and explain the number to a non-statistician."
        viz:
          type: flow
          steps:
          - Prior belief
          - Observe data
          - Posterior belief
          loop: true
      - name: Priors and what they encode
        why: "Interviewers probe priors to find out if you understand assumptions or just run a library."
        beats:
          - >-
              A flat prior says every value is equally plausible. That is rarely what
              you think.
          - >-
              A weakly informative prior rules out the absurd and leaves the rest open.
              Usually the right default.
          - >-
              A strong prior needs a reason. Say what the reason is, then show the
              answer without it.
        plain:
          - >-
              The prior is what you believed before the data arrived. Everyone has one.
              Writing it down is what makes it honest.
          - >-
              A flat prior sounds neutral and rarely is. Pick a prior that rules out
              silly values, then show what happens if you change it.
        covers:
          - "Conjugate families: Beta-Binomial, Normal-Normal, Dirichlet-Multinomial, Gamma-Poisson"
          - Weakly informative priors and why they beat flat ones
          - Jeffreys priors and invariance
          - Improper priors and when the posterior still exists
          - Prior predictive checks
          - Prior sensitivity analysis
        check: "Your prior is Beta(1,1) and you see 3 heads in 3 flips. Give the posterior mean and say why it is not 1."
        viz:
          type: scale
          lo: Says little
          hi: Says a lot
          stops:
          - Flat
          - Weakly informative
          - Strongly informative
          'on': 1
      - name: Computing the posterior
        why: "Bayesian methods became practical when these algorithms did."
        beats:
          - >-
              You want the posterior. Most of the time you cannot write it down.
          - >-
              Sometimes the maths works out exactly. Conjugate pairs give you a formula
              and nothing to tune.
          - >-
              Otherwise, draw thousands of samples and let the pile of points stand in
              for the shape.
          - >-
              Or fit a simpler shape close to the real one. Faster, and wrong in ways
              you should name.
        plain:
          - >-
              The posterior is usually a shape you cannot write down. So you sample from
              it instead. Draw thousands of points and let the pile of points stand in
              for the shape.
          - >-
              The samplers differ in how they wander. A random walk gets lost in high
              dimensions. Hamiltonian methods use the slope of the surface to take long,
              sensible steps.
        covers:
          - Grid approximation and where it dies
          - Laplace approximation
          - "Metropolis-Hastings: proposal, acceptance ratio, tuning"
          - Gibbs sampling and full conditionals
          - "Hamiltonian Monte Carlo: leapfrog, step size, trajectory length"
          - NUTS and why it removed a tuning parameter
          - "Variational inference: ELBO, mean-field, reparameterisation trick"
          - "Diagnostics: R-hat, effective sample size, divergent transitions, trace plots"
        check: "Why does random-walk Metropolis scale badly with dimension, and what does HMC do differently?"
        viz:
          type: tree
          root: Getting the posterior
          branches:
          - k: Exact
            items:
            - Conjugate update
            - Grid over a small space
          - k: Sampling
            items:
            - Metropolis
            - Gibbs
            - Hamiltonian Monte Carlo
          - k: Approximate
            items:
            - Laplace
            - Variational inference
      - name: Hierarchical models
        why: "Partial pooling is the idea I reach for most in applied work."
        beats:
          - >-
              Treat every group separately and small groups swing wildly on almost no
              data.
          - >-
              Let them share. Each group is pulled toward the group average, and the
              smallest get pulled hardest.
          - >-
              Force them all to be identical and you have erased the differences you
              were measuring.
        plain:
          - >-
              You have twenty schools and a small sample from each. Treat them
              separately and the noise wins. Pool them all and you erase real
              differences.
          - >-
              Partial pooling sits between. Each school gets pulled toward the group
              average, and small noisy schools get pulled hardest. That pull is called
              shrinkage.
        covers:
          - Complete pooling, no pooling, partial pooling
          - Shrinkage and borrowing strength
          - Group-level and varying-slope models
          - Neal's funnel and the non-centred parameterisation
          - Hyperpriors on scale parameters
          - When a hierarchy helps and when it hides structure
        check: "Explain shrinkage in the eight-schools problem to a product manager in three sentences."
        viz:
          type: scale
          lo: Every group alone
          hi: All groups identical
          stops:
          - No pooling
          - Partial pooling
          - Complete pooling
          'on': 1
      - name: Checking and comparing models
        why: "Fitting a model is the easy part, so interviewers ask what would make you distrust it."
        beats:
          - >-
              Fit the model. This is the easy part and it proves nothing.
          - >-
              Generate fake data from the fit. If it looks nothing like the real data,
              stop here.
          - >-
              Leave points out one at a time and see how badly the model misses them.
          - >-
              Only now compare models, and check whether a few points are carrying the
              score.
        plain:
          - >-
              Once you have a posterior, generate fake data from it. If the fake data
              looks nothing like the real data, the model is wrong somewhere.
          - >-
              That check catches more problems than any single number. Comparison scores
              like LOO come after, and they carry their own warnings when a few points
              dominate.
        covers:
          - Posterior predictive checks and test quantities
          - "WAIC and LOO-CV, plus the Pareto-k diagnostic"
          - Bayes factors, marginal likelihood, and their sensitivity to priors
          - Model averaging and stacking
          - Calibration of posterior intervals
          - Prior-data conflict
        check: "When would you refuse to report a Bayes factor, and what would you report instead?"
        viz:
          type: flow
          steps:
          - Fit
          - Posterior predictive check
          - Leave-one-out
          - Compare
          loop: true
      - name: Bayesian methods inside machine learning
        why: "This is where the track meets the rest of your CV."
        beats:
          - >-
              A Gaussian process puts a distribution over functions. The kernel says
              what shapes are plausible.
          - >-
              A Bayesian neural network wants a distribution over every weight. Elegant,
              and hard to compute.
          - >-
              Train several ordinary networks instead. It costs more forward passes and
              beats the clever methods on calibration.
        plain:
          - >-
              This is where the track meets your CV. Gaussian processes, Bayesian
              optimisation and Bayesian neural networks all put uncertainty on a
              prediction.
          - >-
              The honest finding is that a plain ensemble of networks often beats the
              clever approximations on calibration. Say so. It signals you read results
              rather than slogans.
        covers:
          - Bayesian linear and logistic regression
          - "Gaussian processes: kernels, marginal likelihood, scaling limits"
          - "Bayesian optimisation: EI, UCB, Thompson sampling"
          - Bayesian neural networks and why they are hard
          - Laplace approximation over weights, last-layer Bayes
          - Deep ensembles as a cheap approximation
        check: "Why does a deep ensemble often beat mean-field variational inference on calibration?"
        viz:
          type: compare
          cols:
          - k: Gaussian process
            items:
            - Kernel sets the shape
            - Scales badly with data
          - k: Bayesian neural net
            items:
            - Posterior over weights
            - Hard to compute
          - k: Deep ensemble
            items:
            - Several full fits
            - Cheap approximation
    traps:
      - Describing a credible interval with confidence-interval language
      - Reporting MCMC results with no convergence diagnostics
      - Claiming Bayesian methods are automatically calibrated
      - Choosing a conjugate prior for convenience and never saying so
    drills:
      - Derive the Beta-Binomial posterior on paper, no lookup
      - Write Metropolis-Hastings in under 30 lines of NumPy
      - Fit eight schools in both parameterisations and compare divergences
      - Explain R-hat to a rubber duck in 60 seconds

  - id: frequentist-statistics
    name: Frequentist Statistics
    group: foundations
    blurb: "Whether your conclusions survive someone asking how you would be wrong."
    scope: "Owns estimators, testing, experiment design and causal identification. Hands posterior belief to Bayesian statistics."
    links: [bayesian-statistics, machine-learning]
    modules:
      - name: Estimators and their properties
        why: "Every other answer in this track is built from this vocabulary."
        beats:
          - >-
              Low bias and low variance. The estimate lands near the truth and stays
              there.
          - >-
              Centred but jumpy. Right on average, and any single run could be well off.
          - >-
              Tight but wrong. Consistently missing in the same direction, which is the
              harder failure to spot.
          - >-
              Both problems at once. Nothing here is worth reporting.
        plain:
          - >-
              An estimator is a recipe for turning data into a number. Run the recipe on
              different samples and you get different answers.
          - >-
              Bias is how far off the average answer is. Variance is how much the answer
              jumps about. You usually trade one for the other.
        covers:
          - Bias, variance, mean squared error, consistency
          - Efficiency and the Cramér-Rao bound
          - Sufficiency and the factorisation theorem
          - "Maximum likelihood: score, Fisher information, asymptotic normality"
          - Method of moments
          - Regularised estimators and the bias-variance trade
        check: "Show the MLE of the variance is biased, then argue why people still use it."
        viz:
          type: matrix
          x:
          - Low variance
          - High variance
          "y":
          - Low bias
          - High bias
          cells:
          - Efficient estimate
          - Noisy but centred
          - Systematically off
          - Off and unstable
      - name: Sampling distributions and intervals
        why: "Half of applied statistics is putting an honest error bar on a number."
        beats:
          - >-
              Somewhere there is a population you will never fully see.
          - >-
              You take one sample from it. That sample is all you get.
          - >-
              From the sample you compute one number.
          - >-
              Imagine repeating that a thousand times. The spread of those numbers is
              what you are really reasoning about.
          - >-
              The interval is built from that spread. It describes the method across many runs.
        plain:
          - >-
              Imagine repeating your study a thousand times. The estimates would form a
              spread. That spread is what a standard error measures.
          - >-
              A confidence interval is a property of the recipe. Run it forever and 95% of the intervals cover the truth. Run it forever and 95% of the intervals cover the truth.
        covers:
          - Law of large numbers, central limit theorem, and their conditions
          - Delta method for functions of estimates
          - "Standard errors: analytic, sandwich, clustered"
          - t, chi-square and F distributions
          - Confidence interval as a procedure with long-run coverage
          - "Bootstrap: percentile, basic, BCa, and where it fails"
        check: "Define a 95% confidence interval without saying anything about this particular interval."
        viz:
          type: flow
          steps:
          - Population
          - Sample
          - Estimate
          - Sampling distribution
          - Interval
      - name: Hypothesis testing
        why: "People say something technically false here without noticing."
        beats:
          - >-
              The null was true and you rejected it. You claimed an effect that is not
              there.
          - >-
              The null was false and you rejected it. This is the outcome you were
              hoping for.
          - >-
              The null was true and you kept it. Correct, and unpublishable.
          - >-
              The null was false and you missed it. Usually because the study was too
              small.
        plain:
          - >-
              A test asks one question. If nothing were going on, how surprising would
              this data be? The p-value is that surprise, as a number.
          - >-
              It is not the chance the null is true. A large p-value means you did not find an effect. Showing there is none is a different claim.
        covers:
          - Null and alternative, type I and type II error
          - Power, minimum detectable effect, sample size
          - "The p-value: definition, and the four things it is not"
          - Neyman-Pearson framing versus Fisher framing
          - Likelihood ratio, Wald and score tests
          - Non-parametric tests and when to reach for them
        check: "Define a p-value in one sentence, then say what a non-significant result does and does not license."
        viz:
          type: matrix
          x:
          - Null is true
          - Null is false
          "y":
          - Reject
          - Do not reject
          cells:
          - Type I error
          - Correct rejection
          - Correct
          - Type II error
      - name: Multiple comparisons and researcher freedom
        why: "Anywhere you run many models, this decides whether the result is real."
        beats:
          - >-
              Run forty tests, correct nothing, and a couple will look significant by
              luck alone.
          - >-
              Controlling the false discovery rate accepts some false positives and
              keeps more power.
          - >-
              Controlling family-wise error is stricter. You will miss real effects to
              be sure of the ones you keep.
        plain:
          - >-
              Test forty things and a few will look significant by luck alone. Nothing
              is wrong with the data. The problem is the number of looks.
          - >-
              Corrections trade power for honesty. Deciding the analysis before seeing the data is the stronger fix. Stopping a test early because it turned significant undoes both.
        covers:
          - Family-wise error rate, Bonferroni, Holm, Šidák
          - False discovery rate and Benjamini-Hochberg
          - Garden of forking paths, p-hacking, HARKing
          - Pre-registration and analysis plans
          - Peeking, sequential testing, alpha spending
          - Always-valid inference and confidence sequences
        check: "You ran 40 metrics on one experiment and two are significant. What do you tell the product team?"
        viz:
          type: scale
          lo: Every test stands alone
          hi: Every test corrected
          stops:
          - No correction
          - False discovery rate
          - Family-wise error
          'on': 1
      - name: Experiment design and A/B testing
        why: "Almost every company asks about this, and it is the applied-scientist core of the track."
        beats:
          - >-
              Split users at random. That coin flip is what buys you the causal claim.
          - >-
              Run it long enough that novelty wears off and the weekly cycle completes.
          - >-
              Measure the metric you named in advance, plus the guardrails you would not
              accept breaking.
          - >-
              Decide. If you keep searching for a slice that works, the experiment is
              already over.
        scene:
          kind: split
          parts:
            - {k: Control, w: 1}
            - {k: Treatment, w: 1, on: true}
          alt: "A random user split into control and treatment groups."
        plain:
          - >-
              An A/B test is a randomised experiment wearing a product hat. Split users,
              ship two versions, compare. Randomising is what buys you the causal claim.
          - >-
              Most of the skill is in the setup. What unit do you randomise. How long do you run it. Which metric would make you roll the change back.
        covers:
          - Randomisation unit, SUTVA, interference and network effects
          - Sample size, MDE, and duration planning
          - "Variance reduction: CUPED, stratification, covariate adjustment"
          - Ratio metrics and the delta method
          - Novelty and primacy effects
          - Switchback and cluster-randomised designs
          - Guardrail metrics and overall evaluation criteria
        check: "Your treatment lifts clicks and drops revenue per session. Walk through what you check before deciding."
        viz:
          type: flow
          steps:
          - Randomise
          - Run
          - Measure
          - Decide
          loop: true
      - name: Causal inference
        why: "Moving from a correlation to a decision is the hard part."
        beats:
          - >-
              You cannot randomise. Every option below buys the causal answer with an
              assumption.
          - >-
              Match or weight on the confounders. This assumes you measured all of them,
              which you cannot check.
          - >-
              Find something that moves the treatment and nothing else. The hard part is
              arguing it affects the outcome no other way.
          - >-
              Use a cutoff or a timing change as the shove. Assumes nothing else jumped
              at the same moment.
        plain:
          - >-
              Two things move together. That tells you nothing about whether one caused
              the other. Something else may be driving both.
          - >-
              Each design buys a causal answer with an assumption. Matching assumes you
              measured the confounders. Instruments assume the instrument works one way
              only. Name the assumption out loud.
        covers:
          - Potential outcomes, ATE, ATT, CATE
          - DAGs, backdoor and frontdoor criteria, colliders
          - Confounding, selection bias, Simpson's paradox
          - Propensity scores, matching, weighting, overlap
          - Instrumental variables and exclusion restriction
          - Difference in differences and parallel trends
          - Regression discontinuity
          - Sensitivity analysis for unmeasured confounding
        check: "You cannot randomise. Give three designs and state the assumption each one leans on."
        viz:
          type: tree
          root: You cannot randomise
          branches:
          - k: Close the backdoor
            items:
            - Matching
            - Propensity weighting
          - k: Find an instrument
            items:
            - Exclusion restriction
          - k: Use time or a cutoff
            items:
            - Difference in differences
            - Regression discontinuity
      - name: Regression in practice
        why: "Regression is still the default when someone needs an answer this afternoon."
        beats:
          - >-
              This is the claim you want to make.
          - >-
              It rests on the error bars, and grouped or repeated data breaks the
              default ones.
          - >-
              Which rest on the model form. A missing interaction shows up as a pattern
              in the residuals.
          - >-
              And all of it rests on assumptions you should state out loud before anyone
              asks.
        plain:
          - >-
              Regression fits a line, or a surface, through the data. It is still the
              fastest way to get a defensible answer before lunch.
          - >-
              The coefficients are only as good as the error bars. Repeated measures or
              grouped data break the default standard errors, and the fix is to cluster
              them.
        covers:
          - OLS assumptions and what breaks under each violation
          - Heteroskedasticity, robust and clustered standard errors
          - Multicollinearity and variance inflation
          - "Generalised linear models: link functions, dispersion, offsets"
          - Residual diagnostics and influence measures
          - Interpreting coefficients under transformation
        check: "Your standard errors halved after you switched from clustered to classical. Which do you trust and why?"
        viz:
          type: stack
          layers:
          - What you claim
          - Standard errors
          - Model form
          - Assumptions
    traps:
      - "Saying a p-value is the probability the null is true"
      - Treating a non-significant result as evidence of no effect
      - Stopping an experiment the day it turns significant
      - Reporting i.i.d. standard errors on clustered or repeated-measure data
    drills:
      - Simulate 10,000 experiments and confirm your interval covers 95% of the time
      - Compute a required sample size from a stated MDE by hand
      - Bootstrap a median and compare with the analytic approximation
      - Draw the DAG for a confounded product metric before touching data

  - id: machine-learning
    name: Machine Learning
    group: foundations
    blurb: "Whether you can turn a vague business problem into a model somebody can ship."
    scope: "Owns classical models, evaluation and the case-study round. Hands network training to deep learning."
    links: [deep-learning]
    modules:
      - name: Framing the problem
        why: "Get this wrong and the modelling never matters, which is why interviewers open here."
        beats:
          - >-
              Someone asks for something vague. Churn prediction, say. Nobody has
              defined churn yet.
          - >-
              Pin down exactly what you are predicting and when you would know the
              answer.
          - >-
              Choose what a mistake costs. A missed fraud and a false alarm are not the
              same size.
          - >-
              Build the dumbest thing that could work. Last month's value, or the
              majority class.
          - >-
              Then ask what decision changes because of the number. If nothing changes,
              stop here.
        plain:
          - >-
              Before any model, decide what you are predicting and what a good answer is
              worth. Most failed projects were lost at this step.
          - >-
              Watch for leakage in the target. Some fields are only filled in after the outcome is known. Use one and your model looks brilliant offline and useless live.
        covers:
          - Supervised, unsupervised, self-supervised, reinforcement
          - Choosing a target, and target leakage
          - Loss function versus business metric
          - Offline metric versus online outcome
          - Baselines you must beat before modelling
          - Deciding when machine learning is the wrong tool
        check: "A team wants to predict churn. What do you ask before writing any code?"
        viz:
          type: flow
          steps:
          - Business question
          - Target
          - Loss
          - Baseline
          - Decision
      - name: The core model families
        why: "Boosted trees still win a lot of tabular problems, and you will be asked why."
        beats:
          - >-
              Rows and columns, mixed types, some values missing. The most common shape
              of real data.
          - >-
              A linear model is fast, easy to explain, and needs you to hand it the
              interactions.
          - >-
              Boosted trees split on thresholds, so scale does not matter and
              interactions come free. Usually the winner here.
          - >-
              Distance methods need scaling and struggle as columns pile up. Worth
              knowing, rarely the answer.
        plain:
          - >-
              On tables of rows and columns, gradient boosted trees still win most of
              the time. They handle mixed types and missing values without much fuss.
          - >-
              Know why. Trees split on thresholds. So they ignore scale, and they pick up interactions on their own. Neural networks need far more data
              to match that.
        covers:
          - Linear and logistic regression, regularisation, elastic net
          - Decision trees, splitting criteria, pruning
          - Bagging, random forests, feature importance and its flaws
          - "Gradient boosting: XGBoost, LightGBM, CatBoost, and the differences"
          - Support vector machines and the kernel trick
          - k-nearest neighbours, naive Bayes
          - "Unsupervised: k-means, DBSCAN, hierarchical, GMM"
          - "Dimensionality reduction: PCA, t-SNE, UMAP"
        check: "Tabular data, 100k rows, mixed types, missing values. Pick a model and defend it in 90 seconds."
        viz:
          type: tree
          root: Tabular problem
          branches:
          - k: Linear
            items:
            - Regression
            - Regularisation
          - k: Trees
            items:
            - Random forest
            - Gradient boosting
          - k: Distance
            items:
            - Nearest neighbours
            - Support vector machine
      - name: Evaluation you can defend
        why: "A leaky validation split will sink an otherwise good answer."
        beats:
          - >-
              Split before you touch anything. This is the step people skip and regret.
          - >-
              Fit the model, and every transformer, on the training part alone.
          - >-
              Tune on validation. Every time you look at it you use a little of it up.
          - >-
              Touch the test set once. If you tune against it, it is just another
              validation set.
        scene:
          kind: "split"
          parts: [{"k": "train", "w": 6}, {"k": "validation", "w": 2}, {"k": "test", "w": 2, "on": true}]
          leak: "Fit a scaler before this cut and information walks backwards from test into train."
        plain:
          - >-
              Split the data first. Fit on the training part. Tune on the validation part. Touch the test part once, at the end.
          - >-
              Leakage is the usual killer. Fit a scaler before the split and the test set has already influenced training. The score you report is then a fiction.
        covers:
          - Train, validation, test discipline
          - "Cross-validation: k-fold, stratified, grouped, nested"
          - Time-series splits and forward chaining
          - Leakage sources, including preprocessing before the split
          - "Metrics: precision, recall, F1, ROC-AUC, PR-AUC, log loss"
          - Threshold selection under asymmetric costs
          - Calibration and why AUC ignores it
        check: "When is PR-AUC the right metric and ROC-AUC misleading?"
        viz:
          type: flow
          steps:
          - Split first
          - Fit on train
          - Tune on validation
          - Report on test
      - name: Features
        why: "On tabular problems this moves the number more than the model choice."
        beats:
          - >-
              Compute the encoding inside each fold, from that fold's training rows
              only.
          - >-
              Compute it once over everything and the target leaks backwards. The score
              looks wonderful and means nothing.
        plain:
          - >-
              Features are how you tell the model what matters. On tabular problems,
              better features move the score more than a better model.
          - >-
              Target encoding is powerful and leaks easily. Compute it inside each fold,
              never on the full dataset, or the model learns the answer.
        covers:
          - Categorical encoding, target encoding and its leakage
          - Scaling, binning, transformations
          - Missing-value strategies and missingness as a signal
          - Interaction and ratio features
          - Feature selection, permutation importance, SHAP
          - Monotonic constraints for regulated settings
        check: "Explain how target encoding leaks and how you would do it safely."
        viz:
          type: compare
          cols:
          - k: Fit inside the fold
            items:
            - Scalers
            - Encoders
            - Target encoding
          - k: Fit on everything
            items:
            - Test set leaks in
            - Score looks better than it is
      - name: Imbalance and shift
        why: "Almost every real dataset arrives imbalanced, shifted, or both."
        beats:
          - >-
              Live performance dropped. Something moved, and which thing decides the
              fix.
          - >-
              The inputs moved. Same relationship, new region of the space. Reweighting
              may be enough.
          - >-
              The base rate moved. Fraud rose. The model is fine and the threshold is
              wrong.
          - >-
              The relationship itself moved. What predicted the outcome last year no
              longer does. Only retraining helps.
        plain:
          - >-
              Real data is lopsided and it drifts. One class may be a tenth of a percent. Last month's pattern may not hold this month.
          - >-
              Resampling fixes the balance and breaks the probabilities. If the product
              needs a calibrated number rather than a ranking, that trade matters.
        covers:
          - Class weights, resampling, SMOTE, focal loss
          - Why resampling breaks calibration
          - Covariate shift, label shift, concept drift
          - Importance weighting
          - Drift detection and monitoring
          - Retraining triggers
        check: "You have 0.1% positives. Give your approach and say what you would sacrifice."
        viz:
          type: tree
          root: The score dropped
          branches:
          - k: Covariate shift
            items:
            - Inputs moved
          - k: Label shift
            items:
            - Base rate moved
          - k: Concept drift
            items:
            - The relationship moved
      - name: Enough theory to hold a conversation
        why: "Research-flavoured roles will probe one level below the API."
        beats:
          - >-
              Training error falls as you add capacity, and keeps falling. It will
              happily reach zero.
          - >-
              Test error falls, then turns and climbs. The gap between the two curves is
              what overfitting looks like.
        plain:
          - >-
              A model with more capacity can fit more shapes, including the noise. Too
              little and it misses the pattern. Too much and it memorises.
          - >-
              The old picture said error rises again once you add too many parameters.
              Very large models break that picture, which is worth being able to
              describe.
        covers:
          - Bias-variance decomposition
          - Overfitting, underfitting, capacity, regularisation
          - Generalisation bounds at an intuitive level
          - Curse of dimensionality
          - No free lunch
          - Double descent and the overparameterised regime
        check: "Why does a model with more parameters than data points sometimes generalise well?"
        viz:
          type: curve
          shape: u
          x: Model capacity
          "y": Error
          a: Training error
          b: Test error
      - name: The case study round
        why: "An hour-long open question is standard for applied roles."
        beats:
          - >-
              Ask questions first. Volume, latency, what a mistake costs, who acts on
              the output.
          - >-
              Name the baseline you have to beat, and be honest that it might be hard to
              beat.
          - >-
              Now pick a model, and say why that one given what you just learned.
          - >-
              Say what you would ship this week. Six-month plans are easy to give and impossible to check.
          - >-
              Finish with how you would find out it had gone wrong. That is the part
              interviewers wait for.
        plain:
          - >-
              The case study is an open question with no right answer. Design fraud
              detection. Twenty minutes, a whiteboard, no code.
          - >-
              They are watching how you narrow it. Ask about volume, the cost of a mistake, and how fast an answer is needed. Then commit to something you could ship this week.
        covers:
          - Clarifying scope, users, constraints, and success criteria
          - Data availability and labelling cost
          - Baseline, v1, and what you would ship in a week
          - Serving constraints, latency, cost
          - Monitoring and the failure plan
          - How you would know the model made things worse
        check: "Design fraud detection for a payments company. Twenty minutes, whiteboard, no code."
        viz:
          type: flow
          steps:
          - Clarify
          - Baseline
          - Model
          - Ship
          - Monitor
          loop: true
    traps:
      - Reaching for a neural network on 5,000 rows of tabular data
      - Fitting the scaler before the split
      - Optimising AUC when the product needs a calibrated probability
      - Naming models without connecting any of them to the stated constraint
    drills:
      - Rebuild logistic regression with gradient descent from scratch
      - Take one Kaggle tabular set and beat your own baseline three ways
      - Write the leakage checklist you would run before every submission
      - Practise a 20-minute case study out loud, timed

  - id: deep-learning
    name: Deep Learning
    group: foundations
    blurb: "Whether you can make a network train, and explain it when it does not."
    scope: "Owns optimisation, architecture and scale. Hands the attention block to transformers and post-training to LLM training."
    links: [transformers, llm-training]
    modules:
      - name: Optimisation
        why: "Almost every training failure traces back to something in this module."
        beats:
          - >-
              One step downhill. Four things decide where you land.
          - >-
              The gradient gives the direction. It is the only information about the
              surface you have.
          - >-
              The learning rate is the step size. Too big and you bounce out, too small
              and you never arrive.
          - >-
              Momentum keeps part of the last step. This smooths noise and helps you
              cross flat parts.
          - >-
              Weight decay pulls the weights toward zero, so nothing grows large without
              earning it.
        scene:
          kind: descent
          cap: "The gradient gives a direction. The learning rate decides the distance."
          alt: "Four positions of one ball moving downhill along a loss curve toward its minimum."
        plain:
          - >-
              Training is a walk downhill on a landscape you cannot see. The gradient
              tells you which way is down. The learning rate is how big a step you take.
          - >-
              Most training failures live here. Too big a step and you bounce out. Too
              small and you never arrive. Warmup exists because the first steps are the
              most dangerous.
        covers:
          - Gradient descent, stochastic gradient descent, mini-batching
          - Momentum, Nesterov, RMSProp
          - "Adam and AdamW, and why decoupled weight decay matters"
          - "Learning rate schedules: warmup, cosine, linear decay, restarts"
          - Gradient clipping and loss scaling
          - Batch size, learning rate scaling rules, critical batch size
          - Sharpness, flat minima, and what the evidence actually shows
        check: "Why does Adam with L2 penalty behave differently from AdamW?"
        viz:
          type: parts
          centre: One update step
          around:
          - Gradient
          - Learning rate
          - Momentum
          - Weight decay
      - name: Initialisation and normalisation
        why: "These get copied from a reference implementation and then cannot be debugged."
        beats:
          - >-
              Batch norm normalises using the other examples in the batch, so examples
              affect each other.
          - >-
              Layer norm normalises across features within one example. Batch size stops
              mattering, which is why transformers use it.
          - >-
              RMSNorm drops the mean subtraction and keeps the scaling. Slightly cheaper
              and works about as well.
        scene:
          kind: normaxis
          batch: Batch norm
          layer: Layer norm
          alt: "Two activation tables. Batch norm marks one feature across examples; layer norm marks all features inside one example."
        plain:
          - >-
              Signals pass through many layers. Without care they either shrink to
              nothing or blow up. Initialisation sets the starting scale so they do
              neither.
          - >-
              Normalisation keeps them in range as training goes on. Batch norm uses the other examples in the batch. That is why it falls apart when the batch is small.
        covers:
          - Xavier and He initialisation, and the variance argument
          - Batch normalisation, train versus eval behaviour
          - Layer norm, RMSNorm, group norm
          - Why batch norm fails at small batch size and in distributed settings
          - Residual connections and gradient flow
          - Pre-norm versus post-norm placement
        check: "You moved from batch size 256 to 8 and training collapsed. Name the likely cause."
        viz:
          type: compare
          cols:
          - k: Batch norm
            items:
            - Normalises across the batch
            - Breaks at small batch
          - k: Layer norm
            items:
            - Normalises across features
            - Batch size does not matter
          - k: RMSNorm
            items:
            - Drops the mean term
            - Cheaper
      - name: Regularisation and generalisation
        why: "Interviewers use this to test whether you know the modern picture."
        beats:
          - >-
              Too little capacity and the model cannot represent the pattern. Errors
              look the same everywhere.
          - >-
              Enough capacity and it learns the signal while leaving the noise alone.
          - >-
              Too much and it memorises. Perfect on the training set, lost on anything
              new.
        scene:
          kind: fitpaths
          pattern: Learns the pattern
          memory: Learns every point
          alt: "The same observations with a smooth fitted path and a jagged path that follows every point."
        plain:
          - >-
              A model that memorises the training set has learnt the answers rather than
              the pattern. Regularisation makes memorising harder.
          - >-
              The modern picture is less tidy than the old one. Very large models can
              reach zero training loss and still keep improving on held-out data.
        covers:
          - Dropout, and why it is rarer in large models
          - Weight decay, early stopping, label smoothing
          - Data augmentation, mixup, cutmix
          - Implicit regularisation from SGD
          - Double descent
          - Memorisation versus generalisation
        check: "Your model hits zero training loss and validation is still improving. What is happening?"
        viz:
          type: scale
          lo: Too little capacity used
          hi: Too much capacity used
          stops:
          - Underfits
          - Fits
          - Memorises
          'on': 1
      - name: Backpropagation and memory
        why: "Anyone touching large models is expected to reason about memory."
        beats:
          - >-
              The forward pass computes the output layer by layer.
          - >-
              Along the way it keeps the intermediate values, because the backward pass
              needs them. This is what fills the GPU.
          - >-
              The backward pass walks the chain rule back, consuming those stored
              values.
          - >-
              Then the memory frees. Checkpointing throws some away early and recomputes
              them, buying memory with time.
        scene:
          kind: checkpoint
          blocks: [Input, Layer 1, Layer 2, Loss]
          back: Backward pass
          cap: Recompute discarded activations
          alt: "A forward chain with two discarded activations that must be recomputed during the backward pass."
        plain:
          - >-
              Backpropagation is the chain rule run backwards through the network. To do
              it, the forward pass has to keep its intermediate values in memory.
          - >-
              That memory is usually what stops you, rather than compute. Checkpointing
              throws some values away and recomputes them later, buying memory with
              time.
        covers:
          - Chain rule on a computational graph, reverse-mode autodiff
          - What is stored for the backward pass
          - Activation checkpointing, compute versus memory
          - Vanishing and exploding gradients
          - Straight-through estimators and non-differentiable ops
          - Optimiser state memory cost
        check: "Estimate the memory needed to train a 7B model in bf16 with Adam. Show the terms."
        viz:
          type: flow
          steps:
          - Forward pass
          - Store activations
          - Backward pass
          - Free the memory
          loop: true
      - name: Architectures and when each fits
        why: "You need a reason for the choice you made."
        beats:
          - >-
              Pick by the shape of the input, since the shape is free information.
          - >-
              A grid of pixels has local structure, so convolutions and their weight
              sharing fit.
          - >-
              A sequence has order and long-range links, which is what attention
              handles.
          - >-
              A graph has arbitrary neighbours, so pass messages along the edges.
        scene:
          kind: inputshape
          grid: Grid
          sequence: Sequence
          graph: Graph
          alt: "Three input shapes shown as a pixel grid, an ordered sequence, and a connected graph."
        plain:
          - >-
              Each architecture bakes in an assumption. Convolutions assume nearby
              pixels belong together. Recurrence assumes order matters. Transformers
              assume little and pay for it in data.
          - >-
              Pick by the shape of the input and the size of the dataset. A
              convolutional network still wins on small image sets, because its
              assumption is free information.
        covers:
          - MLPs, and what they cannot do cheaply
          - "CNNs: locality, weight sharing, translation equivariance"
          - "RNNs and LSTMs: sequence memory, gating, the long-range problem"
          - Transformers as the general-purpose default
          - Graph neural networks and message passing
          - Autoencoders, VAEs, diffusion, GANs
        check: "Give three tasks where a convolutional network still beats a transformer, with the reason."
        viz:
          type: tree
          root: What shape is the input
          branches:
          - k: Grid
            items:
            - Convolutional network
          - k: Sequence
            items:
            - Recurrent network
            - Transformer
          - k: Graph
            items:
            - Message passing
      - name: Training at scale
        why: "Reasoning about scale is what the job actually asks for."
        beats:
          - >-
              Experts split across devices, so each machine holds only a few.
          - >-
              Pipeline parallel cuts the model into stages. Simple, and the stages wait
              on each other.
          - >-
              Tensor parallel splits single matrices across devices. Heavy communication
              inside every layer.
          - >-
              Data parallel is the foundation. Copy the model everywhere, split the
              batch, average the gradients.
        scene:
          kind: replicas
          cap: "One model copy per device. Each copy sees a different data shard."
          alt: "Four devices holding the same model while each receives a different data shard."
        plain:
          - >-
              One GPU cannot hold a large model. So you split the work. Copy the model
              and split the data, or split the model itself across devices.
          - >-
              Every split costs communication. The skill is arranging the work so the machines talk while they compute.
        covers:
          - "Parallelism: data, tensor, pipeline, sequence, expert"
          - ZeRO stages and FSDP
          - "Mixed precision: fp16, bf16, fp8, and loss scaling"
          - Gradient accumulation and effective batch size
          - Communication overlap, NCCL, interconnect limits
          - Model FLOPs utilisation and how to raise it
        check: "Explain the difference between tensor parallelism and pipeline parallelism, and the cost of each."
        viz:
          type: stack
          layers:
          - Expert parallel
          - Pipeline parallel
          - Tensor parallel
          - Data parallel
      - name: Debugging
        why: "Interviewers like this question because reading about training does not prepare you for it."
        beats:
          - >-
              Take thirty examples and drive the loss to zero. If that fails, the bug is
              not the architecture.
          - >-
              Check the loss at step zero against what you can compute by hand. A wrong
              start means a wrong loss.
          - >-
              Watch the gradient norms. A sudden spike or a slow decay to nothing both
              name their own problem.
          - >-
              Change only the seed and rerun. If the result moves more than your
              improvement did, you have not measured anything.
        scene:
          kind: trace
          steps: [Batch, Loss, Gradients, Update]
          bad: 1
          alt: "A training pipeline inspected from batch to update, with the loss marked as the first bad state and later stages dimmed."
        plain:
          - >-
              When training breaks, resist changing the model. Start by proving the
              pipeline works: take thirty examples and drive the loss to zero.
          - >-
              If that fails, the bug is in the data or the loss.
              Check the loss at step zero too, since you can predict what it should be.
        covers:
          - Overfit a single batch first
          - Expected loss at initialisation
          - Gradient and activation norm tracking
          - Learning-rate range test
          - Seed variance and how many runs you need
          - Finding NaNs and where they come from
          - Data pipeline bugs that look like model bugs
        check: "Loss goes to NaN at step 3,000. Give your ordered debugging plan."
        viz:
          type: flow
          steps:
          - Overfit one batch
          - Check the loss at init
          - Watch gradient norms
          - Vary the seed
    traps:
      - Blaming the architecture before checking the data loader
      - Comparing runs that differ in more than one thing
      - Quoting a single seed as a result
      - Explaining batch norm as fixing internal covariate shift with no caveat
    drills:
      - Write backprop for a two-layer MLP by hand, then check against autograd
      - Overfit 32 examples to zero loss on a fresh codebase before every project
      - Profile one training step and find where the time goes
      - Reproduce a paper's training curve at small scale

  - id: linear-algebra
    name: Linear Algebra
    group: foundations
    blurb: "Whether you see a matrix as a thing that does something, rather than a box of numbers."
    scope: "Owns vectors, transformations and decompositions. Hands rates of change to calculus and estimators to frequentist statistics."
    links: [calculus, machine-learning]
    modules:
      - name: Vectors and spaces
        why: "Every later idea is stated in this language."
        beats:
          - >-
              A space is everything you can reach by adding and stretching a few arrows.
          - >-
              You can add two arrows. Put them nose to tail and see where you end up.
          - >-
              You can stretch any arrow by a number, including a negative one, which
              flips it.
          - >-
              Add and stretch them in any combination. Every place you can reach belongs
              to their span.
          - >-
              A basis is the smallest set of arrows that still reaches everywhere.
              Coordinates are always relative to one.
        plain:
          - >-
              A vector is an arrow with a length and a direction. A list of
              numbers is just a way of writing that arrow down.
          - >-
              A space is everything you can reach by stretching and adding those
              arrows. Span, basis and dimension are all ways of asking how much
              of the space you can reach.
        covers:
          - Vectors, scalars, addition and scaling
          - Span, linear independence, basis
          - Dimension and subspaces
          - Dot product, length, angle
          - Orthogonality and orthonormal bases
          - Coordinates depend on the basis you chose
        check: "Explain what a basis is without using the word basis."
        viz:
          type: parts
          centre: A vector space
          around:
          - Arrows you can add
          - Arrows you can stretch
          - Everything you can reach
          - A basis names the directions
      - name: Matrices as transformations
        why: "This is the shift that makes the rest of the subject easy."
        beats:
          - >-
              Here is the plain grid. Every point in the plane sits somewhere on it.
          - >-
              The matrix has two columns. Each one says where a starting arrow ends up.
          - >-
              Apply it and every point moves at once. Straight lines stay straight and
              the origin stays put.
          - >-
              Read the new grid and you can see the whole transformation. That is all a
              matrix is.
        plain:
          - >-
              A matrix is not a table of numbers. It is an instruction for moving
              every point in space at once.
          - >-
              To read one, look at its columns. Each column says where one of the
              original axes lands. That is the whole picture.
        covers:
          - Matrix times vector as a transformation
          - Columns are where the basis vectors land
          - Composition as matrix multiplication
          - Identity, rotation, scaling, shear, projection
          - Why matrix multiplication is not commutative
          - Shapes and when a product is legal
        check: "Given a two by two matrix, say where the unit square lands, and what its area becomes."
        viz:
          type: flow
          steps:
          - Start with the grid
          - Read the columns
          - Move every point
          - Read the new grid
      - name: Determinant, rank and inverse
        why: "Three questions about whether a transformation loses information."
        beats:
          - >-
              One question, asked three ways. Did the transformation lose any
              dimensions?
          - >-
              If not, the determinant is non-zero, every direction survived, and you can
              undo it.
          - >-
              If it did, space got squashed onto a line or a point. Many inputs now
              share one output, so there is no way back.
        plain:
          - >-
              The determinant is how much the transformation scales area, or
              volume. A determinant of zero means space got flattened.
          - >-
              Once space is flattened you cannot undo it, because many points
              landed on the same spot. That is exactly when the inverse does not
              exist, and rank counts how many dimensions survived.
        covers:
          - Determinant as a scaling factor for area and volume
          - Negative determinant and flipped orientation
          - Singular matrices and what goes wrong
          - Rank, column space, null space
          - Inverse and when it exists
          - Solving a linear system, and when there is no unique answer
        check: "A matrix has determinant zero. Say what that means geometrically and what it means for solving Ax equals b."
        viz:
          type: tree
          root: What did the transformation do to space
          branches:
          - k: Kept it full
            items: ["Determinant not zero", "Inverse exists"]
          - k: Flattened it
            items: ["Determinant zero", "Information lost"]
      - name: Eigenvectors and eigenvalues
        why: "The directions a transformation leaves alone explain what it really does."
        beats:
          - >-
              Take almost any arrow. The transformation knocks it off the line it was
              sitting on.
          - >-
              A few arrows stay on their own line and only get longer or shorter. Those
              are the eigenvectors, and the stretch is the eigenvalue.
        plain:
          - >-
              Most arrows get knocked off their line by a transformation. A few
              stay on their own line and only get stretched or squashed.
          - >-
              Those special directions are the eigenvectors, and the amount of
              stretch is the eigenvalue. They tell you what the transformation
              does when you apply it many times.
        covers:
          - The eigenvalue equation and what it asks
          - Characteristic polynomial
          - Diagonalisation and repeated application
          - Symmetric matrices and real eigenvalues
          - Positive definite matrices
          - Spectral radius and stability
        check: "Why does raising a matrix to a large power become easy once you have its eigenvectors?"
        viz:
          type: compare
          cols:
          - k: Ordinary direction
            items: ["Gets rotated off its line"]
          - k: Eigenvector
            items: ["Stays on its line", "Only the length changes"]
      - name: Decompositions
        why: "Factorising a matrix is how numerical linear algebra actually gets work done."
        beats:
          - >-
              Any matrix at all can be split into three simple moves. First, a rotation.
          - >-
              Then a stretch along the axes. The stretch factors are the singular
              values, and dropping the small ones is how compression works.
          - >-
              Then one more rotation. Three simple things, and together they are the
              whole transformation.
        plain:
          - >-
              A decomposition splits one matrix into simpler pieces. Each piece
              does one clean thing, like rotate, or stretch along axes.
          - >-
              The singular value decomposition works for every matrix. It says
              any transformation is a rotation, then a stretch, then another
              rotation.
        covers:
          - "Singular value decomposition: rotate, stretch, rotate"
          - Singular values and low-rank approximation
          - Eigendecomposition and where it applies
          - QR and least squares
          - Cholesky for positive definite systems
          - "Principal component analysis as an SVD"
        check: "Explain SVD in one sentence using only geometry, then say what the singular values mean."
        viz:
          type: flow
          steps:
          - Rotate
          - Stretch along axes
          - Rotate again
      - name: Projections and least squares
        why: "The geometry behind fitting a line to data."
        beats:
          - >-
              You want to hit a target with a model that cannot reach it.
          - >-
              Here is the target. No combination of your columns lands exactly on it.
          - >-
              Here is everything you can reach. A flat space inside a bigger one.
          - >-
              The nearest reachable point is the shadow of the target. That is your fit.
          - >-
              The gap points straight out from the space. That is why the residual is
              perpendicular.
        scene:
          kind: projection
          cap: "The closest reachable point is the target's shadow."
          alt: "A target projects onto a line, leaving a perpendicular error."
        plain:
          - >-
              You have a target that does not lie in the space you can reach. The
              closest you can get is its shadow on that space.
          - >-
              That shadow is a projection, and the error points straight out from
              the space. Least squares is exactly this picture.
        covers:
          - Projection onto a line and onto a subspace
          - The normal equations
          - Residual orthogonal to the column space
          - Overdetermined and underdetermined systems
          - Regularisation as a constraint on the solution
          - Condition number and why it matters here
        check: "Why is the least squares residual perpendicular to the column space?"
        viz:
          type: parts
          centre: Least squares
          around:
          - The target you cannot reach
          - The space you can reach
          - The shadow, which is the fit
          - The gap, which is the error
      - name: Numerical behaviour
        why: "Textbook linear algebra assumes exact arithmetic and computers do not have it."
        beats:
          - >-
              A well conditioned matrix is forgiving. Nudge the input and the answer
              barely moves.
          - >-
              Borderline. Rounding error starts to show up in the last digits you care
              about.
          - >-
              Ill conditioned. A change too small to see in the input swings the answer
              completely. The maths is fine and the computer is not.
        plain:
          - >-
              On a computer, numbers are stored with limited precision. Small
              errors creep in and some matrices magnify them badly.
          - >-
              The condition number measures that sensitivity. A high condition
              number means a tiny change in the input can swing the answer.
        covers:
          - Floating point and rounding error
          - Condition number and sensitivity
          - Why you rarely invert a matrix explicitly
          - Stable algorithms versus unstable ones
          - Sparse matrices and iterative solvers
          - Scaling features before solving
        check: "Why does everyone say not to compute an inverse, and what do you do instead?"
        viz:
          type: scale
          lo: Safe to solve
          hi: Answer swings wildly
          stops: ["Well conditioned", "Borderline", "Ill conditioned"]
          on: 2
    traps:
      - Describing a matrix as a grid of numbers with no mention of what it does
      - Saying a determinant of zero means the matrix is empty
      - Treating eigenvectors as existing for every matrix over the reals
      - Computing an explicit inverse to solve a linear system
    drills:
      - Draw where the unit square lands under four different two by two matrices
      - Find the eigenvectors of a two by two matrix by hand
      - Fit a line by least squares using the normal equations, no library
      - Take one image, keep the largest singular values, and look at what survives

  - id: calculus
    name: Calculus
    group: foundations
    blurb: "Whether you can reason about change, and about what a gradient is actually telling you."
    scope: "Owns derivatives, gradients and optimisation conditions. Hands the vector language to linear algebra and the training loop to deep learning."
    links: [linear-algebra, deep-learning]
    modules:
      - name: Derivatives and rates
        why: "Every training step is built on this one idea."
        beats:
          - >-
              Pick a point on the curve, then a second one nearby.
          - >-
              Draw the straight line through both. Its slope is the average steepness
              between them.
          - >-
              Now slide the second point toward the first. The line keeps tilting, by
              less each time.
          - >-
              It settles on one line. That slope is the derivative, and it is the whole
              idea.
        plain:
          - >-
              A derivative is a rate. Nudge the input a little and see how much
              the output moves.
          - >-
              Draw a line through two nearby points on a curve, then slide them
              together. The slope it settles on is the derivative at that point.
        covers:
          - Limits and continuity, informally
          - Derivative as a limit of slopes
          - Derivative as local linear approximation
          - Rules for sums, products and quotients
          - Higher derivatives and curvature
          - Where a derivative fails to exist
        check: "Define a derivative using a picture rather than a formula."
        viz:
          type: flow
          steps:
          - Two points on a curve
          - Draw the line between
          - Slide them together
          - The slope that remains
      - name: The chain rule
        why: "Backpropagation is this rule applied to a graph."
        beats:
          - >-
              Something goes in.
          - >-
              It passes through a middle step that depends on it.
          - >-
              And that produces an output. Each arrow has its own rate of change.
          - >-
              Multiply the rates along the chain and you have the total effect. Going
              backwards is cheaper when there is one output and many inputs.
        plain:
          - >-
              One thing affects a second. The second affects a third. Multiply the two rates for the total effect.
          - >-
              A neural network is a long chain of those. Working backwards along
              the chain, multiplying as you go, is exactly what backpropagation
              does.
        covers:
          - Composition and the chain rule
          - Computational graphs
          - Forward mode versus reverse mode
          - Why reverse mode suits many inputs and one output
          - What gets stored during the forward pass
          - Non-differentiable points and how they are handled
        check: "Explain why backpropagation goes backwards, and what that saves."
        viz:
          type: flow
          steps:
          - Input
          - Middle value
          - Output
          - Multiply the rates back
          loop: true
      - name: Gradients, Jacobians and Hessians
        why: "Naming these correctly is a quick signal of comfort with the maths."
        beats:
          - >-
              The Hessian is the second derivative. It describes the curve, and it tells
              a minimum from a saddle.
          - >-
              A Jacobian stacks the gradients when there are several outputs. Its shape
              is outputs by inputs.
          - >-
              The gradient is the vector of partials for one output. It points the way
              that increases fastest.
          - >-
              Underneath everything, a partial derivative. One input nudged, everything
              else held still.
        plain:
          - >-
              With several inputs, the derivative becomes a vector. It points in
              the direction that increases the output fastest.
          - >-
              A Jacobian collects those for several outputs at once. A Hessian is
              the second derivative, and it describes the curve rather than the
              slope.
        covers:
          - Partial derivatives and the gradient vector
          - Gradient points uphill, steepest ascent
          - Directional derivatives
          - Jacobian for vector valued functions
          - Hessian, curvature and second order methods
          - Shapes of each object, and why they matter
        check: "Take a function from R^n to R^m. Give the shapes of its gradient, Jacobian and Hessian."
        viz:
          type: stack
          layers:
          - Hessian, the curve
          - Jacobian, many outputs
          - Gradient, one output
          - Partial derivative, one direction
      - name: Optimisation conditions
        why: "Knowing when you have found a minimum, and when you have not."
        beats:
          - >-
              The gradient is zero. That is necessary for a minimum and nowhere near
              sufficient.
          - >-
              If the surface curves up in every direction, you have found a minimum.
          - >-
              If it curves down in every direction, a maximum.
          - >-
              If it curves up one way and down another, a saddle. In high dimensions
              this is what most zero-gradient points turn out to be.
        scene:
          kind: descent
          cap: "The slope changes as the point moves toward a low place."
          alt: "A point moves down a curved surface toward a low place."
        plain:
          - >-
              At a minimum the gradient is zero. But a zero gradient also happens
              at a maximum and at a saddle point.
          - >-
              The second derivative tells them apart. In high dimensions most
              zero-gradient points are saddles, not minima, which changes what
              training is actually fighting.
        covers:
          - Critical points, minima, maxima, saddles
          - Second derivative test
          - Convexity and why it makes life easy
          - Local versus global minima
          - Constrained optimisation and Lagrange multipliers
          - Why saddle points dominate in high dimensions
        check: "The gradient is zero. Say how you would tell a minimum from a saddle."
        viz:
          type: tree
          root: The gradient is zero
          branches:
          - k: Curves up everywhere
            items: ["Minimum"]
          - k: Curves down everywhere
            items: ["Maximum"]
          - k: Both, depending on direction
            items: ["Saddle"]
      - name: Integration and expectation
        why: "Every loss you write down is an average, and an average is an integral."
        beats:
          - >-
              What you actually want is the average loss over every input you will ever
              see.
          - >-
              What you have is the average over the sample you collected. It is an
              estimate, and it is noisy.
        plain:
          - >-
              An integral adds up infinitely many small pieces. Area under a curve
              is the usual picture.
          - >-
              In machine learning it usually appears as an expected value. You
              cannot compute it exactly, so you average over samples instead.
        covers:
          - Integral as accumulated area
          - Fundamental theorem linking it to the derivative
          - Expectation as an integral against a density
          - Monte Carlo estimation of an expectation
          - Change of variables
          - Why the loss you minimise is an estimate
        check: "Your loss is an expectation you cannot compute. What do you actually minimise?"
        viz:
          type: compare
          cols:
          - k: What you want
            items: ["The true average over all data"]
          - k: What you have
            items: ["An average over your sample", "Which is noisy"]
      - name: Approximation
        why: "Most methods are secretly a local approximation of something harder."
        beats:
          - >-
              Approximate the function by a flat line and you learn nothing about
              direction.
          - >-
              Approximate it by a sloped line and you get gradient descent. Cheap, and
              it ignores curvature.
          - >-
              Approximate it by a parabola and you get Newton's method. Better steps,
              and a much larger bill per step.
        plain:
          - >-
              Near a point, a smooth curve looks like a straight line. Look
              closer and it looks like a parabola.
          - >-
              That is a Taylor expansion. Gradient descent uses the straight line
              version. Second order methods use the parabola.
        covers:
          - Linear approximation and tangent lines
          - Taylor series and the remainder
          - First order versus second order methods
          - Newton's method and its cost
          - Where the approximation stops being valid
          - Numerical differentiation and its error
        check: "Explain gradient descent and Newton's method as two different local approximations."
        viz:
          type: scale
          lo: Cheap, less accurate
          hi: Costly, more accurate
          stops: ["Constant", "Straight line", "Parabola"]
          on: 1
      - name: Matrix calculus
        why: "Deriving a gradient on a whiteboard is a common interview task."
        beats:
          - >-
              Write the loss down carefully, including the shapes of everything in it.
          - >-
              Differentiate one layer at a time. Do not try to do the whole network in
              one line.
          - >-
              Check the shapes at every step. If they do not line up, something is wrong
              already.
          - >-
              Then chain it backwards to the weights. The shape check is what catches
              the mistake.
        plain:
          - >-
              The derivative rules still work for vectors and matrices. The hard part
              is keeping every shape consistent.
          - >-
              The reliable trick is to check shapes at every step. If the shapes
              do not line up, the derivation is wrong somewhere.
        covers:
          - Derivative of a linear map and a quadratic form
          - Layout conventions and why they cause confusion
          - Gradient of a loss with respect to weights
          - Softmax and cross-entropy derivative
          - Shape checking as a correctness test
          - Common identities worth memorising
        check: "Derive the gradient of squared error with respect to the weights, checking shapes as you go."
        viz:
          type: flow
          steps:
          - Write the loss
          - Differentiate one layer
          - Check the shapes
          - Chain it back
    traps:
      - Saying the gradient points toward the minimum
      - Treating every zero gradient as a minimum
      - Deriving a gradient without checking that the shapes line up
      - Confusing the Jacobian with the Hessian
    drills:
      - Derive backpropagation for a two layer network by hand
      - Check one gradient numerically against your analytic version
      - Draw a saddle point and say which directions curve which way
      - Write the softmax and cross-entropy derivative from scratch

  # ── Models ───────────────────────────────────────────────────────────────
  - id: transformers
    name: Transformers
    group: models
    blurb: "Whether you know the architecture at the level of shapes and memory."
    scope: "Owns the architecture and its inference behaviour. Hands the training recipe to LLM training and internals to mechanistic interpretability."
    links: [llm-training, mechanistic-interpretability]
    modules:
      - name: Attention mechanics
        why: "You will be asked to write it, and shapes are where people stumble."
        beats:
          - >-
              Each token is projected three ways. A query, a key and a value.
          - >-
              Every query is compared against every key. Each comparison uses a dot
              product. The number of comparisons grows with length squared.
          - >-
              Mask out anything a token should not see. In a decoder that means the
              whole future.
          - >-
              Softmax turns each row of scores into weights that add to one.
          - >-
              Sum the values in those proportions. That mixture is what the token
              carries forward.
        scene:
          kind: "growing"
          steps: 4
          tick: "token"
          cap: "The cache adds a row for every token generated. Nothing removes rows, so serving memory grows with the length of the reply."
        plain:
          - >-
              Attention lets every token look at every other token and decide what to
              borrow. Each token asks a question, every token offers a key, and the
              match decides the weight.
          - >-
              Cost grows with the square of the sequence length, because every token
              compares against every other. Say what is squared, since that is the part
              people fumble.
        covers:
          - Queries, keys, values, and what each one is for
          - "Scaled dot product, and why the scale is 1/sqrt(d_k)"
          - Softmax, temperature, attention entropy
          - Multi-head attention, head dimension, concatenation and output projection
          - Causal masking, padding masks, attention bias
          - "Complexity: O(T^2 d) time, O(T^2) attention memory"
          - The KV cache and its size formula
        check: "Write every tensor shape in multi-head attention. Use batch B, length T, heads H and model size D."
        viz:
          type: flow
          steps:
          - Project to Q, K, V
          - Score
          - Mask
          - Softmax
          - Weighted sum
      - name: Block anatomy
        why: "Parameter counting and residual reasoning come up constantly."
        beats:
          - >-
              Think of the residual stream as a noticeboard running the whole depth of
              the model.
          - >-
              The embedding writes the first thing onto it.
          - >-
              Every attention block reads it, adds what it found, and writes back.
          - >-
              Every feed-forward block does the same, working on one position at a time.
          - >-
              At the end, the unembedding reads the board. It turns that state into a
              guess for the next token.
        plain:
          - >-
              The residual stream runs the length of the model like a shared
              noticeboard. Each block reads from it, does some work, and writes back.
          - >-
              That picture explains a lot. It is why layers can specialise. It is why the model survives losing one. It is also why interpretability talks about directions in that stream.
        covers:
          - The residual stream as a shared communication channel
          - Pre-LN versus post-LN, and why pre-LN trains more easily
          - LayerNorm and RMSNorm
          - "Feed-forward block: expansion ratio, GeLU, SwiGLU"
          - Embedding and unembedding, weight tying
          - Counting parameters for a given config
        check: "Given d_model, n_layers and an FFN ratio of 4, derive the parameter count."
        viz:
          type: parts
          centre: Residual stream
          around:
          - Embedding writes into it
          - Attention reads and writes
          - Feed-forward reads and writes
          - Unembedding reads it
      - name: Position
        why: "Long-context questions all route through this."
        beats:
          - >-
              RoPE rotates queries and keys based on position. Their dot product then
              carries the relative distance.
          - >-
              ALiBi adds a penalty that grows with distance. Simple, and it extrapolates
              past the trained length.
          - >-
              Learned positions store one vector per slot. Nothing to extrapolate with
              once you run out of slots.
        plain:
          - >-
              Attention on its own has no idea what order the tokens came in. Shuffle
              the sentence and it computes the same thing. Position has to be added.
          - >-
              RoPE rotates each query and key. The angle depends on where the token
              sits. Longer contexts need those angles to stretch carefully.
        covers:
          - Sinusoidal and learned absolute positions
          - Relative position bias
          - "RoPE: rotation, frequency bands, why it composes with attention"
          - ALiBi and linear biases
          - Length extrapolation, position interpolation, NTK scaling, YaRN
          - What happens with no positional encoding at all
        check: "Explain RoPE well enough that someone could implement it, then say how you extend context fourfold."
        viz:
          type: compare
          cols:
          - k: RoPE
            items:
            - Rotates queries and keys
            - Extends by interpolation
          - k: ALiBi
            items:
            - Bias grows with distance
            - Extrapolates
          - k: Learned
            items:
            - One vector per slot
            - Fixed length
      - name: Efficient attention and long context
        why: "Serving conversations spend most of their time here."
        beats:
          - >-
              FlashAttention computes exactly the same numbers. It just stops shuttling
              them to slow memory and back.
          - >-
              Grouped-query shares keys and values across several heads. The cache
              shrinks and a little quality goes with it.
          - >-
              Sliding window limits how far back each token can look, which makes cost
              linear and forgetting real.
        plain:
          - >-
              Long sequences make the attention matrix enormous. Two different fixes
              exist and people mix them up.
          - >-
              FlashAttention computes exactly the same numbers, just with far fewer
              trips to slow memory. Sparse and windowed methods change the answer by
              looking at fewer tokens.
        covers:
          - "FlashAttention: tiling, online softmax, IO-awareness, exactness"
          - "Which FlashAttention: FA-2, FA-3 on Hopper, FA-4 on Blackwell"
          - "Multi-query and grouped-query attention: cache savings and quality cost"
          - "Multi-head latent attention: low-rank KV compression, and how it compares to grouped-query"
          - Sliding window and local attention
          - Sparse and block-sparse patterns
          - Natively trainable sparse attention, and why training it beats retrofitting it
          - Linear attention and kernel approximations
          - State-space models and Mamba as an alternative
          - PagedAttention and memory fragmentation
          - vAttention, and the cost of a non-contiguous cache layout
        check: "Why is FlashAttention faster when it does the same arithmetic?"
        viz:
          type: compare
          cols:
          - k: FlashAttention
            items:
            - Same arithmetic
            - Fewer memory reads
          - k: Grouped-query
            items:
            - Fewer key and value heads
            - Smaller cache
          - k: Sliding window
            items:
            - Local context only
            - Linear in length
      - name: The model family
        why: "Choosing the right variant is a design decision you have to justify."
        beats:
          - >-
              Three shapes, and the task picks one.
          - >-
              Encoder-only sees the whole input at once. Best when you want to label the
              text you were given.
          - >-
              Decoder-only writes one token at a time and cannot see ahead. This is what
              generates.
          - >-
              Encoder-decoder reads one thing and writes another, with cross-attention
              linking the two.
        plain:
          - >-
              Encoder-only models read the whole input at once and are good at labelling
              it. Decoder-only models write one token at a time and are good at
              producing text.
          - >-
              Say you have fifty thousand labels and one task. A small fine-tuned encoder is often cheaper, faster and more accurate than prompting a large model.
        covers:
          - "Encoder-only: BERT, masked language modelling, when it still wins"
          - "Decoder-only: GPT family, causal language modelling"
          - "Encoder-decoder: T5, BART, and cross-attention"
          - "Mixture of experts: routing, top-k, load balancing loss, capacity factor"
          - Vision transformers and patch embedding
          - Hybrid and sparse designs
        check: "For a classification task with 50k labelled examples, would you fine-tune an encoder or prompt a decoder?"
        viz:
          type: tree
          root: Which variant
          branches:
          - k: Encoder-only
            items:
            - Classification
            - BERT
          - k: Decoder-only
            items:
            - Generation
            - GPT
          - k: Encoder-decoder
            items:
            - Translation
            - T5
      - name: Inference
        why: "Deployment questions are now standard even in research interviews."
        beats:
          - >-
              Prefill processes the whole prompt in one go. Plenty of parallel work, so
              the arithmetic units stay busy.
          - >-
              Decode makes one token at a time and re-reads the entire cache to do it.
              The GPU sits waiting on memory, which is why utilisation looks low.
        plain:
          - >-
              Serving has two halves with opposite problems. Reading the prompt is heavy
              on arithmetic. Writing each new token is heavy on memory traffic.
          - >-
              That is why a generating GPU can look idle at 20% utilisation. It is
              waiting on memory, not maths, and the fix is batching rather than a faster
              chip.
        covers:
          - Prefill versus decode, and why they have different bottlenecks
          - Compute-bound versus memory-bandwidth-bound
          - Continuous batching and scheduling
          - "Sampling: greedy, temperature, top-k, top-p, min-p, beam search"
          - Speculative decoding and draft models
          - "Quantisation: int8, int4, GPTQ, AWQ, and quality loss"
          - "Four-bit float formats: MXFP4, NVFP4, and why integer methods do not carry over"
          - Throughput versus latency versus cost
        check: "Decode is slow and the GPU is at 20% utilisation. Explain why and what you change."
        viz:
          type: compare
          cols:
          - k: Prefill
            items:
            - Whole prompt at once
            - Compute bound
          - k: Decode
            items:
            - One token at a time
            - Memory bandwidth bound
    traps:
      - Saying attention is quadratic without saying in what
      - Calling FlashAttention an approximation
      - Naming FlashAttention with no version, when the kernel is tied to the GPU generation
      - Confusing d_model with head dimension
      - Forgetting the KV cache when estimating serving memory
    drills:
      - Implement attention from scratch in NumPy, then match PyTorch output
      - Compute KV cache size for a real config at 32k context
      - Read one production inference server's scheduler code
      - Explain the full forward pass out loud in five minutes

  - id: llm-training
    name: LLM Training
    group: models
    blurb: "Whether you could take a base model to a useful assistant and know what each step buys."
    scope: "Owns data, pretraining, and post-training. Hands the architecture to transformers and behaviour risk to AI safety."
    links: [ai-safety, prompt-engineering]
    modules:
      - name: Data
        why: "Data has the largest effect on the result and gets the least attention."
        beats:
          - >-
              Start with a very large amount of scraped text and low expectations of it.
          - >-
              Remove near-duplicates. Repeated passages get memorised, and memorised
              text is not learning.
          - >-
              Filter for quality. Usually a classifier trained on pages someone was
              willing to vouch for.
          - >-
              Remove the benchmarks, or your evaluation is measuring recall of the
              answers.
          - >-
              Then cut it into tokens. That choice decides what every language costs you
              from here on.
        scene:
          kind: "tokens"
          rows: [{"k": "Raw crawl", "parts": ["good", "page", "dup", "dup", "spam", "benchmark", "good"]}, {"k": "After cleaning", "parts": ["good", "page", "good"]}]
        plain:
          - >-
              The data decides most of what the model becomes. Everything else is
              downstream. It is also the least glamorous part of the job.
          - >-
              Two jobs matter above the rest. Remove near-duplicate text, which
              otherwise gets memorised. Remove the benchmarks, or your evaluation is
              measuring recall.
        covers:
          - Sources, licensing, and the web-crawl reality
          - "Deduplication: exact, MinHash, suffix arrays, and its effect on loss"
          - Quality filtering, classifier-based selection, perplexity filters
          - Benchmark decontamination
          - "Tokenizer training: BPE, WordPiece, SentencePiece, byte fallback"
          - Vocabulary size trade-offs and multilingual fertility
          - Mixture weights, upsampling, and data curricula
        check: "Your model does well on a benchmark and badly in production. How do you test for contamination?"
        viz:
          type: flow
          steps:
          - Crawl
          - Deduplicate
          - Filter
          - Decontaminate
          - Tokenise
      - name: Pretraining
        why: "Even if you never run one, you must reason about the budget."
        beats:
          - >-
              A small model improves quickly, then flattens. More tokens stop buying
              much.
          - >-
              A larger model starts worse and keeps improving for longer. Choosing
              between them is what a scaling law is for.
        plain:
          - >-
              Pretraining is one task repeated a very large number of times: predict the
              next token. Everything the model can do grows out of that.
          - >-
              Scaling laws help plan the spend before training. For a fixed budget, they
              suggest a model size and amount of training data.
        covers:
          - Next-token prediction and the loss it optimises
          - "Scaling laws: Kaplan, Chinchilla, and the token-to-parameter ratio"
          - Compute budget arithmetic, 6ND, and hardware hours
          - Batch size schedules and learning-rate transfer
          - Loss spikes, divergence, and rollback strategy
          - Checkpointing and fault tolerance at scale
          - Data ordering and late-stage annealing
        check: "You have a fixed compute budget. Derive the model size and token count you would choose."
        viz:
          type: curve
          shape: diverge
          x: Tokens seen
          "y": Loss
          a: Small model
          b: Large model
      - name: Supervised fine-tuning
        why: "Fine-tuning is the cheapest lever, and probably the one you will own."
        beats:
          - >-
              A full fine-tune moves every weight. Best quality, and you need memory for
              a second copy of everything.
          - >-
              LoRA trains a small low-rank update and leaves the base model frozen. Most
              of the benefit, a fraction of the memory.
          - >-
              QLoRA also stores the frozen base with fewer bits. This can fit a larger
              model on one card.
        plain:
          - >-
              A base model continues text. It does not answer questions. Fine-tuning on
              examples of instructions and good replies is what turns it into an
              assistant.
          - >-
              Mask the loss on the prompt tokens. Otherwise the model wastes effort
              learning to write the questions too.
        covers:
          - Instruction data, sources, and quality over quantity
          - Chat templates and special tokens
          - Loss masking on prompt tokens
          - Packing versus padding
          - "Parameter-efficient methods: LoRA, QLoRA, DoRA, adapters, prefix tuning"
          - Catastrophic forgetting and replay
          - Hyperparameters that actually matter here
        check: "Why mask the loss on prompt tokens, and what changes if you do not?"
        viz:
          type: compare
          cols:
          - k: Full fine-tune
            items:
            - Every weight moves
            - Most memory
          - k: LoRA
            items:
            - Low-rank update
            - Small adapter
          - k: QLoRA
            items:
            - Quantised base model
            - Least memory
      - name: Learning from preferences
        why: "Preference learning is what makes a capable model usable."
        beats:
          - >-
              Collect pairs of answers and ask people which one is better. Comparing is
              easier than scoring.
          - >-
              Train a model to predict those preferences. It is now a stand-in for human
              judgement, with all the gaps that implies.
          - >-
              Optimise the policy against that reward.
          - >-
              Keep it close to the starting model. Otherwise it may chase a high score
              and produce nonsense.
        plain:
          - >-
              Some qualities are easier to compare than to write down. People cannot
              define a helpful answer, but they can pick the better of two.
          - >-
              That is the whole idea. Learn what people prefer, then push the model that way. Keep it tied to where it started, so it does not drift into nonsense.
        covers:
          - "Reward modelling: pairwise data, Bradley-Terry, reward model overfitting"
          - "PPO for RLHF: policy, value head, advantage, KL penalty to the reference"
          - Reward hacking and over-optimisation
          - "DPO and the direct-alignment family: IPO, KTO, ORPO, SimPO"
          - Rejection sampling and best-of-n
          - RLAIF and constitutional feedback
          - Alignment tax, and where it shows up
        check: "Compare DPO and PPO on data needs, stability, and what each one gives up."
        viz:
          type: flow
          steps:
          - Collect pairs
          - Train a reward model
          - Optimise the policy
          - Hold it near the reference
          loop: true
      - name: Reasoning and verifiable rewards
        why: "This area moves fastest, so expect a question about recent work."
        beats:
          - >-
              Sample several attempts at the same problem.
          - >-
              Check them automatically. This only works where a checker exists, which is
              mostly maths and code.
          - >-
              Reward the ones that got it right. No human in the loop, so it scales.
          - >-
              Update and repeat. The risk is everything you cannot check, where the
              model optimises the checker instead of the task.
        plain:
          - >-
              For maths and code, software can check the answer. That checker becomes
              the reward. The model can then practise without a person scoring it.
          - >-
              The catch is everything you cannot check. Design a reward for open-ended
              writing and the model will find the cheap way to score well.
        covers:
          - Chain-of-thought supervision versus emergent reasoning
          - Reinforcement learning from verifiable rewards
          - "GRPO and group-relative advantages"
          - "Sequence-level policy optimisation, and the instability GRPO shows on long generations"
          - Process reward models versus outcome reward models
          - Test-time compute, self-consistency, search
          - Distillation from a stronger teacher
          - Reward design for tasks with no checker
        check: "You can verify maths answers automatically. Describe the training loop and its failure modes."
        viz:
          type: flow
          steps:
          - Sample answers
          - Verify
          - Reward the correct ones
          - Update
      - name: Evaluation across a run
        why: "Bad evaluation means you cannot tell whether the run improved anything."
        beats:
          - >-
              The checkpoint finished. Deciding whether it is better is harder than it
              sounds.
          - >-
              Automatic scores are cheap and go stale. Benchmarks saturate and leak into
              training data.
          - >-
              A model judge is cheaper than people and carries biases. It prefers longer
              answers and its own style.
          - >-
              Humans are the ground truth and the bottleneck. Use them to calibrate the
              judge, then use the judge.
        plain:
          - >-
              You cannot steer a training run without a signal you trust. Loss is smooth
              but says little about behaviour. Benchmarks say more and go stale.
          - >-
              Judges made of models are cheap and biased. They favour longer answers and
              their own style. Calibrate the judge against humans before you trust it.
        covers:
          - Held-out loss versus downstream benchmarks
          - Benchmark saturation and contamination
          - "LLM-as-judge: position bias, verbosity bias, self-preference"
          - Pairwise human evaluation and arenas
          - Regression suites and per-capability tracking
          - Safety and refusal evaluations alongside capability
        check: "Your new checkpoint wins on the judge and loses with humans. What do you check first?"
        viz:
          type: tree
          root: Did it improve
          branches:
          - k: Automatic
            items:
            - Held-out loss
            - Benchmarks
          - k: Judge
            items:
            - Model as judge
            - Rubrics
          - k: Human
            items:
            - Pairwise preference
            - Arena
    traps:
      - Quoting Chinchilla ratios with no mention of inference cost
      - Treating DPO as strictly better than PPO
      - Reporting benchmark gains with no contamination check
      - Ignoring that safety training and capability training interact
    drills:
      - Fine-tune a small open model with LoRA end to end, including the chat template
      - Train a reward model on a public preference set and inspect its errors
      - Run DPO on the same data and compare behaviour, not just the score
      - Build a 50-example private eval set you trust more than any benchmark

  - id: nlp
    name: Natural Language Processing
    group: models
    blurb: "Whether you understand language as data, including the languages that break your pipeline."
    scope: "Owns text tasks, metrics, retrieval and multilingual work. Hands model internals to transformers."
    links: [transformers, multimodality]
    modules:
      - name: Text as data
        why: "Every unicode and tokenisation bug you will ever ship starts here."
        beats:
          - >-
              Raw text, exactly as it arrived. Mixed scripts, stray whitespace, emoji,
              half of it not what you expected.
          - >-
              Normalise it. Casing and unicode form, decided once and applied
              everywhere.
          - >-
              Find the word boundaries. Some languages do not put spaces where you would
              like them.
          - >-
              Cut into tokens. This is where languages start costing different amounts.
          - >-
              Each token becomes a number. From here the model has no idea any of this
              was text.
        scene:
          kind: "tokens"
          rows: [{"k": "English", "parts": ["The", "model", "reads", "the", "sentence"]}, {"k": "Indonesian", "parts": ["Model", "itu", "mem", "baca", "kali", "mat", "ter", "sebut"]}]
        plain:
          - >-
              A model cannot read letters. Text has to be cut into pieces and each piece
              swapped for a number. That cutting step is tokenisation.
          - >-
              The cut is unfair across languages. The same sentence can cost three times more tokens in Indonesian than in English. That costs money and eats the context window.
        covers:
          - "Tokenisation: word, subword, byte, character"
          - Normalisation, casing, unicode forms, whitespace
          - Morphology, agglutination, and why fertility differs by language
          - Segmentation for languages with no spaces
          - Handling emoji, code, and mixed scripts
          - Truncation and its silent damage
        check: "Why might one language use more tokens for the same sentence? What does that extra cost break?"
        viz:
          type: flow
          steps:
          - Raw text
          - Normalise
          - Segment
          - Tokenise
          - Ids
      - name: Representations
        why: "Retrieval quality depends almost entirely on this."
        beats:
          - >-
              TF-IDF counts words and weights the rare ones. No idea what anything
              means, and still hard to beat on narrow domains.
          - >-
              Static embeddings give every word one fixed point. Bank by a river and
              bank with money share it.
          - >-
              Contextual embeddings give a word a different point in every sentence.
              That is what separated the two banks.
        plain:
          - >-
              A representation turns a word into a list of numbers. Similar meanings are placed close together.
          - >-
              Older methods gave each word one fixed point. Contextual models give it a different point in each sentence. That is how bank by a river separates from bank with money.
        covers:
          - "Count-based: bag of words, TF-IDF, n-grams"
          - "Static embeddings: word2vec, GloVe, fastText"
          - Contextual embeddings and what changed
          - Sentence embeddings and pooling strategies
          - Similarity measures and normalisation
          - Embedding dimensionality, quantisation, and index cost
        check: "When is TF-IDF still the right answer over a neural embedding?"
        viz:
          type: scale
          lo: Counts words
          hi: Reads context
          stops:
          - TF-IDF
          - Static embeddings
          - Contextual embeddings
          'on': 2
      - name: Core tasks
        why: "These task names are the shared vocabulary of the field."
        beats:
          - >-
              Three shapes of answer, and the shape picks the method.
          - >-
              One label for the whole text. Sentiment, topic, spam.
          - >-
              One label per token. Named entities, parts of speech. The output is as
              long as the input.
          - >-
              Entirely new text. Summarising, translating. Now you have the harder
              evaluation problem too.
        plain:
          - >-
              Most text tasks are one of three shapes. Label the whole text, label each
              token, or generate new text. Knowing the shape picks the method.
          - >-
              With no labels, start with rules or a prompted model. A small labelled
              set with active learning costs more.
        covers:
          - Classification, multi-label, and hierarchical labels
          - "Sequence labelling: NER, POS, chunking, BIO tagging"
          - Parsing, dependency and constituency
          - Coreference resolution
          - Question answering, extractive and generative
          - Summarisation, abstractive and extractive
          - Machine translation
        check: "Design an NER system for a domain with no labelled data. Give three options ordered by cost."
        viz:
          type: tree
          root: What shape is the output
          branches:
          - k: A label for the text
            items:
            - Classification
          - k: A label per token
            items:
            - Named entities
            - Part of speech
          - k: New text
            items:
            - Summarisation
            - Translation
      - name: Measuring language output
        why: "Choosing the wrong metric is the mistake I see most in this area."
        beats:
          - >-
              Overlap scores count shared words with a reference. Cheap, and they punish
              a good paraphrase.
          - >-
              Learned metrics score with a model trained on human judgements. Better
              agreement, and now your metric can be wrong in its own ways.
          - >-
              Humans are the ground truth. Slow, expensive, and the only thing the
              others are approximating.
        plain:
          - >-
              Judging generated text is genuinely hard. There are many good answers and
              word overlap with one reference misses most of them.
          - >-
              Overlap scores can rank a good translation below a clumsy one that reuses
              the reference's words. Say what the metric misses before you quote it.
        covers:
          - Accuracy, precision, recall, macro versus micro F1
          - "Generation metrics: BLEU, ROUGE, METEOR, chrF"
          - "Learned metrics: BERTScore, COMET, BLEURT"
          - Perplexity and its limits across tokenizers
          - Human evaluation design and agreement
          - Task-specific evaluation over generic scores
        check: "Why can BLEU rank a good translation below a bad one, and what would you use instead?"
        viz:
          type: compare
          cols:
          - k: Overlap
            items:
            - BLEU
            - ROUGE
            - chrF
          - k: Learned
            items:
            - BERTScore
            - COMET
          - k: Human
            items:
            - Ratings
            - Pairwise
      - name: The retrieval pipeline
        why: "Almost every applied NLP role now includes this."
        beats:
          - >-
              Cut the documents into chunks. Chunk boundaries decide what can ever be
              retrieved together.
          - >-
              Embed each chunk. Whether the embedding model knows your domain matters
              more than its leaderboard rank.
          - >-
              Search for the chunks nearest the question. Recall at this step caps
              everything downstream.
          - >-
              Rerank the shortlist with something slower and more accurate.
          - >-
              Only now generate. If the answer is wrong, find out which of these five
              steps failed.
        plain:
          - >-
              Retrieval-augmented generation is two systems. One finds relevant
              documents. The other writes an answer using them. Each fails differently.
          - >-
              When the answer is wrong, find out which half broke. Measure whether the
              right document was retrieved at all, separately from whether the model
              used it well.
        covers:
          - Chunking strategies and boundary effects
          - Embedding model choice and domain fit
          - "Vector search: HNSW, IVF, recall versus latency"
          - Hybrid search with BM25
          - Reranking with cross-encoders
          - Query rewriting and expansion
          - "Evaluating retrieval separately from generation"
        check: "Your RAG answers are wrong. Describe how you decide whether retrieval or generation is at fault."
        viz:
          type: flow
          steps:
          - Chunk
          - Embed
          - Search
          - Rerank
          - Generate
      - name: Multilingual and low-resource
        why: "Your own research area, so expect depth questions."
        beats:
          - >-
              The model is worse in this language. Four candidate reasons, and they look
              identical from outside.
          - >-
              The tokenizer is more expensive here, so the same sentence eats more
              context and costs more.
          - >-
              There was less training data. The plainest reason and the hardest to fix.
          - >-
              Script, dialect and code-switching. Real usage mixes languages in one
              sentence and the training data rarely did.
          - >-
              The benchmarks do not cover it, so nobody noticed. Comparing token counts
              separates the first cause from the rest.
        plain:
          - >-
              A model can be worse in a language for several reasons that look identical
              from the outside. The fix depends on which one it is.
          - >-
              Tokenisation, training data volume, and benchmark coverage are all
              candidates. Comparing token counts for the same sentence separates the
              first from the rest.
        covers:
          - Cross-lingual transfer and shared subword space
          - Tokenizer fairness and cost asymmetry
          - Script, dialect, register, and code-switching
          - Translation as augmentation, and translationese
          - Benchmark coverage gaps and cultural grounding
          - Evaluation when no native speaker is on the team
        check: "A model is worse in Indonesian. How would you separate a data problem from a token problem?"
        viz:
          type: parts
          centre: Why it is worse in this language
          around:
          - Tokenizer cost
          - Training data volume
          - Script and code-switching
          - Benchmark coverage
      - name: Data and annotation
        why: "Nobody enjoys annotation work, and it decides how the project turns out."
        beats:
          - >-
              Write the guidelines. They will be wrong in ways you cannot predict.
          - >-
              Run a pilot on fifty examples, and annotate some yourself. This is where
              you learn the task is ambiguous.
          - >-
              Measure agreement between annotators. Their ceiling is your model's
              ceiling.
          - >-
              Adjudicate the disagreements and fix the guidelines. Do this before
              collecting more.
          - >-
              Only now scale up. Scaling a bad guideline just buys more noise.
        plain:
          - >-
              Labels come from people, and people disagree. If two annotators agree only
              seventy per cent of the time, your ceiling is already set.
          - >-
              Fix the guidelines before collecting more data. Annotate fifty examples
              yourself first, because that is how you find out the task is ambiguous.
        covers:
          - Annotation guidelines and pilot rounds
          - "Agreement: Cohen's kappa, Krippendorff's alpha"
          - Label noise and adjudication
          - Active learning and sampling strategy
          - Synthetic data and its distribution gaps
          - Dataset documentation and licence hygiene
        check: "Two annotators agree 70% of the time. What do you do before collecting more data?"
        viz:
          type: flow
          steps:
          - Guidelines
          - Pilot
          - Measure agreement
          - Adjudicate
          - Scale
          loop: true
    traps:
      - Reporting micro-F1 on an imbalanced multi-class problem with no macro figure
      - Comparing perplexity across models with different tokenizers
      - Treating English results as evidence for a multilingual claim
      - Evaluating RAG end to end with no retrieval metric
    drills:
      - Tokenise the same paragraph in five languages and compare token counts
      - Build a BM25 plus embedding hybrid retriever and measure recall at k
      - Annotate 50 examples yourself before writing any guidelines
      - Break one generation metric on purpose and explain the failure

  - id: computer-vision
    name: Computer Vision
    group: models
    blurb: "Whether you can move from pixels to a decision, and know where the evaluation lies to you."
    scope: "Owns image and video tasks and their evaluation. Hands cross-modal alignment to multimodality."
    links: [multimodality]
    modules:
      - name: Image fundamentals
        why: "Every later architecture question assumes this arithmetic."
        beats:
          - >-
              Start with a grid of pixel values. That is genuinely all there is.
          - >-
              Slide a small window across, looking for one pattern at every position.
          - >-
              Stride decides how far it jumps. Padding decides whether the edges get a
              fair look.
          - >-
              Pooling shrinks the grid, so later layers cover more of the image for the
              same cost.
          - >-
              What comes out is a map of where that pattern appears. Stack these and the
              patterns get more abstract.
        scene:
          kind: "kernel"
          grid: 6
          k: 3
          cap: "The window reads one patch, produces one output, then slides. Stack these and a later output can see a much larger part of the image."
        plain:
          - >-
              A convolution slides a small window across the image and looks for one
              pattern. Stack them and later layers see larger regions.
          - >-
              How much of the image one output can see is the receptive field. Being
              able to work it out on paper is the arithmetic the rest of the track
              assumes.
        covers:
          - Colour spaces, bit depth, channel order
          - Filtering, edges, histograms
          - "Convolution arithmetic: kernel, stride, padding, dilation"
          - Output size formulas and receptive field growth
          - Pooling, upsampling, transposed convolution, aliasing
          - Resizing, interpolation, and the artefacts each introduces
        check: "Given a stack of convolutions, compute the receptive field and the output resolution."
        viz:
          type: flow
          steps:
          - Pixels
          - Convolve
          - Stride and pad
          - Pool
          - Feature map
      - name: Backbones
        why: "Interviewers want the reasoning behind a design choice."
        beats:
          - >-
              At the top, the head that answers your actual question.
          - >-
              Below it, layers that respond to whole object parts. Wheels, eyes,
              windows.
          - >-
              Below that, textures and repeated patterns.
          - >-
              At the bottom, edges and simple gradients. Every network learns these
              first, whatever the task.
        plain:
          - >-
              The backbone is the part that turns pixels into features. Everything else
              is a head bolted on top for a particular task.
          - >-
              Residual connections are what let backbones get deep. They give the
              gradient a short path back, so a hundred layers can still train.
        covers:
          - LeNet, AlexNet, VGG, and what each one settled
          - "ResNet: residuals, bottlenecks, and depth"
          - Inception, DenseNet, MobileNet, depthwise separable convolutions
          - EfficientNet and compound scaling
          - "Vision transformers: patches, class token, inductive bias"
          - ConvNeXt and the convergence of designs
          - Choosing a backbone under a latency budget
        check: "Why do residual connections let you train a 100-layer network?"
        viz:
          type: stack
          layers:
          - Task head
          - Object parts
          - Textures
          - Edges
      - name: Tasks and their metrics
        why: "Detection and segmentation metrics are where candidates get vague."
        beats:
          - >-
              The question decides the task, and the task decides which metric can lie
              to you.
          - >-
              One answer for the whole image. Accuracy works, until the classes are
              unbalanced.
          - >-
              Boxes around objects. Now you need mean average precision, and you need it
              per class.
          - >-
              A label for every pixel. Intersection over union, and it will hide the
              thin structures you care about.
        plain:
          - >-
              Three tasks, three answers. Classification labels the picture. Detection
              draws boxes. Segmentation labels every pixel.
          - >-
              Detection metrics trip people up. Average precision combines several
              overlap thresholds. Report each class too, since common classes can hide
              rare failures.
        covers:
          - Classification, top-1, top-5, and label noise
          - "Detection: anchors, anchor-free, NMS, IoU, mAP at thresholds"
          - Two-stage versus one-stage detectors, DETR-style set prediction
          - "Segmentation: semantic, instance, panoptic, mIoU, Dice, boundary F1"
          - Keypoints, pose, and tracking metrics
          - Depth and geometry tasks
        check: "Explain mAP@[.5:.95] precisely, then say what it hides."
        viz:
          type: tree
          root: What do you need back
          branches:
          - k: The whole image
            items:
            - Classification
          - k: Boxes
            items:
            - Detection
            - Mean average precision
          - k: Pixels
            items:
            - Segmentation
            - Intersection over union
      - name: Training practice
        why: "Vision has its own recipe knowledge."
        beats:
          - >-
              Augmentation shows the model the same object under conditions it will meet
              later. Crops, lighting, small rotations.
          - >-
              The same operations destroy the label elsewhere. Flip a chest X-ray and
              the heart is on the wrong side. Flip text and it is unreadable.
        plain:
          - >-
              Augmentation shows the model the same object under different conditions.
              Rotate it, change the light, crop it. Usually this helps a lot.
          - >-
              Sometimes it destroys the label. Flipping a chest X-ray moves the heart to
              the wrong side, and flipping text makes it unreadable.
        covers:
          - "Augmentation: geometric, photometric, mixup, cutmix, RandAugment"
          - When augmentation hurts, especially in medical and remote sensing
          - Transfer learning, freezing, and layer-wise learning rates
          - Class imbalance in dense prediction
          - "Losses: cross-entropy, focal, Dice, Tversky, IoU losses"
          - Resolution versus batch size versus memory
          - Test-time augmentation and ensembling
        check: "Your segmentation model has high IoU and misses every thin structure. Name the likely cause."
        viz:
          type: compare
          cols:
          - k: Augmentation helps
            items:
            - More viewpoints
            - Colour and lighting
          - k: Augmentation hurts
            items:
            - Flipping medical laterality
            - Rotating text
      - name: Modern vision
        why: "Expect at least one question about the last three years."
        beats:
          - >-
              No labels at all, which is the usual situation before anyone pays for
              annotation.
          - >-
              Contrastive methods take two crops of one photo and ask the model to
              recognise they belong together.
          - >-
              Self-distillation has the model teach itself, with one copy learning to
              match another.
          - >-
              Masked methods hide patches and ask it to fill them in. Then a small
              labelled set finishes the job.
        plain:
          - >-
              Labels are expensive, so a lot of recent work learns from images alone.
              Show the model two crops of one photo and ask it to recognise they match.
          - >-
              The features that fall out are good enough that a small labelled set can
              finish the job. That changes the economics of a vision project.
        covers:
          - "Self-supervised learning: SimCLR, MoCo, BYOL, DINO, MAE"
          - "CLIP-style open-vocabulary recognition"
          - Segment Anything and promptable segmentation
          - Diffusion models for generation and editing
          - NeRF and Gaussian splatting at a conceptual level
          - Video understanding and temporal modelling
        check: "Explain how DINO learns useful features with no labels."
        viz:
          type: tree
          root: No labels at all
          branches:
          - k: Contrastive
            items:
            - SimCLR
            - MoCo
          - k: Self-distillation
            items:
            - DINO
          - k: Masked
            items:
            - Masked autoencoder
      - name: Deployment
        why: "Vision is the area most often pushed to edge hardware."
        beats:
          - >-
              Train on whatever hardware you have.
          - >-
              Export to a format the target device can actually run.
          - >-
              Quantise. Most of the speed comes from here, and so does most of the
              accuracy you lose.
          - >-
              Tile large images, then stitch the predictions back. The seams are where
              the bugs live.
          - >-
              Serve it, and profile on the real device. Operation counts are a poor
              guide to latency.
        plain:
          - >-
              Vision models often have to run on a phone, a camera or a drone. The device sets the constraint, and the accuracy table comes second.
          - >-
              Operation counts are a poor guide to speed. Profile on the actual
              hardware, because memory layout and supported operations decide the real
              latency.
        covers:
          - Inference cost, FLOPs versus latency
          - ONNX, TensorRT, quantisation, pruning, distillation
          - Edge constraints, memory, thermal limits
          - Tiling large images and stitching predictions
          - "Remote sensing specifics: multispectral bands, geo-referencing, tile edges, cloud masks"
          - Batch versus stream processing
        check: "You must run segmentation on 10,000 by 10,000 pixel scenes. Describe the pipeline."
        viz:
          type: flow
          steps:
          - Train
          - Export
          - Quantise
          - Tile
          - Serve
      - name: Evaluation traps
        why: "Naming your own evaluation problems earns trust quickly."
        beats:
          - >-
              The score is suspiciously high. Four usual causes, all of them about the
              split.
          - >-
              Frames from one video are near-identical, so the test set is not new to
              the model.
          - >-
              Tiles from one satellite scene have the same problem, spread across space
              instead of time.
          - >-
              The model may have learnt the background. Snow on the ground came to mean wolf.
          - >-
              Or the remaining error is annotation noise, and you are now fitting
              somebody's mistakes.
        plain:
          - >-
              Vision evaluation lies more often than most. The usual cause is that the
              test set is not really new to the model.
          - >-
              Frames from one video, or tiles from one satellite scene, are
              near-duplicates. Split them at random and the score you report is
              measuring memory.
        covers:
          - Near-duplicate leakage across splits, especially video frames
          - Spatial autocorrelation in geospatial splits
          - Domain gaps between sensors, seasons, and regions
          - Long-tail classes hidden by averaged metrics
          - Annotation error dominating the reported gap
          - Shortcut features, backgrounds, and watermarks
        check: "A geospatial model scores 0.9 IoU on a random split. It scores 0.6 on a regional split. Explain the gap."
        viz:
          type: parts
          centre: The score looks too good
          around:
          - Near-duplicate frames
          - Same scene in both splits
          - Background shortcut
          - Annotation error
    traps:
      - Random splits on tiles from the same scene
      - Reporting mAP with no per-class breakdown
      - Applying flip augmentation to text or medical laterality
      - Quoting FLOPs as if it predicted latency
    drills:
      - Compute output shapes and receptive fields for a network by hand
      - Implement IoU and non-maximum suppression from scratch
      - Build a geographically blocked split and compare with a random one
      - Profile a model on the actual target device, not your laptop

  - id: multimodality
    name: Multimodality
    group: models
    blurb: "Whether you can join two signals and notice when one of them is quietly ignored."
    scope: "Owns cross-modal architecture and evaluation. Hands single-modality depth to computer vision and NLP."
    links: [computer-vision, nlp]
    modules:
      - name: Fusion strategies
        why: "Fusion is the first design decision, and you will have to justify it."
        beats:
          - >-
              Early fusion mixes the raw signals before either has been understood. Most
              flexible, most data-hungry.
          - >-
              Cross-attention keeps two streams and lets each look into the other. This
              is the common middle ground.
          - >-
              Late fusion encodes each separately and joins the outputs. Cheapest, and
              it can never notice a fine-grained conflict.
        scene:
          kind: tokens
          rows:
            - {k: Image, parts: [Patch, Patch, Patch]}
            - {k: Text, parts: [Word, Word, Word]}
          alt: "Image patches and text words form two streams before fusion."
        plain:
          - >-
              Two kinds of input, one model. The design question is where they meet.
              Early, late, or somewhere in between.
          - >-
              The common recipe keeps a vision encoder frozen and trains a small
              connector into a language model. Cheap, and it inherits whatever the
              encoder already ignores.
        covers:
          - Early, late and intermediate fusion
          - Cross-attention between modality streams
          - Projector and adapter designs
          - Tokenising non-text signals, patches, frames, codebooks
          - Interleaved sequences and position handling
          - Freezing versus training each tower
          - Native multimodal training with no separate vision encoder
        check: "You have a strong vision encoder and a strong language model. Describe two ways to connect them and the cost of each."
        viz:
          type: compare
          cols:
          - k: Early fusion
            items:
            - Join before encoding
          - k: Cross-attention
            items:
            - Each stream queries the other
          - k: Late fusion
            items:
            - Join the outputs
      - name: Contrastive alignment
        why: "Retrieval and open-vocabulary systems are built on this."
        beats:
          - >-
              One space that both pictures and words get written into.
          - >-
              The image tower turns a picture into a point.
          - >-
              The text tower turns a caption into a point in the same space.
          - >-
              Real image and caption pairs get pulled together.
          - >-
              Every non-matching pair in the batch gets pushed apart. A larger batch
              supplies more pairs to learn from.
        plain:
          - >-
              Contrastive training puts images and captions in one shared space.
              Matching pairs get pulled together, everything else gets pushed apart.
          - >-
              The pushing apart needs many examples at once, which is why batch size
              matters so much here. Sigmoid variants relax that requirement.
        covers:
          - "The CLIP objective: InfoNCE, symmetric loss, temperature"
          - Batch size effects and negatives
          - SigLIP and the sigmoid alternative
          - Recipes that add captioning, self-distillation and masked prediction to the contrastive loss
          - Hard negative mining
          - Modality gap in the joint embedding space
          - Zero-shot classification and retrieval evaluation
        check: "Why does CLIP need very large batches, and what does SigLIP change?"
        viz:
          type: parts
          centre: Shared embedding space
          around:
          - Image tower
          - Text tower
          - Matching pairs pulled close
          - Everything else pushed apart
      - name: Vision-language models
        why: "Vision-language models are the default multimodal system right now."
        beats:
          - >-
              An image goes in.
          - >-
              A vision encoder turns it into a grid of features. Its resolution decides
              whether a chart is readable.
          - >-
              A projector maps those features into the shape the language model expects.
              This small piece is most of the training.
          - >-
              The language model reads them alongside the text tokens, treating both as
              one sequence.
          - >-
              Text comes out. It may describe objects that were never in the picture.
              The fault often starts earlier in the chain.
        plain:
          - >-
              A vision-language model turns an image into tokens the language model can
              read alongside the text. The connector between them is the whole trick.
          - >-
              Resolution decides whether it can read a chart or a document. Comparing
              two models on document tasks without matching resolution compares the
              wrong thing.
        covers:
          - LLaVA-style connector training stages
          - "Resolution handling: tiling, AnyRes, dynamic patching"
          - Visual instruction tuning data
          - OCR, charts, documents, and where models fail
          - Grounding, referring expressions, bounding-box output
          - Hallucination in captions and object presence
        check: "The model describes objects that are not in the image. Give three causes and one fix each."
        viz:
          type: flow
          steps:
          - Image
          - Vision encoder
          - Projector
          - Language model
          - Text
      - name: Generation across modalities
        why: "Expect at least a conceptual question here."
        beats:
          - >-
              Start with a prompt.
          - >-
              Encode it into a form the generator can be steered by.
          - >-
              Then denoise, step by step, from pure static toward something matching the
              prompt.
          - >-
              Decode from the compressed space back up to full resolution.
          - >-
              An image. Push the guidance too hard and you get obedience with no
              variety.
        plain:
          - >-
              Generation runs the other way. Text goes in, an image or a video comes
              out. Diffusion does this by removing noise, step by step, guided by the
              prompt.
          - >-
              Guidance controls how hard the prompt pulls. Turn it up and you get
              obedience with less variety, and eventually pictures that look burnt.
        covers:
          - "Text to image: diffusion, latent diffusion, classifier-free guidance"
          - Controllability, ControlNet, inpainting
          - Text to video and temporal consistency
          - Speech synthesis and voice cloning risk
          - Any-to-any and unified token models
          - One tokenizer for understanding and generation, and why two is the harder design
          - Evaluation of generated media
        check: "Explain classifier-free guidance and what happens as the scale rises."
        viz:
          type: flow
          steps:
          - Text prompt
          - Encode
          - Denoise
          - Decode
          - Image
      - name: Audio and speech
        why: "Audio gets skipped often enough that knowing it stands out."
        beats:
          - >-
              Sound arrives as a wave. Air pressure over time, and nothing else.
          - >-
              Turn it into a spectrogram, which is a picture of frequency over time. Now
              vision methods apply.
          - >-
              An encoder reads that picture.
          - >-
              It produces tokens, the same kind of thing a language model consumes.
          - >-
              Out comes text. Accent, noise and phone-quality audio all raise the error
              rate, and the training data rarely represents them.
        plain:
          - >-
              Audio is the modality most candidates skip. It is a wave, turned into a
              picture of frequencies over time, then treated much like vision.
          - >-
              Accents, noise and phone audio all raise error rates. Training data often
              has too few examples of them.
        covers:
          - Waveforms, spectrograms, mel scale
          - "ASR: CTC, attention encoder-decoder, Whisper-style training"
          - Speaker identification, diarisation, verification
          - Audio tokenisation and neural codecs
          - Audio language models
          - Noise, accent and channel robustness
        check: "Why does word error rate drop for accented speech, and what would you do about it?"
        viz:
          type: flow
          steps:
          - Waveform
          - Spectrogram
          - Encoder
          - Tokens
          - Text
      - name: Evaluation
        why: "Multimodal benchmarks are unusually easy to game."
        beats:
          - >-
              Score the model with everything it is meant to have. This is the number
              people report.
          - >-
              Now hide the image and ask again. If the score barely moves, the benchmark
              was testing the language model.
          - >-
              Hide the text instead. Between the three you learn what the benchmark
              actually measures.
        plain:
          - >-
              Multimodal benchmarks are unusually easy to game, because many questions
              can be answered from the text alone.
          - >-
              Always run the blind baseline. Feed the question with no image. If that
              scores well, the benchmark is not measuring what its name says.
        covers:
          - VQA, captioning, and retrieval benchmarks
          - MMMU-style reasoning suites, and the hardened versions that strip text-only answerable items
          - Grounding and localisation evaluation
          - Cross-modal conflict tests
          - Language and cultural coverage in multimodal benchmarks
          - Blind baselines that score suspiciously well
        check: "A benchmark can be half-solved with the text alone. How do you detect and correct for that?"
        viz:
          type: compare
          cols:
          - k: Full input
            items:
            - Image and text
          - k: Blind baseline
            items:
            - Text only
          - k: Vision only
            items:
            - Image only
      - name: Failure modes
        why: "Failure modes are your research angle, so answer them best."
        beats:
          - >-
              The model reads the picture and answers from what it sees.
          - >-
              Balanced. Both inputs contribute, which is what you hoped for.
          - >-
              The text prior wins and the image is quietly ignored. Build a set where
              the two disagree and you can measure exactly where a model sits.
        plain:
          - >-
              When two inputs disagree, one usually wins. Models often trust the text
              and quietly ignore what the picture shows.
          - >-
              You can measure this. Build a set where the caption contradicts the image
              and count which one the answer follows. That number is the finding.
        covers:
          - Modality dominance and text priors overriding the image
          - Shortcut learning across modalities
          - Missing or corrupted modality robustness
          - Unequal safety and alignment coverage per modality
          - Calibration differences between modalities
          - Cross-lingual gaps in multimodal instruction data
        check: "How would you measure whether a model trusts the caption over the picture?"
        viz:
          type: scale
          lo: Trusts the picture
          hi: Trusts the caption
          stops:
          - Follows the image
          - Balanced
          - Follows the text
          'on': 2
    traps:
      - Reporting a multimodal score with no unimodal baseline
      - Assuming a frozen vision encoder is neutral
      - Ignoring resolution when comparing models on document tasks
      - Testing only in English and calling it a general result
    drills:
      - Run a text-only baseline on any multimodal benchmark you cite
      - Fine-tune a small connector between a vision encoder and an LLM
      - Build a conflict set where image and text disagree, and measure which wins
      - Compare the same VLM in two languages on identical images

  - id: embedding
    name: Embeddings
    group: models
    blurb: "Whether you can turn meaning into geometry, and know when the geometry lies."
    scope: "Owns representation, similarity and vector search. Hands the encoder architecture to transformers and the pipeline around it to NLP."
    links: [nlp, transformers]
    modules:
      - name: What an embedding is
        why: "Every retrieval system and every recommendation rests on this one idea."
        plain:
          - >-
              An embedding turns a thing into a list of numbers. Put those numbers
              on a map and similar things land near each other.
          - >-
              Nothing about the numbers is meaningful on its own. Only the
              distances between them carry information.
        covers:
          - A vector as a point in a high-dimensional space
          - Why nearby means similar
          - Dense versus sparse representations
          - Dimensionality and what it costs
          - The same space for images, text or users
          - What the axes do not mean
        check: "Someone asks what dimension 42 of your embedding represents. What do you tell them?"
        viz:
          type: flow
          steps: ["A thing", "An encoder", "A vector", "A point on a map"]
        beats:
          - "Start with anything you want to compare. A sentence, a picture, a product."
          - "Push it through an encoder trained to place similar things together."
          - "Out comes a list of numbers. Hundreds or thousands of them."
          - "Treat that list as a point in space. Now similarity is just distance, and distance is easy to compute."
      - name: How embeddings get trained
        why: "The training signal decides what similar ends up meaning."
        plain:
          - >-
              Nobody labels which sentences are similar. So the training has to
              invent a signal from the data itself.
          - >-
              Most methods show the model matching and non-matching pairs. It pulls the
              matches together and pushes the rest apart.
        covers:
          - Contrastive learning and in-batch negatives
          - Hard negative mining and why easy negatives stop teaching
          - Masked language modelling as a starting point
          - Distillation from a larger encoder
          - Instruction-tuned and task-prefixed embeddings
          - Matryoshka training for truncatable vectors
        check: "Why does an embedding model need hard negatives, and what happens without them?"
        viz:
          type: flow
          steps: ["Take a pair that belongs", "Pull them together", "Push everything else apart", "Repeat"]
          loop: true
        beats:
          - "Take two things you know belong together. A question and its answer, a caption and its image."
          - "Pull their two points closer in the space."
          - "Push every other pairing in the batch apart. This is where most of the learning happens."
          - "Repeat across a very large number of pairs. What counts as similar is decided entirely by which pairs you chose."
      - name: Similarity and distance
        why: "Choosing the wrong measure quietly breaks retrieval."
        plain:
          - >-
              Cosine similarity measures the angle between two vectors and
              ignores their length. Dot product does not.
          - >-
              If your vectors are normalised the two agree. If they are not, dot
              product will favour long vectors, which often means popular items.
        covers:
          - "Cosine similarity: angle only"
          - "Dot product: angle and magnitude"
          - Euclidean distance and when it matches cosine
          - Normalising, and what it throws away
          - Temperature and the sharpness of the comparison
          - Matching the measure the model was trained with
        check: "Your retrieval favours long documents. Name the likely cause."
        viz:
          type: compare
          cols:
            - k: "Cosine"
              items: ["Angle only", "Length ignored"]
            - k: "Dot product"
              items: ["Angle and length", "Long vectors win"]
        beats:
          - "Cosine looks only at direction. Two vectors pointing the same way score the same however long they are."
          - "Dot product rewards length too. If some items simply have larger vectors, they surface more often, whatever the query."
        scene:
          kind: points
          query: Query
          near: Close match
          far: Weak match
          alt: "A query point sits near one match and far from another."
      - name: Choosing a model
        why: "Most retrieval quality is decided here, before any tuning."
        plain:
          - >-
              Embedding models learn from different data. They also vary in output size
              and how much text they accept.
          - >-
              A leaderboard rank tells you little about your own domain. Test on
              your own queries before committing.
        covers:
          - Domain fit versus benchmark rank
          - Sequence length and what gets truncated
          - Dimension size, storage and index cost
          - Multilingual coverage and cross-lingual retrieval
          - Symmetric versus asymmetric search
          - Cost of re-embedding everything when you switch
        check: "You are choosing between two embedding models. Describe the test you would run."
        viz:
          type: parts
          centre: Choosing an embedding model
          around:
            - Does it know your domain
            - How much text fits
            - What the vectors cost to store
            - What switching later costs
        beats:
          - "Four things decide it, and benchmark rank is not among them."
          - "Whether it has seen language like yours. Legal, clinical and code all behave differently."
          - "How much text it accepts before truncating. Silent truncation is a common and invisible bug."
          - "How many dimensions, since that sets your storage and index bill."
          - "And what it costs to change your mind, because switching means re-embedding everything you have."
      - name: Vector search at scale
        why: "Exact search stops being possible quickly, and the approximations have knobs."
        plain:
          - >-
              Comparing a query against every vector works until you have
              millions of them. Then you need an index.
          - >-
              Every index trades recall for speed. It finds most of the nearest
              neighbours, most of the time, much faster.
        covers:
          - Exact search and where it stops scaling
          - "HNSW: a navigable graph, and its build cost"
          - "IVF: cluster first, search a few clusters"
          - Product quantisation and compressed vectors
          - The recall and latency trade, measured rather than assumed
          - Filtering by metadata alongside the vector search
          - Rebuilding an index when the data moves
        check: "Explain the trade an approximate index makes, and how you would measure whether it hurt you."
        viz:
          type: scale
          lo: Exact and slow
          hi: Fast and approximate
          stops: ["Brute force", "Graph index", "Compressed vectors"]
          on: 1
        beats:
          - "Brute force compares against everything. Perfect recall, and it stops being viable in the millions."
          - "A graph index walks toward the answer instead of scanning. Usually the right default, and it costs memory to build."
          - "Compress the vectors and you fit far more in memory, paying in precision. Always measure the recall you actually lost."
      - name: Evaluating an embedding
        why: "Retrieval is measurable, and most teams skip measuring it."
        plain:
          - >-
              You can measure retrieval on its own, without the model that reads
              the results. Most teams never do.
          - >-
              Build a small set of real queries with the documents that should
              come back. Fifty is enough to catch a bad choice.
        covers:
          - "Recall at k, and choosing k from the downstream budget"
          - "Mean reciprocal rank and normalised discounted cumulative gain"
          - Building a golden set from real queries
          - Benchmark rank versus your own data
          - Measuring retrieval separately from generation
          - Watching for drift as the corpus grows
        check: "How would you tell whether a retrieval change helped, without asking a language model?"
        viz:
          type: flow
          steps: ["Collect real queries", "Mark what should return", "Measure recall at k", "Change one thing"]
          loop: true
        beats:
          - "Take queries people actually asked. Invented ones flatter the system."
          - "For each, mark which documents should come back. This is the slow part and it only happens once."
          - "Measure how often the right document is in the top k. That number is your ceiling for everything downstream."
          - "Change one thing and measure again. Now you know whether it helped."
      - name: Where the geometry lies
        why: "Embedding spaces have known pathologies that look like model failure."
        plain:
          - >-
              Embedding spaces are not evenly filled. Vectors often crowd into a
              narrow cone, so everything looks fairly similar to everything else.
          - >-
              Some points are also near far more queries than they should be.
              Those hubs turn up in results they have no business being in.
        covers:
          - Anisotropy and the narrow cone
          - Hubness in high dimensions
          - Popularity bias in learned spaces
          - The modality gap in joint image and text spaces
          - Drift as the corpus changes under a fixed model
          - Near-duplicate documents crowding the results
        check: "Every query returns the same three documents. Give two possible causes."
        viz:
          type: parts
          centre: Why retrieval looks broken
          around:
            - Everything is similar to everything
            - A few hubs dominate
            - Near-duplicates fill the results
            - The corpus moved and the model did not
        beats:
          - "Four pathologies that look like a broken model and are properties of the space."
          - "Anisotropy. The vectors crowd into a narrow cone, so all the similarities sit in a tight band."
          - "Hubness. A few points sit near an unreasonable number of queries and appear everywhere."
          - "Near-duplicates. The top results are the same document five times over."
          - "Drift. The corpus grew into topics the encoder never saw, and nobody re-embedded."
    traps:
      - Comparing vectors with a different measure from the one they were trained with
      - Quoting a benchmark rank as evidence the model suits your domain
      - Reporting end-to-end quality with no retrieval metric underneath it
      - Assuming an approximate index returns the true nearest neighbours
    drills:
      - Embed fifty of your own queries and read the top result for each by hand
      - Measure recall at ten before and after switching index type
      - Plot the distribution of pairwise similarities and look for the narrow cone
      - Truncate an input past the model's limit and watch the retrieval quietly degrade
  - id: edge-ai
    name: Edge AI
    group: systems
    blurb: "Whether you can make a model small enough to run where the data already is."
    scope: "Owns small models, compression and on-device serving. Hands training recipes to LLM training and cloud serving to MLOps."
    links: [mlops, llm-training]
    modules:
      - name: Why run it on the device
        why: "The reasons are rarely about accuracy, and interviewers want the real ones."
        plain:
          - >-
              Running on the device means the data never leaves it. That answers
              a privacy question no amount of encryption in transit does.
          - >-
              It also removes the round trip. No network means no latency spike
              and no outage when the connection drops.
        covers:
          - Privacy and data that cannot legally leave
          - Latency without a network round trip
          - Working with no connection at all
          - Cost per request at scale
          - Battery, heat and what the user notices
          - When the cloud is simply the right answer
        check: "Give three reasons to run on device that have nothing to do with accuracy."
        viz:
          type: parts
          centre: Why on the device
          around:
            - The data never leaves
            - No round trip
            - Works offline
            - No per-request bill
        beats:
          - "Four reasons, and none of them is that the small model is better."
          - "The data stays put. For health and finance this is often the whole argument."
          - "No network hop, so the slowest case is your own hardware rather than someone's wifi."
          - "It keeps working on a plane, underground, or in a clinic with bad signal."
          - "And there is no bill per request, which changes the economics entirely at scale."
      - name: Making a model smaller
        why: "Three levers, and they compose differently."
        plain:
          - >-
              You can train a small model to copy a large one. You can also remove
              parts or store its numbers with less detail.
          - >-
              Distillation usually gives the most for the effort. Quantisation
              gives the most for the least effort.
        covers:
          - "Distillation: a small student copying a large teacher"
          - Training on teacher outputs rather than hard labels
          - "Pruning: structured and unstructured"
          - The lottery ticket idea and what survived it
          - Low-rank factorisation of weight matrices
          - Combining methods, and the order to apply them
        check: "You need a model four times smaller. Describe your order of attack."
        viz:
          type: stack
          layers: ["Quantise last", "Prune the fat", "Distil into a smaller student", "Start from the right architecture"]
        beats:
          - "Quantisation goes last, because it applies to whatever you end up with."
          - "Pruning removes weights that were doing little. Structured pruning removes whole channels, which hardware can actually exploit."
          - "Distillation trains a small model on the large model's outputs. Soft targets carry more information than the labels did."
          - "And underneath, picking an architecture that suits the hardware. No amount of compression rescues the wrong shape."
        scene:
          kind: shrink
          steps: [Full model, Smaller model, Fits device]
          cap: "Each step removes cost while trying to keep useful behaviour."
          alt: "A large model shrinks until it fits on a small device."
      - name: Quantisation
        why: "The highest-value lever, and the one with the sharpest edges."
        plain:
          - >-
              Weights are usually stored as sixteen-bit numbers. Store them as
              eight or four bits and the model shrinks by the same factor.
          - >-
              Most of the model tolerates this. A few outlier values do not, and
              handling those is what separates the methods.
        covers:
          - "Post-training quantisation versus quantisation-aware training"
          - Weight-only versus weight and activation quantisation
          - Per-tensor, per-channel and group-wise scales
          - Outliers, and why they break naive rounding
          - "Integer formats and four-bit float formats"
          - Calibration data and how little you need
          - Measuring the quality you actually lost
        check: "Explain why quantising to four bits hurts some layers far more than others."
        viz:
          type: scale
          lo: Full size
          hi: Smallest
          stops: ["Sixteen bit", "Eight bit", "Four bit"]
          on: 1
        beats:
          - "Sixteen-bit is the usual starting point. Nothing is lost and nothing is saved."
          - "Eight-bit halves the size and, done carefully, costs almost no quality. This is the safe default."
          - "Four-bit halves it again and starts to bite. Outlier weights are where the damage concentrates, so measure rather than assume."
      - name: Small language models
        why: "The area moving fastest, and the one you will be asked about."
        plain:
          - >-
              A small language model has a few billion parameters or fewer. It can run
              on a phone or laptop.
          - >-
              They get much of their quality from training data rather than
              size. Careful curation buys more than extra parameters here.
        covers:
          - What a small model can and cannot do
          - Data quality as the main lever at small scale
          - Distilling reasoning from a larger model
          - Task-specific small models versus general ones
          - Long context on a memory budget
          - Routing between a small local model and a large remote one
        check: "When would you ship a small local model instead of calling a large one?"
        viz:
          type: tree
          root: Which model runs this request
          branches:
            - k: Small and local
              items: ["Routine, private, offline"]
            - k: Large and remote
              items: ["Hard, rare, needs breadth"]
        beats:
          - "Most systems end up routing rather than choosing once."
          - "The local model handles the routine, the private and the offline. Most requests, most of the time."
          - "The remote model gets the hard and unusual ones. The interesting design question is who decides, and how it fails when the network is gone."
      - name: Runtimes and hardware
        why: "The model is only half of it. The runtime decides what actually happens."
        plain:
          - >-
              A phone has a processor, a graphics chip and often a dedicated
              neural unit. Each supports a different set of operations.
          - >-
              Unsupported operations fall back to a slow path. One fallback can erase
              the gain from the other changes.
        covers:
          - "CPU, GPU and neural accelerators on the same device"
          - Operator support and silent fallbacks
          - "Export formats and their converters"
          - Memory mapping and load time
          - Batch size one, which is the normal case here
          - Profiling on the target device rather than a simulator
        check: "Your quantised model is slower than the original on device. Give the likely cause."
        viz:
          type: flow
          steps: ["Train", "Export", "Convert", "Run on device", "Profile"]
          loop: true
        beats:
          - "Train wherever you like. This part is unconstrained."
          - "Export to an interchange format. The first place operators start disappearing."
          - "Convert for the target runtime. The second place, and unsupported operations quietly fall back to the CPU."
          - "Run it on the actual device. Simulators do not reproduce thermal limits or memory pressure."
          - "Profile, find the fallback, and go round again. This loop is most of the work."
      - name: Measuring on device
        why: "Server metrics do not describe a phone."
        plain:
          - >-
              On a server you measure throughput. On a device you measure how
              long the user waits and how warm the phone gets.
          - >-
              A model that is fast for ten seconds and then throttles is not
              fast. Sustained performance is the number that matters.
        covers:
          - Time to first token and time per token
          - Peak memory, and what the operating system will kill
          - Thermal throttling and sustained versus burst speed
          - Battery cost per request
          - Cold start and model load time
          - Measuring on the oldest device you support
        check: "Name three measurements that matter on device and not on a server."
        viz:
          type: compare
          cols:
            - k: On a server
              items: ["Requests per second", "Cost per thousand calls"]
            - k: On a device
              items: ["Wait before the first word", "Heat and battery", "Whether it survives ten minutes"]
        beats:
          - "On a server you optimise throughput, because you are filling a machine with many users."
          - "A device serves one user. Measure their wait, the heat in their hand, and performance after ten minutes."
      - name: What you give up
        why: "Being honest about the gap is what makes the pitch credible."
        plain:
          - >-
              A small model knows less. It has weaker general knowledge, shorter
              usable context, and it breaks down on unusual requests.
          - >-
              Test whether the smaller model is good enough for your job. Use your own data, since a general benchmark answers a different question.
        covers:
          - Capability gaps that appear at the tail
          - Shorter usable context in practice
          - Evaluating on your own task rather than general benchmarks
          - Falling back to a larger model, and how that fails offline
          - Updating a model already on millions of devices
          - Being honest about the gap in a design review
        check: "Your on-device model handles 90% of requests. Describe what happens to the other 10%."
        viz:
          type: flow
          steps: ["Request arrives", "Small model tries", "Is it confident", "Answer or escalate"]
        beats:
          - "A request arrives on the device."
          - "The small model attempts it, because most requests are routine."
          - "Something has to judge whether the answer is good enough. This is a calibration problem, and it is the hard part."
          - "Answer locally, or escalate to the cloud. Then decide what happens when there is no cloud to escalate to."
    traps:
      - Quoting benchmark scores from a server for a model that will run on a phone
      - Profiling on a simulator instead of the oldest supported device
      - Assuming a smaller model is automatically faster on the target hardware
      - Designing an escalation path that fails silently when the device is offline
    drills:
      - Quantise one model to eight bits and measure the quality you lost on your own data
      - Run one model on a phone. Time the first token now and again after ten minutes
      - Find one operator that falls back to the CPU and remove it
      - Write the routing rule between local and remote, including the offline case
  - id: image-generation
    name: Image Generation
    group: models
    blurb: "Whether you understand denoising as a process, and what steering it costs."
    scope: "Owns diffusion, conditioning and control. Hands the encoders to multimodality and the safety framing to AI safety."
    links: [multimodality, ai-safety]
    modules:
      - name: Diffusion as a process
        why: "Every later idea is a modification of this loop."
        plain:
          - >-
              Take an image and add noise until nothing is left. That direction
              is easy and needs no learning.
          - >-
              Now train a model to undo one step of it. Run that model many
              times from pure noise and an image appears.
        covers:
          - The forward process that destroys an image
          - Learning to predict the noise that was added
          - Sampling as repeated partial denoising
          - Why many small steps beat one large one
          - Noise schedules and what they control
          - The link to score matching, at a conceptual level
        check: "Explain diffusion without using the word diffusion."
        viz:
          type: flow
          steps: ["Pure noise", "Predict the noise", "Subtract a little", "Repeat", "An image"]
          loop: true
        beats:
          - "Start from pure static. No information at all."
          - "The model predicts which part of this is noise. That is the only thing it was ever trained to do."
          - "Remove a fraction of what it predicted. One small step toward something coherent."
          - "Repeat, tens of times. Each pass has an easier job than the one before."
          - "An image. The whole method is one small prediction, run many times."
        scene:
          kind: denoise
          labels: [Noise, Less noise, Shape, Image]
          alt: "Four frames change from random noise into a simple image."
      - name: Working in a smaller space
        why: "This is what made image generation affordable."
        plain:
          - >-
              Denoising at full resolution is very expensive. So the work happens
              in a compressed space instead.
          - >-
              An autoencoder first squeezes the image into a smaller space. Denoising
              happens there, then a decoder rebuilds the image.
        covers:
          - The autoencoder and its compression factor
          - Denoising in latent space rather than pixel space
          - What the decoder can and cannot recover
          - Artefacts that come from the autoencoder rather than the model
          - Resolution, aspect ratio and training distribution
          - Why fine text and small faces suffer
        check: "Your outputs have consistent small artefacts. How would you tell the autoencoder from the denoiser?"
        viz:
          type: flow
          steps: ["Image", "Encode down", "Denoise here", "Decode up", "Image"]
        beats:
          - "Start with a full resolution image during training."
          - "An encoder compresses it, often by a factor of eight in each direction."
          - "All the expensive denoising happens in that small space. This is the entire cost saving."
          - "A decoder expands the result back to full size, inventing the fine detail."
          - "Which is why small text and distant faces come out wrong. That damage is the autoencoder's, not the denoiser's."
      - name: Steering it with a prompt
        why: "Guidance is the knob people turn without knowing what it does."
        plain:
          - >-
              The model can predict noise with the prompt in mind, or without it.
              Run both and you get two directions.
          - >-
              Guidance exaggerates the difference between them. It pushes the
              image toward the prompt and away from a generic one.
        covers:
          - Text encoders and what the model actually reads
          - Conditional and unconditional prediction
          - "Classifier-free guidance and the guidance scale"
          - What happens as guidance rises
          - Negative prompts as a second unconditional direction
          - Prompt adherence versus image diversity
        check: "Explain what classifier-free guidance does, and what breaks when you turn it up."
        viz:
          type: scale
          lo: Ignores the prompt
          hi: Obeys and looks burnt
          stops: ["No guidance", "Balanced", "Too much"]
          on: 1
        beats:
          - "With no guidance the model produces something plausible that may ignore what you asked for."
          - "Turn it up and the image moves toward the prompt. There is a range where this is simply better."
          - "Push further and you get obedience with no variety, oversaturated colour and hard edges. The image is being pulled harder than the model can absorb."
      - name: Control beyond the prompt
        why: "Words run out quickly when you need a specific composition."
        plain:
          - >-
              A prompt cannot say where things go. For that you give the model
              another image to follow.
          - >-
              An edge map, depth map or pose skeleton fixes the layout. The prompt can
              still change the style.
        covers:
          - Image to image, and how much of the original survives
          - Inpainting and outpainting with a mask
          - "Structural control from edges, depth or pose"
          - Reference images for style or identity
          - Combining several controls and their conflicts
          - Seeds and reproducing a result exactly
        check: "You need the same composition in five different styles. Describe your setup."
        viz:
          type: tree
          root: What do you need to hold fixed
          branches:
            - k: The layout
              items: ["Edge or depth control"]
            - k: A region
              items: ["Inpainting with a mask"]
            - k: A subject
              items: ["Reference image or a trained adapter"]
        beats:
          - "Decide what must stay the same. That choice picks the tool."
          - "Use an edge or depth map to keep the composition. Let the prompt control the remaining style."
          - "To change one region only, mask it and inpaint. The rest of the image is untouched."
          - "Use a reference image to keep a subject consistent. A small trained adapter can do the same."
      - name: Samplers and step count
        why: "The cheapest quality and speed lever in the whole stack."
        plain:
          - >-
              The sampler decides how big each denoising step is and how it uses
              the model's prediction.
          - >-
              Better samplers reach the same quality in fewer steps. Fewer steps
              means proportionally less compute.
        covers:
          - Deterministic and stochastic samplers
          - Step count and where the returns flatten
          - Solver order and why it lets you take fewer steps
          - Distilled few-step models
          - Reproducibility, seeds and sampler choice
          - Measuring quality against cost rather than by eye
        check: "You halve the step count and quality drops. Give two things you would try before adding steps back."
        viz:
          type: curve
          shape: rise
          x: Steps taken
          y: Quality
          a: A better sampler
          b: A basic sampler
        beats:
          - "A basic sampler needs many steps before the image settles."
          - "A better solver reaches the same quality sooner. It makes the same picture with fewer steps."
      - name: Teaching it something new
        why: "Almost every production use needs a subject the base model never saw."
        plain:
          - >-
              The base model does not know your product, your character or your
              house style. You teach it with a handful of images.
          - >-
              A small adapter is usually enough. Training the whole model is
              expensive and forgets things.
        covers:
          - "LoRA adapters for style and subject"
          - Subject-driven fine-tuning from a few images
          - Textual inversion and learning a new token
          - Overfitting, and the same face in every output
          - Combining adapters and their interference
          - Rights and consent for the training images
        check: "Every image now looks like your five training photos. Say what went wrong."
        viz:
          type: scale
          lo: Cheapest
          hi: Most invasive
          stops: ["New token", "Small adapter", "Full fine-tune"]
          on: 1
        beats:
          - "Learning one new word is the lightest option. It teaches a concept without touching the model."
          - "A small adapter is the usual answer. Enough capacity for a style or a subject, small enough to swap in and out."
          - "A full fine-tune moves everything. Most capable, most expensive, and it forgets things you wanted to keep."
      - name: Evaluation and harm
        why: "The metrics are weak and the harms are concrete."
        plain:
          - >-
              Scores for generated images correlate loosely with what people
              actually prefer. Human comparison is still the real measure.
          - >-
              The harms are not hypothetical. Likeness without consent, and
              images presented as real, are the two that matter most.
        covers:
          - Automated scores and how loosely they track preference
          - Pairwise human comparison as the real measure
          - Prompt adherence measured separately from image quality
          - Likeness, consent and named individuals
          - Provenance, watermarking and their limits
          - Training data rights and attribution
        check: "How would you decide whether a new checkpoint is better than the one in production?"
        viz:
          type: parts
          centre: Before it ships
          around:
            - Do people prefer it
            - Does it follow the prompt
            - Can it depict a real person
            - Can anyone tell it was generated
        beats:
          - "Four questions, and the automated score answers none of them well."
          - "Do people actually prefer the output. Pairwise comparison, on your own prompts."
          - "Does it do what the prompt asked. Measure this separately from whether the picture is attractive."
          - "Will it produce a recognisable real person on request. Test this deliberately rather than waiting to find out."
          - "And is there any way to tell the image was generated. Watermarking helps and survives less handling than people assume."
    traps:
      - Turning guidance up until the image looks burnt and calling it prompt adherence
      - Blaming the denoiser for artefacts the autoencoder introduced
      - Judging a checkpoint by a handful of cherry-picked outputs
      - Training on someone's likeness without asking whether you may
    drills:
      - Generate the same seed at five guidance values and line them up
      - Halve the step count and compare against the sampler change instead
      - Train one small adapter on ten images and find where it overfits
      - Run a pairwise comparison on thirty prompts before trusting any score

  # ── Judgement ────────────────────────────────────────────────────────────
  - id: uncertainty-quantification
    name: Uncertainty Quantification
    group: judgement
    blurb: "Whether a model's confidence means anything, and what you do when it does not."
    scope: "Owns calibration, coverage and abstention. Hands posterior computation to Bayesian statistics and deployment gating to AI safety."
    links: [bayesian-statistics, ai-safety]
    modules:
      - name: What kind of uncertainty
        why: "The decomposition decides which fix is available to you."
        beats:
          - >-
              Two very different things get called uncertainty, and the fix depends on
              which one you have.
          - >-
              Aleatoric is noise in the world. A fair coin is genuinely unpredictable
              and more data will never change that.
          - >-
              Epistemic is your own ignorance. More data, or a better model, removes it.
              Only this kind is worth collecting for.
        plain:
          - >-
              Two different things get called uncertainty. One is noise in the world,
              like a coin flip. More data will never remove it.
          - >-
              The other is your own ignorance, and more data does remove it. Which kind
              you have decides whether collecting more data is worth anything.
        covers:
          - Aleatoric versus epistemic uncertainty
          - Distributional shift and model misspecification
          - Uncertainty from data, model, and optimisation
          - Why the decomposition is not clean in practice
          - What each type licenses you to do
          - Predictive versus parameter uncertainty
        check: "Give a real example where more data removes the uncertainty, and one where it does not."
        viz:
          type: tree
          root: Uncertainty
          branches:
          - k: Aleatoric
            items:
            - Noise in the world
            - More data will not remove it
          - k: Epistemic
            items:
            - Gaps in the model
            - More data helps
      - name: Calibration
        why: "Calibration is the central measurement here, and easy to get subtly wrong."
        beats:
          - >-
              A perfectly calibrated model sits on the diagonal. Say seventy per cent,
              be right seventy per cent of the time.
          - >-
              Most models sit below it. They claim more confidence than they earn, and
              the gap is widest where they are most certain.
        plain:
          - >-
              A calibrated model is one you can take at its word. Of everything it calls
              seventy per cent likely, about seventy per cent should turn out true.
          - >-
              Plot it to see it. Stated confidence along the bottom, observed accuracy
              up the side. A calibrated model sits on the diagonal. Most sit below it,
              claiming more than they deliver.
        covers:
          - Reliability diagrams and confidence histograms
          - "Expected calibration error, its bin dependence and estimator bias"
          - Adaptive binning, class-wise and top-label ECE
          - Brier score and its decomposition
          - Proper scoring rules, log loss, sharpness under calibration
          - Calibration versus accuracy versus discrimination
        check: "Why can two models with identical accuracy and identical ECE behave very differently in deployment?"
        viz:
          type: curve
          shape: diag
          x: Stated confidence
          "y": Observed accuracy
          a: Perfectly calibrated
          b: Overconfident
      - name: Recalibration
        why: "Try this before anything more elaborate."
        beats:
          - >-
              You have a trained model. Its ranking is fine and its numbers are not.
          - >-
              Take a held-out set it never saw during training.
          - >-
              Fit a single number that divides all the scores. One parameter, nothing
              else changes.
          - >-
              Now the probabilities mean something. Accuracy is untouched, because
              dividing everything by one number cannot reorder it.
        plain:
          - >-
              Recalibration fixes the numbers without touching the ranking. Temperature
              scaling divides the scores by one constant, fitted on held-out data.
          - >-
              It is cheap and it works, until the input distribution moves. Then the
              constant you fitted describes yesterday's data, and the calibration
              quietly goes.
        covers:
          - Temperature scaling and why it preserves accuracy
          - Vector and matrix scaling
          - Platt scaling and isotonic regression
          - Histogram binning and beta calibration
          - Calibration sets, size requirements, and reuse
          - Recalibration failing under distribution shift
        check: "Temperature scaling fixed calibration on validation and failed in production. Explain."
        viz:
          type: flow
          steps:
          - Trained model
          - Held-out set
          - Fit a temperature
          - Calibrated model
      - name: Conformal prediction
        why: "Conformal prediction gives a finite-sample guarantee, and it is your own tool."
        beats:
          - >-
              Set aside a calibration set. It must look like the data you will meet
              later.
          - >-
              Score every point by how badly the model missed it.
          - >-
              Take the quantile of those scores at the level you asked for.
          - >-
              For a new input, keep every label scoring better than that threshold. That
              set is your answer.
          - >-
              Coverage holds on average across inputs. The guarantee covers the procedure, and says nothing about any one prediction.
        scene:
          kind: "sets"
          cases: [{"k": "Easy input", "set": ["cat"]}, {"k": "Harder input", "set": ["cat", "lynx"]}, {"k": "Hardest input", "set": ["cat", "lynx", "fox", "dog"]}]
        plain:
          - >-
              Conformal prediction gives a set of answers instead of one, with a promise
              attached. Ask for ninety per cent coverage. Across many cases, the set
              should contain the true answer nine times out of ten.
          - >-
              The promise is real but narrow. It holds on average across all inputs. It says nothing about any single input. It also needs new data to resemble the calibration data.
        covers:
          - Exchangeability and what it demands
          - "Split conformal: calibration set, quantile, coverage guarantee"
          - Nonconformity scores and their effect on set size
          - Marginal versus conditional coverage
          - "Classification sets: APS, RAPS"
          - "Regression: conformalised quantile regression"
          - Weighted conformal under covariate shift
          - Conformal risk control and beyond-coverage guarantees
          - Adaptive and online conformal for drifting streams
        check: "State the split conformal guarantee precisely, including what it does not promise per input."
        viz:
          type: flow
          steps:
          - Calibration set
          - Score every point
          - Take the quantile
          - Build the set
          - Coverage holds
      - name: Bayesian and ensemble approximations
        why: "These are the practical alternatives, priced honestly."
        beats:
          - >-
              Train several models with different seeds and look at how much they
              disagree. Best results, and you pay for every one.
          - >-
              Leave dropout on at prediction time and sample repeatedly. Cheap, and the
              theory behind it is contested.
          - >-
              Look at the curvature around the solution. One extra pass, and it only
              describes the neighbourhood you landed in.
        plain:
          - >-
              If you want the model's own uncertainty rather than a wrapper, you have to
              approximate. Train several models, sample with dropout, or look at
              curvature near the optimum.
          - >-
              Cost is the deciding factor at serving time. Ensembles work well and
              multiply your bill by the number of models.
        covers:
          - Monte Carlo dropout and its criticisms
          - Deep ensembles, diversity, and cost
          - Snapshot ensembles and SWAG
          - Laplace approximation and last-layer Bayes
          - Evidential deep learning and the objections to it
          - Cheap approximations that hold up under shift
        check: "You can afford one extra forward pass at serving time. What uncertainty method do you pick?"
        viz:
          type: compare
          cols:
          - k: Deep ensemble
            items:
            - Several full models
            - Most compute
          - k: Monte Carlo dropout
            items:
            - One model, many passes
          - k: Laplace
            items:
            - Curvature at the optimum
            - One extra pass
      - name: Abstention and selective prediction
        why: "This is where uncertainty turns into a decision."
        beats:
          - >-
              Abstain on the least confident cases and accuracy on the rest climbs.
          - >-
              Answer everything and you accept more errors. The cost of a mistake tells
              you where to set the confidence threshold.
        scene:
          kind: "defer"
          inflow: "Every case arrives"
          answer: "Confident enough, answer it"
          aside: "Not confident, send to a person"
        plain:
          - >-
              Uncertainty is only worth measuring if something changes because of it.
              Usually that something is the decision to stay silent.
          - >-
              Abstain on the least confident cases and accuracy on the rest goes up.
              Plot that trade, then pick the threshold from what a mistake actually
              costs.
        covers:
          - Selective risk, coverage, and the risk-coverage curve
          - Area under the risk-coverage curve
          - Threshold selection under a cost model
          - Deferral to a human and cascade systems
          - "Out-of-distribution detection: max softmax, energy, Mahalanobis, kNN"
          - Open-set recognition and novelty
          - Measuring the value of abstention to the product
        check: "Design an abstention policy for a medical triage model and justify the threshold."
        viz:
          type: curve
          shape: rise
          x: Coverage
          "y": Risk
          a: Abstain on the hard cases
          b: Answer everything
      - name: Uncertainty for language models
        why: "Language models are the open frontier here, and where your own work sits."
        beats:
          - >-
              A language model has no single uncertainty number. The same meaning can
              have many phrasings.
          - >-
              Token probability is available and misleading. It measures wording as much
              as meaning.
          - >-
              Semantic entropy groups the samples that mean the same thing, then
              measures spread over meanings.
          - >-
              Sampling several times and checking whether the answers agree is a decent
              signal for very little work.
          - >-
              Asking the model how sure it is gives the least reliable answer of the
              four.
        plain:
          - >-
              Language models make this harder. There is no single probability to read
              off, because the same meaning can be phrased many ways.
          - >-
              Asking the model how sure it is gives an unreliable answer. Sampling
              several times and seeing whether the meanings agree is a better signal
              than any stated confidence.
        covers:
          - Token probability, sequence likelihood, length normalisation
          - Semantic entropy and meaning-level uncertainty
          - Verbalised confidence and its unreliability
          - Self-consistency and sampling-based signals
          - Hallucination detection versus uncertainty
          - Calibration change after instruction tuning and RLHF
          - Conformal methods for open-ended generation
        check: "How would you measure whether safety training changed a model's calibration?"
        viz:
          type: parts
          centre: Can I trust this answer
          around:
          - Token probability
          - Semantic entropy
          - Self-consistency
          - Stated confidence
    traps:
      - Reporting ECE with a fixed 15 bins and no sensitivity check
      - Claiming conformal gives per-input coverage
      - Using the calibration set twice
      - Treating high softmax confidence as evidence of correctness
    drills:
      - Plot a reliability diagram for a model you trained
      - Implement split conformal in 20 lines and verify empirical coverage
      - Break exchangeability on purpose and watch coverage fail
      - Build a risk-coverage curve and pick a threshold from a cost model

  - id: mechanistic-interpretability
    name: Mechanistic Interpretability
    group: judgement
    blurb: "Whether you can make a causal claim about a network's internals and defend it."
    scope: "Owns internals and causal analysis. Hands the architecture to transformers and the safety case to AI safety."
    links: [transformers, ai-safety]
    modules:
      - name: The framing
        why: "The field has a specific standard of evidence, and interviews test whether you hold it."
        beats:
          - >-
              In the tidy case one neuron means one thing and you can read it directly.
          - >-
              In practice a neuron fires for several unrelated concepts. That is
              polysemanticity.
          - >-
              The reason is superposition. There are more concepts worth storing than
              there are neurons, so they share directions.
        scene:
          kind: "crowded"
          slots: 5
          labels: ["French", "legal text", "a full stop", "bird names", "sarcasm", "hex colours", "the year 1987"]
          cap: "There are more things worth representing than there are neurons, so concepts share space. That is why one neuron fires for several unrelated things."
        plain:
          - >-
              The goal is the actual mechanism inside the network. A story that happens to fit the outputs will not do. That standard of evidence is what defines the
              field.
          - >-
              One neuron often fires for several unrelated things. The network has more
              concepts than neurons, so it packs them in overlapping directions.
        covers:
          - What counts as a mechanistic explanation
          - Features versus neurons
          - Superposition and polysemanticity
          - Privileged bases and why they matter
          - The residual stream as a channel that layers read and write
          - Interpretability illusions and correlation traps
        check: "Why can a neuron fire for two unrelated concepts, and what does that imply for interpretation?"
        viz:
          type: scale
          lo: One neuron, one concept
          hi: Concepts spread across neurons
          stops:
          - Monosemantic
          - Polysemantic
          - Superposition
          'on': 2
      - name: The toolkit
        why: "You will be asked which tool answers which question."
        beats:
          - >-
              Pick a specific behaviour, narrow enough to test. Not intelligence.
              Something like copying a repeated name.
          - >-
              Form a hypothesis about which component does it.
          - >-
              Intervene. Patch that activation from another run, or ablate it, and see
              whether the behaviour changes.
          - >-
              Measure the effect. Watching what lights up is correlation. Changing it
              and watching the output move is the causal claim.
        plain:
          - >-
              Looking at what lights up tells you what correlates. To claim a mechanism
              you have to intervene and watch the behaviour change.
          - >-
              Patching does that. Run one clean input and one corrupted input. Copy an
              activation between them, then see whether the answer changes.
        covers:
          - Logit lens and tuned lens
          - "Activation patching and causal tracing"
          - Path patching and attribution patching
          - "Ablation: zero, mean, resample, and why the choice matters"
          - Direct logit attribution
          - Causal scrubbing and hypothesis testing
          - Attribution graphs, and what freezing attention costs you
          - Probing classifiers and their limits
        check: "Compare zero ablation and resample ablation. When does zero ablation mislead you?"
        viz:
          type: flow
          steps:
          - Pick a behaviour
          - Form a hypothesis
          - Patch or ablate
          - Measure the effect
          loop: true
      - name: Circuits found so far
        why: "Concrete results are the shared reference points of the field."
        beats:
          - >-
              The clearest circuit anyone has found, and the standard reference point.
          - >-
              One head looks at the token before the current one.
          - >-
              Another finds where that same token appeared earlier in the context.
          - >-
              It copies whatever followed it last time.
          - >-
              That simple move accounts for a surprising amount of learning from
              examples in the prompt.
        plain:
          - >-
              A few circuits are understood well enough to be shared reference points.
              Induction heads are the clearest one.
          - >-
              They spot a repeat. The head finds where the current token appeared
              before, then copies whatever followed it. That simple move is much of
              in-context learning.
        covers:
          - Induction heads and in-context learning
          - Indirect object identification and name mover heads
          - Copy suppression and backup heads
          - Grokking and modular addition
          - Docstring and greater-than circuits
          - What evidence makes a circuit claim credible
        check: "Describe the induction head mechanism and the evidence that it is causal."
        viz:
          type: parts
          centre: Induction head
          around:
          - Reads the previous token
          - Matches an earlier copy
          - Copies what followed it
          - Gives in-context learning
      - name: Sparse dictionary learning
        why: "Sparse dictionaries are the main line of work right now, so expect depth."
        beats:
          - >-
              Start from the activations at one layer. Concepts are packed into
              overlapping directions.
          - >-
              Encode into a much wider layer, with only a few units allowed to be active
              at once.
          - >-
              Decode back and try to reproduce the original activations.
          - >-
              Compare the result. You want good reconstruction with few active units.
              Recent features can still lose to a simple probe.
        plain:
          - >-
              Since concepts are packed into overlapping directions, the idea is to
              unpack them. Train a wide layer that reconstructs activations using only a
              few active units at a time.
          - >-
              Recent results are humbling. A simple probe can search raw activations for
              a concept. It often beats the unpacked features on this task.
        covers:
          - Sparse autoencoders and the reconstruction-sparsity trade
          - "Variants: top-k, gated, JumpReLU"
          - Dead features, shrinkage, and feature absorption
          - Feature splitting across dictionary sizes
          - Transcoders and crosscoders, and why circuit work moved to them
          - Weight-sparse models and parameter decomposition as a different route
          - "Evaluating a dictionary: loss recovered, interpretability scores, downstream use"
          - "Where SAEs lose to a plain baseline: probing and steering"
        check: "A plain logistic probe beats your SAE at finding a concept. Explain why that is expected."
        viz:
          type: flow
          steps:
          - Activations
          - Encode sparsely
          - Decode
          - Compare the reconstruction
      - name: Steering and editing
        why: "Steering is where interpretability becomes something you can use."
        beats:
          - >-
              Steering adds a direction during the forward pass. Nothing is retrained
              and you can switch it off.
          - >-
              Editing rewrites weights to change a specific fact. Permanent, and it
              generalises worse than it looks.
          - >-
              Fine-tuning changes everything a little. Most effective, and the hardest
              to attribute or undo.
        plain:
          - >-
              Find a direction that means something and you can add it back mid-forward-pass. Behaviour changes with no retraining.
          - >-
              Finding a direction that controls refusal is not the same as finding the
              refusal mechanism. Test what else moved before making that claim.
        covers:
          - Activation addition and steering vectors
          - Refusal directions and single-direction findings
          - "Model editing: ROME, MEMIT, and their generalisation failures"
          - Representation engineering
          - Fine-tuning versus steering as an intervention
          - Side effects and how to measure them
        check: "You found a direction that controls refusal. What experiments before you claim it is the refusal mechanism?"
        viz:
          type: compare
          cols:
          - k: Steering
            items:
            - Add a direction at runtime
            - Reversible
          - k: Editing
            items:
            - Change the weights
            - Permanent
          - k: Fine-tuning
            items:
            - Retrain
            - Broadest side effects
      - name: Interpretability for safety
        why: "Labs fund this work for safety reasons, which is also how it meets your agenda."
        beats:
          - >-
              The goal at the top: interpretability evidence strong enough to hold up a
              deployment decision.
          - >-
              Below that, explaining a whole behaviour rather than one component.
          - >-
              Below that, locating a feature and showing it is causal.
          - >-
              At the bottom, reading activations. The field is solid here and gets
              shakier with every step up.
        plain:
          - >-
              Labs fund this work for one reason. They want to check what a model is
              doing before deploying it, rather than only testing outputs.
          - >-
              The field is not there yet. Be able to say what a safety case built on interpretability would need. Then be honest that current tools fall short.
        covers:
          - What a safety case built on interpretability would need
          - Deception and situational awareness detection
          - Faithfulness of chain of thought
          - Auditing games and blind evaluation
          - Scaling interpretability to frontier models
          - Honest accounting of what the field cannot yet do
        check: "What would have to be true for interpretability to gate a deployment decision?"
        viz:
          type: stack
          layers:
          - Gate a deployment
          - Explain a behaviour
          - Locate a feature
          - Read activations
    traps:
      - Presenting a correlational probe as a mechanism
      - Reading feature labels without a causal check
      - Cherry-picking one prompt as evidence of a circuit
      - Overstating what SAEs currently deliver
      - Comparing an interpretability method against no baseline at all
    drills:
      - Run activation patching on a small model and locate a known head
      - Train an SAE on one layer and manually label 20 features
      - Run a logistic probe on the same concept and compare it with the SAE
      - Reproduce the induction head result on a two-layer model
      - Write one claim, then write the experiment that would refute it

  - id: ai-safety
    name: AI Safety
    group: judgement
    blurb: "Whether you have a position, and whether it survives the strongest objection."
    scope: "Owns risk framing, alignment methods and evaluation. Draws on mechanistic interpretability and uncertainty quantification as tools."
    links: [uncertainty-quantification, mechanistic-interpretability]
    modules:
      - name: The landscape
        why: "A broad interview will open here, and vagueness reads badly."
        beats:
          - >-
              Three broad shapes of risk. Being able to name which one you mean is most
              of a good answer.
          - >-
              Misuse. The system works exactly as built and somebody points it at harm.
          - >-
              Misalignment. The system pursues something other than what you meant, and
              does it competently.
          - >-
              Systemic. No single failure, just harm that emerges from scale, speed and
              dependence.
        plain:
          - >-
              Harm has several sources. People can misuse a system, or the system can
              pursue the wrong goal. Scale can spread either harm.
          - >-
              Have a position and a threat model. Vagueness reads badly, and so does
              certainty about questions the field has genuinely not settled.
        covers:
          - Misuse, misalignment, and systemic risk
          - Near-term harms and long-horizon concerns as one agenda
          - Who does what across labs, government, and academia
          - Capability versus propensity
          - Threat models worth taking seriously, and the weak arguments
          - Where reasonable researchers disagree
        check: "Give your one-minute answer to what AI safety means, then defend it against the strongest counterargument."
        viz:
          type: tree
          root: Risk
          branches:
          - k: Misuse
            items:
            - People use it to cause harm
          - k: Misalignment
            items:
            - The model pursues the wrong goal
          - k: Systemic
            items:
            - Harm from scale and dependence
      - name: Alignment methods
        why: "You need to explain what current techniques do and where they stop."
        beats:
          - >-
              When a person can judge the answer directly, ordinary human feedback
              works.
          - >-
              When it takes effort, give the rater tools. Let a model draft the critique
              and a human check it.
          - >-
              When the model is better than any rater, feedback stops carrying
              information. Everything past this line is unsolved.
        plain:
          - >-
              Current alignment mostly means learning from human feedback. Show people
              two answers, learn which they prefer, push the model that way.
          - >-
              That breaks once the model is better than the rater at the task. If a
              human cannot tell which answer is right, their preference stops carrying
              information.
        covers:
          - RLHF and its known limits
          - Constitutional AI and rule-based feedback
          - Debate and recursive reward modelling
          - Weak-to-strong generalisation
          - Scalable oversight and amplification
          - Deliberative and specification-following approaches
        check: "Why is human feedback insufficient once models exceed human performance on a task?"
        viz:
          type: scale
          lo: A human can check the work
          hi: A human cannot check the work
          stops:
          - Direct feedback
          - Assisted oversight
          - Scalable oversight
          'on': 1
      - name: Failure modes
        why: "These terms are the field's vocabulary, and precision counts."
        beats:
          - >-
              Reward hacking. The measurement was wrong, so scoring well and doing well
              came apart.
          - >-
              Goal misgeneralisation. The goal was learnt from a narrow setting and does
              not transfer. Same bad behaviour, different cause.
          - >-
              Sycophancy. Agreement got rewarded, so the model tells you what you seem
              to want.
        plain:
          - >-
              These terms get used loosely and precision counts. Reward hacking means
              the goal was measured badly, so scoring well and doing well came apart.
          - >-
              Goal misgeneralisation is different. The goal was learnt from a narrow
              setting and does not transfer. Same bad behaviour, different cause,
              different fix.
        covers:
          - Reward hacking and specification gaming
          - Goal misgeneralisation versus capability misgeneralisation
          - Sycophancy and preference gaming
          - Deceptive alignment and the arguments for and against
          - Situational awareness and evaluation awareness
          - Sandbagging and strategic underperformance
          - Emergent behaviour claims and how to test them
        check: "Distinguish reward hacking from goal misgeneralisation with a concrete example of each."
        viz:
          type: compare
          cols:
          - k: Reward hacking
            items:
            - The goal was measured badly
          - k: Goal misgeneralisation
            items:
            - The goal was learned narrowly
          - k: Sycophancy
            items:
            - Agreement got rewarded
      - name: Evaluation and red teaming
        why: "Most safety roles spend their time here."
        beats:
          - >-
              Name a capability you would genuinely worry about. Vague risk gives you an
              eval nobody acts on.
          - >-
              Build a test that would detect it, and check it can fail.
          - >-
              Set the threshold before you see the result, or you will negotiate with
              yourself afterwards.
          - >-
              Write down what happens when it is crossed. An eval with no consequence
              attached is theatre.
        plain:
          - >-
              Most safety work is evaluation. Name the capability that would be
              dangerous. Build a test, then set a threshold that changes a decision.
          - >-
              An evaluation nobody would act on is theatre. Write down in advance what
              happens if the model crosses the line.
        covers:
          - Dangerous capability evaluations
          - Red teaming, manual and automated
          - "Jailbreaks: many-shot, encoding, persona, multi-turn"
          - Refusal training and the over-refusal cost
          - Eval gaming, contamination, and eval awareness
          - Responsible scaling policies and capability thresholds
          - Building an eval that would change a decision
        check: "Design an evaluation for a capability you believe is dangerous. State the threshold and the response."
        viz:
          type: flow
          steps:
          - Name the capability
          - Build the eval
          - Set a threshold
          - Decide the response
          loop: true
      - name: Robustness and control
        why: "Assume alignment might fail, then engineer around it."
        beats:
          - >-
              At the top, a person approving anything you cannot undo.
          - >-
              Below that, monitoring that would notice the pattern you fear.
          - >-
              Below that, a sandbox limiting what any single action can reach.
          - >-
              At the base, least privilege. All of this assumes alignment might fail,
              which is the point of it.
        plain:
          - >-
              Control asks a different question. Suppose the model is misaligned but not
              superhuman. What deployment design keeps it from causing harm anyway.
          - >-
              Answers look like ordinary security. Least privilege, monitoring,
              sandboxes, approval for irreversible actions, and a rollback you have
              actually tested.
        covers:
          - Adversarial robustness and its limits
          - Control evaluations and untrusted models
          - Monitoring, tripwires, and anomaly detection
          - Sandboxing and permission design for agents
          - Defence in depth across the deployment stack
          - Incident response and rollback
        check: "Assume the model is misaligned but not superhuman. What deployment controls still work?"
        viz:
          type: stack
          layers:
          - Human approval
          - Monitoring
          - Sandboxing
          - Least privilege
      - name: Honesty, calibration and abstention
        why: "Calibration is your own contribution, so keep this section the sharpest."
        beats:
          - >-
              Safety training seems to cost a model some of its sense of what it knows.
          - >-
              That cost is reported as one averaged number.
          - >-
              It is really a distribution over inputs, and averages hide where the
              damage falls.
          - >-
              It is likely larger in languages where the safety data was thin.
          - >-
              And in modalities beyond text, for the same reason. Measuring the shape is
              the open work.
        scene:
          kind: defer
          inflow: Model answers
          answer: "Clear case: answer"
          aside: "Unsure case: abstain"
          alt: "A model answers clear cases and abstains when it is unsure."
        plain:
          - >-
              This is your own contribution, so it should be the sharpest section. A
              model that knows when to stay quiet is safer than one that is confident
              and wrong.
          - >-
              Safety training seems to cost some of that self-knowledge. The cost is
              reported as one average number, and averages hide where the damage
              actually falls.
        covers:
          - Truthfulness versus helpfulness tension
          - Knowing when to abstain as a safety property
          - The alignment tax on calibration
          - Where the cost concentrates, by language and modality
          - Measuring the shape of the tax rather than its average
          - Recovery methods and what they give up
        check: "Argue that calibration is a safety property, not a nice-to-have, in three sentences."
        viz:
          type: parts
          centre: The alignment tax on calibration
          around:
          - Reported as one average
          - Really a spread over inputs
          - Varies by language
          - Varies by modality
      - name: Policy and practice
        why: "Even research roles expect awareness of the surrounding system."
        beats:
          - >-
              Evaluate against the capabilities you named in advance.
          - >-
              Document what you found, including what you could not test.
          - >-
              Gate the release on it. This is the step that makes the earlier ones real.
          - >-
              Monitor after launch, because deployment finds things evaluation missed.
          - >-
              Report what goes wrong. A field that hides incidents learns nothing from
              them.
        plain:
          - >-
              Research does not end at the paper. Model cards, staged release and
              third-party audits are how a finding turns into a deployment decision.
          - >-
              Open weights is a live argument with real points on both sides. Be able to
              state the strongest version of each before saying where you land.
        covers:
          - Model cards, system cards, transparency reporting
          - Deployment gating and staged release
          - Open weights debate, both sides stated fairly
          - Evaluation standards and third-party audits
          - Incident reporting and shared learning
          - Regulation landscape at a high level
        check: "State the strongest argument for open weights and the strongest against, then say where you land."
        viz:
          type: flow
          steps:
          - Evaluate
          - Document
          - Gate the release
          - Monitor
          - Report
          loop: true
    traps:
      - Talking about risk with no threat model attached
      - Framing gaps as other organisations' mistakes
      - Claiming certainty on questions the field has not settled
      - Treating safety and capability as strictly opposed
    drills:
      - Write your safety position in 200 words and cut it to 100
      - Red team one open model for an afternoon and log what worked
      - Reproduce one published eval and note where it is fragile
      - Steelman the position you disagree with most, out loud

  - id: machine-learning-research
    name: Machine Learning Research
    group: judgement
    blurb: "Whether you pick questions worth answering and run experiments that could prove you wrong."
    scope: "Owns research taste, method and communication. Applies to whichever technical track the role sits in."
    links: [ai-safety, uncertainty-quantification]
    modules:
      - name: Choosing a question
        why: "Research interviews are measuring taste more than technique."
        beats:
          - >-
              The answer is known and somebody acts on it. That is engineering, and it
              is useful work.
          - >-
              The answer is unknown and somebody acts on it. This is the quadrant worth
              writing about.
          - >-
              The answer is known and nobody acts on it. Nothing to add here.
          - >-
              Unknown and nobody cares. Interesting to you, and hard to justify as a
              project.
        plain:
          - >-
              Taste is picking a question worth answering. That is what a research
              interview is really testing, more than technique.
          - >-
              The strongest design is one where either result teaches you something.
              Write down in advance what would make you abandon the idea.
        covers:
          - Mapping a literature quickly and honestly
          - Gap versus novelty, and why a gap alone is weak
          - Designing a claim where either result is publishable
          - Writing your own kill criteria before you start
          - Stating your credence and updating it
          - Scope that fits the compute you actually have
        check: "Describe a project where the negative result would still have been worth reporting."
        viz:
          type: matrix
          x:
          - The answer is known
          - The answer is unknown
          "y":
          - Somebody acts on it
          - Nobody acts on it
          cells:
          - Engineering task
          - Worth doing
          - Not worth writing
          - Curiosity only
      - name: Experiment design
        why: "Good design is what turns a demo into evidence."
        beats:
          - >-
              Start with a hypothesis specific enough to be wrong.
          - >-
              Write down what you expect to see, before running anything.
          - >-
              Tune the baseline as hard as your own method. This is the step people
              quietly skip.
          - >-
              Ablate. Remove one piece at a time so you learn which part carried the
              result.
          - >-
              Then judge, against what you wrote down at the start.
        scene:
          kind: split
          parts:
            - {k: Baseline, w: 1}
            - {k: One change, w: 1, on: true}
            - {k: Compare, w: 1}
          alt: "A fair experiment changes one thing before comparing results."
        plain:
          - >-
              An experiment is a prediction plus a way of being wrong. Without the
              second part it is a demo.
          - >-
              Tune the baseline as hard as your own method. A one point gain over a lazy
              baseline is not a finding.
        covers:
          - Hypothesis, prediction, and the observation that would refute it
          - Baselines, and tuning them as hard as your method
          - Ablations that isolate one variable
          - Controls, seeds, and variance budgeting
          - Compute planning and the smallest informative scale
          - Deciding in advance what counts as success
        check: "Your method beats the baseline by 1 point. What would you run before believing it?"
        viz:
          type: flow
          steps:
          - Hypothesis
          - Prediction
          - Baseline
          - Ablation
          - Verdict
      - name: Statistics for papers
        why: "Reviewers and interviewers both push hardest here."
        beats:
          - >-
              One run per method. The difference you see could be entirely the seed.
          - >-
              Three runs. You can see a spread now, and it is probably wider than your
              improvement.
          - >-
              Enough runs that the spread settles. Report the spread. The best run you got is not the result.
        plain:
          - >-
              Different random seeds give different results. If your gain is smaller
              than that spread, you have not measured anything.
          - >-
              Run enough seeds to see the spread, then report it. Three overlapping
              error bars support a much weaker claim than most papers make from them.
        covers:
          - Seed variance and how many runs you need
          - Error bars, confidence intervals, and honest plots
          - Multiple comparisons across many benchmarks
          - Effect size over significance theatre
          - Cherry-picking, and how to notice your own
          - Reporting compute and cost
        check: "You have three seeds and overlapping error bars. What do you claim?"
        viz:
          type: scale
          lo: One run
          hi: Enough runs
          stops:
          - One seed
          - Three seeds
          - Enough to see the spread
          'on': 2
      - name: Reproducibility
        why: "Reproducibility is cheap to provide and it signals seriousness."
        beats:
          - >-
              At the top, the number in the paper.
          - >-
              It rests on the exact configs and seeds that produced it.
          - >-
              Which rest on an environment that has to be pinned, or the numbers move.
          - >-
              And under all of it, the data and code. The test is whether someone who
              wants you wrong could reproduce it.
        plain:
          - >-
              Reproducibility is cheap and it signals seriousness. Pin the environment,
              save the configs, record the seeds.
          - >-
              The test is whether a stranger who wants you to be wrong could get your
              number. Write for that reader.
        covers:
          - Code release, configs, and environment pinning
          - Dataset cards and licence clarity
          - Random seed and determinism handling
          - Reporting failures and negative results
          - Making a result reproducible by someone hostile to it
          - Artefact evaluation norms
        check: "What would a stranger need to reproduce your last result exactly?"
        viz:
          type: stack
          layers:
          - The reported result
          - Configs and seeds
          - Environment
          - Data and code
      - name: Writing
        why: "The output of research is a paper somebody can act on."
        beats:
          - >-
              State the claim. One sentence, and a reviewer should be able to repeat it
              back.
          - >-
              Attach the evidence that supports it. Every claim needs one.
          - >-
              Make a figure that carries the argument, rather than decorating it.
          - >-
              Then the limitation, written as the next piece of work rather than as an
              apology.
        plain:
          - >-
              The output of research is a paper someone can act on. Every claim needs a
              piece of evidence attached to it.
          - >-
              State limitations as the next piece of work rather than as an apology. It
              reads as confidence and it is more useful.
        covers:
          - Abstract structure and the one-sentence claim
          - Mapping every claim to its evidence
          - Figures that carry the argument
          - Related work as positioning, not a list
          - Limitations written as the work, not as apology
          - Titles, framing, and the reader you are writing for
        check: "Compress your last project into one sentence a reviewer would remember."
        viz:
          type: flow
          steps:
          - Claim
          - Evidence
          - Figure
          - Limitation
      - name: Review and rebuttal
        why: "Interviewers often ask about reviewing, since it shows you are part of the community."
        beats:
          - >-
              Read the reviews once, then leave them alone for a day.
          - >-
              Sort by weight. Some points would change the decision and most would not.
          - >-
              Answer the load-bearing ones properly. Space spent on small complaints is
              space taken from real ones.
          - >-
              Revise, and say plainly what you changed.
        plain:
          - >-
              Reviewing is part of being in the field, and interviewers ask about it. It
              also teaches you what a weak paper looks like from outside.
          - >-
              In a rebuttal, pick the points that carry the decision. Answering every
              complaint equally wastes the space you have.
        covers:
          - Reviewing well and what a useful review contains
          - Reading reviews without defensiveness
          - Rebuttal strategy and choosing which points to fight
          - Venue norms and timelines across NeurIPS, ICML, ICLR, ACL, CVPR
          - Preprints, arXiv practice, and scooping
          - Authorship and credit conversations
        check: "A reviewer misunderstood your method. Draft the first two sentences of the rebuttal."
        viz:
          type: flow
          steps:
          - Read the reviews
          - Sort by weight
          - Answer the load-bearing ones
          - Revise
      - name: The research interview
        why: "This is the round that decides research hires."
        beats:
          - >-
              Ten minutes on your own work. No slides needed if you know it.
          - >-
              Then defend one design choice under pressure. They are testing whether you know why you did it.
          - >-
              Name the weakest part yourself. Doing it first is worth more than being
              caught out.
          - >-
              Finish with what you would do next, and make it something their team would
              care about.
        plain:
          - >-
              The research round is a conversation about your own work. Ten minutes, no
              slides needed, then questions.
          - >-
              Expect two questions. What you would do with far more compute, and what the weakest part of your paper is. Have an honest answer to the second one.
        covers:
          - A ten-minute talk on your own work, no slides needed
          - Defending one design choice under pressure
          - "The 'what would you do with ten times the compute' question"
          - Naming the weakest part of your own paper
          - Proposing what you would work on in the first six months
          - Asking questions that show you read their work
        check: "Present your strongest paper in ten minutes, then answer why the main baseline is fair."
        viz:
          type: flow
          steps:
          - Ten-minute talk
          - Defend a choice
          - Name the weakness
          - Say what is next
    traps:
      - Under-tuning the baseline you are beating
      - Reporting a single seed as a result
      - Framing limitations as apologies rather than the next step
      - Proposing work that ignores the team's actual agenda
    drills:
      - Write a one-page proposal with a stated kill criterion
      - Re-run someone else's baseline until you match their number
      - Give your ten-minute talk to a non-specialist and time it
      - Review one paper properly and compare with the public reviews

  - id: prompt-engineering
    name: Prompt Engineering
    group: judgement
    blurb: "Whether you treat prompts as an engineering surface with tests, or as guesswork."
    scope: "Owns instruction design and measurement. Hands the loop and tools to agentic AI, and weight updates to LLM training."
    links: [agentic-ai, llm-training]
    modules:
      - name: The basics that still matter
        why: "Most production gains come from doing these carefully."
        beats:
          - >-
              Say what the task is. Most weak prompts fail here, long before the clever part.
          - >-
              Give the context needed and no more. Extra material dilutes what matters.
          - >-
              Add examples if the format is hard to describe. Two good ones beat ten
              mediocre.
          - >-
              State the output contract. Shape, length, and what to do when it cannot
              comply.
        plain:
          - >-
              Be specific about three things. The task, the reader, and the shape of the answer you want.
          - >-
              Telling the model what not to do works poorly. Describe the behaviour you
              want instead, because that is what it can follow.
        covers:
          - Clear instructions, task, audience, and output contract
          - Role and context setting, and when it does nothing
          - "Zero-shot, few-shot, and choosing examples"
          - "Where few-shot examples only fix the output format"
          - Delimiters and structure for long inputs
          - Ordering effects, recency and primacy
          - Negative instructions and why they underperform
          - Model-specific behaviour and prompt portability
        check: "Rewrite a vague instruction into a testable one, and say what you would measure."
        viz:
          type: flow
          steps:
          - Task
          - Context
          - Examples
          - Output contract
      - name: Reasoning
        why: "Folklore is thick here, so precision stands out."
        beats:
          - >-
              On problems with real steps, thinking through them first genuinely helps.
              Maths, planning, multi-hop questions.
          - >-
              On simple lookups it can hurt, and it always costs tokens and latency.
              Reasoning models already do this internally.
        plain:
          - >-
              Asking a model to work step by step helps on problems with real steps. It
              gives the model room to compute before answering.
          - >-
              On simple lookups it can hurt, and it always costs tokens and time.
              Reasoning models are trained for this already and need less prompting
              toward it.
        covers:
          - Chain of thought, and when it helps
          - Self-consistency and majority voting
          - Decomposition, least-to-most, plan then solve
          - Reasoning models and why they need different prompting
          - Reasoning that hurts on simple tasks
          - Faithfulness of stated reasoning
        check: "Name a task where chain of thought lowers accuracy, and explain why."
        viz:
          type: compare
          cols:
          - k: Reasoning helps
            items:
            - Multi-step maths
            - Planning
          - k: Reasoning hurts
            items:
            - Simple lookup
            - Tight latency budget
      - name: Context construction
        why: "Long context rewards careful budgeting of what you include."
        beats:
          - >-
              Too little context and the model fills the gaps by guessing.
          - >-
              Select carefully. Put what matters near the start or the end, since the
              middle gets used least.
          - >-
              Too much and the useful material is buried. Treat a long context as a budget you spend.
        scene:
          kind: tokens
          rows:
            - {k: Context, parts: [Instructions, Examples, Evidence, Question]}
          alt: "A context window holds instructions, examples, evidence, and a question."
        plain:
          - >-
              Treat a long context as a budget you spend. What you leave
              out matters as much as what you put in.
          - >-
              Material in the middle of a long prompt gets used least. Put important
              text near the start or end. Keep the opening stable for caching.
        covers:
          - System prompt design and stable structure
          - Where to place retrieved content and why
          - Lost in the middle, and mitigation
          - Context rot across long conversations
          - Token budgeting and compaction
          - Cache-friendly prompt layout, stable prefixes
        check: "You have 100k tokens of documents and a 32k budget. Describe your selection strategy."
        viz:
          type: scale
          lo: Nothing in context
          hi: Everything in context
          stops:
          - Too little
          - Selected
          - Too much
          'on': 1
      - name: Structured output
        why: "Every production integration needs this to be reliable."
        beats:
          - >-
              Define a schema. Now the output is something code can rely on.
          - >-
              Generate against it, ideally with constrained decoding so the shape cannot
              break.
          - >-
              Validate every response. Assume some fraction will be malformed.
          - >-
              Repair what you can and fail loudly on the rest. A silent parse failure is
              the worst outcome.
        plain:
          - >-
              Any prompt feeding a real system needs to return a predictable shape. A
              schema turns the output into something code can rely on.
          - >-
              Plan for the small fraction that comes back malformed. Validate, then
              repair, then fail loudly. Silent parsing failures are the worst outcome.
        covers:
          - JSON schema and typed output contracts
          - Constrained decoding and grammars
          - Tool and function schemas as prompts
          - Parsing, validation, and repair loops
          - Partial output and streaming considerations
          - Failure handling when the schema is violated
        check: "Your JSON output breaks 2% of the time. Give three fixes ordered by cost."
        viz:
          type: flow
          steps:
          - Schema
          - Generate
          - Validate
          - Repair
          loop: true
      - name: Measurement
        why: "Measurement is what makes this engineering."
        beats:
          - >-
              Write thirty examples before touching the prompt. This is the step that
              separates engineering from guessing.
          - >-
              Change one thing. Two changes and you learn nothing about either.
          - >-
              Compare on the whole set. The one example you happened to try proves nothing.
          - >-
              Keep or revert the change. Leave the test set in place for the next model
              upgrade.
        plain:
          - >-
              Without an evaluation set you are guessing. You will believe your last change helped, because you want it to.
          - >-
              Write thirty examples before touching the prompt. Change one thing at a
              time. Keep the set as a regression suite for the next model upgrade.
        covers:
          - Building the eval set before the prompt
          - Pairwise comparison and rubric grading
          - LLM-as-judge, its biases, and calibration against humans
          - Regression suites and prompt versioning
          - "Automatic prompt optimisation: Bayesian search, and reflective evolution over traces"
          - Statistical significance on small eval sets
        check: "How many examples do you need to tell two prompts apart, and how would you decide?"
        viz:
          type: flow
          steps:
          - Build the eval set
          - Change one thing
          - Compare
          - Keep or revert
          loop: true
      - name: Robustness
        why: "Prompting meets security here."
        beats:
          - >-
              Text you did not write ends up in the prompt. Retrieved documents, tool
              results, web pages.
          - >-
              Mark clearly where it begins. This helps a little and is not a defence.
          - >-
              Keep your instructions above it and assert they take priority. Also helps
              a little.
          - >-
              Limit what each tool can do. Then a successful prompt injection still
              cannot reach sensitive actions or data.
          - >-
              Then attack your own prompt. If you have not tried, you do not know.
        plain:
          - >-
              If your prompt includes text you did not write, that text can carry
              instructions. Retrieved documents and tool results both count.
          - >-
              Delimiters and telling the model to ignore instructions are weak defences.
              Adaptive attackers get past them, so limit what the system can do instead.
        covers:
          - Prompt injection through retrieved or tool content
          - Delimiter hygiene and untrusted-content marking
          - Why prompting defences lose to an adaptive attacker
          - Control flow and data flow kept apart outside the model
          - Instruction hierarchy and conflicting instructions
          - Jailbreak resistance and refusal tuning
          - Over-refusal and false positives
          - Behaviour change after a model upgrade
        check: "A retrieved document contains instructions. Give a defence that does not rely on the model refusing."
        viz:
          type: parts
          centre: Untrusted text arrives in the prompt
          around:
          - Mark where it starts
          - Keep instructions above it
          - Limit what the tools can do
          - Test with an injection
      - name: Choosing the right lever
        why: "Senior candidates are judged on knowing when to stop prompting."
        beats:
          - >-
              Prompting is the cheapest lever and the first to try.
          - >-
              Few-shot examples cost tokens on every call, forever.
          - >-
              Retrieval adds a system to maintain and fixes problems prompting cannot.
          - >-
              Fine-tuning changes the weights. Most expensive, most durable, and
              pointless if the real problem is your data.
        plain:
          - >-
              Prompting is one lever among several. Few-shot examples, retrieval,
              fine-tuning and an agent loop all sit on the same shelf.
          - >-
              Know when the prompt has hit its ceiling. A prompt cannot add missing
              knowledge or repair bad training data.
        covers:
          - Prompt versus few-shot versus retrieval versus fine-tune versus agent loop
          - Cost, latency and maintenance of each
          - When a prompt has hit its ceiling
          - When the problem is the data, not the prompt
          - Migration cost between models
          - Documenting a prompt as a product artefact
        check: "At what point do you stop iterating on a prompt and fine-tune instead?"
        viz:
          type: scale
          lo: Cheapest to change
          hi: Most expensive to change
          stops:
          - Prompt
          - Few-shot
          - Retrieval
          - Fine-tune
          'on': 0
    traps:
      - Claiming a prompt improvement with no eval set
      - Stacking instructions that contradict each other
      - Assuming a prompt transfers across model families
      - Calling a prompt injection defence robust after testing it on a fixed benchmark
      - Treating chain of thought as free accuracy
    drills:
      - Write 30 eval examples before touching the prompt
      - Run the same prompt on three model families and diff the failures
      - Build a regression suite that runs on every prompt edit
      - Attack your own prompt with injected instructions

  # ── Systems ──────────────────────────────────────────────────────────────
  - id: agentic-ai
    name: Agentic AI
    group: systems
    blurb: "Whether you can build a loop that finishes the task and stops when it should."
    scope: "Owns the agent loop, tools and evaluation. Hands instruction design to prompt engineering and permissioning to network and security."
    links: [prompt-engineering, network-and-security]
    modules:
      - name: The loop
        why: "Every agent framework is a variation on this, so know the primitive."
        beats:
          - >-
              Observe the current state. Whatever the agent can actually see.
          - >-
              Plan one action. Just one, because the world may not match the plan.
          - >-
              Act, against a real tool with real consequences.
          - >-
              Observe what came back, and go round again. The stopping rule matters as
              much as any of this.
        plain:
          - >-
              An agent is a loop. Look at the state, decide an action, take it, look
              again. Everything else is detail on top of that.
          - >-
              The stopping rule matters as much as the acting. Without a step budget, a
              confused agent will keep going and spend real money.
        covers:
          - Observe, plan, act, observe again
          - ReAct and interleaved reasoning
          - Plan-and-execute versus reactive stepping
          - Committing to a plan before reading untrusted content
          - Reflection and self-critique steps
          - Termination conditions and step budgets
          - Loop detection and progress checks
        check: "Write the pseudocode for a minimal tool-using agent, including its stopping rule."
        viz:
          type: flow
          steps:
          - Observe
          - Plan
          - Act
          - Observe the result
          loop: true
      - name: Tools
        why: "Most agent failures are tool failures."
        beats:
          - >-
              One tool call, and four things decide whether it works.
          - >-
              The schema, which the model reads as part of its prompt. Names and
              descriptions are prompt engineering.
          - >-
              The arguments it fills in. Ambiguous parameter names produce confidently
              wrong calls.
          - >-
              The error message when it fails. It must say what to do differently, or
              the agent repeats the mistake.
          - >-
              And the permission it needs, which should be the narrowest one that works.
        plain:
          - >-
              Tools are how the agent touches the world. The schema and the description
              are read as part of the prompt, so they are prompt engineering.
          - >-
              Most agent failures are tool failures. Start with clear tool names and
              descriptions. Error messages should say what to do next.
        covers:
          - Tool schema design and naming
          - Descriptions as prompts, and their effect on selection
          - Error messages the model can act on
          - Idempotency, retries, and side effects
          - Sandboxing and permission scopes
          - Model Context Protocol and tool servers
          - Tool count, overlap, and selection accuracy
        check: "The agent calls the wrong tool half the time. Give four changes before touching the model."
        viz:
          type: parts
          centre: One tool call
          around:
          - The schema it reads
          - The arguments it fills
          - The error it can act on
          - The permission it needs
      - name: Memory and context
        why: "Context is the binding constraint on any long task."
        beats:
          - >-
              The current step, always in full.
          - >-
              The last few steps, so it does not repeat itself.
          - >-
              A summary of everything before that, compressed and lossy.
          - >-
              And artefacts stored outside the context, fetched only when needed. Long
              tasks run out of room before they run out of steps.
        scene:
          kind: "growing"
          steps: 5
          tick: "step"
          cap: "Each step adds to the context. Long tasks run out of room before they run out of steps, which is why compaction decides how far an agent gets."
        plain:
          - >-
              Long tasks run out of context before they run out of steps. That is
              currently the binding constraint on agents.
          - >-
              So the agent has to decide what to keep, what to summarise and what to
              drop. Getting that wrong looks like forgetting a constraint halfway
              through.
        covers:
          - Short-term scratchpad versus persistent memory
          - Retrieval over past steps and artefacts
          - Summarisation and compaction strategies
          - Compaction trained with the task rather than bolted on
          - Running out of context before the task ends
          - State serialisation and resumption
          - Context budgeting across a long trajectory
          - Deciding what to forget
        check: "A task needs 300 steps and the context holds 30. Describe your memory design."
        viz:
          type: stack
          layers:
          - The current step
          - Recent steps
          - Summary of the run
          - Stored artefacts
      - name: Planning and control
        why: "Cost and reliability are decided here."
        beats:
          - >-
              The task is too long to hold in one pass. Three tools for that.
          - >-
              Decompose into pieces small enough to check individually.
          - >-
              Verify each piece before building on it, or an early error propagates the
              whole way.
          - >-
              Budget the run in tokens and wall-clock. Without a limit, a confused agent
              spends real money.
        plain:
          - >-
              Planning splits a large task into pieces small enough to check. Control
              decides how much time and money the whole thing may take.
          - >-
              Committing to a plan before reading untrusted content is also a security decision. Injected text cannot redefine a task already fixed.
        covers:
          - Task decomposition and subtask granularity
          - Orchestrator and worker patterns
          - Verifier loops and check steps
          - Budget control, token and wall-clock
          - Parallel versus sequential steps
          - Escalation to a human
        check: "How do you stop an agent that is confidently making no progress?"
        viz:
          type: tree
          root: The task is long
          branches:
          - k: Decompose
            items:
            - Subtasks
          - k: Verify
            items:
            - Check each step
          - k: Budget
            items:
            - Stop at a limit
      - name: Multi-agent systems
        why: "Popular, often unnecessary, and you should be able to say when."
        beats:
          - >-
              One agent with good tools. Simplest, cheapest, and the right answer more
              often than people expect.
          - >-
              Several agents with roles. Genuine parallelism, and you pay in
              coordination, duplicated work and failures spreading between them.
        plain:
          - >-
              Several agents can work at once, each with a role. Sometimes that helps.
              Often it adds coordination cost and duplicated work.
          - >-
              Be able to name a task where it wins and one where it loses. One agent
              with better tools beats a committee more often than people expect.
        covers:
          - Role specialisation and when it helps
          - Message passing and shared state
          - Debate and critic patterns
          - Coordination cost and duplicated work
          - Failure propagation across agents
          - When one agent with better tools wins
        check: "Give a task where multi-agent beats single-agent, and one where it clearly loses."
        viz:
          type: compare
          cols:
          - k: One agent
            items:
            - Simplest
            - No coordination cost
          - k: Many agents
            items:
            - Work in parallel
            - Coordination cost
            - Failures spread
      - name: Evaluation
        why: "Agent evaluation is harder than model evaluation and interviewers know it."
        beats:
          - >-
              Run the task and record the final score.
          - >-
              Then read the trajectory, because the final answer hides how it got there.
          - >-
              Find where it actually broke. Usually earlier than the step that failed.
          - >-
              Fix the cause.
          - >-
              Run it again, and keep the case as a regression test.
        plain:
          - >-
              A final answer hides the path an agent took. Agent tests must inspect that
              path too.
          - >-
              Benchmark scores can also be earned without doing the task. Read the
              trajectories, and ask how a score could be faked before trusting it.
        covers:
          - End-to-end task success rate
          - Trajectory analysis and partial credit
          - "Benchmarks: SWE-bench, WebArena, tau-bench, and their limits"
          - "Long-horizon computer-use evaluation, and how far agents get"
          - "Benchmarks an agent can score on without doing the task"
          - Rubric-based judging of process
          - Cost per solved task
          - Regression suites and flakiness
        check: "Your agent scores well on a public benchmark. How would you check it earned the score?"
        viz:
          type: flow
          steps:
          - Run the task
          - Read the trajectory
          - Find the break
          - Fix
          - Run again
          loop: true
      - name: Reliability and safety
        why: "Agents have privileges, which changes the risk profile."
        beats:
          - >-
              At the top, a person approving anything irreversible. Sending, paying,
              deleting.
          - >-
              Below that, an audit log good enough to replay what happened.
          - >-
              Below that, credentials scoped to the task rather than to you.
          - >-
              At the base, a sandbox. Injected instructions are only as dangerous as the
              permissions they inherit.
        plain:
          - >-
              An agent has permissions, which changes the risk. Text that arrives from a
              web page or a tool can try to redirect it.
          - >-
              The defence is structural. Limit each credential and keep untrusted data
              away from the plan. Require approval before permanent actions.
        covers:
          - Prompt injection through tool output and web content
          - Capabilities and information-flow control as an out-of-band defence
          - Attacks that hide the compromise from the final answer
          - Confused deputy and privilege escalation
          - Least privilege and scoped credentials
          - Human in the loop and approval gates
          - Audit logs and reproducing a trajectory
          - Rollback and irreversible actions
        check: "Your agent can send email and read the web. Name the attack and design the defence."
        viz:
          type: stack
          layers:
          - Approval for irreversible steps
          - Audit log
          - Scoped credentials
          - Sandbox
    traps:
      - Adding agents when the problem needed one better tool
      - No step budget, so failures cost real money
      - Evaluating on final answer only, with no trajectory view
      - Trusting an agent benchmark score without asking how it could be gamed
      - Giving broad credentials because scoping was inconvenient
      - Reading capability scores as evidence that an agent is safe to deploy
    drills:
      - Build a three-tool agent with no framework, then read one framework's source
      - Log every trajectory and read 20 failures by hand
      - Inject an instruction into a tool result and watch what happens
      - Try to score on one agent benchmark without solving its task
      - Measure cost per solved task, not just success rate

  - id: mlops
    name: MLOps
    group: systems
    blurb: "Whether the model still works in six months and someone other than you can fix it."
    scope: "Owns lifecycle, serving and monitoring. Hands pipeline internals to data engineering."
    links: [data-engineering, machine-learning]
    modules:
      - name: Lifecycle and reproducibility
        why: "Any production role assumes this."
        beats:
          - >-
              Frame the problem, and write down what would make you retire the model.
          - >-
              Train it, recording enough to rebuild this exact run later.
          - >-
              Register the artefact with its data, config and metrics attached.
          - >-
              Deploy behind something you can turn off.
          - >-
              Monitor, and expect this loop to run many times.
        plain:
          - >-
              A model in production is not an artefact, it is a process. Someone has to
              be able to rebuild any prediction months later.
          - >-
              That needs code, data, config and weights versioned together. A regulator
              asking about a decision from March is the test of whether you did.
        covers:
          - Problem framing to retirement, as one loop
          - Experiment tracking and run metadata
          - Versioning code, data, config, and model together
          - Model registry, stages, and promotion
          - Environment pinning and containers
          - Reproducing a six-month-old prediction
        check: "A regulator asks why the model made a decision last March. What do you need to answer?"
        viz:
          type: flow
          steps:
          - Frame
          - Train
          - Register
          - Deploy
          - Monitor
          loop: true
      - name: Data for ML systems
        why: "Training-serving skew is the classic production bug."
        beats:
          - >-
              Training uses a saved table of past data. Live predictions only know what
              has arrived so far.
          - >-
              At serving time you have one row and a latency budget. Those two rarely
              produce identical features, and that gap is the classic production bug.
        plain:
          - >-
              Training sees a whole table at once. Serving sees one row as the request
              arrives. Those two rarely produce the same features.
          - >-
              That gap is training-serving skew, and it is the classic production bug.
              Offline scores look strong and live performance does not follow.
        covers:
          - Feature stores, online and offline
          - Point-in-time correctness and time travel
          - Training-serving skew, causes and detection
          - Backfills and reprocessing
          - Data validation at the pipeline boundary
          - Label delay and feedback loops
        check: "Offline AUC is 0.85 and online performance is poor. List the skew sources you would check."
        viz:
          type: compare
          cols:
          - k: At training time
            items:
            - Features from history
            - Whole table at once
          - k: At serving time
            items:
            - Features as the request arrives
            - One row
      - name: Training infrastructure
        why: "Cost control is a real part of the job."
        beats:
          - >-
              Jobs queue, because GPUs are scarce and everyone wants them.
          - >-
              The scheduler places yours, possibly on a machine that can be taken back.
          - >-
              Training runs.
          - >-
              Checkpoint often enough to survive losing the machine.
          - >-
              Recover and continue. Without this, cheap instances cost more than they
              save.
        plain:
          - >-
              Training infrastructure is mostly about not wasting money. GPUs are
              expensive and queues are long.
          - >-
              Cheap machines can be taken away mid-run, so checkpoint often enough to
              survive that. Then track what each experiment actually cost.
        covers:
          - Containers and orchestration, Kubernetes basics
          - "Workflow tools: Airflow, Kubeflow, Ray, Metaflow"
          - GPU scheduling, queues, and sharing
          - Spot instances and checkpoint recovery
          - Distributed training operations
          - Cost attribution and budgets
        check: "Training costs tripled with no accuracy gain. Where do you look?"
        viz:
          type: flow
          steps:
          - Queue
          - Schedule
          - Train
          - Checkpoint
          - Recover
          loop: true
      - name: Serving
        why: "Latency and cost questions appear in almost every system round."
        beats:
          - >-
              Batch scoring is cheapest per prediction and the answer is hours old.
          - >-
              Micro-batching trades a little latency for much better hardware use.
          - >-
              Online scoring answers now and costs the most. Pick from what the product
              actually needs.
        plain:
          - >-
              Serving turns a model into a service with a latency budget. The tail
              matters more than the average, since the slowest requests are what users
              notice.
          - >-
              Cost comes down through smaller models, quantisation and caching, in that
              order of impact. Load test before promising a number.
        covers:
          - Batch, online, and streaming inference
          - Latency budgets, p50 versus p99
          - "Model servers: Triton, TorchServe, vLLM, TGI"
          - Autoscaling, cold starts, and warm pools
          - Quantisation, distillation, and caching for cost
          - Load testing and capacity planning
          - Multi-model serving and routing
        check: "You must serve a 7B model at 200ms p99 on a fixed budget. Walk through the design."
        viz:
          type: scale
          lo: Cheapest
          hi: Fastest to answer
          stops:
          - Batch
          - Micro-batch
          - Online
          'on': 2
      - name: Deployment strategy
        why: "Shipping without breaking things comes down to these five moves."
        beats:
          - >-
              Shadow first. Run the new model on live traffic and act on none of it.
          - >-
              Canary to a small slice, watching the guardrails as much as the target
              metric.
          - >-
              Roll out gradually.
          - >-
              And have the rollback tested before you need it. Deciding under pressure
              goes badly.
        scene:
          kind: split
          parts:
            - {k: Old model, w: 9}
            - {k: New model, w: 1, on: true}
          alt: "Most traffic stays on the old model during a small canary release."
        plain:
          - >-
              Never swap a model straight into production. Run it alongside the old one
              first and compare on real traffic without acting on it.
          - >-
              Then release to a small slice. Decide the rollback trigger before you
              start, because deciding under pressure goes badly.
        covers:
          - Shadow deployment and offline replay
          - Canary and progressive rollout
          - Blue-green and instant rollback
          - A/B testing a model change
          - Feature flags and kill switches
          - Rollback triggers defined in advance
        check: "Design the rollout plan for a model that touches revenue."
        viz:
          type: flow
          steps:
          - Shadow
          - Canary
          - Full rollout
          - Rollback ready
      - name: Monitoring
        why: "Monitoring decides whether you find out first or the customer does."
        beats:
          - >-
              Something changed, and where you look decides how fast you find it.
          - >-
              The inputs moved. This you can see today, with no labels needed.
          - >-
              The predictions moved. Also visible immediately, and often the first real
              signal.
          - >-
              The outcomes moved. The truth, and it arrives weeks late. So watch the
              first two.
        plain:
          - >-
              Monitoring decides whether you find the problem or the customer does.
              Inputs, predictions and outcomes all need watching.
          - >-
              Labels often arrive weeks late, so you cannot wait for accuracy. Watch the
              input distribution and the prediction mix as an early warning.
        covers:
          - Input drift, prediction drift, and performance decay
          - Monitoring with delayed or missing labels
          - Proxy metrics and guardrails
          - Alert design and avoiding fatigue
          - Service level objectives for ML systems
          - Incident response and postmortems
          - Automated retraining and its risks
        check: "Labels arrive 30 days late. How do you know today whether the model is broken?"
        viz:
          type: tree
          root: Something changed
          branches:
          - k: Inputs
            items:
            - Data drift
          - k: Outputs
            items:
            - Prediction drift
          - k: Outcome
            items:
            - Performance decay
      - name: Governance
        why: "More and more, a deployment will not go ahead without this."
        beats:
          - >-
              At the top, whoever signs off before this touches money or health.
          - >-
              Below that, documentation of what the model does and where it should not
              be used.
          - >-
              Below that, access control over the data and the artefact.
          - >-
              At the base, lineage from any prediction back to the data it learnt from.
        plain:
          - >-
              Governance is the paperwork that lets a model touch something that
              matters, like money or health.
          - >-
              You need lineage from a prediction back to its training data. You also need documented limits and a record of who approved the release.
        covers:
          - Lineage from prediction to training data
          - Model cards and documentation
          - Access control and PII handling
          - Audit trails and approval workflows
          - Fairness monitoring in production
          - Deprecation and model retirement
        check: "What documentation would you require before a model touches customer money?"
        viz:
          type: stack
          layers:
          - Approval
          - Documentation
          - Access control
          - Lineage
    traps:
      - Monitoring accuracy only, and only when labels arrive
      - Retraining automatically with no gate
      - Treating notebooks as a deployment artefact
      - Ignoring cost until finance asks
    drills:
      - Deploy one small model end to end, including rollback
      - Write the runbook for your own model failing at 2am
      - Simulate drift and confirm your monitor fires
      - Price your inference per thousand requests

  - id: data-engineering
    name: Data Engineering
    group: systems
    blurb: "Whether the numbers are right, arrive on time, and cost what you said they would."
    scope: "Owns storage, pipelines and streaming. Hands model lifecycle to MLOps."
    links: [mlops]
    modules:
      - name: Storage and file layout
        why: "Most query cost problems are layout problems."
        beats:
          - >-
              A row store keeps each record together. Good for writing and for fetching
              one whole record.
          - >-
              A column store keeps each field together. It reads only the fields you
              asked for, which is why analytics uses it.
        plain:
          - >-
              How data sits on disk decides what a query costs. Column storage reads
              only the fields you ask for, which is why analytics uses it.
          - >-
              Most expensive queries are layout problems. If a query scans two terabytes to return a hundred rows, partitioning is the fix. A bigger cluster only pays to scan it faster.
        covers:
          - OLTP versus OLAP workloads
          - Row versus columnar storage
          - "Formats: Parquet, ORC, Avro, and when each fits"
          - Partitioning, clustering, and small-file problems
          - Compression and encoding choices
          - "Table formats: Iceberg, Delta Lake, Hudi, and what they add"
          - Schema evolution
        check: "A query scans 2TB to return 100 rows. Give three layout changes and the expected effect."
        viz:
          type: compare
          cols:
          - k: Row store
            items:
            - Reads whole records
            - Suits writes
          - k: Column store
            items:
            - Reads a few columns
            - Suits scans
      - name: Data modelling
        why: "Analytics teams either trust your model or work around it."
        beats:
          - >-
              A fact table holds the events. Every design decision here follows from one
              choice.
          - >-
              The grain. What exactly does one row mean? Get this wrong and everything
              downstream works around you.
          - >-
              Dimensions give the context. Who, what, where.
          - >-
              Measures are the numbers you add up.
          - >-
              Keys join it all together, and they need to survive a source system
              renaming things.
        plain:
          - >-
              Modelling is deciding what one row means before anyone writes a query.
              That decision is called the grain.
          - >-
              Get it wrong and every analyst works around you with their own copy. Get
              it right and most questions become simple.
        covers:
          - Normalisation and denormalisation trade-offs
          - Star and snowflake schemas
          - Fact and dimension design, grain
          - Slowly changing dimensions, types 1 to 3
          - Wide tables and the one-big-table pattern
          - Semantic layers and metric definitions
        check: "Model an events dataset for a team that asks unpredictable questions. Defend the grain."
        viz:
          type: parts
          centre: Fact table
          around:
          - Grain
          - Dimensions
          - Measures
          - Keys
      - name: Batch processing
        why: "SQL and Spark are the two most commonly tested skills."
        beats:
          - >-
              Read the input, ideally only the columns and partitions you need.
          - >-
              Shuffle moves data between machines so matching keys meet. This is usually
              the expensive step.
          - >-
              Join. Broadcast the small side if you can, and watch for one key holding
              most of the rows.
          - >-
              Aggregate.
          - >-
              Write, in a way that is safe to run twice.
        plain:
          - >-
              Batch processing moves large amounts of data on a schedule. Spark spreads
              the work across machines and the slow part is usually the shuffle.
          - >-
              Skew is the usual culprit. One key may hold most rows. Then one machine
              works while the others wait.
        covers:
          - "SQL depth: window functions, CTEs, join strategies, anti-joins"
          - Query plans and reading them
          - "Spark: partitions, shuffle, broadcast joins, skew handling"
          - Adaptive query execution and caching
          - Incremental processing and idempotent writes
          - Cost tuning and cluster sizing
        check: "One Spark stage takes 90% of the runtime. Diagnose it."
        viz:
          type: flow
          steps:
          - Read
          - Shuffle
          - Join
          - Aggregate
          - Write
      - name: Streaming
        why: "Correctness gets subtle once events arrive out of order."
        beats:
          - >-
              The event happens at a real moment. That is its event time.
          - >-
              It arrives at your system later, sometimes much later, and out of order.
          - >-
              The watermark passes. That is you declaring how long you were willing to
              wait.
          - >-
              The window closes and emits its answer. Wait too little and you drop real
              data. Too long and nothing finalises.
        scene:
          kind: growing
          steps: 4
          tick: event
          cap: "State grows while late events arrive."
          alt: "A stream adds four events to a growing state."
        plain:
          - >-
              Streaming is where correctness gets subtle. Events arrive late, out of
              order, or twice, and the answer has to hold anyway.
          - >-
              A watermark is the system saying how long it will wait for stragglers. Set
              it too tight and you drop real data. Too loose and nothing ever finalises.
        covers:
          - "Kafka: topics, partitions, offsets, consumer groups, rebalancing"
          - Delivery semantics, at-least-once versus exactly-once
          - Event time versus processing time
          - Watermarks and late data
          - Windowing, tumbling, sliding, session
          - Stateful processing and checkpointing
          - Flink and Spark Structured Streaming differences
        check: "Events arrive an hour late. Explain what a watermark does to your aggregates."
        viz:
          type: flow
          steps:
          - The event happens
          - It arrives late
          - The watermark passes
          - The window closes
      - name: Orchestration and quality
        why: "Nobody notices the pipeline until it is wrong or late."
        beats:
          - >-
              Extract from the source, expecting it to change without telling you.
          - >-
              Validate at the boundary. Catching a bad schema here is far cheaper than
              three steps later.
          - >-
              Transform.
          - >-
              Test the output as well as the code. Row counts, nulls, ranges, freshness.
          - >-
              Publish. Everything downstream now assumes this was correct.
        plain:
          - >-
              Nobody notices a pipeline until it is wrong or late. Reliability is the
              actual product here.
          - >-
              Make every job safe to run twice. Backfills that double count are the most
              common way a rerun quietly corrupts a table.
        covers:
          - DAG design, dependencies, and retries
          - Idempotency and safe reruns
          - Backfills without double counting
          - "Data contracts and schema enforcement"
          - "Testing: dbt tests, Great Expectations, assertions"
          - Lineage and impact analysis
          - Freshness and volume alerting
        check: "A source changed a column type overnight. How does your pipeline behave, and how should it?"
        viz:
          type: flow
          steps:
          - Extract
          - Validate
          - Transform
          - Test
          - Publish
          loop: true
      - name: Architecture
        why: "Data roles run their system design round on this."
        beats:
          - >-
              At the top, tables shaped for how people actually query them.
          - >-
              Below that, curated tables with business logic applied once, in one place.
          - >-
              Below that, cleaned and typed data.
          - >-
              The base is the raw landing zone. Keep it unchanged so you can rebuild
              every later layer.
        plain:
          - >-
              The architecture question is how raw data becomes trusted tables. Layers
              help: land it raw, clean it, then shape it for use.
          - >-
              Each layer has an owner and a contract. Without that, a source changing a
              column type breaks something three steps downstream at 2am.
        covers:
          - Lakehouse and medallion layering
          - ETL versus ELT
          - Change data capture
          - Batch and streaming in one architecture
          - Warehouse selection and cost models
          - Governance, cataloguing, and access control
          - Build versus buy
        check: "Design ingestion for 50 sources with mixed freshness needs. State your assumptions first."
        viz:
          type: stack
          layers:
          - Serving tables
          - Curated tables
          - Cleaned tables
          - Raw landing
      - name: The system design round
        why: "It is a conversation about trade-offs."
        beats:
          - >-
              Ask the volume before drawing anything.
          - >-
              Ask how fresh it needs to be. Hourly and sub-second are different systems.
          - >-
              Ask the budget, because it rules out half the options.
          - >-
              Only now sketch the components.
          - >-
              Then name your own bottleneck, because the interviewer is going to look
              for it anyway.
        plain:
          - >-
              The system design round is a conversation about trade-offs.
          - >-
              Ask about volume, freshness and budget before drawing anything. Then name
              your bottleneck yourself, because the interviewer is going to look for it.
        covers:
          - Clarifying volume, velocity, latency, and budget
          - Stating assumptions out loud
          - Sketching components before details
          - Naming the bottleneck and the failure mode
          - Cost estimates with real numbers
          - What you would build first and what you would defer
        check: "Design a pipeline for 10TB a day with a one-hour freshness target. Talk through it in 30 minutes."
        viz:
          type: flow
          steps:
          - Ask the volume
          - Ask the latency
          - Ask the budget
          - Sketch it
          - Name the bottleneck
    traps:
      - Designing before asking about volume and latency
      - Ignoring small-file and skew problems
      - Claiming exactly-once with no idempotency story
      - Backfills that silently double count
    drills:
      - Write the same aggregation three ways and compare query plans
      - Break a Spark job with skew on purpose, then fix it
      - Run a Kafka consumer group and force a rebalance
      - Design one pipeline on paper, then price it

  - id: network-and-security
    name: Network and Security
    group: systems
    blurb: "Whether you can reason about an attacker who wants your model, your data, or your credentials."
    scope: "Owns networking, application security and ML-specific attacks. Hands agent permissioning to agentic AI."
    links: [agentic-ai]
    modules:
      - name: Networking
        why: "Every distributed system question sits on top of this."
        beats:
          - >-
              At the top, the application. HTTP, your API, the thing you wrote.
          - >-
              Below it, transport. TCP guarantees delivery and order, and pays in round
              trips.
          - >-
              Below that, the network layer moving packets between hosts.
          - >-
              At the base, the physical link. Most outages you will debug live somewhere
              in this stack.
        plain:
          - >-
              Every distributed system question sits on top of this. A request crosses
              several layers, and each one can fail in its own way.
          - >-
              Trace a URL to its first byte. Name DNS, the handshake and the proxies on the way. That covers most of what gets asked.
        covers:
          - OSI and TCP/IP layers
          - "TCP handshake, congestion control, and what a timeout means"
          - UDP and when it wins
          - DNS resolution and caching
          - "HTTP/1.1, HTTP/2, HTTP/3, keep-alive, head-of-line blocking"
          - "TLS handshake, certificates, chains, and pinning"
          - NAT, firewalls, load balancers, reverse proxies, CDNs
          - VPNs and private networking
        check: "Trace what happens from typing a URL to the first byte, and name where it can fail."
        viz:
          type: stack
          layers:
          - Application
          - Transport
          - Network
          - Link
      - name: Security foundations
        why: "Without this framing the rest of the track is just a list of attacks."
        beats:
          - >-
              A trust boundary is any line where data or requests change hands. Four
              questions at every one.
          - >-
              Who is asking. That is authentication.
          - >-
              What they are allowed to do. That is authorisation, and conflating the two
              is the classic mistake.
          - >-
              What crosses the line, and whether you validated it.
          - >-
              And what gets logged, because you cannot investigate what you did not
              record.
        plain:
          - >-
              Security starts with a threat model. Who might attack, what do they want,
              and where does trust change hands.
          - >-
              Authentication is who you are. Authorisation is what you may do. Mixing
              them up is the most common answer that loses points.
        covers:
          - Confidentiality, integrity, availability
          - "Threat modelling: STRIDE, attack trees, trust boundaries"
          - Least privilege and defence in depth
          - Authentication versus authorisation
          - "OAuth 2.0, OIDC, and JWT pitfalls"
          - Session management and token lifetimes
          - Secrets management and rotation
        check: "Draw the trust boundaries for an ML service that reads customer data."
        viz:
          type: parts
          centre: Trust boundary
          around:
          - Who is asking
          - What they may do
          - What crosses the line
          - What gets logged
      - name: Cryptography in practice
        why: "The goal is to avoid misusing it."
        beats:
          - >-
              Start from what you actually need. The tool follows from that.
          - >-
              Keeping content secret means encryption.
          - >-
              Knowing it was not altered means hashing and signatures. Hashing is not
              encryption.
          - >-
              Knowing who sent it means certificates and a chain you trust.
        plain:
          - >-
              The goal is not to invent cryptography. It is to avoid misusing it, which
              is where real systems break.
          - >-
              Hashing is not encryption. Passwords need a slow function and a unique
              salt. Fast hashes let attackers test guesses too quickly.
        covers:
          - Symmetric versus asymmetric encryption
          - Hashing versus encryption versus encoding
          - Password storage, salting, and key derivation functions
          - Digital signatures and certificate chains
          - Key management and PKI
          - Common misuse, ECB mode, reused nonces, homemade schemes
        check: "Explain why hashing a password with SHA-256 alone is not enough."
        viz:
          type: tree
          root: What do you actually need
          branches:
          - k: Secrecy
            items:
            - Encryption
          - k: Integrity
            items:
            - Hashing
            - Signatures
          - k: Identity
            items:
            - Certificates
      - name: Application security
        why: "These are the attacks you will meet."
        beats:
          - >-
              Input arrives from outside. Treat all of it as hostile, including from
              your own front end.
          - >-
              Validate it against what you expect, rather than against a list of bad
              things.
          - >-
              Encode on the way out, for the context it lands in. This is what stops
              cross-site scripting.
          - >-
              Give the service only the access it needs. Then a bug can reach less of
              the system.
        scene:
          kind: boundary
          input: Untrusted input
          gate: Validate
          app: Small access area
          alt: "Untrusted input crosses validation before reaching a limited service."
        plain:
          - >-
              These are the attacks you actually meet. Most come from trusting input
              that came from outside.
          - >-
              If your service fetches a URL a user supplied, it can be pointed at your
              internal network. That one catches cloud systems often.
        covers:
          - "OWASP Top 10, current edition"
          - Injection, SQL and command
          - Cross-site scripting and content security policy
          - Cross-site request forgery
          - Server-side request forgery, and why it hurts cloud systems
          - Insecure deserialisation
          - Dependency and supply chain risk, SBOMs
        check: "Your service fetches a user-supplied URL. Name the risk and the mitigation."
        viz:
          type: flow
          steps:
          - Untrusted input
          - Validate
          - Encode on output
          - Least privilege
      - name: Infrastructure and cloud
        why: "Most real breaches happen here now."
        beats:
          - >-
              A credential scoped to one resource. If it leaks, the damage is bounded.
          - >-
              Scoped to one service. Broader, and still recoverable.
          - >-
              Scoped to the whole account. This is how most real cloud breaches actually
              go.
        plain:
          - >-
              Most real breaches now come from configuration rather than clever
              exploits. A leaked key or an over-broad role does it.
          - >-
              Assume a credential will leak. Scope it narrowly, rotate it, and be able
              to tell what it touched.
        covers:
          - IAM policies, roles, and privilege escalation paths
          - Network segmentation and security groups
          - Container isolation and escape risks
          - Secrets in images, environment variables, and logs
          - Logging, SIEM, and detection
          - Incident response phases
        check: "An access key leaked in a public repository. Walk through the first hour."
        viz:
          type: scale
          lo: Narrow access
          hi: Broad access
          stops:
          - One resource
          - One service
          - The whole account
          'on': 0
      - name: Machine learning security
        why: "Few candidates can speak to both sides of this."
        beats:
          - >-
              In machine learning the model itself is a target, in four distinct ways.
          - >-
              Poisoned training data, which plants behaviour you never asked for.
          - >-
              Stolen weights, either copied directly or reconstructed from enough
              queries.
          - >-
              Extracted training examples, which is a privacy breach hiding inside a
              model.
          - >-
              And injected instructions at inference time, which is the one you will
              meet most often.
        plain:
          - >-
              Machine learning adds its own attack surface. The model, the training data
              and the weights are all targets.
          - >-
              Repeated queries can help steal a copy of the model. They may also expose
              who was in the training data. An untrusted checkpoint can run code.
        covers:
          - Training data poisoning and backdoors
          - Model extraction and stealing
          - Membership inference and memorisation
          - Adversarial examples and evasion
          - Prompt injection, direct and indirect
          - Tool abuse and confused deputy in agents
          - Unsafe model artefacts, pickle files, arbitrary code on load
        check: "Someone can query your model 100k times. What can they learn, and how do you limit it?"
        viz:
          type: parts
          centre: The model is the target
          around:
          - Poisoned training data
          - Stolen weights
          - Extracted training examples
          - Injected instructions
      - name: Privacy
        why: "Compliance constrains what you are allowed to build."
        beats:
          - >-
              Raw personal data. Maximum utility, maximum obligation.
          - >-
              Pseudonymised. Identifiers replaced, and re-identification is often easier
              than people assume.
          - >-
              Aggregated. Safer, and individuals can still be exposed by small groups.
          - >-
              Differentially private, which gives a real mathematical guarantee and
              costs accuracy to get it.
        plain:
          - >-
              Privacy constrains what you are allowed to build, before any question of
              what works.
          - >-
              A deletion request is the awkward one. The data is in the training set. The model already learnt from it. Have a real answer ready.
        covers:
          - PII, sensitive categories, and data minimisation
          - GDPR concepts, lawful basis, and the right to erasure
          - Anonymisation versus pseudonymisation
          - Differential privacy basics and the privacy budget
          - Federated learning and its assumptions
          - Data residency and cross-border transfer
        check: "A user requests deletion and their data is in a trained model. What do you actually do?"
        viz:
          type: scale
          lo: Identifiable
          hi: Protected
          stops:
          - Raw personal data
          - Pseudonymised
          - Aggregated
          - Differentially private
          'on': 3
    traps:
      - Confusing authentication with authorisation
      - Trusting client-side validation
      - Loading a model checkpoint from an untrusted source
      - Treating differential privacy as automatic anonymity
    drills:
      - Capture a TLS handshake in Wireshark and name each message
      - Threat model one of your own services on paper
      - Run a dependency audit on a real project and triage the findings
      - Write the prompt injection that would break your own agent
