# Interview revision syllabi — /interview/ and one page per topic.
# Hand-written. House style applies: British spelling, short sentences, no em dashes.
#
# Each topic renders twice:
#   - as a card on the /interview/ hub (name, blurb, slug, modules count)
#   - as its own page at /<slug>/ via _layouts/syllabus.html
#
# Field contract per topic:
#   id       slug and permalink, must be unique across the whole site
#   name     display title
#   group    hub grouping key: foundations | models | systems | judgement
#   blurb    one sentence, what an interview on this actually tests
#   scope    what this track owns, and what it hands to a neighbouring track
#   modules  ordered study units. Each has name, why, covers[], check
#   links    other topic ids this one hands work to; the hub map draws these
#   traps    mistakes that cost points in a live interview
#   drills   things to do with your hands, never things to read
#
# `check` is the question you should be able to answer cold, no notes.
#
# Every module carries a `viz:` block that js/components/interview.js turns into
# a diagram at the top of that module. Eight archetypes:
#
#   flow     ordered stages, `loop: true` closes the cycle
#   compare  two or three columns of contrasting items
#   stack    layers, last entry is the base
#   matrix   two by two; `cells` reads top-left, top-right, bottom-left, bottom-right
#   scale    a spectrum with labelled stops, `on` marks one
#   parts    a centre with labelled parts around it
#   tree     a root question with branches
#   curve    SVG axes with two curves; `shape` is u, diverge, diag or rise
#
# Labels are lifted from that module's own covers, why or check. A diagram
# restates the module. It never adds a claim, and it carries no numbers.

topics:
  # ── Foundations ──────────────────────────────────────────────────────────
  - id: bayesian-statistics
    name: Bayesian Statistics
    group: foundations
    blurb: "Whether you can reason about a parameter you never get to observe."
    scope: "Owns priors, posteriors, and how you compute them. Hands calibration and coverage guarantees to uncertainty quantification."
    links: [uncertainty-quantification]
    modules:
      - name: Probability as belief
        why: "Every later answer rests on whether you can say what a probability refers to."
        covers:
          - Sample space, events, conditional probability
          - "Bayes rule: prior, likelihood, evidence, posterior"
          - Joint, marginal and conditional distributions
          - Exchangeability and what de Finetti's theorem buys you
          - The likelihood principle and where it bites
          - Credible interval versus confidence interval
        check: "A test is 99% accurate and the disease affects 1 in 10,000. Give the posterior and explain the number to a non-statistician."
        viz:
          type: flow
          steps:
          - Prior belief
          - Observe data
          - Posterior belief
          loop: true
      - name: Priors and what they encode
        why: "Interviewers probe priors to find out if you understand assumptions or just run a library."
        covers:
          - "Conjugate families: Beta-Binomial, Normal-Normal, Dirichlet-Multinomial, Gamma-Poisson"
          - Weakly informative priors and why they beat flat ones
          - Jeffreys priors and invariance
          - Improper priors and when the posterior still exists
          - Prior predictive checks
          - Prior sensitivity analysis
        check: "Your prior is Beta(1,1) and you see 3 heads in 3 flips. Give the posterior mean and say why it is not 1."
        viz:
          type: scale
          lo: Says little
          hi: Says a lot
          stops:
          - Flat
          - Weakly informative
          - Strongly informative
          'on': 1
      - name: Computing the posterior
        why: "The whole field is applied only because these algorithms work."
        covers:
          - Grid approximation and where it dies
          - Laplace approximation
          - "Metropolis-Hastings: proposal, acceptance ratio, tuning"
          - Gibbs sampling and full conditionals
          - "Hamiltonian Monte Carlo: leapfrog, step size, trajectory length"
          - NUTS and why it removed a tuning parameter
          - "Variational inference: ELBO, mean-field, reparameterisation trick"
          - "Diagnostics: R-hat, effective sample size, divergent transitions, trace plots"
        check: "Why does random-walk Metropolis scale badly with dimension, and what does HMC do differently?"
        viz:
          type: tree
          root: Getting the posterior
          branches:
          - k: Exact
            items:
            - Conjugate update
            - Grid over a small space
          - k: Sampling
            items:
            - Metropolis
            - Gibbs
            - Hamiltonian Monte Carlo
          - k: Approximate
            items:
            - Laplace
            - Variational inference
      - name: Hierarchical models
        why: "Partial pooling is the single most useful Bayesian idea in applied work."
        covers:
          - Complete pooling, no pooling, partial pooling
          - Shrinkage and borrowing strength
          - Group-level and varying-slope models
          - Neal's funnel and the non-centred parameterisation
          - Hyperpriors on scale parameters
          - When a hierarchy helps and when it hides structure
        check: "Explain shrinkage in the eight-schools problem to a product manager in three sentences."
        viz:
          type: scale
          lo: Every group alone
          hi: All groups identical
          stops:
          - No pooling
          - Partial pooling
          - Complete pooling
          'on': 1
      - name: Checking and comparing models
        why: "Anyone can fit a model. The interview is about whether you would trust it."
        covers:
          - Posterior predictive checks and test quantities
          - "WAIC and LOO-CV, plus the Pareto-k diagnostic"
          - Bayes factors, marginal likelihood, and their sensitivity to priors
          - Model averaging and stacking
          - Calibration of posterior intervals
          - Prior-data conflict
        check: "When would you refuse to report a Bayes factor, and what would you report instead?"
        viz:
          type: flow
          steps:
          - Fit
          - Posterior predictive check
          - Leave-one-out
          - Compare
          loop: true
      - name: Bayesian methods inside machine learning
        why: "This is where the track meets the rest of your CV."
        covers:
          - Bayesian linear and logistic regression
          - "Gaussian processes: kernels, marginal likelihood, scaling limits"
          - "Bayesian optimisation: EI, UCB, Thompson sampling"
          - Bayesian neural networks and why they are hard
          - Laplace approximation over weights, last-layer Bayes
          - Deep ensembles as a cheap approximation
        check: "Why does a deep ensemble often beat mean-field variational inference on calibration?"
        viz:
          type: compare
          cols:
          - k: Gaussian process
            items:
            - Kernel sets the shape
            - Scales badly with data
          - k: Bayesian neural net
            items:
            - Posterior over weights
            - Hard to compute
          - k: Deep ensemble
            items:
            - Several full fits
            - Cheap approximation
    traps:
      - Describing a credible interval with confidence-interval language
      - Reporting MCMC results with no convergence diagnostics
      - Claiming Bayesian methods are automatically calibrated
      - Choosing a conjugate prior for convenience and never saying so
    drills:
      - Derive the Beta-Binomial posterior on paper, no lookup
      - Write Metropolis-Hastings in under 30 lines of NumPy
      - Fit eight schools in both parameterisations and compare divergences
      - Explain R-hat to a rubber duck in 60 seconds

  - id: frequentist-statistics
    name: Frequentist Statistics
    group: foundations
    blurb: "Whether your conclusions survive someone asking how you would be wrong."
    scope: "Owns estimators, testing, experiment design and causal identification. Hands posterior belief to Bayesian statistics."
    links: [bayesian-statistics, machine-learning]
    modules:
      - name: Estimators and their properties
        why: "The vocabulary every other answer is built from."
        covers:
          - Bias, variance, mean squared error, consistency
          - Efficiency and the Cramér-Rao bound
          - Sufficiency and the factorisation theorem
          - "Maximum likelihood: score, Fisher information, asymptotic normality"
          - Method of moments
          - Regularised estimators and the bias-variance trade
        check: "Show the MLE of the variance is biased, then argue why people still use it."
        viz:
          type: matrix
          x:
          - Low variance
          - High variance
          "y":
          - Low bias
          - High bias
          cells:
          - Efficient estimate
          - Noisy but centred
          - Systematically off
          - Off and unstable
      - name: Sampling distributions and intervals
        why: "Half of applied statistics is putting an honest error bar on a number."
        covers:
          - Law of large numbers, central limit theorem, and their conditions
          - Delta method for functions of estimates
          - "Standard errors: analytic, sandwich, clustered"
          - t, chi-square and F distributions
          - Confidence interval as a procedure with long-run coverage
          - "Bootstrap: percentile, basic, BCa, and where it fails"
        check: "Define a 95% confidence interval without saying anything about this particular interval."
        viz:
          type: flow
          steps:
          - Population
          - Sample
          - Estimate
          - Sampling distribution
          - Interval
      - name: Hypothesis testing
        why: "The most common place candidates say something technically false."
        covers:
          - Null and alternative, type I and type II error
          - Power, minimum detectable effect, sample size
          - "The p-value: definition, and the four things it is not"
          - Neyman-Pearson framing versus Fisher framing
          - Likelihood ratio, Wald and score tests
          - Non-parametric tests and when to reach for them
        check: "Define a p-value in one sentence, then say what a non-significant result does and does not license."
        viz:
          type: matrix
          x:
          - Null is true
          - Null is false
          "y":
          - Reject
          - Do not reject
          cells:
          - Type I error
          - Correct rejection
          - Correct
          - Type II error
      - name: Multiple comparisons and researcher freedom
        why: "Anywhere you run many models, this decides whether the result is real."
        covers:
          - Family-wise error rate, Bonferroni, Holm, Šidák
          - False discovery rate and Benjamini-Hochberg
          - Garden of forking paths, p-hacking, HARKing
          - Pre-registration and analysis plans
          - Peeking, sequential testing, alpha spending
          - Always-valid inference and confidence sequences
        check: "You ran 40 metrics on one experiment and two are significant. What do you tell the product team?"
        viz:
          type: scale
          lo: Every test stands alone
          hi: Every test corrected
          stops:
          - No correction
          - False discovery rate
          - Family-wise error
          'on': 1
      - name: Experiment design and A/B testing
        why: "The applied-scientist version of this track, asked at almost every company."
        covers:
          - Randomisation unit, SUTVA, interference and network effects
          - Sample size, MDE, and duration planning
          - "Variance reduction: CUPED, stratification, covariate adjustment"
          - Ratio metrics and the delta method
          - Novelty and primacy effects
          - Switchback and cluster-randomised designs
          - Guardrail metrics and overall evaluation criteria
        check: "Your treatment lifts clicks and drops revenue per session. Walk through what you check before deciding."
        viz:
          type: flow
          steps:
          - Randomise
          - Run
          - Measure
          - Decide
          loop: true
      - name: Causal inference
        why: "The gap between correlation and a decision is where senior candidates separate."
        covers:
          - Potential outcomes, ATE, ATT, CATE
          - DAGs, backdoor and frontdoor criteria, colliders
          - Confounding, selection bias, Simpson's paradox
          - Propensity scores, matching, weighting, overlap
          - Instrumental variables and exclusion restriction
          - Difference in differences and parallel trends
          - Regression discontinuity
          - Sensitivity analysis for unmeasured confounding
        check: "You cannot randomise. Give three designs and state the assumption each one leans on."
        viz:
          type: tree
          root: You cannot randomise
          branches:
          - k: Close the backdoor
            items:
            - Matching
            - Propensity weighting
          - k: Find an instrument
            items:
            - Exclusion restriction
          - k: Use time or a cutoff
            items:
            - Difference in differences
            - Regression discontinuity
      - name: Regression in practice
        why: "Still the default tool when someone needs an answer this afternoon."
        covers:
          - OLS assumptions and what breaks under each violation
          - Heteroskedasticity, robust and clustered standard errors
          - Multicollinearity and variance inflation
          - "Generalised linear models: link functions, dispersion, offsets"
          - Residual diagnostics and influence measures
          - Interpreting coefficients under transformation
        check: "Your standard errors halved after you switched from clustered to classical. Which do you trust and why?"
        viz:
          type: stack
          layers:
          - What you claim
          - Standard errors
          - Model form
          - Assumptions
    traps:
      - "Saying a p-value is the probability the null is true"
      - Treating a non-significant result as evidence of no effect
      - Stopping an experiment the day it turns significant
      - Reporting i.i.d. standard errors on clustered or repeated-measure data
    drills:
      - Simulate 10,000 experiments and confirm your interval covers 95% of the time
      - Compute a required sample size from a stated MDE by hand
      - Bootstrap a median and compare with the analytic approximation
      - Draw the DAG for a confounded product metric before touching data

  - id: machine-learning
    name: Machine Learning
    group: foundations
    blurb: "Whether you can turn a vague business problem into a model somebody can ship."
    scope: "Owns classical models, evaluation and the case-study round. Hands network training to deep learning."
    links: [deep-learning]
    modules:
      - name: Framing the problem
        why: "Most failed ML projects failed here, and interviewers know it."
        covers:
          - Supervised, unsupervised, self-supervised, reinforcement
          - Choosing a target, and target leakage
          - Loss function versus business metric
          - Offline metric versus online outcome
          - Baselines you must beat before modelling
          - Deciding when machine learning is the wrong tool
        check: "A team wants to predict churn. What do you ask before writing any code?"
        viz:
          type: flow
          steps:
          - Business question
          - Target
          - Loss
          - Baseline
          - Decision
      - name: The core model families
        why: "Boosted trees still win a lot of tabular problems, and you will be asked why."
        covers:
          - Linear and logistic regression, regularisation, elastic net
          - Decision trees, splitting criteria, pruning
          - Bagging, random forests, feature importance and its flaws
          - "Gradient boosting: XGBoost, LightGBM, CatBoost, and the differences"
          - Support vector machines and the kernel trick
          - k-nearest neighbours, naive Bayes
          - "Unsupervised: k-means, DBSCAN, hierarchical, GMM"
          - "Dimensionality reduction: PCA, t-SNE, UMAP"
        check: "Tabular data, 100k rows, mixed types, missing values. Pick a model and defend it in 90 seconds."
        viz:
          type: tree
          root: Tabular problem
          branches:
          - k: Linear
            items:
            - Regression
            - Regularisation
          - k: Trees
            items:
            - Random forest
            - Gradient boosting
          - k: Distance
            items:
            - Nearest neighbours
            - Support vector machine
      - name: Evaluation you can defend
        why: "The fastest way to fail an interview is a leaky validation split."
        covers:
          - Train, validation, test discipline
          - "Cross-validation: k-fold, stratified, grouped, nested"
          - Time-series splits and forward chaining
          - Leakage sources, including preprocessing before the split
          - "Metrics: precision, recall, F1, ROC-AUC, PR-AUC, log loss"
          - Threshold selection under asymmetric costs
          - Calibration and why AUC ignores it
        check: "When is PR-AUC the right metric and ROC-AUC misleading?"
        viz:
          type: flow
          steps:
          - Split first
          - Fit on train
          - Tune on validation
          - Report on test
      - name: Features
        why: "On tabular problems this moves the number more than the model choice."
        covers:
          - Categorical encoding, target encoding and its leakage
          - Scaling, binning, transformations
          - Missing-value strategies and missingness as a signal
          - Interaction and ratio features
          - Feature selection, permutation importance, SHAP
          - Monotonic constraints for regulated settings
        check: "Explain how target encoding leaks and how you would do it safely."
        viz:
          type: compare
          cols:
          - k: Fit inside the fold
            items:
            - Scalers
            - Encoders
            - Target encoding
          - k: Fit on everything
            items:
            - Test set leaks in
            - Score looks better than it is
      - name: Imbalance and shift
        why: "The two conditions almost every real dataset has."
        covers:
          - Class weights, resampling, SMOTE, focal loss
          - Why resampling breaks calibration
          - Covariate shift, label shift, concept drift
          - Importance weighting
          - Drift detection and monitoring
          - Retraining triggers
        check: "You have 0.1% positives. Give your approach and say what you would sacrifice."
        viz:
          type: tree
          root: The score dropped
          branches:
          - k: Covariate shift
            items:
            - Inputs moved
          - k: Label shift
            items:
            - Base rate moved
          - k: Concept drift
            items:
            - The relationship moved
      - name: Enough theory to hold a conversation
        why: "Research-flavoured roles will probe one level below the API."
        covers:
          - Bias-variance decomposition
          - Overfitting, underfitting, capacity, regularisation
          - Generalisation bounds at an intuitive level
          - Curse of dimensionality
          - No free lunch
          - Double descent and the overparameterised regime
        check: "Why does a model with more parameters than data points sometimes generalise well?"
        viz:
          type: curve
          shape: u
          x: Model capacity
          "y": Error
          a: Training error
          b: Test error
      - name: The case study round
        why: "An hour-long open question is standard for applied roles."
        covers:
          - Clarifying scope, users, constraints, and success criteria
          - Data availability and labelling cost
          - Baseline, v1, and what you would ship in a week
          - Serving constraints, latency, cost
          - Monitoring and the failure plan
          - How you would know the model made things worse
        check: "Design fraud detection for a payments company. Twenty minutes, whiteboard, no code."
        viz:
          type: flow
          steps:
          - Clarify
          - Baseline
          - Model
          - Ship
          - Monitor
          loop: true
    traps:
      - Reaching for a neural network on 5,000 rows of tabular data
      - Fitting the scaler before the split
      - Optimising AUC when the product needs a calibrated probability
      - Naming models without connecting any of them to the stated constraint
    drills:
      - Rebuild logistic regression with gradient descent from scratch
      - Take one Kaggle tabular set and beat your own baseline three ways
      - Write the leakage checklist you would run before every submission
      - Practise a 20-minute case study out loud, timed

  - id: deep-learning
    name: Deep Learning
    group: foundations
    blurb: "Whether you can make a network train, and explain it when it does not."
    scope: "Owns optimisation, architecture and scale. Hands the attention block to transformers and post-training to LLM training."
    links: [transformers, llm-training]
    modules:
      - name: Optimisation
        why: "Almost every training failure traces back to something in this module."
        covers:
          - Gradient descent, stochastic gradient descent, mini-batching
          - Momentum, Nesterov, RMSProp
          - "Adam and AdamW, and why decoupled weight decay matters"
          - "Learning rate schedules: warmup, cosine, linear decay, restarts"
          - Gradient clipping and loss scaling
          - Batch size, learning rate scaling rules, critical batch size
          - Sharpness, flat minima, and what the evidence actually shows
        check: "Why does Adam with L2 penalty behave differently from AdamW?"
        viz:
          type: parts
          centre: One update step
          around:
          - Gradient
          - Learning rate
          - Momentum
          - Weight decay
      - name: Initialisation and normalisation
        why: "The parts people copy without understanding, then cannot debug."
        covers:
          - Xavier and He initialisation, and the variance argument
          - Batch normalisation, train versus eval behaviour
          - Layer norm, RMSNorm, group norm
          - Why batch norm fails at small batch size and in distributed settings
          - Residual connections and gradient flow
          - Pre-norm versus post-norm placement
        check: "You moved from batch size 256 to 8 and training collapsed. Name the likely cause."
        viz:
          type: compare
          cols:
          - k: Batch norm
            items:
            - Normalises across the batch
            - Breaks at small batch
          - k: Layer norm
            items:
            - Normalises across features
            - Batch size does not matter
          - k: RMSNorm
            items:
            - Drops the mean term
            - Cheaper
      - name: Regularisation and generalisation
        why: "Interviewers use this to test whether you know the modern picture."
        covers:
          - Dropout, and why it is rarer in large models
          - Weight decay, early stopping, label smoothing
          - Data augmentation, mixup, cutmix
          - Implicit regularisation from SGD
          - Double descent
          - Memorisation versus generalisation
        check: "Your model hits zero training loss and validation is still improving. What is happening?"
        viz:
          type: scale
          lo: Too little capacity used
          hi: Too much capacity used
          stops:
          - Underfits
          - Fits
          - Memorises
          'on': 1
      - name: Backpropagation and memory
        why: "Anyone touching large models is expected to reason about memory."
        covers:
          - Chain rule on a computational graph, reverse-mode autodiff
          - What is stored for the backward pass
          - Activation checkpointing, compute versus memory
          - Vanishing and exploding gradients
          - Straight-through estimators and non-differentiable ops
          - Optimiser state memory cost
        check: "Estimate the memory needed to train a 7B model in bf16 with Adam. Show the terms."
        viz:
          type: flow
          steps:
          - Forward pass
          - Store activations
          - Backward pass
          - Free the memory
          loop: true
      - name: Architectures and when each fits
        why: "You need a reason for the choice you made."
        covers:
          - MLPs, and what they cannot do cheaply
          - "CNNs: locality, weight sharing, translation equivariance"
          - "RNNs and LSTMs: sequence memory, gating, the long-range problem"
          - Transformers as the general-purpose default
          - Graph neural networks and message passing
          - Autoencoders, VAEs, diffusion, GANs
        check: "Give three tasks where a convolutional network still beats a transformer, with the reason."
        viz:
          type: tree
          root: What shape is the input
          branches:
          - k: Grid
            items:
            - Convolutional network
          - k: Sequence
            items:
            - Recurrent network
            - Transformer
          - k: Graph
            items:
            - Message passing
      - name: Training at scale
        why: "The line between a research engineer and a hobbyist."
        covers:
          - "Parallelism: data, tensor, pipeline, sequence, expert"
          - ZeRO stages and FSDP
          - "Mixed precision: fp16, bf16, fp8, and loss scaling"
          - Gradient accumulation and effective batch size
          - Communication overlap, NCCL, interconnect limits
          - Model FLOPs utilisation and how to raise it
        check: "Explain the difference between tensor parallelism and pipeline parallelism, and the cost of each."
        viz:
          type: stack
          layers:
          - Expert parallel
          - Pipeline parallel
          - Tensor parallel
          - Data parallel
      - name: Debugging
        why: "A favourite question because it separates readers from practitioners."
        covers:
          - Overfit a single batch first
          - Expected loss at initialisation
          - Gradient and activation norm tracking
          - Learning-rate range test
          - Seed variance and how many runs you need
          - Finding NaNs and where they come from
          - Data pipeline bugs that look like model bugs
        check: "Loss goes to NaN at step 3,000. Give your ordered debugging plan."
        viz:
          type: flow
          steps:
          - Overfit one batch
          - Check the loss at init
          - Watch gradient norms
          - Vary the seed
    traps:
      - Blaming the architecture before checking the data loader
      - Comparing runs that differ in more than one thing
      - Quoting a single seed as a result
      - Explaining batch norm as fixing internal covariate shift with no caveat
    drills:
      - Write backprop for a two-layer MLP by hand, then check against autograd
      - Overfit 32 examples to zero loss on a fresh codebase before every project
      - Profile one training step and find where the time goes
      - Reproduce a paper's training curve at small scale

  # ── Models ───────────────────────────────────────────────────────────────
  - id: transformers
    name: Transformers
    group: models
    blurb: "Whether you know the architecture at the level of shapes and memory."
    scope: "Owns the architecture and its inference behaviour. Hands the training recipe to LLM training and internals to mechanistic interpretability."
    links: [llm-training, mechanistic-interpretability]
    modules:
      - name: Attention mechanics
        why: "You will be asked to write it, and shapes are where people stumble."
        covers:
          - Queries, keys, values, and what each one is for
          - "Scaled dot product, and why the scale is 1/sqrt(d_k)"
          - Softmax, temperature, attention entropy
          - Multi-head attention, head dimension, concatenation and output projection
          - Causal masking, padding masks, attention bias
          - "Complexity: O(T^2 d) time, O(T^2) attention memory"
          - The KV cache and its size formula
        check: "Write every tensor shape in a multi-head attention forward pass for batch B, length T, heads H, model dim D."
        viz:
          type: flow
          steps:
          - Project to Q, K, V
          - Score
          - Mask
          - Softmax
          - Weighted sum
      - name: Block anatomy
        why: "Parameter counting and residual reasoning come up constantly."
        covers:
          - The residual stream as a shared communication channel
          - Pre-LN versus post-LN, and why pre-LN trains more easily
          - LayerNorm and RMSNorm
          - "Feed-forward block: expansion ratio, GeLU, SwiGLU"
          - Embedding and unembedding, weight tying
          - Counting parameters for a given config
        check: "Given d_model, n_layers and an FFN ratio of 4, derive the parameter count."
        viz:
          type: parts
          centre: Residual stream
          around:
          - Embedding writes into it
          - Attention reads and writes
          - Feed-forward reads and writes
          - Unembedding reads it
      - name: Position
        why: "Long-context questions all route through this."
        covers:
          - Sinusoidal and learned absolute positions
          - Relative position bias
          - "RoPE: rotation, frequency bands, why it composes with attention"
          - ALiBi and linear biases
          - Length extrapolation, position interpolation, NTK scaling, YaRN
          - What happens with no positional encoding at all
        check: "Explain RoPE well enough that someone could implement it, then say how you extend context fourfold."
        viz:
          type: compare
          cols:
          - k: RoPE
            items:
            - Rotates queries and keys
            - Extends by interpolation
          - k: ALiBi
            items:
            - Bias grows with distance
            - Extrapolates
          - k: Learned
            items:
            - One vector per slot
            - Fixed length
      - name: Efficient attention and long context
        why: "The practical half of every serving conversation."
        covers:
          - "FlashAttention: tiling, online softmax, IO-awareness, exactness"
          - "Multi-query and grouped-query attention: cache savings and quality cost"
          - Sliding window and local attention
          - Sparse and block-sparse patterns
          - Linear attention and kernel approximations
          - State-space models and Mamba as an alternative
          - PagedAttention and memory fragmentation
        check: "Why is FlashAttention faster when it does the same arithmetic?"
        viz:
          type: compare
          cols:
          - k: FlashAttention
            items:
            - Same arithmetic
            - Fewer memory reads
          - k: Grouped-query
            items:
            - Fewer key and value heads
            - Smaller cache
          - k: Sliding window
            items:
            - Local context only
            - Linear in length
      - name: The model family
        why: "Choosing the right variant is a design decision you have to justify."
        covers:
          - "Encoder-only: BERT, masked language modelling, when it still wins"
          - "Decoder-only: GPT family, causal language modelling"
          - "Encoder-decoder: T5, BART, and cross-attention"
          - "Mixture of experts: routing, top-k, load balancing loss, capacity factor"
          - Vision transformers and patch embedding
          - Hybrid and sparse designs
        check: "For a classification task with 50k labelled examples, would you fine-tune an encoder or prompt a decoder?"
        viz:
          type: tree
          root: Which variant
          branches:
          - k: Encoder-only
            items:
            - Classification
            - BERT
          - k: Decoder-only
            items:
            - Generation
            - GPT
          - k: Encoder-decoder
            items:
            - Translation
            - T5
      - name: Inference
        why: "Deployment questions are now standard even in research interviews."
        covers:
          - Prefill versus decode, and why they have different bottlenecks
          - Compute-bound versus memory-bandwidth-bound
          - Continuous batching and scheduling
          - "Sampling: greedy, temperature, top-k, top-p, min-p, beam search"
          - Speculative decoding and draft models
          - "Quantisation: int8, int4, GPTQ, AWQ, and quality loss"
          - Throughput versus latency versus cost
        check: "Decode is slow and the GPU is at 20% utilisation. Explain why and what you change."
        viz:
          type: compare
          cols:
          - k: Prefill
            items:
            - Whole prompt at once
            - Compute bound
          - k: Decode
            items:
            - One token at a time
            - Memory bandwidth bound
    traps:
      - Saying attention is quadratic without saying in what
      - Calling FlashAttention an approximation
      - Confusing d_model with head dimension
      - Forgetting the KV cache when estimating serving memory
    drills:
      - Implement attention from scratch in NumPy, then match PyTorch output
      - Compute KV cache size for a real config at 32k context
      - Read one production inference server's scheduler code
      - Explain the full forward pass out loud in five minutes

  - id: llm-training
    name: LLM Training
    group: models
    blurb: "Whether you could take a base model to a useful assistant and know what each step buys."
    scope: "Owns data, pretraining, and post-training. Hands the architecture to transformers and behaviour risk to AI safety."
    links: [ai-safety, prompt-engineering]
    modules:
      - name: Data
        why: "The part with the largest effect and the least glamour."
        covers:
          - Sources, licensing, and the web-crawl reality
          - "Deduplication: exact, MinHash, suffix arrays, and its effect on loss"
          - Quality filtering, classifier-based selection, perplexity filters
          - Benchmark decontamination
          - "Tokenizer training: BPE, WordPiece, SentencePiece, byte fallback"
          - Vocabulary size trade-offs and multilingual fertility
          - Mixture weights, upsampling, and data curricula
        check: "Your model does well on a benchmark and badly in production. How do you test for contamination?"
        viz:
          type: flow
          steps:
          - Crawl
          - Deduplicate
          - Filter
          - Decontaminate
          - Tokenise
      - name: Pretraining
        why: "Even if you never run one, you must reason about the budget."
        covers:
          - Next-token prediction and the loss it optimises
          - "Scaling laws: Kaplan, Chinchilla, and the token-to-parameter ratio"
          - Compute budget arithmetic, 6ND, and hardware hours
          - Batch size schedules and learning-rate transfer
          - Loss spikes, divergence, and rollback strategy
          - Checkpointing and fault tolerance at scale
          - Data ordering and late-stage annealing
        check: "You have a fixed compute budget. Derive the model size and token count you would choose."
        viz:
          type: curve
          shape: diverge
          x: Tokens seen
          "y": Loss
          a: Small model
          b: Large model
      - name: Supervised fine-tuning
        why: "The cheapest lever, and the one you will most likely own."
        covers:
          - Instruction data, sources, and quality over quantity
          - Chat templates and special tokens
          - Loss masking on prompt tokens
          - Packing versus padding
          - "Parameter-efficient methods: LoRA, QLoRA, DoRA, adapters, prefix tuning"
          - Catastrophic forgetting and replay
          - Hyperparameters that actually matter here
        check: "Why mask the loss on prompt tokens, and what changes if you do not?"
        viz:
          type: compare
          cols:
          - k: Full fine-tune
            items:
            - Every weight moves
            - Most memory
          - k: LoRA
            items:
            - Low-rank update
            - Small adapter
          - k: QLoRA
            items:
            - Quantised base model
            - Least memory
      - name: Learning from preferences
        why: "The step that turns a capable model into a usable one."
        covers:
          - "Reward modelling: pairwise data, Bradley-Terry, reward model overfitting"
          - "PPO for RLHF: policy, value head, advantage, KL penalty to the reference"
          - Reward hacking and over-optimisation
          - "DPO and the direct-alignment family: IPO, KTO, ORPO, SimPO"
          - Rejection sampling and best-of-n
          - RLAIF and constitutional feedback
          - Alignment tax, and where it shows up
        check: "Compare DPO and PPO on data needs, stability, and what each one gives up."
        viz:
          type: flow
          steps:
          - Collect pairs
          - Train a reward model
          - Optimise the policy
          - Hold it near the reference
          loop: true
      - name: Reasoning and verifiable rewards
        why: "The most active area, so expect a current-work question."
        covers:
          - Chain-of-thought supervision versus emergent reasoning
          - Reinforcement learning from verifiable rewards
          - "GRPO and group-relative advantages"
          - Process reward models versus outcome reward models
          - Test-time compute, self-consistency, search
          - Distillation from a stronger teacher
          - Reward design for tasks with no checker
        check: "You can verify maths answers automatically. Describe the training loop and its failure modes."
        viz:
          type: flow
          steps:
          - Sample answers
          - Verify
          - Reward the correct ones
          - Update
      - name: Evaluation across a run
        why: "Training is only as good as the signal you steer by."
        covers:
          - Held-out loss versus downstream benchmarks
          - Benchmark saturation and contamination
          - "LLM-as-judge: position bias, verbosity bias, self-preference"
          - Pairwise human evaluation and arenas
          - Regression suites and per-capability tracking
          - Safety and refusal evaluations alongside capability
        check: "Your new checkpoint wins on the judge and loses with humans. What do you check first?"
        viz:
          type: tree
          root: Did it improve
          branches:
          - k: Automatic
            items:
            - Held-out loss
            - Benchmarks
          - k: Judge
            items:
            - Model as judge
            - Rubrics
          - k: Human
            items:
            - Pairwise preference
            - Arena
    traps:
      - Quoting Chinchilla ratios with no mention of inference cost
      - Treating DPO as strictly better than PPO
      - Reporting benchmark gains with no contamination check
      - Ignoring that safety training and capability training interact
    drills:
      - Fine-tune a small open model with LoRA end to end, including the chat template
      - Train a reward model on a public preference set and inspect its errors
      - Run DPO on the same data and compare behaviour, not just the score
      - Build a 50-example private eval set you trust more than any benchmark

  - id: nlp
    name: Natural Language Processing
    group: models
    blurb: "Whether you understand language as data, including the languages that break your pipeline."
    scope: "Owns text tasks, metrics, retrieval and multilingual work. Hands model internals to transformers."
    links: [transformers, multimodality]
    modules:
      - name: Text as data
        why: "Every unicode and tokenisation bug you will ever ship starts here."
        covers:
          - "Tokenisation: word, subword, byte, character"
          - Normalisation, casing, unicode forms, whitespace
          - Morphology, agglutination, and why fertility differs by language
          - Segmentation for languages with no spaces
          - Handling emoji, code, and mixed scripts
          - Truncation and its silent damage
        check: "Why does the same sentence cost three times more tokens in one language than another, and what does that break?"
        viz:
          type: flow
          steps:
          - Raw text
          - Normalise
          - Segment
          - Tokenise
          - Ids
      - name: Representations
        why: "Retrieval systems live or die on this."
        covers:
          - "Count-based: bag of words, TF-IDF, n-grams"
          - "Static embeddings: word2vec, GloVe, fastText"
          - Contextual embeddings and what changed
          - Sentence embeddings and pooling strategies
          - Similarity measures and normalisation
          - Embedding dimensionality, quantisation, and index cost
        check: "When is TF-IDF still the right answer over a neural embedding?"
        viz:
          type: scale
          lo: Counts words
          hi: Reads context
          stops:
          - TF-IDF
          - Static embeddings
          - Contextual embeddings
          'on': 2
      - name: Core tasks
        why: "The shared vocabulary of the field."
        covers:
          - Classification, multi-label, and hierarchical labels
          - "Sequence labelling: NER, POS, chunking, BIO tagging"
          - Parsing, dependency and constituency
          - Coreference resolution
          - Question answering, extractive and generative
          - Summarisation, abstractive and extractive
          - Machine translation
        check: "Design an NER system for a domain with no labelled data. Give three options ordered by cost."
        viz:
          type: tree
          root: What shape is the output
          branches:
          - k: A label for the text
            items:
            - Classification
          - k: A label per token
            items:
            - Named entities
            - Part of speech
          - k: New text
            items:
            - Summarisation
            - Translation
      - name: Measuring language output
        why: "Bad metric choice is the most common NLP interview mistake."
        covers:
          - Accuracy, precision, recall, macro versus micro F1
          - "Generation metrics: BLEU, ROUGE, METEOR, chrF"
          - "Learned metrics: BERTScore, COMET, BLEURT"
          - Perplexity and its limits across tokenizers
          - Human evaluation design and agreement
          - Task-specific evaluation over generic scores
        check: "Why can BLEU rank a good translation below a bad one, and what would you use instead?"
        viz:
          type: compare
          cols:
          - k: Overlap
            items:
            - BLEU
            - ROUGE
            - chrF
          - k: Learned
            items:
            - BERTScore
            - COMET
          - k: Human
            items:
            - Ratings
            - Pairwise
      - name: The retrieval pipeline
        why: "Almost every applied NLP role now includes this."
        covers:
          - Chunking strategies and boundary effects
          - Embedding model choice and domain fit
          - "Vector search: HNSW, IVF, recall versus latency"
          - Hybrid search with BM25
          - Reranking with cross-encoders
          - Query rewriting and expansion
          - "Evaluating retrieval separately from generation"
        check: "Your RAG answers are wrong. Describe how you decide whether retrieval or generation is at fault."
        viz:
          type: flow
          steps:
          - Chunk
          - Embed
          - Search
          - Rerank
          - Generate
      - name: Multilingual and low-resource
        why: "Your own research area, so expect depth questions."
        covers:
          - Cross-lingual transfer and shared subword space
          - Tokenizer fairness and cost asymmetry
          - Script, dialect, register, and code-switching
          - Translation as augmentation, and translationese
          - Benchmark coverage gaps and cultural grounding
          - Evaluation when no native speaker is on the team
        check: "How would you tell whether a model is worse in Indonesian because of data or because of tokenisation?"
        viz:
          type: parts
          centre: Why it is worse in this language
          around:
          - Tokenizer cost
          - Training data volume
          - Script and code-switching
          - Benchmark coverage
      - name: Data and annotation
        why: "The unglamorous work that decides project outcomes."
        covers:
          - Annotation guidelines and pilot rounds
          - "Agreement: Cohen's kappa, Krippendorff's alpha"
          - Label noise and adjudication
          - Active learning and sampling strategy
          - Synthetic data and its distribution gaps
          - Dataset documentation and licence hygiene
        check: "Two annotators agree 70% of the time. What do you do before collecting more data?"
        viz:
          type: flow
          steps:
          - Guidelines
          - Pilot
          - Measure agreement
          - Adjudicate
          - Scale
          loop: true
    traps:
      - Reporting micro-F1 on an imbalanced multi-class problem with no macro figure
      - Comparing perplexity across models with different tokenizers
      - Treating English results as evidence for a multilingual claim
      - Evaluating RAG end to end with no retrieval metric
    drills:
      - Tokenise the same paragraph in five languages and compare token counts
      - Build a BM25 plus embedding hybrid retriever and measure recall at k
      - Annotate 50 examples yourself before writing any guidelines
      - Break one generation metric on purpose and explain the failure

  - id: computer-vision
    name: Computer Vision
    group: models
    blurb: "Whether you can move from pixels to a decision, and know where the evaluation lies to you."
    scope: "Owns image and video tasks and their evaluation. Hands cross-modal alignment to multimodality."
    links: [multimodality]
    modules:
      - name: Image fundamentals
        why: "The arithmetic that every later architecture question assumes."
        covers:
          - Colour spaces, bit depth, channel order
          - Filtering, edges, histograms
          - "Convolution arithmetic: kernel, stride, padding, dilation"
          - Output size formulas and receptive field growth
          - Pooling, upsampling, transposed convolution, aliasing
          - Resizing, interpolation, and the artefacts each introduces
        check: "Given a stack of convolutions, compute the receptive field and the output resolution."
        viz:
          type: flow
          steps:
          - Pixels
          - Convolve
          - Stride and pad
          - Pool
          - Feature map
      - name: Backbones
        why: "You need to explain a design choice, not recite a leaderboard."
        covers:
          - LeNet, AlexNet, VGG, and what each one settled
          - "ResNet: residuals, bottlenecks, and depth"
          - Inception, DenseNet, MobileNet, depthwise separable convolutions
          - EfficientNet and compound scaling
          - "Vision transformers: patches, class token, inductive bias"
          - ConvNeXt and the convergence of designs
          - Choosing a backbone under a latency budget
        check: "Why do residual connections let you train a 100-layer network?"
        viz:
          type: stack
          layers:
          - Task head
          - Object parts
          - Textures
          - Edges
      - name: Tasks and their metrics
        why: "Detection and segmentation metrics are where candidates get vague."
        covers:
          - Classification, top-1, top-5, and label noise
          - "Detection: anchors, anchor-free, NMS, IoU, mAP at thresholds"
          - Two-stage versus one-stage detectors, DETR-style set prediction
          - "Segmentation: semantic, instance, panoptic, mIoU, Dice, boundary F1"
          - Keypoints, pose, and tracking metrics
          - Depth and geometry tasks
        check: "Explain mAP@[.5:.95] precisely, then say what it hides."
        viz:
          type: tree
          root: What do you need back
          branches:
          - k: The whole image
            items:
            - Classification
          - k: Boxes
            items:
            - Detection
            - Mean average precision
          - k: Pixels
            items:
            - Segmentation
            - Intersection over union
      - name: Training practice
        why: "Vision has its own recipe knowledge."
        covers:
          - "Augmentation: geometric, photometric, mixup, cutmix, RandAugment"
          - When augmentation hurts, especially in medical and remote sensing
          - Transfer learning, freezing, and layer-wise learning rates
          - Class imbalance in dense prediction
          - "Losses: cross-entropy, focal, Dice, Tversky, IoU losses"
          - Resolution versus batch size versus memory
          - Test-time augmentation and ensembling
        check: "Your segmentation model has high IoU and misses every thin structure. Name the likely cause."
        viz:
          type: compare
          cols:
          - k: Augmentation helps
            items:
            - More viewpoints
            - Colour and lighting
          - k: Augmentation hurts
            items:
            - Flipping medical laterality
            - Rotating text
      - name: Modern vision
        why: "Expect at least one question about the last three years."
        covers:
          - "Self-supervised learning: SimCLR, MoCo, BYOL, DINO, MAE"
          - "CLIP-style open-vocabulary recognition"
          - Segment Anything and promptable segmentation
          - Diffusion models for generation and editing
          - NeRF and Gaussian splatting at a conceptual level
          - Video understanding and temporal modelling
        check: "Explain how DINO learns useful features with no labels."
        viz:
          type: tree
          root: No labels at all
          branches:
          - k: Contrastive
            items:
            - SimCLR
            - MoCo
          - k: Self-distillation
            items:
            - DINO
          - k: Masked
            items:
            - Masked autoencoder
      - name: Deployment
        why: "Vision is the area most often pushed to edge hardware."
        covers:
          - Inference cost, FLOPs versus latency
          - ONNX, TensorRT, quantisation, pruning, distillation
          - Edge constraints, memory, thermal limits
          - Tiling large images and stitching predictions
          - "Remote sensing specifics: multispectral bands, geo-referencing, tile edges, cloud masks"
          - Batch versus stream processing
        check: "You must run segmentation on 10,000 by 10,000 pixel scenes. Describe the pipeline."
        viz:
          type: flow
          steps:
          - Train
          - Export
          - Quantise
          - Tile
          - Serve
      - name: Evaluation traps
        why: "Where an honest candidate earns trust fast."
        covers:
          - Near-duplicate leakage across splits, especially video frames
          - Spatial autocorrelation in geospatial splits
          - Domain gaps between sensors, seasons, and regions
          - Long-tail classes hidden by averaged metrics
          - Annotation error dominating the reported gap
          - Shortcut features, backgrounds, and watermarks
        check: "Your geospatial model scores 0.9 IoU on a random split and 0.6 on a regional split. Explain."
        viz:
          type: parts
          centre: The score looks too good
          around:
          - Near-duplicate frames
          - Same scene in both splits
          - Background shortcut
          - Annotation error
    traps:
      - Random splits on tiles from the same scene
      - Reporting mAP with no per-class breakdown
      - Applying flip augmentation to text or medical laterality
      - Quoting FLOPs as if it predicted latency
    drills:
      - Compute output shapes and receptive fields for a network by hand
      - Implement IoU and non-maximum suppression from scratch
      - Build a geographically blocked split and compare with a random one
      - Profile a model on the actual target device, not your laptop

  - id: multimodality
    name: Multimodality
