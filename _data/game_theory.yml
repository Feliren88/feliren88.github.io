# Game theory — /game-theory/
# Consumed by _pages/game-theory.md and js/components/game-theory.js.
#
# The `solved:` block on each game is GENERATED by scripts/solve_games.py.
# Do not hand-edit it. Change `payoffs` and re-run the script instead, so
# the stated equilibria always follow from the numbers actually shown.
#
# payoffs[row][col] = [row player payoff, column player payoff]

games:
  - id: prisoners-dilemma
    name: "Prisoner's Dilemma"
    life: "Trust with someone you may not deal with again"
    icon: gt-g-prisoners
    rows: ["Cooperate", "Defect"]
    cols: ["Cooperate", "Defect"]
    payoffs: [[[3, 3], [0, 5]], [[5, 0], [1, 1]]]
    reading: "Defecting pays more whatever the other player does. Both defect and receive 1, though mutual cooperation would give each player 3."
    move: "Make the relationship repeat. When the future matters enough, conditional cooperation becomes rational."
    solved:
      pure: [[1, 1]]
      mixed: null
      dominant_row: 1
      dominant_col: 1
      pareto: [[0, 0], [0, 1], [1, 0]]
      zero_sum: false

  - id: stag-hunt
    name: "Stag Hunt"
    life: "Cofounders, marriage, any ambitious joint bet"
    icon: gt-g-stag
    rows: ["Stag", "Hare"]
    cols: ["Stag", "Hare"]
    payoffs: [[[4, 4], [0, 3]], [[3, 0], [2, 2]]]
    reading: "Hunting stag pays more when both commit. Hare pays less but remains safe when the other person wavers. Doubt drives this game."
    move: "Buy assurance before you commit. Evidence that they will show up is worth more than a better offer."
    solved:
      pure: [[0, 0], [1, 1]]
      mixed: {"row": [0.6666666666666666, 0.3333333333333333], "col": [0.6666666666666666, 0.3333333333333333]}
      dominant_row: null
      dominant_col: null
      pareto: [[0, 0]]
      zero_sum: false

  - id: chicken
    name: "Chicken"
    life: "Ego standoffs, brinkmanship, who blinks first"
    icon: gt-g-chicken
    rows: ["Swerve", "Straight"]
    cols: ["Swerve", "Straight"]
    payoffs: [[[3, 3], [2, 4]], [[4, 2], [0, 0]]]
    reading: "Two equilibria, and in each one somebody swerves. The crash is worst for both, which is exactly why the threat works."
    move: "Build a face-saving exit for them. Cornering someone in Chicken raises your odds of the crash."
    solved:
      pure: [[0, 1], [1, 0]]
      mixed: {"row": [0.6666666666666666, 0.3333333333333333], "col": [0.6666666666666666, 0.3333333333333333]}
      dominant_row: null
      dominant_col: null
      pareto: [[0, 0], [0, 1], [1, 0]]
      zero_sum: false

  - id: trust-game
    name: "Trust Game"
    life: "Delegation, lending, early intimacy"
    icon: gt-g-trust
    rows: ["Send", "Hold"]
    cols: ["Return", "Keep"]
    payoffs: [[[3, 3], [0, 5]], [[1, 1], [1, 1]]]
    reading: "Sending creates value only if it comes back. Backward induction says they keep, so you never send, and the surplus is never made."
    move: "Send a small amount first. Escalate on evidence, not on how trustworthy they sound."
    solved:
      pure: [[1, 1]]
      mixed: null
      dominant_row: null
      dominant_col: null
      pareto: [[0, 0], [0, 1]]
      zero_sum: false

  - id: public-goods
    name: "Public Goods"
    life: "Housework, team effort, anything everyone benefits from"
    icon: gt-g-public
    rows: ["Contribute", "Free-ride"]
    cols: ["Contribute", "Free-ride"]
    payoffs: [[[3, 3], [1, 4]], [[4, 1], [2, 2]]]
    reading: "Everyone wants the shared good and would prefer someone else to fund it. Free-riding dominates, so the good stays underfunded."
    move: "Make each contribution visible. People often free-ride on work they cannot see."
    solved:
      pure: [[1, 1]]
      mixed: null
      dominant_row: 1
      dominant_col: 1
      pareto: [[0, 0], [0, 1], [1, 0]]
      zero_sum: false

  - id: battle-of-sexes
    name: "Coordination"
    life: "Two good options, and being together beats being right"
    icon: gt-g-coordination
    rows: ["Option A", "Option B"]
    cols: ["Option A", "Option B"]
    payoffs: [[[3, 2], [0, 0]], [[0, 0], [2, 3]]]
    reading: "You each prefer a different option, but a mismatch pays nobody. Both matching outcomes are stable."
    move: "Agree a focal point in advance, or alternate. Arguing over which is better wastes the surplus you are arguing about."
    solved:
      pure: [[0, 0], [1, 1]]
      mixed: {"row": [0.6, 0.4], "col": [0.4, 0.6]}
      dominant_row: null
      dominant_col: null
      pareto: [[0, 0], [1, 1]]
      zero_sum: false

  - id: matching-pennies
    name: "Matching Pennies"
    life: "Genuinely adversarial: bluffing, bidding, tactical surprise"
    icon: gt-g-pennies
    rows: ["Heads", "Tails"]
    cols: ["Heads", "Tails"]
    payoffs: [[[1, -1], [-1, 1]], [[-1, 1], [1, -1]]]
    reading: "No pure equilibrium exists. Any pattern you settle into can be exploited, so stable play requires unpredictability."
    move: "Reserve zero-sum tactics for genuinely adversarial games. Applied elsewhere, they burn value both sides could have kept."
    solved:
      pure: []
      mixed: {"row": [0.5, 0.5], "col": [0.5, 0.5]}
      dominant_row: null
      dominant_col: null
      pareto: [[0, 0], [0, 1], [1, 0], [1, 1]]
      zero_sum: true

  - id: principal-agent
    name: "Principal-Agent"
    life: "Managing, delegating, hiring anyone whose effort you cannot see"
    icon: gt-g-agent
    rows: ["Monitor", "Trust"]
    cols: ["Work", "Shirk"]
    payoffs: [[[2, 2], [1, 0]], [[4, 3], [0, 4]]]
    reading: "Monitoring is costly and can damage trust. Without it, hidden effort invites shirking. The problem begins with poor visibility."
    move: "Make the outcome observable and reward it directly. Better evidence reduces the need to police behaviour."
    solved:
      pure: []
      mixed: {"row": [0.3333333333333333, 0.6666666666666666], "col": [0.3333333333333333, 0.6666666666666666]}
      dominant_row: null
      dominant_col: null
      pareto: [[1, 0], [1, 1]]
      zero_sum: false

levers:
  - key: "Players"
    icon: gt-players
    ask: "Who is at the table, and who could be?"
    example: "A bad cofounder is rarely a negotiation problem. It is a casting problem."

  - key: "Payoffs"
    icon: gt-payoffs
    ask: "What is each person rewarded for?"
    example: "If comp rewards beating colleagues, no amount of asking for collaboration will produce it."

  - key: "Information"
    icon: gt-information
    ask: "Who knows what, and what stays hidden?"
    example: "Mistrust often means low observability. Make the work visible before appealing to good faith."

  - key: "Sequence"
    icon: gt-sequence
    ask: "Who moves first, and can that change?"
    example: "Split one irreversible commitment into stages and each stage buys information for the next."

  - key: "Rules"
    icon: gt-rules
    ask: "Which constraints are real, and which come from habit?"
    example: "Constant interruptions point to a bad protocol. Change the protocol so you stop absorbing the cost."

  - key: "Arena"
    icon: gt-arena
    ask: "Is this the right place to be playing at all?"
    example: "In a commodity market everyone competes on price. Differentiate, or find a market where you are scarce."

  - key: "Exit"
    icon: gt-exit
    ask: "What happens if you walk, and how good is that?"
    example: "Your bargaining power is set before the negotiation by how survivable no-deal is."

laws:
  - n: 1
    icon: gt-l-survival
    law: "Survival precedes optimisation"
    why: "Nothing compounds after ruin. Expected value stops being the right measure once a loss ends your ability to keep playing."

  - n: 2
    icon: gt-repeat
    law: "Most human games repeat"
    why: "The same people come back. That is what makes reputation an asset and betrayal expensive."

  - n: 3
    icon: gt-l-positive
    law: "Most valuable games are positive-sum"
    why: "Treating a joint problem as a contest destroys the surplus you were both there to create."

  - n: 4
    icon: gt-l-zero
    law: "Some games really are zero-sum"
    why: "One promotion, one contract, one auction. Misreading these as cooperative is its own kind of loss."

  - n: 5
    icon: gt-l-response
    law: "Include the response"
    why: "Evaluate a decision after everyone else has replied to it."

  - n: 6
    icon: gt-rules
    law: "Change the game before playing harder"
    why: "Effort inside a badly structured game is the most expensive way to lose."

  - n: 7
    icon: gt-information
    law: "Information has option value"
    why: "Under uncertainty, a cheap experiment is usually worth more than a confident decision."

  - n: 8
    icon: gt-l-escalate
    law: "Escalate commitment with evidence"
    why: "Small bet, then evidence, then large bet. Reversing that order is how people lose big."

  - n: 9
    icon: gt-sunk
    law: "Sunk cost has no vote"
    why: "What you already spent is a fact about the past. Only future costs and benefits are decidable."

  - n: 10
    icon: gt-exit
    law: "Improve your outside option first"
    why: "Bargaining power is built before the conversation, by making no-deal survivable."

  - n: 11
    icon: gt-l-reputation
    law: "Reputation compounds and decays asymmetrically"
    why: "It takes years to build and one transaction to spend. Price it accordingly."

  - n: 12
    icon: gt-l-incentives
    law: "Incentives beat intentions"
    why: "When the stated goal and the reward structure disagree, the reward structure wins."

  - n: 13
    icon: gt-l-agency
    law: "Avoid success that costs you agency"
    why: "A well-paid role you cannot leave is a trap that looks like an achievement."

  - n: 14
    icon: gt-l-trajectory
    law: "Optimise the trajectory"
    why: "Ask whether today's choice improves the sequence of states that follows."

  - n: 15
    icon: gt-l-choose
    law: "Choose games carefully"
    why: "Strong players spend less of their life in games where winning means nothing."

