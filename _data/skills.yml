# Technical skills, rendered on /cv.
#
# This mirrors the "Technical skills" section of the CV Vicky actually sends, group
# for group and item for item. It is the single source for skills on the site: the
# tiered `tech_stack` cloud that used to sit on the homepage was a second, shorter
# and drifting list, and was removed rather than kept in sync by hand.
#
# `items` is deliberately one plain string per group rather than a list. These are a
# cluster to be read, not a set of chips to be scanned, and prose keeps the reading
# order the CV chose. `id` is what the filter on /cv matches against.
#
# Every entry starts with a capital, which is the one place this departs from the CV:
# the CV runs them as sentence-case prose, and on screen each cluster reads as a list
# of named skills instead. `vLLM` and `dbt` are lowercase on purpose and must stay
# that way when syncing from the CV.

- id: safety
  group: 'AI safety & reliability'
  items: 'Conformal prediction, Uncertainty quantification, Selective prediction / abstention, Calibration, Distribution-shift robustness, Linear probing, Activation steering, Red-teaming, LLM/VLM evaluation, SHAP'

- id: deep-learning
  group: 'Deep learning & multimodal AI'
  items: 'PyTorch, TensorFlow, Vision-Language Models, Diffusion models (SDXL), Knowledge distillation, PEFT, DeepSpeed'

- id: generative
  group: 'Generative AI & LLMOps'
  items: 'LangChain, LangGraph, RAG, vLLM, Vector databases, Agentic workflows, LangSmith, MLflow, Weights & Biases'

- id: vision
  group: 'Computer vision & geospatial'
  items: 'OpenCV, Semantic segmentation, Multispectral imaging, Geospatial foundation models (Prithvi), Google Earth Engine'

- id: production
  group: 'Production ML & data engineering'
  items: 'GCP (Vertex AI, BigQuery), AWS (SageMaker, EC2, S3), Kubernetes, Docker, Distributed inference, Apache Spark, dbt, FastAPI'

- id: foundations
  group: 'Languages & foundations'
  items: 'Python, Scala, SQL, R, Git, Linux/Unix'
