# Who the site says its author is.
#
# Consumed by _includes/seo/person.html, which turns it into the Person
# JSON-LD block on every page. Nothing else reads it. Before this file existed
# the same content sat inline in _layouts/default.html, which meant editing an
# award or adding a profile link required opening a layout.
#
# The counterpart files are _data/media.yml (press coverage) and
# _data/events.yml (talks). Publications stay in _data/publications.yml and are
# referenced here by @id rather than duplicated.

name: Vicky Feliren
job_title: Applied Scientist
email: vickyfeliren@gmail.com
gender: Male
pronouns: he/him
nationality: Indonesia

description: >-
  Applied Scientist focusing on AI safety and trustworthy multimodal and
  multilingual systems; published in IEEE, ACL, and Remote Sensing of Environment.

# The WebSite node's description, which is a third wording again.
#
# DRIFT, preserved deliberately: this, `description` above, and `description` in
# _config.yml are three different sentences about the same person. _config.yml
# leads with calibration under safety alignment, matching the current narrative
# spine; these two still lead with trustworthy multimodal systems. Reconciling
# them is a copy decision, so this refactor kept each string exactly where it
# was rather than quietly picking a winner.
website_description: >-
  Applied Scientist working on AI safety for trustworthy, multimodal, and
  multilingual systems, published in IEEE, ACL, and Remote Sensing of Environment.

# Long-form variant. Search engines show this in knowledge panels, so it repeats
# facts from the short description on purpose.
disambiguating_description: >-
  Vicky Feliren is an applied scientist specializing in AI safety and the
  development of trustworthy multimodal and multilingual systems. He conducts
  applied research that bridges vision–language models, uncertainty
  quantification, and interpretability, and has published in venues including
  IEEE, ACL, and Remote Sensing of Environment. Vicky holds a Master of Data
  Science and a Bachelor of Computer Science from Monash University, and
  contributes to initiatives around responsible AI and regionally relevant
  multimodal research. He has been recognized with awards such as the Global
  South AI Safety Hackathon (Asia Pacific Regional Winner, 2026) and the
  Microsoft Azure Virtual Hackathon APAC (Regional Champion, 2020). Vicky is
  available for research collaborations, speaking engagements, and consulting on
  trustworthy AI.

