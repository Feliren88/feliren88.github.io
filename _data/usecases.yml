        and Traackr (influencer engagement) alongside platform-native social
        engagement features via dbt transformation pipelines on BigQuery.
      uncertainty_quantification: >
        Designed split conformal prediction wrappers on XGBoost outputs to
        deliver calibrated prediction intervals with coverage guarantees,
        replacing point forecasts with plannable uncertainty ranges. Built
        evaluation pipelines tracking calibration drift and empirical coverage
        as observable KPIs (target of 90% PI empirical coverage on rolling holdout
        windows), establishing UQ as a first-class production metric alongside
        point forecast accuracy.
