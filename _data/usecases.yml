      TikTok, and YouTube. Media leaders used monthly spreadsheets that arrived
      three to four weeks late to decide where brands were over- or under-funded.

    complication: >
      The data produced hundreds of short, sparse time series across category,
      country, division, and platform. Campaign cycles caused seasonality, while
      competitor spending mixed with organic brand growth. Linear regression
      missed nonlinear effects from platform changes and spending surges. A single
