      architecture: |-
        I designed an assistant for basic phones and 2G networks. It required no
        app or internet service. Moreover, speech recognition handled Indonesian
        with Javanese and Sundanese accents. A knowledge graph stored connections
        between health advice, service rules, and emergency contacts. Then
        text-to-speech read the answers aloud.
      accessibility_design: |-
        I designed the service for people without digital skills. Therefore, the
        interaction followed familiar banking and telecom phone menus operated
        with keypad tones. These are called DTMF IVR systems. Moreover, people
        unfamiliar with menu navigation could ask questions freely by voice.
      localization: |-
        We curated the knowledge graph for Indonesia. It covered local health
        contacts, regional quarantine rules, and eligibility for social
