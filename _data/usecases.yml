  - id: plastic-bag-ban-causal-analysis
    title: Plastic bag ban, causal policy analysis using NLP and citizen data
    category: applied
    tags:
      - NLP
      - Causal Inference
      - Difference-in-Differences
      - Policy Analysis
      - IEEE
      - Smart City
    venue: "ICISS 2021, IEEE"
    role: First Author
    doi: "10.1109/ICISS53185.2021.9533236"
    link: "https://ieeexplore.ieee.org/document/9533236/"
    keywords:
      - Plastic bag ban
      - Waste complaints
      - Hypothesis testing
      - Causal inference
      - e-government
      - Jakarta

    hook: |-
      I used more than 100,000 citizen complaints to measure the effect of Jakarta’s
      2020 plastic bag ban.

    situation: |-
      Jakarta banned retailers from distributing single-use plastic bags in 2020.
      Policymakers needed evidence that the ban worked before extending similar
      rules to other waste. However, no earlier quantitative study had measured its
      effect using the city’s own complaint platforms.

    complication: |-
      The ban began during COVID-19 lockdowns, which also reduced shopping and
      waste. Therefore, a simple before-and-after comparison would mix these
      effects. I needed to control for mobility, economic activity, seasonal waste,
      and changes in complaint use.

    resolution:
      method: |-
        I used difference-in-differences to compare changes in plastic complaints
        with changes in other waste complaints. I classified 100,000+ records by
        waste type using text classification. The records came from JAKI,
        Jakarta’s official smart city complaint platform, and Qlue, a civic
        reporting platform. The classes separated plastic complaints from general
        waste, sanitation, and other urban services. Plastic complaints formed the
        treatment group. Meanwhile, non-plastic waste complaints formed the
        control group within the same platform and period.
      confounders: |-
        I controlled for COVID-19 mobility using Google Community Mobility
        Reports. Moreover, I controlled for seasonal waste patterns and changes in
        platform use. This separated changes in waste from changes in reporting
        behaviour.
      result: |-
        I found a statistically significant reduction in plastic complaints after
        the ban, controlling for pandemic effects. Moreover, I presented the
        pre-registered hypotheses and transparent method at ICISS 2021.

    tech_stack:
      nlp: [Text classification, complaint taxonomy]
      causal: [Difference-in-differences, hypothesis testing]
      data: [JAKI, Qlue citizen complaint platforms]
      statistics: [Python statsmodels, R]
      records_analyzed: "100,000+"

    metrics:
      complaint_records: "100,000+"
      conference_attendees: 500
      venue: "ICISS 2021, IEEE, Bandung, Indonesia"

    impact: |-
      This was the first quantitative evaluation of the ban using Jakarta’s own
      complaint systems. Moreover, the method can test food-container bans, producer
      responsibility, and other city policies. I presented the work to more than 500
      international attendees at IEEE-sponsored ICISS 2021.

