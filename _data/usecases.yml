  - id: commonlid-language-identification
    title: "CommonLID: language identification on noisy web data"
    category: cultural
    tags:
      - NLP
      - Language Identification
      - Low-Resource
      - Benchmark
      - ACL 2026
    venue: "ACL 2026"
    role: Contributor
    arxiv: "https://arxiv.org/abs/2601.18026"
    keywords:
      - Language identification
      - Low-resource NLP
      - Code-switching
      - CommonCrawl
      - Southeast Asia
      - Benchmark

    hook: "Language identification scores above 95% on clean tests fall sharply on real Southeast Asian web data."

    situation: >
      Language identification supports translation routing, content moderation,
      dataset building, and search indexing. These pipelines often treat it as a
      solved problem. FastText LangID, GlotLID, and OpenLID regularly score above
      95% on clean benchmarks, but those scores create false confidence.

    complication: >
      Southeast Asian web text mixes languages within a sentence, uses Roman
      spellings alongside standard scripts, and includes phonetic spelling and
      social-media shorthand. Systems trained on curated text perform much worse
      on this data. Existing benchmarks miss the decline because they do not
      represent the web conditions where the systems operate.

    resolution:
      approach: >
        We re-tested fastText LangID, GlotLID, and OpenLID on CommonCrawl text
        with code-switching, Romanised scripts, and spelling variation. We mapped
        each system's failures across language families and proposed a stricter
        protocol for claims about low-resource Southeast Asian coverage.
      significance: >
        The results challenge published accuracy claims and show why pipelines
        using language identification must be tested again. This includes the
        CommonCrawl-based data used to train major language models.

    tech_stack:
      systems_evaluated: [fastText LangID, GlotLID, OpenLID]
      data_source: CommonCrawl
      focus_languages: "Low-resource SEA languages (11+)"

    impact: >
      These failures affect content moderation, translation routing, and language
      model datasets across Southeast Asia. The evaluation protocol also gives
      future low-resource benchmarks a clear method for testing real web data.

