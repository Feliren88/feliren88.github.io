  - id: aquaculture-pond-detection
    title: Aquaculture pond detection and change analysis
    category: geospatial
    tags:
      - Object Detection
      - Coastal Monitoring
      - Change Detection
      - Time-Series Satellite
      - Patent
    venue: "Filed Patent IDS000010594, Issued June 2025"
    role: Lead Developer
    keywords:
      - Aquaculture detection
      - Coastal land use
      - Mangrove deforestation
      - Sentinel-2 time series
      - Indonesia
      - Vietnam

    hook: |-
      I built a system to flag possible illegal shrimp farms within hours of a
      satellite pass.

    situation: |-
      Illegal shrimp and fish ponds cause substantial mangrove loss along Southeast
      Asian coasts. Indonesia and Vietnam have lost substantial mangrove cover over
      the past 2 decades. However, regulators relied on occasional field surveys.
      Therefore, years could pass between new pond construction and enforcement.

    complication: |-
      Aquaculture ponds can resemble rivers, tidal flats, and estuaries in optical
      satellite images. Moreover, tides change whether the same place appears as
      water or land. Tropical clouds also obscure single images. Therefore, reliable
      detection needs changes over time. Comparing image stacks helps separate
      stable natural water from newly built ponds.

    resolution:
      approach: |-
        I built a pipeline that compares Sentinel-2 images across dates in 3
        stages. First, the water indices NDWI, MNDWI, and AWEI locate possible
        water bodies from reflected light. Shape filters then separate rectangular
        human-made ponds from natural water. Finally, differences over time
        identify ponds built within a chosen monitoring period.
      geography: |-
        I validated the pipeline on Sumatra and Kalimantan’s coasts in Indonesia.
        Moreover, I tested it in Vietnam’s Mekong Delta and Ca Mau. Their
        different tides and wavelength responses tested transfer across regions.
      output: |-
        The outputs link pond growth with mangrove loss. Therefore, they provide
        spatial evidence for policy reports investigating possible illegal coastal
        conversion.

    tech_stack:
      frameworks: [Python, Google Earth Engine]
      indices: [NDWI, MNDWI, AWEI]
      imagery: [Sentinel-2 (multi-temporal)]

    patent:
      title: "System for Detection and Analysis of Fish and Shrimp Ponds Using Satellite Imagery"
      id: IDS000010594
      issued: "June 2025"

    impact: |-
      Governments and NGOs can monitor possible illegal coastal conversion within
      hours of a new satellite pass. This gives them evidence before field surveys.
      Moreover, the alerts support agencies protecting biodiversity and carbon
      stocks in Indonesia and Vietnam.

