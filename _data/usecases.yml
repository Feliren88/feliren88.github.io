  - id: heron-hijack-self-probe
    title: "Hidden-State Detection of In-Context Goal Hijacking with a Conformal False-Positive Guarantee"
    category: safety
    tags:
      - Mechanistic Interpretability
      - Prompt Injection
      - Activation Probing
      - Conformal Prediction
      - AI Security
      - Heron Fellowship
    venue: "Heron AI Security Research Fellowship, Work-Test Prototype (2026)"
    role: "Sole Researcher"
    link: "/heron/"
    keywords:
      - In-context goal hijacking
      - Prompt injection detection
      - Residual-stream probing
      - Split conformal prediction
      - False-positive guarantee
      - Confound controls
      - Qwen2.5-0.5B-Instruct

    hook: "Output monitoring sees nothing when a hijack attempt fails. The residual stream sees it almost every time."

    situation: >
      Deployed LLM security monitoring mostly watches inputs and outputs. An
      in-context goal-hijack attack embeds an instruction in the prompt that
      tries to override the user's task, and it changes the model's internal
      computation whether or not the final output changes. When the model
      resists the injection at the output level, which happens often, input and
      output monitoring records nothing, and the attempt goes unlogged. This
      work-test prototype for the Heron AI Security Research Fellowship asks a
      narrower, testable question: do an instruction-tuned model's own
      hidden states carry a linearly readable signature of a hijack attempt,
      and can the resulting detector's false-positive rate be bounded before
      deployment rather than guessed at.

    complication: >
      Activation-based attack detectors are usually reported as a bare accuracy
      or AUC number, which hides two failure modes. A detector trained on clean
      prompts versus injected-prefix prompts can reach a perfect score by
      learning "there is extra text before the task" rather than "the goal is
      being hijacked", and that shortcut also fires on completely harmless
      prefixed prompts, so the reported accuracy misstates real deployment
      behaviour unless a benchmark is built specifically to expose it. Separately,
      a raw probe score gives a security operator no way to pre-commit to an
      acceptable false-alarm rate. Both problems needed to be solved inside the
      benchmark and the calibration method, not patched after the fact.

    resolution:
      pipeline: >
        Built a read-only pipeline on Qwen2.5-0.5B-Instruct, one forward pass
        per prompt over 640 prompts across four conditions (clean, attacked,
        a benign-prefix control whose hard negatives reuse the attacks' command
        vocabulary in benign senses, and a held-out attack family excluded from
        training), with residual-stream hidden states cached at every layer so
        the full ablation suite reuses a single model pass. A logistic-regression
        probe on one layer's last-token state scores each prompt, and a
        split-conformal threshold calibrated on benign-only scores sets the
        decision rule at a chosen false-positive budget, alpha = 0.05.
      confound_control: >
        Designed the benign-prefix control specifically to catch the shortcut
        described above, and it did. The naive probe (clean vs. attacked only)
        flagged 100% of harmless prefixed prompts as attacks under clean-only
        calibration, across all ten seeds, despite reaching a perfect AUC on
        the headline metric. Retraining the decision boundary to separate
        goal-override prefixes from harmless ones (control-aware training)
        removed the false alarms, raised the deconfounded AUC from 0.937 to
        0.998, and restored true-positive rate on the held-out attack family
        from 0.710 to 0.988.
      generalization: >
        Stress-tested the control-aware detector, at its original threshold and
        with no retraining, against attacks it had never seen in any form,
        paraphrases built to avoid every command word in the training templates,
        and attacks moved from the prefix to the suffix position. True-positive
        rate held at 1.000 in both cases, which rules out keyword matching and
        position-specific memorisation as explanations for the signal. The full
        benchmark was then rerun on the same model family at 1.5B, 3B and 7B.
        Detection improved with size and false alarms stayed near budget, while
        the larger models obeyed the injected command far more often (roughly
        27 to 49% of attempts at 0.5B and 1.5B, 73 to 85% at 3B and 7B).
      calibration_validity: >
        Verified the conformal guarantee empirically over 200 random
        calibration/test splits (mean false-positive rate 0.037 against a 0.05
        target) and surfaced a second calibration finding: a threshold
        calibrated only on prefix-form benign traffic misclassified 25.8% of
        harmless suffix-form prompts, even though the detector's score ranking
        stayed near-perfect (AUC 0.999). Extending the calibration set with
        representative benign traffic, with detector weights unchanged, restored
        the bound for the mixture (0.045 combined false-positive rate; the
        remaining suffix-subgroup gap, 0.087, motivates group-conditional
        calibration). Twelve ablations in total (A1 to A12)
        plus a behavioral check and five unit tests rule out layer-choice
        artifacts, pipeline leakage, and label noise.
      input_text_baseline: >
        Closed the loop with the baseline any reviewer would ask for. These
        injections are visible in the prompt, so a bag-of-words classifier on
        the raw input text, trained and calibrated under the identical
        protocol, is the honest comparison. It nearly matches the probe
        (deconfounded AUC 1.000) and trails it only on threshold transfer to
        the unseen phrasing family (0.880 vs 0.988 of attacks caught at the
        fixed alarm line). The benchmark therefore cannot claim internal
        signals are required for this attack class; what it shows is that
        hidden-state scores transfer to unseen phrasings without threshold
        degradation, and that separating internal-state monitoring from input
        filtering needs attacks that are not legible in the input text.

    tech_stack:
      model: [Qwen2.5-Instruct 0.5B-7B]
      methods: [Logistic regression probe, Split conformal prediction, Residual-stream activation caching]
      evaluation: [Deconfounded AUC, False-positive rate at alpha, Held-out family TPR, Paraphrase and position transfer]
      hardware: [A100]

    metrics:
      deconfounded_auc: "0.998 ± 0.003"
      fpr_at_alpha_0.05: "0.029 ± 0.016"
      held_out_family_tpr: "0.988 ± 0.013"
      output_hijack_success_rate_pct: "36-49"
      scale_sweep: "0.5B to 7B, AUC reaches 1.000"
      text_baseline_heldout_tpr: "0.880 (input-only) vs 0.988 (probe)"
      ablations_and_controls: 12

    impact: >
      Shows, on one model family and one attack style, that a benchmark with
      only clean and attacked conditions can certify a detector at perfect AUC
      that misclassifies every harmless prefixed prompt, and that a calibration
      set restricted to one benign format can certify a 5% false-alarm budget
      that measures five times higher on another benign format. Both findings
      argue for building confound controls, calibration-coverage audits, and
      trivial input-only baselines into security benchmarks by default rather
      than treating a single accuracy number as sufficient. The behavioral
      results ground the case for internal monitoring against output
      monitoring directly. The 0.5B model obeys the injection in 36 to 49% of
      attempts, the 7B model in roughly 80%, and the probe flags almost every
      attempt at every size. Capability helps the attacker, and output
      monitoring under-fires exactly where it matters.

    why_this: >
      Most LLM security tooling watches the boundary, inputs and outputs, and
      treats the model as a black box in between. That framing misses an attack
      the moment the model successfully resists it at the output level, which is
      most of the time here. I wanted to test the narrower, falsifiable claim
      that the internal computation still carries the signature even when the
      output looks clean, and to hold myself to the same bar I would want
      applied to my own conformal prediction work: a false-positive rate that is
      guaranteed, not just measured on one favourable split.

    surprise: >
      The naive probe's failure was the most useful result in the project. It
      reached a perfect headline AUC and would have shipped as a working
      detector, and the benign-prefix control was the only thing that caught it
      flagging every harmless prefixed prompt. The fix was not a better model or
      more data, it was a different negative class in training. That is a
      cheap, structural lesson about benchmark design that generalises well
      past this one detector.

    next: >
      With hard negatives in the benchmark the 0.5B layer sweep finally shows
      structure, rising from chance at the embeddings to a peak in early-middle
      layers and fading toward the head. That structure washes out at 3B and
      7B, and the injections are still template-generated. The next step is a
      harder, semantically diverse attack suite in the style of in-context
      representation hijacking, where layer localisation becomes a sharper
      question, alongside a second architecture family, group-conditional
      calibration for the subgroup coverage gap the suffix-position ablation
      exposed, and moving from an external probe toward a detector the model
      can use on itself.

