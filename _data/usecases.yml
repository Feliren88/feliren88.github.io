        results. Client media teams checked the explanations against their domain
        knowledge. BigQuery and dbt combined platform engagement data with
        SimilarWeb traffic and Traackr influencer signals.
      uncertainty_quantification: >
        I added split conformal prediction to XGBoost, replacing point forecasts
        with calibrated intervals and coverage guarantees. The evaluation pipeline
        tracked calibration drift and empirical coverage on rolling holdouts,
        targeting 90% interval coverage alongside forecast accuracy.
      mlops: >
        I built the pipeline on Vertex AI Workbench with automated ingestion,
        versioned dbt features, experiment tracking, and Streamlit dashboards.
        The dashboards turned model output into market-share views for commercial
        teams. As the office's sole technical contributor, I also set standards
        for code review, reproducibility, and configuration.
      rag_poc: >
