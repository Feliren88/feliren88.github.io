  - id: sea-vl-benchmark
    title: "SEA-VL: multicultural vision-language benchmark for Southeast Asia"
    category: cultural
    tags:
      - Vision-Language Models
      - Benchmark
      - Dataset
      - Crowdsourcing
      - Cultural AI
      - ACL 2025
    venue: "ACL 2025 (Main Conference, Long Paper)"
    role: "Core Contributor, Data Pipeline Lead"
    link: "https://aclanthology.org/2025.acl-long.916/"
    arxiv: "https://arxiv.org/abs/2503.07920"
    keywords:
      - Multicultural dataset
      - Southeast Asia
      - Vision-language
      - Crowdsourcing
      - Multilingual
      - Benchmark
      - Cultural representation

    hook: "We built the ACL 2025 benchmark that measures GPT-4V's failures on Southeast Asian culture."

    situation: >
      Leading vision-language models rely mainly on English and Western image-text
      data. Southeast Asia spans 11 countries, more than 700 million people,
      hundreds of languages, and distinct cultural practices. Yet the region is
      underrepresented in training data and benchmarks. Before SEA-VL, no rigorous
      community benchmark measured culturally grounded visual reasoning across it.

    complication: >
      A valid cultural benchmark needs more than scraped images. Its questions
      must reflect local food, festivals, buildings, scripts, and social practices.
      Standard crowdsourcing platforms lack enough regional knowledge. Using GPT-4
      or Gemini to generate the test would also make the evaluation circular.
      Quality control becomes harder across 11 languages, including low-resource
      scripts.

    resolution:
      data_collection: >
        I co-led more than 100 community annotators across all 11 Southeast Asian
        countries. They wrote image, question, and answer sets from lived cultural
        knowledge without using web search as a substitute.
      pipeline: >
        I designed and built the quality pipeline. It covered annotation rules,
        automated filters, human review, language checks, and cultural validation.
        For image deduplication, I compared several similarity methods against a
        human-checked reference set and selected the most reliable one. The final
        contribution included more than 10,000 image-question pairs in 11 languages.
      findings: >
        The benchmark measures consistent cultural reasoning gaps in GPT-4V,
        Gemini, and Claude. AI labs can use the results to set localisation
        priorities for Southeast Asian markets.

    tech_stack:
      models_evaluated: [GPT-4V, Gemini 1.5, Claude 3, LLaVA, InternVL]
      deduplication: [pHash, CLIP-ViT, SigLIP, Nomic Embed Vision]
      annotation_scale: "100+ annotators, 11 countries"
