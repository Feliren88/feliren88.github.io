  - id: gg-ez-regional-adaptation
    title: "GG-EZ: regional adaptation framework for vision-language models in SEA"
    category: cultural
    tags:
      - VLMs
      - Cultural AI
      - Regional Adaptation
      - Diffusion Models
      - Knowledge Distillation
      - Findings of AACL-IJCNLP 2026
    venue: "Findings of AACL-IJCNLP 2026"
    role: "Lead, Diffusion Model Arm"
    arxiv: "https://arxiv.org/abs/2604.11490"
    keywords:
      - Vision-language models
      - Cultural adaptation
      - Southeast Asia
      - Retrieval-augmented generation
      - Fine-tuning
      - Anthropogenic priors

    hook: |-
      I adapted image generation for Southeast Asia while retaining more than 98% of
      global benchmark quality.

    situation: |-
      General-purpose models such as LLaVA, InternVL, Phi-Vision, and SDXL often
      misidentify Southeast Asian food, scripts, and traditions. However, full
      retraining on regional data is expensive. It usually needs proprietary data
      that local teams lack.

    complication: |-
      We asked whether targeted adaptation could improve cultural accuracy without
      full retraining. Moreover, we asked how small that intervention could be. The
      answer depends on where model weights hold cultural knowledge and how
      efficiently we can change them. However, automated scores alone cannot judge
      cultural accuracy. Therefore, the evaluation also needed expert regional
      raters.

    resolution:
      framework: |-
        We proposed Anthropogenic Regional Adaptation to teach models cultural
        context through structured regional knowledge. The approach rests on the
        claim that this knowledge can reduce reliance on large data volumes.
        Therefore, we tested retrieval from curated sources, targeted regional
        fine-tuning, and systematic checks of cultural accuracy.
      diffusion_arm: |-
        I led the image-generation work. First, I fine-tuned the model on curated
        Southeast Asian images. Then, I merged its weights with the original model
        at several ratios. This controlled the balance between regional accuracy
        and global image quality. Regional raters scored cultural accuracy at
        1.569 versus a 1.491 baseline. Moreover, automated tests retained more
        than 98% of global quality.
      evaluation: |-
        Regional annotators scored cultural accuracy, while DPG-Bench measured
        global image quality. We tracked both for every variant. Therefore, we
        could map regional gains against global losses.

    tech_stack:
      models: [SDXL, LLaVA, InternVL, Phi-Vision]
      training: [PyTorch, diffusers]
      evaluation: [DPG-Bench, human evaluation, RAG scaffolds]
      hyperparams:
        batch_size: 32
        learning_rate: 1.0e-5
        epochs: 4
        vae: frozen

    metrics:
      cultural_correctness_adapted: 1.569
      cultural_correctness_baseline: 1.491
      global_benchmark_retention_pct: 98.0

    impact: |-
      The work provides a reproducible, affordable method for regional model
      adaptation. It retained more than 98% of global quality while improving
      Southeast Asian performance. Therefore, the result strengthens the case for
      localisation in commercial AI labs.

