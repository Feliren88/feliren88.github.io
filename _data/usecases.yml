  - id: aquaculture-pond-detection
    title: Aquaculture pond detection and change analysis
    category: geospatial
    tags:
      - Object Detection
      - Coastal Monitoring
      - Change Detection
      - Time-Series Satellite
      - Patent
    venue: "Filed Patent IDS000010594, Issued June 2025"
    role: Lead Developer
    keywords:
      - Aquaculture detection
      - Coastal land use
      - Mangrove deforestation
      - Sentinel-2 time series
      - Indonesia
      - Vietnam

    hook: "Detecting illegal shrimp farms from orbit within hours of a satellite pass."

    situation: >
      Illegal shrimp and fish ponds are a major cause of mangrove loss along
      Southeast Asian coasts. Indonesia and Vietnam have lost substantial mangrove
      cover over the past two decades. Regulators relied on occasional field
      surveys, so years could pass between new construction and enforcement.

    complication: >
      Aquaculture ponds can look like rivers, tidal flats, and estuaries in optical
      satellite images. Tides make the same place appear as water or land at
      different times, while tropical clouds obscure single images. The key signal
      is change over time. A reliable system must compare image stacks to separate
      stable natural water from newly built ponds.

    resolution:
      approach: >
        I built a multi-date Sentinel-2 pipeline with three stages. NDWI, MNDWI,
        and AWEI first locate possible water bodies. Shape filters then separate
        rectangular human-made ponds from natural water. Finally, time-based
        differences identify ponds built within a chosen monitoring period.
      geography: >
        I validated the pipeline on the coasts of Sumatra and Kalimantan in
        Indonesia, and the Mekong Delta and Ca Mau in Vietnam. Their different
        tidal and spectral conditions tested transfer across regions.
      output: >
        The outputs link pond growth with mangrove loss. They provide spatial
        evidence for policy reports on illegal coastal conversion.

    tech_stack:
      frameworks: [Python, Google Earth Engine]
      indices: [NDWI, MNDWI, AWEI]
      imagery: [Sentinel-2 (multi-temporal)]

    patent:
      title: "System for Detection and Analysis of Fish and Shrimp Ponds Using Satellite Imagery"
      id: IDS000010594
      issued: "June 2025"

    impact: >
      Governments and NGOs can monitor illegal coastal conversion within hours
      of a new satellite pass without waiting for field surveys. The alerts
      support agencies responsible for biodiversity and carbon stocks in Indonesia
      and Vietnam.

