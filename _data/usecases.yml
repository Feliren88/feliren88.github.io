      by campaign cycles, and competitive signal entangled with organic brand
      momentum. The initial baseline, a linear regression, failed to capture
      non-linear interaction effects between platform algorithm changes and
      competitor spend surges. More critically, point forecasts were insufficient for the use case. Media planners needed calibrated uncertainty ranges to justify budget reallocation decisions to CFOs, where single-number predictions only communicated false precision.

