  - id: goal-hijack-probe
    title: "Goal Hijack Probe"
    category: uncertainty
    tags:
      - Mechanistic Interpretability
      - Prompt Injection
      - Activation Probing
      - Conformal Prediction
      - AI Security
      - AI Security Research
    venue: "Personal experiment (2026)"
    role: "Sole Researcher"
    link: "/goal-hijack-probe/"
    keywords:
      - In-context goal hijacking
      - Prompt injection detection
      - Residual-stream probing
      - Split conformal prediction
      - False-positive guarantee
      - Confound controls
      - Qwen2.5-0.5B-Instruct

    hook: |-
      A classifier using internal model signals catches goal-hijack attempts even
      when the model’s answer stays unchanged.

    situation: |-
      A goal-hijack attack adds a competing instruction to a prompt to replace the
      user’s task. If the model answers the original task, output monitoring misses
      the attempt. In this prototype, I tested whether a linear classifier could
      detect attacks from internal model signals. Moreover, I tested calibration,
      which uses benign examples to set an alarm threshold. I asked whether it could
      bound average false alarms when future benign prompts resemble those examples.

    complication: |-
      A detector can score perfectly by learning that attacks add extra text before
      the task. However, harmless prefixes expose this shortcut. A raw score also
      leaves the alarm threshold unspecified. Therefore, I included harmless prompts
      that resemble attacks. I then used benign calibration scores to set a
      threshold for a chosen false-alarm target.

    resolution:
      pipeline: |-
        I built a read-only pipeline for Qwen2.5-0.5B-Instruct and ran 1 forward
        pass per prompt across 640 prompts. The 4 groups were clean prompts,
        attacks, harmless prefixes, and an attack family excluded from training.
        The harmless prefixes used attack vocabulary safely. I saved every layer’s
        internal residual-stream state so all ablations could reuse the same pass.
        A logistic classifier scored the last-token state at 1 layer. Then I set a
        split-conformal threshold using only benign scores, with alpha = 0.05.
      confound_control: |-
        The harmless-prefix control exposed the shortcut. Across all 10 seeds, the
        naive classifier flagged every harmless prefixed prompt despite perfect
        headline AUC. AUC measures how well scores rank attacks above benign
        prompts across thresholds. Training with controls improved separation
        between goal overrides and harmless prefixes. Moreover, it lowered false
        alarms and raised deconfounded AUC from 0.937 to 0.998. Detection on the
        held-out attack family rose from 0.710 to 0.988.
      generalization: |-
        I kept the original model and threshold for transfer tests. These covered
        unseen attacks, wording without training command words, and attacks moved
        from prompt start to end. The true-positive rate stayed at 1.000 in both
        transfer tests. This weakens simple keyword and fixed-position
        explanations. However, the template benchmark may contain other shortcuts.
        Then I repeated the benchmark on 1.5B, 3B, and 7B models in the same
        family.

        Detection improved with size, and false alarms stayed near the target.
        However, larger models followed attacks more often. Rates were about
        27–49% at 0.5B and 1.5B, compared with 73–85% at 3B and 7B.
      calibration_validity: |-
        Across 200 random calibration and test splits, mean false-positive rate
        was 0.037 against a 0.05 target. However, a second test exposed a coverage
        gap. A threshold calibrated only on benign prefixes flagged 25.8% of
        harmless suffix prompts, despite AUC of 0.999. Adding representative
        benign inputs reduced the observed mixed-group rate to 0.045 without
        changing detector weights. However, the suffix subgroup rate stayed at
        0.087. This motivates calibration within each group.

        The average guarantee assumes exchangeability, so reordering calibration
        and future benign examples must leave their probabilities unchanged. It
        does not guarantee the same false-alarm rate within each subgroup.
        Moreover, I ran 12 ablations, 1 behavioural check, and 5 unit tests. These
        tested sensitivity to layer choice and found no label leakage in the
        checked pipeline.
      input_text_baseline: |-
        I compared the internal classifier with a bag-of-words classifier that
        uses word counts from raw prompts. Both used the same training and
        calibration protocol. Because these attacks appear in the input, this is
        the relevant baseline. It nearly matched the internal classifier, with
        deconfounded AUC of 1.000. However, at the fixed threshold, it caught
        0.880 of attacks in the unseen phrasing family. The internal classifier
        caught 0.988.

        Thus, the need for internal signals remains unproven for this attack
        class. The benchmark shows better threshold transfer to unseen wording. A
        stronger comparison needs attacks that cannot be read directly from input.

    tech_stack:
      model: [Qwen2.5-Instruct 0.5B-7B]
      methods: [Logistic regression probe, Split conformal prediction, Residual-stream activation caching]
      evaluation: [Deconfounded AUC, False-positive rate at alpha, Held-out family TPR, Paraphrase and position transfer]
      hardware: [A100]

    metrics:
      deconfounded_auc: "0.998 ± 0.003"
      fpr_at_alpha_0.05: "0.029 ± 0.016"
      held_out_family_tpr: "0.988 ± 0.013"
      output_hijack_success_rate_pct: "36-49"
      scale_sweep: "0.5B to 7B, AUC reaches 1.000"
      text_baseline_heldout_tpr: "0.880 (input-only) vs 0.988 (probe)"
      ablations_and_controls: 12

    impact: |-
      In 1 model family and attack style, a detector achieved perfect AUC while
      flagging every harmless prefix. Moreover, a threshold calibrated on 1 benign
      format flagged 25.8% of harmless prompts in another. These tests support
      controls for shortcuts, coverage audits, and input-only baselines in security
      benchmarks. The behaviour tests also show the limit of output monitoring. The
      0.5B model followed 36–49% of injections, while the 7B model followed about
      80%. The internal classifier detected almost every attempt at each size.

      Thus, greater model size coincided with more successful injections in this
      benchmark. Meanwhile, output monitoring missed attempts that left the answer
      unchanged.

    why_this: |-
      Output monitoring misses an attack attempt when the model answers the original
      task. Therefore, I tested whether internal model signals retain readable
      evidence of those attempts. Moreover, I calibrated an alarm threshold to a
      stated false-positive target. This applies the same statistical standard I use
      in my conformal prediction work.

    surprise: |-
      The naive classifier’s failure was the most useful result. Its AUC was
      perfect, yet it flagged every harmless prefix. Only the benign-prefix control
      exposed this problem. Adding harmless prefixes to negative training examples
      improved ranking and held-out detection. Therefore, benchmarks need controls
      that resemble the attacks they aim to detect.

    next: |-
      With difficult benign controls, the 0.5B layer sweep starts at chance in the
      embeddings. It peaks in early-middle layers, then fades near the output head.
      However, this pattern disappears at 3B and 7B. The current attacks still come
      from templates. Next, I will test more varied attacks on internal
      representations and a second model family. Moreover, I will test
      group-conditional calibration to address the suffix coverage gap.

      I also want to develop a detector that the model can use on itself.

