      During the early 2020 COVID-19 surge, Indonesian hospitals needed to monitor
      high-risk patients at home. Standard systems required broadband and devices
      such as pulse oximeters or ECG patches. Rural broadband access was below 30%,
      and medical hardware supply chains were disrupted.

    complication: >
      Server-side breathing analysis would overwhelm rural 2G and 3G links because
