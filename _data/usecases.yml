  - id: fraud-detection-pipeline
    title: Real-time fraud detection pipeline (GDP Labs)
    category: production
    tags:
      - Fraud Detection
      - Anomaly Detection
      - Graph Networks
      - Real-Time Inference
      - Kafka
      - Redis
      - Fintech
    venue: "GDP Labs (GLAIR.ai), Lead ML Engineer (2021, 2023)"
    role: Lead ML Engineer

    hook: "One real-time pipeline detected account takeover, synthetic identities, and merchant collusion."

    situation: >
      A high-volume payments platform faced three forms of fraud: account takeover,
      synthetic identities built with false KYC documents, and merchants inflating
      transactions through collusion. Each attack had different signals and timing,
      so one classifier could not cover them all.

    complication: >
      The platform had less than a second to approve each transaction. Full graph
      inference was too slow for that window. Fraud also made up less than 0.1%
      of traffic, and attackers changed tactics in response to detection. Static
      models could become stale within weeks.

    resolution:
      architecture: >
        I designed three detection stages. Fast rules rejected known patterns such
        as unusual velocity, location, or blocked devices. XGBoost then scored
        engineered transaction features. A graph detector found colluding merchants
        and synthetic identity groups from their network structure.
      real_time_serving: >
        Kafka ingested transaction events, while Redis served precomputed features
        such as rolling velocity and account baselines. Separating feature work
        from inference allowed complex signals within the latency limit.
      continuous_learning: >
        Continuous retraining pipeline on labeled feedback from the fraud
        operations team (human-in-the-loop label generation from case resolution
        outcomes). Deployed with monitoring on feature distribution shifts and
        score distribution drift as early warning signals for concept drift
        between retraining cycles.

    tech_stack:
      models: [XGBoost, gradient boosting, graph anomaly detection]
      streaming: [Apache Kafka]
      feature_store: [Redis]
      frameworks: [Python, scikit-learn]
      infrastructure: [Docker, Kubernetes, AWS]

    impact: >
      The system reduced fraudulent approvals and chargeback costs while protecting
      users and platform revenue. Its three-stage design became the internal
      template for later fraud systems across the client portfolio.

