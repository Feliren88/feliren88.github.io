  - id: procaenet-flood-segmentation
    title: Flood segmentation from multispectral satellite imagery (ProCANet)
    category: geospatial
    tags:
      - Semantic Segmentation
      - Attention Mechanisms
      - Multi-Modal Fusion
      - Remote Sensing
      - PyTorch Lightning
    venue: "IEEE Geoscience and Remote Sensing Letters (GRSL), 2025, Q1 (IF 4.4)"
    role: First Author
    doi: "10.1109/LGRS.2024.3495974"
    link: "https://ieeexplore.ieee.org/document/10750225"
    keywords:
      - Flood segmentation
      - Multimodal deep learning
      - Progressive cross-attention
      - Semantic segmentation
      - Sentinel-2
      - Sen1Floods11

    hook: |-
      I built flood maps within hours for a basin of 25 million people, achieving
      state-of-the-art results.

    situation: |-
      Disaster teams need flood maps to plan routes and supplies. However, manual
      GIS work, which maps and analyses locations, takes days or weeks. That delay
      leaves little time during an emergency’s first 72 hours. The 270 km Citarum
      River basin in West Java houses more than 25 million people. Therefore, it
      needed accurate automated flood maps across cities, farms, and forests despite
      partial cloud.

    complication: |-
      U-Net models using only RGB colour images often confuse flood water with dark
      soil and shadows. Near-infrared (NIR) bands from Sentinel-2 help distinguish
      them. However, the model must combine information about light wavelengths and
      spatial patterns. Joining RGB and NIR only at the input leaves their features
      misaligned later. This happens at skip connections, which pass spatial detail
      to the decoder that builds the map.

    resolution:
      architecture: |-
        I designed ProCANet, a U-Net with separate RGB and NIR encoders that
        extract image features. At every skip connection, cross-attention combines
        features from both inputs. It works at 4 scales, 1/2, 1/4, 1/8, and 1/16.
        First, self-attention captures long-range patterns within each branch.
        This keeps coherent regions with different wavelength responses from
        interfering before the branches combine.
      training: |-
        I trained ProCANet on Sen1Floods11, which contains Sentinel-2 images from
        11 floods worldwide. Moreover, I tracked every experiment with Weights &
        Biases. These records included parameter sweeps, loss curves, and
        checkpoints showing each class’s intersection over union (IoU). IoU
        measures how much the predicted and reference regions overlap.
      generalization: |-
        I tested the model on PlanetScope images without retraining. PlanetScope
        pixels represented 3 m on the ground, compared with 10 m in the training
        images. Across a 6,112 km² holdout area, the model reached 0.659 IoU. The
        reference labels came from NDWI, a water index based on light reflected at
        different wavelengths. This test reflects deployment across different
        training and inference sensors.
      baselines: |-
        I compared ProCANet with UNet, PSPNet, LinkNet, MANet, PAN, and ConvNeXt
        V2. Each model used the same Sen1Floods11 test protocol. ProCANet reached
        0.898 F1, which balances precision and recall, and 0.815 IoU. By
        comparison, UNet reached 0.884 F1 and 0.791 IoU. These gains matter on a
        benchmark already close to its current performance ceiling.

    tech_stack:
      frameworks: [PyTorch, PyTorch Lightning]
      remote_sensing: [Google Earth Engine, Sentinel-2, PlanetScope]
      experiment_tracking: [Weights & Biases (W&B)]
      data_format: [GeoTIFF, multispectral raster, NDWI]

    metrics:
      f1_score: 0.898
      iou: 0.815
      zero_shot_iou: 0.659
      baseline_f1: 0.884
      baseline_iou: 0.791
      coverage_area_km2: 6112
      accuracy_pct: 95.0

    impact: |-
      The system can support disaster response for more than 25 million people in
      the Citarum basin. It reduces days of manual GIS work to hours after a
      satellite pass. Therefore, Indonesia’s disaster agency, BNPB, can use earlier
      flood maps to plan evacuation routes and stage supplies.

    collaborators:
      - institution: "Monash University"
        role: "Primary research host (A/Prof Risqi U. Saputra)"
      - institution: "University of Indonesia"
        role: "Domain validation"

