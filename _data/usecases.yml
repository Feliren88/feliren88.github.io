  - id: multilingual-vlm-crossmodal-conflict
    title: "Do Multilingual VLMs Abstain Under Cross-Modal Conflict in Low-Resource Languages?"
    category: safety
    tags:
      - Vision-Language Models
      - Multilingual AI
      - AI Safety
      - Activation Steering
      - Cross-Modal Conflict
      - Apart Research
      - Hackathon
    venue: "Apart Research Global South AI Safety Hackathon (2026)"
    role: "Co-First Author, Benchmark & Steering Lead"
    link: "https://apartresearch.com/project/do-multilingual-visionlanguage-models-abstain-under-crossmodal-conflict-in-lowresource-languages-hcsp"
    keywords:
      - Multilingual vision-language models
      - Cross-modal conflict
      - Abstention safety
      - Low-resource languages
      - Hindi
      - Telugu
      - Contrastive activation steering
      - Override gap

    hook: "A model that trusts visual evidence in English follows a false caption in Telugu. We measured the shift, located its signal, and steered the model back."

    situation: >
      Vision-language models must choose between visual evidence and text when
      the two conflict. That choice matters for safety. Hundreds of millions of
      people use Hindi, Telugu, and other languages with limited training and
      red-team data. In a clinical example, an X-ray may show a fracture while
      its report says there is none. A model can perceive the fracture yet repeat
      the false report. We had little evidence on whether safe conflict handling
      transfers from English to lower-resource languages.

    complication: >
      Raw text bias mixes two failures: following a false caption and failing to
      see the right answer at all. One average also hides model-language pairs
      that work in English and fail in Telugu. Abstention creates another risk.
      A model that refuses every question looks cautious but provides no visual
      value. Existing fixes require costly fine-tuning or contrastive decoding,
      while most earlier evaluations cover only English.

    resolution:
      benchmark: >
        We built and released four conflict datasets in English, Hindi, and Telugu.
        They cover natural scenes, physics renders, remote sensing, and rendered
        3D objects. NLLB-200-600M and Claude produced translations that people then
        checked. Each item is scored with and without a false caption. The resulting
        override gap and normalised override share separate caption-driven errors
        from basic failures of visual perception.
      evaluation: >
        We ran 10,260 conflict tests on nine open multilingual models, three
        languages, and four datasets. We found two language-dependent failures:
        text capture, where the caption wins, and abstention collapse, where the
        model refuses everything. Override share exposed unsafe behaviour hidden
        by refusal rates. Qwen2.5-VL-7B had the lowest raw text bias but the highest
        override share at 0.81, reversing the simple ranking.
      mechanistic_probing: >
        We cached each layer's residual-stream activation at the final prompt
        token. L2-regularised logistic probes with five-fold cross-validation
        then predicted whether the model followed the image or the text. The
        signal remained easy to decode even when behaviour worsened: peak accuracy
        was 0.97 in English and 0.92 in Telugu. The representation stayed strong
        while the model stopped acting on it.
      cross_lingual_steering: >
        We fit an abstain-versus-answer direction in English and injected it at
        middle layers through forward hooks. We varied its strength while guarding
        against unrelated perception errors, then transferred it to Hindi and
        Telugu. For models able to abstain, one English vector reduced steered text
        override to zero in every target language, with a 0.00 transfer gap. The
        method runs only at inference and needs no target-language labels. We
        released the MIT-licensed code and all four datasets.

    tech_stack:
      models: [InternVL3-2B/8B, Qwen2.5-VL-3B/7B, Qwen3-VL-8B, LLaVA-OneVision-7B, GLM-4.1V-9B-Thinking, Granite-Vision-3.3-2B, SEA-LION-v4-8B-VL]
      methods: [Contrastive activation steering, Linear probes, Logistic regression, Forward hooks]
      translation: [NLLB-200-600M, Claude, Gemini]
      datasets: [COCO-Counterfactuals, Pendulum, Remote-Sensing-VQA, 3D-Objects]
      languages: [English, Hindi, Telugu]

    metrics:
      models_evaluated: 9
      languages: 3
      datasets: 4
      conflict_evaluations: "10,260"
      probe_accuracy_telugu: 0.92
      max_override_share: 0.81
      transfer_gap_abstention: 0.00

    impact: >
      This is the first multilingual audit of cross-modal conflict that controls
      for visual perception. It shows where grounding fails beyond English. The
      override gap lets deployers and regulators identify the model-language pairs
      most likely to follow a false caption. It also shows that an inference-time
      direction learned in a high-resource language can transfer to lower-resource
      ones. The open benchmark, steering pipeline, and datasets support direct
      replication and further safety work.

    team_scale: "3 co-first authors"

    why_this: >
      Cross-modal conflict is usually tested only in English. I see it as a direct
      safety problem. A model becomes dangerous when it ignores sound visual
      evidence and follows false text. The people most exposed may use languages
      missing from current tests. This problem connects interpretability with
      low-resource NLP, and both fields need to test their claims together.

    surprise: >
      Behaviour and representation separated. Models followed false text more
      often in lower-resource languages, yet their internal signal remained almost
      as clear as in English. The model still represented the visual answer but
      stopped using it. The model retained the knowledge and failed to elicit it.

    next: >
      I will first test how far an honesty direction learned in one language
      transfers across many others and identify where it breaks. I will also develop
      a standard, perception-controlled audit of missed abstention across languages.
      The next goal is to add coverage guarantees, turning abstention into a bounded
      decision with a stated guarantee.

