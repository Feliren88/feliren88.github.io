  - id: multilingual-vlm-crossmodal-conflict
    title: "Do Multilingual VLMs Abstain Under Cross-Modal Conflict in Low-Resource Languages?"
    category: safety
    tags:
      - Vision-Language Models
      - Multilingual AI
      - AI Safety
      - Activation Steering
      - Cross-Modal Conflict
      - Apart Research
      - Hackathon
    venue: "Apart Research Global South AI Safety Hackathon (2026)"
    role: "Co-First Author, Benchmark & Steering Lead"
    link: "https://apartresearch.com/project/do-multilingual-visionlanguage-models-abstain-under-crossmodal-conflict-in-lowresource-languages-hcsp"
    keywords:
      - Multilingual vision-language models
      - Cross-modal conflict
      - Abstention safety
      - Low-resource languages
      - Hindi
      - Telugu
      - Contrastive activation steering
      - Override gap

    hook: "A model that trusts its eyes in English becomes a caption-follower in Telugu. We measured it, localized it, and steered it back."

    situation: >
      Vision-Language Models (VLMs) must arbitrate between visual evidence and a
      textual claim, a safety-critical decision when the two contradict. A model
      may safely abstain under cross-modal conflict in English, but hundreds of
      millions of people interact with multilingual VLMs in low-resource languages
      such as Hindi and Telugu, where both training data and red-teaming are
      scarce. The harm in high-stakes settings is concrete. An X-ray that depicts
      a fracture, paired with a report asserting no abnormality, can lead a model to
      silently adopt the false caption over its own correct perception. Whether
      cross-modal arbitration survives the shift to a low-resource language was
      largely unmeasured.

    complication: >
      Raw text-bias conflates two distinct failures. A model can follow a false
      caption, or it can never have perceived the correct answer in the first
      place. A single aggregate accuracy number hides exactly the cells that matter most, the model that trusts its eyes in English yet capitulates to
      false text in Telugu. Worse, abstention itself can collapse into a failure mode. A model that defaults to "unable to answer" looks cautious while
      sacrificing all visual utility. Existing mitigations rely on expensive
      fine-tuning or contrastive decoding, and almost all prior conflict
      evaluation is English-only.

    resolution:
      benchmark: >
        Built and open-sourced four multilingual cross-modal conflict datasets
        (English, Hindi, Telugu) spanning natural scenes, physics renders, remote
        sensing, and rendered 3D objects, with high-quality translations generated
        via NLLB-200-600M and Claude and verified by humans. Designed a paired perception-control benchmark in which every item is scored both with and without
        the counterfactual caption, yielding an "override gap" and a normalized
        "override share" that isolate genuine caption-driven override from baseline
        perceptual inability, a perception-corrected metric that re-ranks model
        safety.
      evaluation: >
        Evaluated nine open multilingual VLMs across three languages and four
        datasets (10,260 conflict evaluations), identifying two distinct,
        language-dependent failure modes, text capture (the caption wins) and
        abstention collapse (the model refuses everything). The override-share
        metric exposed "quietly unsafe" abstainers. Qwen2.5-VL-7B posts the
        lowest raw text-bias yet by far the highest override share (0.81),
        flipping the naive safety ranking.
      mechanistic_probing: >
        Cached last-prompt-token residual-stream activations per layer and fit
        L2-regularized logistic probes (5-fold CV) to decode image-faithful vs.
        text-following outcomes. The conflict signal stays strongly linearly
        decodable even where behaviour collapses (peak accuracy 0.97 in English
        and still 0.92 in Telugu), establishing a dissociation, where behaviour collapses along the resource axis while the representation does not.
      cross_lingual_steering: >
        Exploited that dissociation with cross-lingual contrastive activation steering by fitting an abstain-vs-assert direction in English, injecting it mid-depth through forward hooks, sweeping its strength under an off-target perception guard, and transferring it to Hindi and Telugu. For
        abstention-amenable models a single English-fit vector drives steered
        text-override to zero in every target language with a transfer gap of 0.00.
        The mitigation runs entirely at inference time, with no labels in the target
        language. Code (MIT) and all four datasets are released on GitHub and the
        Hugging Face Hub.

    tech_stack:
      models: [InternVL3-2B/8B, Qwen2.5-VL-3B/7B, Qwen3-VL-8B, LLaVA-OneVision-7B, GLM-4.1V-9B-Thinking, Granite-Vision-3.3-2B, SEA-LION-v4-8B-VL]
      methods: [Contrastive activation steering, Linear probes, Logistic regression, Forward hooks]
      translation: [NLLB-200-600M, Claude, Gemini]
      datasets: [COCO-Counterfactuals, Pendulum, Remote-Sensing-VQA, 3D-Objects]
      languages: [English, Hindi, Telugu]

    metrics:
      models_evaluated: 9
      languages: 3
      datasets: 4
      conflict_evaluations: "10,260"
      probe_accuracy_telugu: 0.92
      max_override_share: 0.81
      transfer_gap_abstention: 0.00

    impact: >
      Delivers the first multilingual, perception-controlled audit of cross-modal
      conflict in VLMs, showing that genuine visual grounding evaporates precisely
      in the low-resource languages that English-only evaluation never sees. The
      override-gap design gives deployers and regulators a concrete auditing
      instrument that names the most caption-suggestible model-by-language cells,
      and the cross-lingual steering result demonstrates a cheap, inference-time fix. An honesty direction estimated in a high-resource language transfers
      down the resource axis. Open-sourced benchmark, steering pipeline, and four
      datasets enable reproducible follow-up work on multilingual VLM safety.

    team_scale: "3 co-first authors"

    why_this: >
      Cross-modal conflict is usually studied as an English-only curiosity. What
      pulled me in was the safety framing. The moment a model stops trusting its
      eyes and starts obeying a false caption is exactly the moment it becomes
      dangerous, and the people most exposed to that failure speak the languages
      our evaluations ignore. The problem sits in the gap between interpretability
      and low-resource NLP, two communities that rarely test each other's claims,
      and that gap is where I think the tractable, neglected work hides.

    surprise: >
      The behaviour and the representation came apart. As we moved down the
      resource axis the models capitulated to false text far more often, yet the
      internal signal that separates trusting the image from following the caption
      stayed almost as decodable in a low-resource language as in English. The model
      still knew. It just stopped acting on what it knew. That dissociation, not the
      headline accuracy drop, is the result I keep thinking about, because it reframes
      the failure as one of elicitation rather than of knowledge.

    next: >
      Two directions. First, push the cross-lingual steering result from a hackathon
      proof into a real method, stress-testing how far an honesty direction fit in
      one language transfers across many and finding where it breaks. Second, treat
      this as the measurement gap it exposes, a standard, perception-controlled way
      to audit when a multimodal model should abstain and does not, across languages,
      so safety claims stop being English-shaped, and then put coverage guarantees on
      top so abstention is something you can bound rather than hope for.

