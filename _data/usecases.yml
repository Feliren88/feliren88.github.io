  - id: fraud-detection-pipeline
    title: Real-time fraud detection pipeline (GDP Labs)
    category: production
    tags:
      - Fraud Detection
      - Anomaly Detection
      - Graph Networks
      - Real-Time Inference
      - Kafka
      - Redis
      - Fintech
    venue: "GDP Labs (GLAIR.ai), Lead ML Engineer (2021, 2023)"
    role: Lead ML Engineer

    hook: |-
      I designed 1 real-time pipeline to detect account takeover, synthetic
      identities, and merchant collusion.

    situation: |-
      A high-volume payments platform faced 3 forms of fraud. Attackers took over
      accounts, created synthetic identities with false identity-check documents,
      and inflated merchant transactions through collusion. Each attack had
      different signals and timing. Therefore, the platform needed several detection
      methods.

    complication: |-
      The platform had less than a second to approve each transaction. However, full
      analysis of account and merchant connections took too long. Moreover, fraud
      made up less than 0.1% of traffic. Attackers also changed tactics in response
      to detection. Therefore, models using fixed patterns could become stale within
      weeks.

    resolution:
      architecture: |-
        I designed 3 detection stages. First, fast rules rejected known patterns
        in transaction rates, locations, or blocked devices. Then XGBoost scored
        features derived from transactions. Finally, a graph detector analysed
        connections between accounts and merchants. It found colluding merchants
        and groups of synthetic identities from this network structure.
      real_time_serving: |-
        Kafka ingested transaction events, while Redis served features calculated
        in advance. These included rolling transaction rates and each account’s
        usual behaviour. Therefore, separating feature calculations from inference
        allowed complex signals within the response-time limit.
      continuous_learning: |-
        The pipeline retrained continuously on labelled feedback from the fraud
        operations team. Staff supplied labels from resolved fraud cases.
        Moreover, monitoring tracked shifts in input features and model scores.
        These changes warned of shifts in fraud patterns between retraining
        cycles.

    tech_stack:
      models: [XGBoost, gradient boosting, graph anomaly detection]
      streaming: [Apache Kafka]
      feature_store: [Redis]
      frameworks: [Python, scikit-learn]
      infrastructure: [Docker, Kubernetes, AWS]

    impact: |-
      The system reduced fraudulent approvals and chargeback costs while protecting
      users and platform revenue. Moreover, its 3-stage design became the internal
      template for later fraud systems across the client portfolio.

