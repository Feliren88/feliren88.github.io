      - IEEE
      - Smart City
    venue: "ICISS 2021, IEEE"
    role: First Author
    doi: "10.1109/ICISS53185.2021.9533236"
    link: "https://ieeexplore.ieee.org/document/9533236/"
    keywords:
      - Plastic bag ban
      - Waste complaints
      - Hypothesis testing
      - Causal inference
      - e-government
      - Jakarta

    hook: "Used more than 100,000 citizen complaints to measure the effect of Jakarta's 2020 plastic bag ban."

    situation: >
      Jakarta banned retailers from distributing single-use plastic bags in 2020.
      Policymakers needed evidence that the ban worked before extending similar
      rules to other waste. No earlier quantitative study had used the city's own
      complaint platforms to measure its effect.

    complication: >
      The ban began during COVID-19 lockdowns, which also reduced shopping and
      waste. A simple before-and-after comparison would confuse the effects.
      The analysis had to control for mobility, economic activity, seasonal waste,
      and changes in complaint use.

    resolution:
      method: >
        Applied difference-in-differences (DiD) causal inference framework using
        NLP-classified citizen waste complaints from JAKI (Jakarta's official
        smart city complaint platform) and Qlue (a civic reporting platform).
        100,000+ complaint records classified by waste type using text
        classification, distinguishing plastic-specific complaints from
        general waste, sanitation, and other urban service complaints.
        Plastic-specific complaints serve as the treatment group; non-plastic
        waste complaints serve as the control group within the same platform
        and time period.
      confounders: >
        The analysis controlled for COVID-19 mobility using Google Community
        Mobility Reports, seasonal waste patterns, and changes in platform use.
        This separated real waste changes from changes in reporting behaviour.
      result: >
        Identified statistically significant reduction in plastic-specific
        complaints post-ban-implementation, controlling for pandemic confounders.
        Pre-registered hypotheses and transparent methodology presented at
        ICISS 2021.

    tech_stack:
      nlp: [Text classification, complaint taxonomy]
      causal: [Difference-in-differences, hypothesis testing]
      data: [JAKI, Qlue citizen complaint platforms]
      statistics: [Python statsmodels, R]
      records_analyzed: "100,000+"

    metrics:
      complaint_records: "100,000+"
      conference_attendees: 500
      venue: "ICISS 2021, IEEE, Bandung, Indonesia"

    impact: >
      This was the first quantitative evaluation of the ban using Jakarta's own
      complaint systems. The method can also test food-container bans, producer
      responsibility, and other city policies. I presented the work to more than
      500 international attendees at IEEE-sponsored ICISS 2021.

  # ──────────────────────────────────────────

  - id: aicity-qwen-vl
    title: "Qwen VL Fine-tuning for AI City Challenge 2026 Track 2"
    category: applied
    tags:
      - Vision-Language Models
      - LoRA Fine-tuning
      - Qwen2.5-VL
      - LLaMA-Factory
      - DeepSpeed
      - VLM Training
    venue: "AI City Challenge 2026, Track 2 (2026)"
    role: Lead ML Engineer
    keywords:
      - Vision-language model fine-tuning
      - Qwen2.5-VL-3B
      - LoRA adaptation
      - DeepSpeed ZeRO-2
      - AI City Challenge
      - Captioning

    hook: "Fine-tuned a three-billion-parameter vision-language model on one 14 GB GPU."

    situation: >
      AI City Challenge Track 2 required video-caption fine-tuning on one V100
      with 14 GB of memory. Qwen2.5-VL offered a strong baseline but needed task
      adaptation. The main engineering problem was fitting useful training within
      the hardware limit.

    complication: >
      Full fine-tuning could not fit the model and training state in 14 GB.
      Cluster networking also ruled out multi-GPU training. Multiple video frames
      made each sequence too large even with memory-saving settings. Conflicts
      between system libraries and project versions delayed training further.

    resolution:
      architecture: >
        I used LoRA to update a small part of the model while leaving most of its
        three billion parameters frozen. This cut training memory. I extended the context window for
        longer visual sequences and enabled gradient checkpointing, which recomputes
        intermediate values to save memory. Together, these changes made training
        fit on one GPU. The pipeline also supports multi-GPU scaling when available.
      dataset_optimization: >
        Redesigned the training data format to reduce memory consumption per
        training step. The original dataset structure packed multiple video frames
        per example, producing sequences that saturated GPU memory before training
        could begin. Reformatting to a single-frame-per-example structure preserved
        the task semantics while making each training step memory-safe, a data
        engineering decision that unblocked the entire fine-tuning run.
      environment_setup: >
        I isolated project dependencies from the cluster's system libraries and
        configured the GPU runtime. This removed version conflicts and made runs
        reproducible on the shared cluster.
      training_pipeline: >
        I automated data preparation, configuration, and training in one workflow.
        It reduced setup for each experiment and can transfer to other limited-GPU
        tasks. Training remained stable and converged within the 14 GB budget.

    tech_stack:
      model: [Qwen2.5-VL-3B-Instruct, LoRA]
      framework: [LLaMA-Factory, DeepSpeed ZeRO-2]
      training: [PyTorch 2.5.1+cu121, peft, transformers]
      infrastructure: [V100 14GB, CUDA 12.5]
      hyperparams:
        lora_rank: 16
        lora_alpha: 4
        cutoff_len: 8192
        batch_size: 1
        learning_rate: 1.0e-4
        gradient_checkpointing: true
        epochs: 3

    metrics:
      train_loss: 1.46
      training_time_minutes: 1.75
      epochs_completed: 3
      samples: 5
      gpu_memory_gb: 14

    impact: >
      The project provides a reproducible method for fine-tuning large
      vision-language models on limited academic or consumer hardware. It combines
      parameter-efficient training, memory-safe data, isolated dependencies, and
      an automated pipeline. The outputs include adapted weights and a reusable
      caption-training workflow.

  # ──────────────────────────────────────────

  - id: vln-conformal-prediction
    title: "Conformal Prediction for Vision-and-Language Navigation in Discrete Graphs"
    category: safety
    tags:
      - Conformal Prediction
      - Vision-Language Navigation
      - Uncertainty Quantification
      - VLN-DUET
      - VLN-HAMT
      - Human-in-the-Loop

    venue: "Thesis Research, VLN-DUET Uncertainty Propagation (2026)"
    role: Lead Researcher
    keywords:
      - Conformal prediction
      - Vision-and-language navigation
      - Uncertainty quantification
      - VLN-DUET
      - VLN-HAMT
      - Recurrent VLN-BERT
      - R2R and REVERIE datasets
      - Prediction sets
      - Human-in-the-loop help-seeking

    hook: "A parameter-free rescaling turns an overconfident navigation policy into a calibrated signal for when to ask for help."

    situation: >
      Navigation agents often make confident wrong moves in unfamiliar buildings.
      Early errors then compound until the route fails. A deployed agent needs a
      calibrated rule for asking a person for help. Conformal prediction can
      guarantee that the correct action lies in a prediction set at a chosen risk
      level. It had not been validated on the sharp, sequential probabilities
      produced by modern navigation transformers.

    complication: >
      Standard conformal scores fail here for two reasons. First, trained policies
      put 0.80–0.84 mean probability on their top action in R2R val-unseen. Scores
      then crowd near zero, and thresholds stop responding to the chosen risk.
      Second, steps within a route depend on each other, while split conformal
      prediction assumes exchangeable calibration units. Deployment also shifts
      from seen to unseen buildings. A valid fix must work across model designs,
      transfer beyond one benchmark, and support a clear human-help rule.

    resolution:
      score: >
        I normalise each nonconformity score by dividing it by one plus the policy's
        residual confidence. Calibration uses the maximum score for a whole episode.
        The method adds no weights or inference delay. It restores sensitivity to
        the chosen risk level where the raw score had saturated.
      guarantee: >
        I proved that the normalised score gives sequence-level conformal
        calibration for variable-length graph navigation. Under episode-level
        exchangeability, the prediction set covers the correct action across the
        full route at every risk level. Dependence between steps does not break the
        guarantee. A learned weight also works but needs another calibration split
        and adds little after the confidence floor.
      cross_architecture_validation: >
        I tested four transformer backbones and three base scores. All 36 settings
        met their coverage target. Thresholds also transferred across all backbone
        pairs because the rescaling put different policies on one confidence scale.
        A transferred threshold can initialise a new platform before local calibration.
      generalisation_and_deployment: >
        I extended the test to remote object grounding. The navigation guarantee
        held under the new goal, while object grounding needed a small local
        calibration split under shift. I then connected the prediction set to a
        help-seeking policy. It asked a person only on flagged steps, raised success
        from 71% to 91%, and beat an uncalibrated cutoff at the same query budget.

    tech_stack:
      frameworks: [PyTorch, DeepSpeed ZeRO-2]
      vln_models: [VLN-DUET, VLN-HAMT, Recurrent VLN-BERT]
      conformal_methods: [THR, APS, RAPS, Split Conformal Prediction]
      datasets: [R2R, REVERIE]
      evaluation: [Whole-trajectory coverage, Threshold transfer, Closed-loop help-seeking]
      hardware: [A40, V100]

    metrics:
      backbones_evaluated: 4
      base_scores_evaluated: 3
      configurations_covering_target: "36/36"
      cross_backbone_pairs_covering_target: "12/12"
      benchmarks_validated: 2
      help_seeking_success_lift: "71% to 91%"

    impact: >
      One parameter-free rescaling restored valid, risk-sensitive uncertainty
      without a learned or temporal correction. The proof holds across model
      designs, and the result transfers to a second benchmark. In closed-loop
      tests, a person answered only flagged steps and recovered most of the gap
      to full supervision with far fewer queries.

