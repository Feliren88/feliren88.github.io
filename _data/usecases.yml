  - id: mining-footprint-segmentation
    title: Mining footprint detection with multi-modal satellite data
    category: geospatial
    tags:
      - Multi-Modal Fusion
      - Semantic Segmentation
      - SAR
      - DEM
      - Foundation Models
      - Land Use
    venue: "Remote Sensing of Environment, vol. 318, 2025, Q1 (IF 11.4)"
    role: Co-Author
    doi: "10.1016/j.rse.2024.114584"
    link: "https://doi.org/10.1016/j.rse.2024.114584"
    keywords:
      - Global mining footprints
      - Semantic segmentation
      - Multispectral
      - Deep learning
      - SAR
      - Geospatial foundation models

    hook: |-
      We published the first use of a geospatial foundation model to map mining
      footprints at continental scale.

    situation: |-
      Regulators need accurate mining boundaries to check compliance and plan land
      rehabilitation. In Australia, GIS analysts took months to map each region’s
      active and historical sites by hand. Therefore, the cost made continuous
      national monitoring impractical.

    complication: |-
      Sentinel-2 images alone give unreliable mining boundaries. Clouds interrupt
      images over time, while disturbed land can resemble bare soil or dry plants.
      Moreover, optical sensors miss work underground or below tree cover.
      Sentinel-1 radar and elevation data provide further evidence. However, inputs
      differ in size and timing, and sites vary in ore type and biome. The model
      must combine these inputs while preserving those differences.

    resolution:
      architecture: |-
        We built a pipeline combining images, radar, and terrain data. Its inputs
        included 13-band Sentinel-2 images, Sentinel-1 VV/VH radar, and elevation
        with slope. Separate encoders extracted and aligned features from each
        source before combining them. Moreover, we fine-tuned NASA and IBM’s
        Prithvi model to mark mining areas. Prithvi is a geospatial foundation
        model, trained broadly on satellite data for later specialised tasks. This
        was the first published use of a geospatial foundation model for mining
        segmentation.
      data_pipeline: |-
        I built pipelines to ingest and prepare more than 500 GB of labelled
        multispectral images. These images came from Google Earth Engine and
        recorded several light wavelengths. Moreover, I coordinated annotation
        with geographers at the University of Queensland, UCL, and the University
        of Nottingham. Agreement checks maintained label quality across ore types
        and biomes.
      temporal_change: |-
        We compared image stacks spanning several years to separate active mines
        from rehabilitated or historically disturbed land. This distinction has
        direct legal and financial importance under Australian regulation.

    tech_stack:
      frameworks: [TensorFlow, PyTorch]
      remote_sensing: [Google Earth Engine, Sentinel-1, Sentinel-2, DEM]
      foundation_models: [Prithvi (NASA/IBM)]
      data_volume_gb: 500

    impact: |-
      The pipeline replaces months of manual GIS analysis with automated maps after
      each satellite update. Therefore, it supports compliance and rehabilitation
      work across large mining regions. Uses include Australian state regulation and
      international mining companies’ environmental, social, and governance (ESG)
      reporting.

    collaborators:
      - institution: "Monash University"
        role: "Primary host (A/Prof Risqi U. Saputra, Prof Alex Lechner)"
      - institution: "University of Queensland"
        role: "Remote sensing science and annotation"
      - institution: "UCL"
        role: "Annotation and domain expertise"
      - institution: "University of Nottingham"
        role: "Annotation and domain expertise"

