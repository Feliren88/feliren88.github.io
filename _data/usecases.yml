  - id: flood-urban-resilience
    title: Flood policy evaluation, retention pond effectiveness in South Bandung
    category: geospatial
    tags:
      - Flood Mitigation
      - Policy Evaluation
      - NDWI
      - Mixed Methods
      - Urban Resilience
    venue: "AQUA, Water Infrastructure, Ecosystems and Society, 2025, Q2"
    role: Contributor
    doi: "10.2166/aqua.2025.292"
    keywords:
      - Deep learning flood segmentation
      - Flood mitigation
      - Flood policy
      - NDWI
      - Sustainability
      - Urban resilience

    hook: "Do retention ponds actually reduce flooding? We answered it with satellites and causal stats."

    situation: >
      Urban flood management policy in Indonesian cities relies heavily on
      retention pond construction as a primary mitigation instrument, yet rigorous
      quantitative evaluation of their effectiveness at the city scale is rarely
      conducted prior to large-scale replication.

    complication: >
      Urban flood interventions are seldom evaluated with causal rigour, construction
      volume is treated as a proxy for effectiveness. The confounding problem is severe. Retention pond implementation coincides with seasonal rainfall variation,
      upstream catchment changes, and ongoing expansion of impervious surface cover
      across the city, all of which independently alter flood frequency. A naive
      before-after comparison would misattribute any observed reduction to the
      intervention when the causal signal is fundamentally ambiguous. Policy
      replication at city scale required defensible quantitative evidence, not
      directional narratives from anecdotal post-project reports.

    resolution:
      approach: >
        Mixed-methods evaluation combining deep learning-based flood segmentation
        (applying the ProCANet framework) with NDWI-derived flood extent mapping
        across South Bandung catchments, integrated with qualitative policy
        document analysis. Provided quantitative evidence of retention pond
        effectiveness before and after infrastructure intervention.
      significance: >
        Bridges the gap between ML-based earth observation and evidence-based
        urban policy, translating pixel-level segmentation outputs into
        measurable policy KPIs that city planners can act on.

    tech_stack:
      frameworks: [Python, Google Earth Engine]
      indices: [NDWI]
      methods: [Deep learning segmentation, mixed-methods policy analysis]

