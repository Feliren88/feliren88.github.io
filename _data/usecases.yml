  - id: aicity-qwen-vl
    title: "Qwen VL Fine-tuning for AI City Challenge 2026 Track 2"
    category: applied
    tags:
      - Vision-Language Models
      - LoRA Fine-tuning
      - Qwen2.5-VL
      - LLaMA-Factory
      - DeepSpeed
      - VLM Training
    venue: "AI City Challenge 2026, Track 2 (2026)"
    role: Lead ML Engineer
    keywords:
      - Vision-language model fine-tuning
      - Qwen2.5-VL-3B
      - LoRA adaptation
      - DeepSpeed ZeRO-2
      - AI City Challenge
      - Captioning

    hook: |-
      I fine-tuned a vision-language model with 3 billion parameters on 1 GPU with
      14 GB of memory.

    situation: |-
      AI City Challenge Track 2 required video-caption fine-tuning on 1 V100 with 14
      GB of memory. Qwen2.5-VL offered a strong baseline, yet needed training for
      this task. Therefore, I needed to fit useful training within the hardware
      limit.

    complication: |-
      Full fine-tuning could not fit the model and training state in 14 GB.
      Moreover, cluster networking ruled out multi-GPU training. Multiple video
      frames made each sequence too large even with memory-saving settings.
      Meanwhile, conflicts between system libraries and project versions delayed
      training.

    resolution:
      architecture: |-
        I used LoRA to train small added weights while freezing most of the
        model’s 3 billion parameters. This reduced training memory. Moreover, I
        extended the context window for longer visual sequences. I enabled
        gradient checkpointing, which recomputes intermediate values to save
        memory. Together, these changes made training fit on 1 GPU. The pipeline
        also supports training across multiple GPUs when available.
      dataset_optimization: |-
        I changed the training data format to reduce memory use per step.
        Originally, each example contained multiple video frames. The resulting
        sequences filled GPU memory before training could start. Therefore, I
        changed the format to use 1 frame per example. This preserved the task’s
        meaning and kept each training step within memory limits. As a result, the
        fine-tuning run could proceed.
      environment_setup: |-
        I isolated project dependencies from the cluster’s system libraries and
        configured the GPU runtime. As a result, I removed version conflicts and
        made runs reproducible on the shared cluster.
      training_pipeline: |-
        I automated data preparation, configuration, and training in 1 workflow.
        This reduced setup for each experiment. Moreover, the workflow can
        transfer to other tasks with limited GPU access. Training stayed stable
        and converged within the 14 GB budget.

    tech_stack:
      model: [Qwen2.5-VL-3B-Instruct, LoRA]
      framework: [LLaMA-Factory, DeepSpeed ZeRO-2]
      training: [PyTorch 2.5.1+cu121, peft, transformers]
      infrastructure: [V100 14GB, CUDA 12.5]
      hyperparams:
        lora_rank: 16
        lora_alpha: 4
        cutoff_len: 8192
        batch_size: 1
        learning_rate: 1.0e-4
        gradient_checkpointing: true
        epochs: 3

    metrics:
      train_loss: 1.46
      training_time_minutes: 1.75
      epochs_completed: 3
      samples: 5
      gpu_memory_gb: 14

    impact: |-
      The project provides a reproducible method for fine-tuning large
      vision-language models on limited academic or consumer hardware. It combines
      training of small added weights, data that fit memory, isolated dependencies,
      and an automated pipeline. Moreover, the outputs include adapted weights and a
      reusable caption-training workflow.

