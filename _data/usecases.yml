  - id: flood-urban-resilience
    title: Flood policy evaluation, retention pond effectiveness in South Bandung
    category: geospatial
    tags:
      - Flood Mitigation
      - Policy Evaluation
      - NDWI
      - Mixed Methods
      - Urban Resilience
    venue: "AQUA, Water Infrastructure, Ecosystems and Society, 2025, Q2"
    role: Contributor
    doi: "10.2166/aqua.2025.292"
    keywords:
      - Deep learning flood segmentation
      - Flood mitigation
      - Flood policy
      - NDWI
      - Sustainability
      - Urban resilience

    hook: "We used satellite data and causal analysis to test whether retention ponds reduce flooding."

    situation: >
      Indonesian cities rely on retention ponds to reduce floods. Yet cities rarely
      measure their effect rigorously before building more of them at scale.

    complication: >
      The number of ponds built is often used as a stand-in for actual results.
      That is weak evidence. Rainfall, upstream changes, and expanding paved areas
      also affect flood rates. A simple before-and-after comparison can credit the
      ponds for changes caused elsewhere. City-wide policy requires evidence that
      separates the intervention from these other causes.

    resolution:
      approach: >
        We combined ProCANet flood segmentation with NDWI flood maps across South
        Bandung catchments. We then paired the satellite results with policy
        document analysis. This produced quantitative evidence of flood extent
        before and after pond construction.
      significance: >
        The study turns pixel-level satellite results into policy measures that
        city planners can use to judge flood projects.

    tech_stack:
      frameworks: [Python, Google Earth Engine]
      indices: [NDWI]
      methods: [Deep learning segmentation, mixed-methods policy analysis]

