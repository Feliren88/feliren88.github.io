        Video frames remain on the device. Symptom self-reporting via structured mobile form
        provides complementary clinical signal.
      optimization: >
        Model quantized and optimized for ARM CPU inference on target chipset
        range. Evaluated inference latency and accuracy tradeoff across
        quantization levels (FP32, FP16, INT8) on physical device testing.
      privacy: >
        GDPR-compliant by design, so zero raw biometric data leaves the device.
        Data transmission limited to aggregated vital sign estimates and
        structured symptom reports.

