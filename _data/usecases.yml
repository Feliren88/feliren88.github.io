  - id: flood-urban-resilience
    title: Flood policy evaluation, retention pond effectiveness in South Bandung
    category: geospatial
    tags:
      - Flood Mitigation
      - Policy Evaluation
      - NDWI
      - Mixed Methods
      - Urban Resilience
    venue: "AQUA, Water Infrastructure, Ecosystems and Society, 2025, Q2"
    role: Contributor
    doi: "10.2166/aqua.2025.292"
    keywords:
      - Deep learning flood segmentation
      - Flood mitigation
      - Flood policy
      - NDWI
      - Sustainability
      - Urban resilience

    hook: |-
      We used satellite maps and policy analysis to assess whether retention ponds
      reduce flooding.

    situation: |-
      Indonesian cities use retention ponds to hold water and reduce floods.
      However, they rarely measure the ponds’ effects rigorously before building
      more at scale.

    complication: |-
      Cities often count completed ponds as evidence of success. However, that count
      gives weak evidence of reduced flooding. Rainfall, upstream changes, and
      expanding paved areas also affect flood rates. Therefore, a simple
      before-and-after comparison can credit ponds for changes caused elsewhere.
      City-wide policy needs evidence that separates the ponds’ effects from these
      other causes.

    resolution:
      approach: |-
        We used ProCANet to mark flooded areas and NDWI water-index maps across
        South Bandung catchments. Then, we paired these satellite results with
        policy document analysis. Together, they provided quantitative evidence of
        flood extent before and after pond construction.
      significance: |-
        The study translates satellite results for individual pixels into measures
        of policy outcomes. Therefore, city planners can use those measures to
        judge flood projects.

    tech_stack:
      frameworks: [Python, Google Earth Engine]
      indices: [NDWI]
      methods: [Deep learning segmentation, mixed-methods policy analysis]

