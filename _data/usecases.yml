  - id: gg-ez-regional-adaptation
    title: "GG-EZ: regional adaptation framework for vision-language models in SEA"
    category: cultural
    tags:
      - VLMs
      - Cultural AI
      - Regional Adaptation
      - Diffusion Models
      - Knowledge Distillation
      - Under Review
    venue: "Under Review + arXiv preprint 2026"
    role: "Lead, Diffusion Model Arm"
    arxiv: "https://arxiv.org/abs/2604.11490"
    keywords:
      - Vision-language models
      - Cultural adaptation
      - Southeast Asia
      - Retrieval-augmented generation
      - Fine-tuning
      - Anthropogenic priors

    hook: "Adapted image generation for Southeast Asia while retaining more than 98% of global benchmark quality."

    situation: >
      General-purpose models such as LLaVA, InternVL, Phi-Vision, and SDXL often
      misidentify Southeast Asian food, scripts, and traditions. Full retraining
      on regional data is expensive and usually requires proprietary data that
      local teams do not have.

    complication: >
      We asked whether targeted adaptation could improve cultural accuracy without
      full retraining, and how small that intervention could be. The answer depends
      on where cultural knowledge sits in model weights and how efficiently we can
      change it. Automated scores cannot judge cultural accuracy alone, so the
      evaluation also required expert regional raters.

    resolution:
      framework: >
        We proposed Anthropogenic Regional Adaptation, based on the claim that
        structured regional knowledge can teach cultural context without raw scale.
        We tested curated retrieval, targeted regional fine-tuning, and systematic
        evaluation of cultural accuracy.
      diffusion_arm: >
        I led the image-generation work. I fine-tuned the model on curated
        Southeast Asian images, then merged its weights with the original model
        at several ratios. This let us control regional accuracy against global
        image quality. Regional raters scored cultural accuracy at 1.569 versus
        a 1.491 baseline. Automated tests retained more than 98% of global quality.
        Regional adaptation did not require a comparable loss in general ability.
      evaluation: >
        Regional annotators scored cultural accuracy, while DPG-Bench measured
        global image quality. We tracked both for every variant to map regional
        gains against global losses.

    tech_stack:
      models: [SDXL, LLaVA, InternVL, Phi-Vision]
      training: [PyTorch, diffusers]
      evaluation: [DPG-Bench, human evaluation, RAG scaffolds]
      hyperparams:
        batch_size: 32
        learning_rate: 1.0e-5
        epochs: 4
        vae: frozen

    metrics:
      cultural_correctness_adapted: 1.569
      cultural_correctness_baseline: 1.491
      global_benchmark_retention_pct: 98.0

    impact: >
      The work provides a reproducible and affordable method for regional model
      adaptation. Retaining more than 98% of global quality shows that stronger
      Southeast Asian performance need not remove general ability. That result
      strengthens the case for localisation in commercial AI labs.

