      - GDPR Compliance
      - Low Bandwidth
      - Hackathon
    venue: "CamvsCovid, Cambridge Judge Business School, Top 3 Globally (2020)"
    role: Lead ML Engineer
    duration_hours: 72
    keywords:
      - Remote patient monitoring
      - Edge inference
      - Respiratory rate estimation
      - COVID-19
      - Indonesia
      - GDPR

    hook: "COVID-19 vitals monitoring on a 2G connection, no cloud, no smartphone. Top 3, Cambridge."

    situation: >
      During the COVID-19 pandemic surge (early 2020), Indonesian public hospitals
      faced patient overflow that required monitoring high-risk home-isolated
      patients remotely. Standard telemonitoring systems assumed broadband
      connectivity and expensive hardware (pulse oximeters, ECG patches),
      neither assumption held for the majority of Indonesia's population, where
      rural broadband penetration was below 30% and healthcare hardware supply
      chains were disrupted.

    complication: >
      Camera-based vitals estimation (respiratory rate via chest motion analysis)
      is computationally expensive if inference runs server-side, the video
      stream alone would overwhelm rural 2G/3G connections. On-device inference
      on consumer smartphones (low-end Android, 2017-2019 chipsets) requires
      aggressive model compression and runtime optimization. GDPR-equivalent
      patient privacy requirements prohibit raw video transmission to cloud
      servers, which turns on-device inference into a hard compliance
      requirement on top of its bandwidth savings.

    resolution:
      architecture: >
        Designed an edge-first architecture, with respiratory rate estimation via optical flow analysis on chest region (bounding box from lightweight
        pose estimation) running entirely on-device. Only the derived vital
        sign estimate (a single float, not video frames) is transmitted to the
        monitoring dashboard. Symptom self-reporting via structured mobile form
        provides complementary clinical signal.
      optimization: >
        Model quantized and optimized for ARM CPU inference on target chipset
        range. Evaluated inference latency and accuracy tradeoff across
        quantization levels (FP32, FP16, INT8) on physical device testing.
      privacy: >
        GDPR-compliant by design, so zero raw biometric data leaves the device.
        Data transmission limited to aggregated vital sign estimates and
        structured symptom reports.

    tech_stack:
      inference: [On-device (ARM CPU), optical flow, pose estimation]
      optimization: [Model quantization (INT8/FP16), OpenCV]
      connectivity: [2G/3G compatible (minimal data transmission)]
      frameworks: [Python, OpenCV, TensorFlow Lite]

    metrics:
      global_placement: "Top 3 (out of hundreds of international submissions)"
      competition: "University of Cambridge (15 finalist teams)"

    impact: >
      Top 3 globally at Cambridge's international COVID-19 innovation challenge.
      Validated the edge-first AI healthcare architecture for emerging markets,
      a design pattern that has since been adopted across multiple global health
      AI deployment contexts where bandwidth and hardware constraints are binding.
      Demonstrated that GDPR-compliant vitals monitoring is achievable on
      commodity 2019-era smartphones at 2G data rates.

