  - id: eccv-workshop-qwen-vl
    title: "Qwen VL Fine-tuning for AI City Challenge 2026 Track 2"
    category: ongoing
    tags:
      - Vision-Language Models
      - LoRA Fine-tuning
      - Qwen2.5-VL
      - LLaMA-Factory
      - DeepSpeed
      - VLM Training
      - ECCV 2026
    venue: "AI City Challenge 2026 Track 2 -- ECCV Workshop (2026)"
    role: Lead ML Engineer
    keywords:
      - Vision-language model fine-tuning
      - Qwen2.5-VL-3B
      - LoRA adaptation
      - DeepSpeed ZeRO-2
      - AI City Challenge
      - Captioning

    situation: >
      The AI City Challenge Track 2 requires fine-tuning vision-language models
      for video captioning tasks under compute-constrained environments (single
      V100 GPU with 14GB memory). General-purpose VLMs like Qwen2.5-VL achieve
      strong baseline performance but require task-specific adaptation for
      domain-specific captioning quality. The constraint environment demands
      careful memory management and optimization to achieve meaningful fine-tuning
      within hardware limits.

    complication: >
      Fine-tuning Qwen2.5-VL-3B on a 14GB GPU presents multiple technical
      challenges: standard full-parameter fine-tuning exceeds GPU memory on
      even a single forward pass, multi-GPU training is blocked by cluster-level
      TCP port exhaustion, and naive LoRA configurations fail due to sequence
      length issues (caption_train_small.json had multiple image segments per
      sample creating sequences too long for GPU memory). Additional challenges
      include system-wide PyTorch vs. venv torch conflicts and CUDA version
      mismatches between the cluster environment and PyTorch installation.

    resolution:
      architecture: >
        Implemented LoRA fine-tuning on Qwen2.5-VL-3B-Instruct using LLaMA-Factory
        framework with LoRA rank 16, LoRA alpha 4, targeting all layers. Cutoff
        length increased from 4096 to 8192 to accommodate longer sequences.
        Gradient checkpointing enabled for memory optimization. DeepSpeed ZeRO-2
        configuration prepared for multi-GPU scaling when cluster port issues resolve.
      dataset_optimization: >
        Created caption_train_tiny.json with simplified format (single image per
        sample instead of multiple segments) to reduce sequence length while
        preserving task semantics. This resolved the CUDA OOM on first forward pass
        issue that prevented training from starting.
      environment_setup: >
        Configured dedicated Python 3.11 venv with PyTorch 2.5.1+cu121, peft,
        transformers, deepspeed. Set CUDA_HOME=/usr/local/cuda-12.5 for correct
        CUDA bindings, PYTHONPATH to venv site-packages first to avoid system torch
        conflict, and PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True for better
        memory fragmentation handling. NCCL_SOCKET_IFNAME=lo configured to avoid
        multi-GPU port conflicts.
      training_pipeline: >
        Implemented automated training script (train_qwen.py) that generates
        dataset_info.json, train_caption.yaml, and ds_zero2.json configs, then
        executes LLaMA-Factory training with proper environment isolation.
        Achieved stable training with train loss ~1.46 after 3 epochs on simplified
        dataset, training time ~1:42 minutes.

    tech_stack:
      model: [Qwen2.5-VL-3B-Instruct, LoRA]
      framework: [LLaMA-Factory, DeepSpeed ZeRO-2]
      training: [PyTorch 2.5.1+cu121, peft, transformers]
      infrastructure: [V100 14GB, CUDA 12.5]
      hyperparams:
        lora_rank: 16
        lora_alpha: 4
        cutoff_len: 8192
        batch_size: 1
        learning_rate: 1.0e-4
        gradient_checkpointing: true
        epochs: 3

    metrics:
      train_loss: 1.46
      training_time_minutes: 1.75
      epochs_completed: 3
      samples: 5
      gpu_memory_gb: 14

    impact: >
      Establishes a reproducible LoRA fine-tuning pipeline for Qwen VL models
      under constrained compute environments. The resolved issues (venv environment
      conflicts, CUDA configuration, dataset sequence length optimization,
      memory fragmentation handling) form a practical playbook applicable to
      any VLM fine-tuning task on resource-limited GPU clusters. Outputs include
      ready-to-use LoRA adapters and training scripts for downstream captioning
      applications.

  # ──────────────────────────────────────────

  - id: vln-conformal-prediction
    title: "Conformal Prediction for Vision-and-Language Navigation (DUET + HAMT)"
    category: ongoing
    tags:
      - Conformal Prediction
      - Vision-Language Navigation
      - Uncertainty Quantification
      - VLN-DUET
      - VLN-HAMT
      - Score Functions
      - ICRA 2027
    venue: "Thesis Research -- VLN-DUET Uncertainty Propagation (2026)"
    role: Lead Researcher
    keywords:
      - Conformal prediction
      - Vision-and-language navigation
      - Uncertainty quantification
      - VLN-DUET
      - VLN-HAMT
      - R2R dataset
      - Prediction sets

    situation: >
      Vision-and-Language Navigation (VLN) agents operating in unseen environments
      require calibrated uncertainty estimates to know when to defer to human
      oversight. A navigation agent that is 70% confident may be catastrophically
      wrong -- high confidence does not guarantee correctness. Conformal Prediction
      (CP) offers distribution-free coverage guarantees but requires systematic
      evaluation across multiple VLN architectures and uncertainty propagation
      formulations to determine which methods actually improve set efficiency
      without sacrificing coverage.

    complication: >
      Evaluating CP for VLN requires navigating three compounding challenges:
      (1) Multiple VLN architectures with fundamentally different action spaces
      (DUET's topological graph vs. HAMT's local candidate space) make fair
      comparison non-trivial, (2) VLN's short trajectories (mean 6-8 steps) are
      structurally incompatible with temporal uncertainty propagation methods
      designed for long-horizon tasks, and (3) 21 propagation formulations must
      be systematically benchmarked to distinguish genuine improvements from
      hyperparameter artifacts. Additionally, the codebase must support two
      navigation backends (VLN-DUET, VLN-HAMT) with a unified CLI, handling
      environment conflicts between DUET's and HAMT's Python dependencies.

    resolution:
      methodology: >
        Implemented end-to-end conformal prediction runner (conformal_vln.py)
        supporting DUET and HAMT backends with matched action spaces via
        `--action_space full/local` switch on DUET. Score functions (THR/APS/RAPS)
        run automatically; intervention modes (observe, set_restrict) enable
        coverage vs. intervention trade-off analysis.
      propagation_benchmark: >
        Designed and executed systematic benchmark of 21 uncertainty propagation
        formulations across 3 VLN architectures and 4 alpha levels. Key finding:
        16 of 21 temporal propagation formulations catastrophically inflate
        prediction set sizes (mean 17-38 actions, saturating the full action
        space) on finite-horizon VLN trajectories. Root cause: VLN's short
        trajectories prevent running-average methods (EMA, ACI) from converging
        and cause control-based methods (PID) to overshoot.
      score_augmentation: >
        Discovered that augmenting the base THR nonconformity score with a
        log-prob penalty term `s(a) = (1 - p_a) + w * (-log p_a)` improves
        set efficiency by 18-47% across all tested models while maintaining
        valid coverage guarantees. The improvement is architecture-invariant
        because the penalty is a monotonic transformation of the softmax output.
      codebase: >
        Built unified codebase (`output_v6/`) supporting both DUET and HAMT
        with DeepSpeed integration for efficient calibration, multi-backend
        experiment orchestration, and a propagation pipeline running ~24h per
        full configuration. Resolved environment conflicts via modular import
        isolation (`_hamt_module_context`) to prevent DUET's `r2r` package
        from shadowing HAMT's dependencies.

    tech_stack:
      frameworks: [PyTorch, DeepSpeed ZeRO-2]
      vln_models: [VLN-DUET, VLN-HAMT]
      conformal_methods: [THR, APS, RAPS, Conformal Prediction]
      propagation_formulations: "21 formulations (EMA, CumulMax, ACI, PID, entropy-family, etc.)"
      datasets: [R2R, R4R, REVERIE, SOON]
      evaluation: [Coverage guarantees, Set size, Intervention rate]
      hardware: [A40, V100]

    metrics:
      architectures_tested: 3
      propagation_formulations: 21
      alpha_levels: 4
      efficiency_improvement_pct: "18-47"
      mean_set_size_baseline: 1.9
      mean_set_size_logprob_penalty: 1.38
      trajectory_length_mean: 7
      calibration_runtime_hours: 24

    impact: >
      Provides the first systematic CP evaluation across multiple VLN architectures,
      establishing which uncertainty quantification methods work and why most
      temporal propagation approaches fail on VLN's short-horizon trajectories.
      The log-prob penalty finding -- that simple score augmentation outperforms
      complex temporal propagation -- is a counterintuitive and publication-worthy
      result for ICRA 2027. The codebase enables reproducible benchmarking for
      future VLN uncertainty research.

