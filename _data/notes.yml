# Research notes distinguish the paper's result from my question.
# Newest first.

- title: "What does a factuality guarantee assume about the next question?"
  paper: "Language Models with Conformal Factuality Guarantees"
  authors: "Christopher Mohri, Tatsunori Hashimoto"
  venue: "ICML"
  year: "2024"
  link: "https://arxiv.org/abs/2402.10978"
  date: "Jun 2026"
  finding: >
    Mohri and Hashimoto make language model answers less specific until a test
    against held-out examples meets a chosen factuality target. Their guarantee
    requires the held-out and future cases to be exchangeable, meaning their
    order does not change the joint distribution. It also requires a sound rule
    for backing off to a less specific answer.
  question: >
    What happens when an agent's later questions depend on its earlier actions,
    or when deployment inputs differ from the calibration cases? A useful
    stopping rule needs a clear account of where its guarantee still applies.

- title: "Do honesty probes carry across languages?"
  paper: "Representation Engineering: A Top-Down Approach to AI Transparency"
  authors: "Andy Zou et al."
  venue: "arXiv"
  year: "2023"
  link: "https://arxiv.org/abs/2310.01405"
  date: "Jun 2026"
  finding: >
    Zou and colleagues identify patterns in a model's internal states that can
    help monitor and change behaviours including honesty and harmlessness.
  question: >
    Their paper does not establish whether a pattern found in one language
    works in another. That transfer needs direct testing on Indonesian and
    other underrepresented languages before the pattern can be trusted as a
    general monitor.
