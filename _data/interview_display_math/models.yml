transformers:
  'transformer/embedding': 'X=\operatorname{Embedding}(\mathrm{tokens})\sqrt{d_{\mathrm{model}}}+\mathrm{PE}'
  'transformer/head': '\mathrm{head}_{i}=\operatorname{Attention}(QW_i^Q,KW_i^K,VW_i^V)'
  'transformer/score': 'QK^{\top}'
  'transformer/scaled-score': '\frac{QK^{\top}}{\sqrt{d_k}}'
  'transformer/mask': '\mathrm{score}_{ij}\gets-\infty\quad\text{for }j>i'
  'transformer/weights': 'A=\operatorname{softmax}\left(\frac{QK^{\top}}{\sqrt{d_k}}\right)'
  'transformer/mix': 'AV'
  'transformer/concat': '\operatorname{Concat}(\mathrm{head}_1,\ldots,\mathrm{head}_h)'
  'transformer/multihead': '\operatorname{MultiHead}(Q,K,V)=\operatorname{Concat}(\mathrm{head}_1,\ldots,\mathrm{head}_h)W^O'
  'transformer/input': 'x'
  'transformer/pre-attention': '\operatorname{MultiHead}(\operatorname{LayerNorm}(x))'
  'transformer/attention': '\operatorname{MultiHead}(x)'
  'transformer/pre-residual': 'x+\operatorname{MultiHead}(\operatorname{LayerNorm}(x))'
  'transformer/post-residual': '\operatorname{LayerNorm}(x+\operatorname{MultiHead}(x))'
  'transformer/relu': '\max(0,xW_1+b_1)'
  'transformer/ffn': '\operatorname{FFN}(x)=\max(0,xW_1+b_1)W_2+b_2'
  'transformer/pre-ffn': 'x+\operatorname{FFN}(\operatorname{LayerNorm}(x))'
  'transformer/post-ffn': '\operatorname{LayerNorm}(x+\operatorname{FFN}(x))'
  'transformer/parameter-count': '4d^2\quad\text{per attention sub-layer},\qquad 2d\,d_{\mathrm{ff}}\quad\text{per FFN}'
  'transformer/attention-output': '\operatorname{softmax}\left(\frac{QK^{\top}}{\sqrt{d_k}}\right)V'
  'transformer/position-pair': '\begin{array}{l}\mathrm{PE}(\mathrm{pos},2i)=\sin\left(\frac{\mathrm{pos}}{10000^{2i/d_{\mathrm{model}}}}\right)\\\mathrm{PE}(\mathrm{pos},2i+1)=\cos\left(\frac{\mathrm{pos}}{10000^{2i/d_{\mathrm{model}}}}\right)\end{array}'
  'transformer/wavelength': '\mathrm{wavelength}=2\pi\,10000^{2i/d_{\mathrm{model}}}'
  'transformer/position-offset': '\mathrm{PE}(\mathrm{pos}+k)=M_k\mathrm{PE}(\mathrm{pos})'
  'transformer/operation-count': '\text{Self-attention }n^2d,\qquad\text{recurrent }nd^2'
  'transformer/cache': '2\times\mathrm{layers}\times\mathrm{heads}\times d_{\mathrm{head}}\times\mathrm{bytes}\quad\text{per token}'
  'transformer/tiled-attention': '\operatorname{softmax}\left(\frac{QK^{\top}}{\sqrt{d_k}}\right)V\quad\text{computed in tiles}'
  'transformer/logits': '\mathrm{logits}=hE^{\top}'
  'transformer/temperature': 'p=\operatorname{softmax}\left(\frac{\mathrm{logits}}{\mathrm{temperature}}\right)'
  'transformer/lookup': '\operatorname{Embedding}(\mathrm{tokens})\sqrt{d_{\mathrm{model}}}'
  'transformer/position': '\mathrm{PE}(\mathrm{pos},2i)=\sin\left(\frac{\mathrm{pos}}{10000^{2i/d_{\mathrm{model}}}}\right)'
  'transformer/encoder-heads': '\operatorname{Concat}(\mathrm{head}_1,\ldots,\mathrm{head}_h)W^O\quad\text{without a mask}'
  'transformer/sublayer': '\operatorname{LayerNorm}(x+\operatorname{Sublayer}(x))'
  'transformer/decoder-mask': '\mathrm{score}_{ij}\gets-\infty\quad\text{for }j>i,\quad\text{then softmax}'
  'transformer/masked-residual': '\operatorname{LayerNorm}(x+\operatorname{MaskedMultiHead}(x))'
  'transformer/cross-attention': '\operatorname{Attention}(Q_{\mathrm{decoder}},K_{\mathrm{encoder}},V_{\mathrm{encoder}})'
  'transformer/cross-residual': '\operatorname{LayerNorm}(x+\operatorname{MultiHead}(x,\mathrm{encoder}))'
  'transformer/softmax': 'p=\operatorname{softmax}(\mathrm{logits})'
  'transformer/path-constant': 'O(1)'
  'transformer/path-recurrent': 'O(n)=\text{SLOT_count}'
  'transformer/path-convolution': 'O(\log_k n)\approx\text{SLOT_count}'
  'transformer/path-restricted': 'O(n/r)=\text{SLOT_count}'
  'gpt/score': 'QK^{\top}'
  'gpt/scale': '\div\sqrt{64}'
  'gpt/scale-equality': '\sqrt{64}=8'
  'gpt/scratch-scale': '\sqrt{24}'
image-generation:
  'diffusion/guidance': '\tilde{\varepsilon}=\varepsilon_{\varnothing}+w(\varepsilon_c-\varepsilon_{\varnothing}),\quad w=\text{SLOT_guidance}'
  'diffusion/forward': 'x_t=\sqrt{\bar{\alpha}_t}\,x_0+\sqrt{1-\bar{\alpha}_t}\,\varepsilon'
  'diffusion/conditional': '\varepsilon_c'
  'diffusion/unconditional': '\varepsilon_{\varnothing}'
  'diffusion/guided': '\tilde{\varepsilon}'
