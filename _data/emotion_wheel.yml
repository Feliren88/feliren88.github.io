# Emotion wheel for /uncertainty-and-emotions/
#
# Eight families, each with an inner band of three broader words and an outer
# band of finer ones. Rendered as a sunburst by js/components/uncertainty-and-emotions.js
# and read through the JSON island the page emits.
#
# Every family carries the three parts the page already asks a reader to
# separate: what the feeling points at, what it urges you to do, and one
# action that does not require the feeling to stop first. The register is
# plain English throughout; nothing here is a diagnosis or a clinical term.

families:
  - key: fear
    name: Fear
    hue: 262
    points_at: A possible threat, often one that has not happened yet.
    urge: Escape it, avoid it, or make it certain before you move.
    counter: Name the specific outcome you are protecting against, then take the smallest step towards it.
    inner:
      - name: Anxious
        outer: ["Worried", "Uneasy", "Jumpy", "Dreading"]
      - name: Scared
        outer: ["Startled", "Alarmed", "Panicked"]
      - name: Insecure
        outer: ["Exposed", "Inadequate", "Doubtful"]

  - key: anger
    name: Anger
    hue: 8
    points_at: A boundary crossed, a rule broken, or something blocked.
    urge: Push back, argue, retaliate, or make someone understand.
    counter: Write down what was crossed. Decide the outcome you want before you speak.
    inner:
      - name: Frustrated
        outer: ["Blocked", "Impatient", "Exasperated"]
      - name: Resentful
        outer: ["Bitter", "Overlooked", "Unthanked"]
      - name: Furious
        outer: ["Outraged", "Seething", "Scornful"]

  - key: sadness
    name: Sadness
    hue: 214
    points_at: A loss, a distance, or something that mattered and is gone.
    urge: Withdraw, go quiet, stop trying.
    counter: Let it be present and keep one small commitment to another person today.
    inner:
      - name: Lonely
        outer: ["Isolated", "Excluded", "Cut off"]
      - name: Disappointed
        outer: ["Let down", "Deflated", "Discouraged"]
      - name: Grieving
        outer: ["Heavy", "Aching", "Numb"]

  - key: shame
    name: Shame
    hue: 286
    points_at: A gap between what you did and who you want to be.
    urge: Hide, over-explain, confess repeatedly, or seek reassurance.
    counter: Say the accurate sentence once, repair what you can, then continue.
    inner:
      - name: Embarrassed
        outer: ["Watched", "Awkward", "Exposed"]
      - name: Guilty
        outer: ["Regretful", "Remorseful", "Blameworthy"]
      - name: Worthless
        outer: ["Defective", "Small", "Unlovable"]

  - key: disgust
    name: Disgust
    hue: 96
    points_at: Something that violates what you value, or feels contaminating.
    urge: Reject it, clean it, distance yourself, get rid of the thought.
    counter: Let the thought stay in the room without arguing with it or removing it.
    inner:
      - name: Repelled
        outer: ["Revolted", "Queasy", "Repulsed"]
      - name: Disapproving
        outer: ["Judgemental", "Appalled", "Let down"]
      - name: Self-disgust
        outer: ["Ashamed", "Tainted", "Off"]

  - key: joy
    name: Joy
    hue: 44
    points_at: Something is going well, or something you care about is here.
    urge: Hold on to it, or check whether you are allowed to have it.
    counter: Stay in it for a full minute without auditing whether it will last.
    inner:
      - name: Content
        outer: ["Settled", "Easy", "Grateful"]
      - name: Excited
        outer: ["Eager", "Buzzing", "Playful"]
      - name: Proud
        outer: ["Capable", "Seen", "Satisfied"]

  - key: love
    name: Love
    hue: 336
    points_at: Closeness, care, or someone whose wellbeing is bound up with yours.
    urge: Move closer, or test whether the feeling is real enough.
    counter: Act warmly without asking the feeling to prove itself first.
    inner:
      - name: Affectionate
        outer: ["Warm", "Tender", "Fond"]
      - name: Trusting
        outer: ["Safe", "Open", "Relieved"]
      - name: Longing
        outer: ["Missing", "Yearning", "Wistful"]

  - key: surprise
    name: Surprise
    hue: 178
    points_at: Something did not match what you expected.
    urge: Resolve the mismatch immediately.
    counter: Note what changed. Decide whether it changes the decision or only the feeling.
    inner:
      - name: Confused
        outer: ["Disoriented", "Unsure", "Torn"]
      - name: Startled
        outer: ["Jolted", "Shaken", "Amazed"]
      - name: Curious
        outer: ["Interested", "Intrigued", "Drawn"]
