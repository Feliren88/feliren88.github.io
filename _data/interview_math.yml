notation:
- group: Objects you feed in and get out
  items:
  - is: One input example
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>x</mi></mrow></math>
    tex: x
  - is: The true answer for this input
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>y</mi></mrow></math>
    tex: y
  - is: The answer predicted by the model
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mover accent="true"><mi>y</mi><mo>&#x0005E;</mo></mover></mrow></math>
    tex: \hat{y}
  - is: A hidden representation, the numbers produced by an intermediate model step
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>z</mi></mrow></math>
    tex: z
  - is: A time step or a position in a sequence
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>t</mi></mrow></math>
    tex: t
  - is: An index identifying a class or a neighbour
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>k</mi></mrow></math>
    tex: k
  - is: An index identifying an example
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>i</mi></mrow></math>
    tex: i
  - is: A second index used alongside another index
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>j</mi></mrow></math>
    tex: j
  - is: The number of items being counted
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>n</mi></mrow></math>
    tex: n
  - is: The number of examples in a dataset
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>N</mi></mrow></math>
    tex: N
  - is: The number of components in a vector
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>d</mi></mrow></math>
    tex: d
  - is: The number of classes
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>K</mi></mrow></math>
    tex: K
- group: Sets and data
  items:
  - is: A dataset containing input and answer pairs
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>D</mi></mrow></math>
    tex: D
  - is: The set of possible inputs
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D4B3;</mi></mrow></math>
    tex: \mathcal{X}
  - is: The set of possible answers
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D4B4;</mi></mrow></math>
    tex: \mathcal{Y}
  - is: The probability distribution that generates the data
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D49F;</mi></mrow></math>
    tex: \mathcal{D}
  - is: The real numbers
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x0211D;</mi></mrow></math>
    tex: \mathbb{R}
  - is: The set of vectors with d real-number components
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msup><mi>&#x0211D;</mi><mrow><mi>d</mi></mrow></msup></mrow></math>
    tex: \mathbb{R}^{d}
  - is: Is a member of
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02208;</mo></mrow></math>
    tex: \in
  - is: Is a subset of
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02286;</mo></mrow></math>
    tex: \subseteq
  - is: Is sampled from
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x0223C;</mo></mrow></math>
    tex: \sim
  - is: The number of items in D
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo stretchy="false">&#x0007C;</mo><mi>D</mi><mo stretchy="false">&#x0007C;</mo></mrow></math>
    tex: '|D|'
- group: Probability
  items:
  - is: A probability or probability density
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>p</mi></mrow></math>
    tex: p
  - is: The probability or density assigned to input x
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>p</mi><mo stretchy="false">&#x00028;</mo><mi>x</mi><mo stretchy="false">&#x00029;</mo></mrow></math>
    tex: p(x)
  - is: The probability or density of answer y given input x
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>p</mi><mo stretchy="false">&#x00028;</mo><mi>y</mi><mo>&#x02223;</mo><mi>x</mi><mo stretchy="false">&#x00029;</mo></mrow></math>
    tex: p(y \mid x)
  - is: Given the information on the right of the symbol
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02223;</mo></mrow></math>
    tex: \mid
  - is: The model parameters, the numbers fitted or assigned to the model
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003B8;</mi></mrow></math>
    tex: \theta
  - is: A policy, the rule an agent uses to choose actions in a state
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003C0;</mi></mrow></math>
    tex: \pi
  - is: The expected value, an average weighted by the probability distribution
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D53C;</mi></mrow></math>
    tex: \mathbb{E}
  - is: The variance, a measure of spread around the mean
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mrow><mi mathvariant="normal">V</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">r</mi></mrow></mrow></math>
    tex: \mathrm{Var}
  - is: The normal distribution
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D4A9;</mi></mrow></math>
    tex: \mathcal{N}
  - is: A mean
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003BC;</mi></mrow></math>
    tex: \mu
  - is: A standard deviation, a measure of spread in the original units
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003C3;</mi></mrow></math>
    tex: \sigma
  - is: A variance, equal to the square of the standard deviation
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msup><mi>&#x003C3;</mi><mrow><mn>2</mn></mrow></msup></mrow></math>
    tex: \sigma^{2}
- group: Learning
  items:
  - is: The model, a function that maps an input to an answer
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>f</mi></mrow></math>
    tex: f
  - is: The model with its parameters shown explicitly
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msub><mi>f</mi><mrow><mi>&#x003B8;</mi></mrow></msub></mrow></math>
    tex: f_{\theta}
  - is: The loss, a measure of error that training aims to reduce
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x02112;</mi></mrow></math>
    tex: \mathcal{L}
  - is: The loss for one example
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x02113;</mi></mrow></math>
    tex: \ell
  - is: The risk, the average loss under the data distribution
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>R</mi></mrow></math>
    tex: R
  - is: The empirical risk, the average loss on the observed data
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mover accent="true"><mi>R</mi><mo>&#x0005E;</mo></mover></mrow></math>
    tex: \hat{R}
  - is: The learning rate, which controls the size of a parameter update
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003B7;</mi></mrow></math>
    tex: \eta
  - is: The gradient, whose components are partial derivatives
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02207;</mo></mrow></math>
    tex: \nabla
  - is: A coefficient controlling the balance between terms in an objective
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003BB;</mi></mrow></math>
    tex: \lambda
  - is: An error-rate threshold chosen before the test
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003B1;</mi></mrow></math>
    tex: \alpha
  - is: A small tolerance
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003F5;</mi></mrow></math>
    tex: \epsilon
  - is: A weight vector, the coefficients of a linear model
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>w</mi></mrow></math>
    tex: w
  - is: A discount factor controlling the weight given to future rewards
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003B3;</mi></mrow></math>
    tex: \gamma
  - is: The number of layers
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>L</mi></mrow></math>
    tex: L
  - is: The sequence length
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>T</mi></mrow></math>
    tex: T
- group: Testing a claim
  items:
  - is: The null hypothesis, the claim evaluated by a statistical test
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msub><mi>H</mi><mrow><mn>0</mn></mrow></msub></mrow></math>
    tex: H_{0}
  - is: The alternative hypothesis, the claim compared with the null hypothesis
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msub><mi>H</mi><mrow><mn>1</mn></mrow></msub></mrow></math>
    tex: H_{1}
  - is: The probability of failing to detect an effect under the specified alternative
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003B2;</mi></mrow></math>
    tex: \beta
  - is: A test statistic expressed in standard-error units
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>Z</mi></mrow></math>
    tex: Z
  - is: The standard error, the standard deviation of an estimate across repeated samples
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mrow><mi mathvariant="normal">S</mi><mi mathvariant="normal">E</mi></mrow></mrow></math>
    tex: \mathrm{SE}
- group: Vectors and matrices
  items:
  - is: A vector, an ordered list of numbers
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>v</mi></mrow></math>
    tex: v
  - is: A matrix, a rectangular array of numbers that can transform vectors
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>A</mi></mrow></math>
    tex: A
  - is: The transpose of A, obtained by swapping its rows and columns
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msup><mi>A</mi><mrow><mo>&#x022A4;</mo></mrow></msup></mrow></math>
    tex: A^{\top}
  - is: The inverse of A, which reverses its transformation when an inverse exists
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msup><mi>A</mi><mrow><mo>&#x02212;</mo><mn>1</mn></mrow></msup></mrow></math>
    tex: A^{-1}
  - is: The determinant, which gives signed area or volume scaling
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo movablelimits="true">det</mo></mrow></math>
    tex: \det
  - is: The length of v
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo fence="false" stretchy="false">&#x02016;</mo><mi>v</mi><mo fence="false" stretchy="false">&#x02016;</mo></mrow></math>
    tex: \|v\|
  - is: The inner product of u and v
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x027E8;</mi><mi>u</mi><mo>&#x0002C;</mo><mi>v</mi><mi>&#x027E9;</mi></mrow></math>
    tex: \langle u, v \rangle
  - is: The identity matrix, which leaves a vector unchanged
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>I</mi></mrow></math>
    tex: I
  - is: An outer product, a matrix formed from pairwise products of two vectors
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02297;</mo></mrow></math>
    tex: \otimes
- group: Reading the symbols
  items:
  - is: Add the indicated terms
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02211;</mo></mrow></math>
    tex: \sum
  - is: Multiply the indicated terms
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x0220F;</mo></mrow></math>
    tex: \prod
  - is: Integrate, accumulating values across a continuous range
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x0222B;</mo></mrow></math>
    tex: \int
  - is: The input that achieves the largest value
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo /><mrow><mi>a</mi><mi>r</mi><mi>g</mi><mspace width="0.167em" /><mi>m</mi><mi>a</mi><mi>x</mi></mrow></mrow></math>
    tex: \arg\max
  - is: The input that achieves the smallest value
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo /><mrow><mi>a</mi><mi>r</mi><mi>g</mi><mspace width="0.167em" /><mi>m</mi><mi>i</mi><mi>n</mi></mrow></mrow></math>
    tex: \arg\min
  - is: Proportional to, or equal up to a constant factor
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x0221D;</mo></mrow></math>
    tex: \propto
  - is: Approximately equal to
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02248;</mo></mrow></math>
    tex: \approx
  - is: Approaches, or maps to, depending on the expression
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02192;</mo></mrow></math>
    tex: \to
  - is: For every
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02200;</mo></mrow></math>
    tex: \forall
  - is: There exists at least one
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02203;</mo></mrow></math>
    tex: \exists
  - is: Is defined as
    ml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02254;</mo></mrow></math>
    tex: \coloneqq
