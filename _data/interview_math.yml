  ai-safety/1/0/3: <math class="ivm-s" data-s="3" xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msub><mi>&#x003B2;</mi><mrow><mrow><mi mathvariant="normal">k</mi><mi mathvariant="normal">l</mi></mrow></mrow></msub></mrow></math>
  ai-safety/1/0/4: <math class="ivm-s" data-s="4" xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mrow><mi mathvariant="normal">K</mi><mi mathvariant="normal">L</mi></mrow></mrow></math>
