intro: 'Reliability and relevance. Every system I have built comes down to the same question: how do we know when to trust the model? And who is the model actually built for?'
intro_sub: 'I work at the intersection of trustworthy AI and cultural inclusion in multimodal systems. If any of the below fits where you are, I would be glad to hear from you.'

