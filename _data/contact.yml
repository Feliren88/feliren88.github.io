intro: 'Reliability and relevance. Every system I have built comes down to the same question. How do we know when to trust the model, when should it hold back, and who is it actually built for?'
intro_sub: 'I work on calibration under safety alignment, and on making safe models more useful. If any of the below fits where you are, I would be glad to hear from you.'

engagements:
  - type: 'Research Collaboration'
    description: "Working on the alignment tax, calibration, honesty and abstention, or evaluation beyond English? Particularly interested in anyone measuring what safety training costs and where that cost lands. Let's find the overlap."
  - type: 'Research & Applied Roles'
    description: 'Open to research and applied scientist roles internationally, particularly in alignment finetuning, calibration and evaluation, and reliability for multimodal and multilingual systems.'
  - type: 'Speaking'
    description: 'Conference talks, university lectures, and panels on AI safety, trustworthy and multimodal AI, uncertainty quantification, and AI for underrepresented languages.'
  - type: 'Mentorship'
    description: "I mentor early-career researchers and engineers moving into AI safety and trustworthy AI, including graduate school applications and careers in applied science, especially across Southeast Asia."

