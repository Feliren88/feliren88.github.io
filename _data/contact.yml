intro: 'Every system I have built raises the same questions. When can we trust the model? When should it hold back? Who was it built to serve?'
intro_sub: 'I study calibration under safety alignment and ways to keep safe models useful. If your work overlaps with the areas below, I would be glad to hear from you.'

engagements:
  - type: 'Research Collaboration'
    description: "I welcome work on the alignment tax, calibration, honesty, abstention, and evaluation beyond English. I am especially interested in measuring the costs of safety training and where they fall."
  - type: 'Research & Applied Roles'
    description: 'I am open to research and applied scientist roles worldwide, especially in alignment finetuning, calibration, evaluation, and reliable multimodal or multilingual systems.'
  - type: 'Speaking'
    description: 'I speak at conferences, universities, and panels about AI safety, trustworthy and multimodal AI, uncertainty quantification, and AI for underrepresented languages.'
  - type: 'Mentorship'
    description: "I mentor early-career researchers and engineers entering AI safety and trustworthy AI. This includes graduate applications and applied science careers, especially across Southeast Asia."

