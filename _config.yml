# Site settings
title: Vicky Feliren
description: 
  Applied Scientist building AI that rigorously knows its own limits grounded with rigorous engineering and philosophy.
baseurl: ""
url: "https://feliren88.github.io"

# Author info
author:
  name: Vicky Feliren
email: vickyfeliren@gmail.com

# Webmaster Tools Verification
google_site_verification: "google41769159a82c477f"

# Locale & Language
locale: en-US
lang: en-US

# SEO Settings (for jekyll-seo-tag)
logo: /assets/img/profile.png
image: /assets/img/profile.png

# Search keywords for AI roles
keywords:
  - Vicky Feliren
  - Applied Scientist
  - AI Researcher
  - Machine Learning Engineer
  - Data Scientist
  - Computer Vision
  - Deep Learning
  - Vision-Language Models
  - Multimodal AI
  - Trustworthy AI
  - Conformal Prediction

social:
  name: Vicky Feliren
  links:
    - https://www.linkedin.com/in/feliren/
    - https://github.com/feliren88
    - https://scholar.google.com/citations?user=R2LVQ7AAAAAJ&hl=en
    - https://medium.com/@feliren

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Sitemap settings
sitemap:
  changefreq: monthly
  priority: 0.5

# Exclude from processing
exclude:
  - node_modules
  - vendor
  - CLAUDE.md

# Permalink structure
permalink: pretty

# Include for additional directories
include:
  - _pages

# Front Matter Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      robots: "index, follow" # Ensures all pages are indexable by default
  - scope:
      path: "_pages"
    values:
      layout: page