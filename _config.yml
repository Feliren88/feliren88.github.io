# Site settings
title: Vicky Feliren
description:
  Applied Scientist studying calibration under safety alignment. I measure where safety training weakens calibration across languages and input types, then develop ways to recover it.
baseurl: ""
url: "https://vickyfeliren.com"

# Author info
author:
  name: Vicky Feliren
email: vickyfeliren@gmail.com

# Webmaster Tools Verification
google_site_verification: "google41769159a82c477f"

# Locale & Language
locale: en-US
lang: en-US

# SEO Settings (for jekyll-seo-tag)
logo: /assets/img/profile.webp
image: /assets/img/profile.webp

# Search keywords for AI roles
keywords:
  - Vicky Feliren
  - Applied Scientist
  - AI Researcher
  - Machine Learning Engineer
  - Data Scientist
  - Computer Vision
  - Deep Learning
  - Vision-Language Models
  - Multimodal AI
  - Multilingual AI
  - Trustworthy AI
  - AI Safety
  - Interpretability
  - Conformal Prediction
  - Earth Observation

social:
  name: Vicky Feliren
  links:
    - https://www.linkedin.com/in/feliren/
    - https://github.com/feliren88
    - https://scholar.google.com/citations?user=R2LVQ7AAAAAJ&hl=en
    - https://medium.com/@feliren

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Sitemap settings
sitemap:
  changefreq: monthly
  priority: 0.5

# Exclude from processing
exclude:
  - node_modules
  - vendor
  - CLAUDE.md
  - backlog.md
  - scripts/generate_uc_banners.py
  - notes

# Permalink structure
permalink: pretty

# Include for additional directories
include:
  - _pages
  - scripts/heron

# Front Matter Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      # jekyll-seo-tag reads og:image from page.image only, never site.image.
      # Setting it here gives every page a social card; front matter overrides it.
      image: /assets/img/profile.webp
  - scope:
      path: "_pages"
    values:
      layout: page
  # Search-console ownership tokens. They are real files at fixed paths, but they
  # are not pages, and jekyll-sitemap otherwise picks up every .html static file.
  - scope:
      path: "google41769159a82c477f.html"
    values:
      sitemap: false
  - scope:
      path: "yandex_3f8f613ab592ef84.html"
    values:
      sitemap: false
