---
layout: default
---

<section class="section {{ page.layout-class | default: 'page' }} reveal">
  {% unless page.hide_title %}
  <div class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </div>
  {% endunless %}
  
  <div class="page-content">
    {{ content }}
  </div>
</section>
