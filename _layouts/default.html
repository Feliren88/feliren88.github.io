<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ '/assets/img/favicon_black.JPG' | relative_url }}" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/css/styles.css?v=6' | relative_url }}">
    
    {% seo %}
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>
    <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

    <header class="topbar" id="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/img/favicon.png?v=2' | relative_url }}" alt="Home" style="height:1.6rem;width:auto;">
      </a>
      <nav class="nav" aria-label="Primary" id="main-nav"></nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="footer">
      <p>&copy; <span id="year"></span> Vicky Feliren</p>
    </footer>

    <script src="{{ '/js/main.js?v=3' | relative_url }}"></script>
    <script src="{{ '/js/components/nav.js' | relative_url }}"></script>
  </body>
</html>
</html>
