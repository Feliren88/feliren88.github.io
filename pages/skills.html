(function() {
  var container = document.getElementById('skills-grid');
  if (!container || !SKILLS_DATA || SKILLS_DATA.length === 0) return;
  container.innerHTML = SKILLS_DATA.map(function(skill) {
    return '<article class="skill-card reveal">' +
      '<h3>' + skill.category + '</h3>' +
      '<p>' + skill.description + '</p>' +
      '<ul>' + skill.skills.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ul>' +
    '</article>';
  }).join('');
})();
  </script>
