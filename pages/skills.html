<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vicky Feliren - Applied Scientist, Multimodal AI, Vision-Language Models, Remote Sensing.">
  <title>Skills | Vicky Feliren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary">
    </nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">SYSTEM CAPABILITIES</p>
      <h2 class="section-title">Expertise</h2>

      <div class="skill-grid" id="skill-grid">
        <!-- Skills rendered by JavaScript from js/data/skills.js -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren · VF</p>
  </footer>

  <script src="../js/data/skills.js"></script>
  <script src="../js/components/nav.js"></script>
  <script src="../js/main.js?v=2"></script>
  <script>
    /**
     * Renders skills from SKILLS_DATA to the DOM
     */
    (function() {
      var grid = document.getElementById('skill-grid');
      if (!grid || typeof SKILLS_DATA === 'undefined') return;
      if (grid.children.length > 0) return; // Already rendered

      var html = '';
      SKILLS_DATA.forEach(function(category) {
        html += '<article class="skill-card reveal">';
        html += '<h3>' + category.category + '</h3>';
        html += '<p>' + category.description + '</p>';
        html += '<ul>';
        
        category.skills.forEach(function(skill) {
          html += '<li>' + skill + '</li>';
        });
        
        html += '</ul>';
        html += '</article>';
      });

      grid.innerHTML = html;
    })();
  </script>
</body>
</html>
