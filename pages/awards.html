<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vicky Feliren - Awards & Recognition">
  <title>Recognition | Vicky Feliren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary" id="main-nav"></nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">MILESTONES</p>
      <h2 class="section-title">Awards & Honours</h2>

      <div id="awards-grid" class="awards-grid">
        <p class="loading">Loading awards...</p>
      </div>

      <div class="service-section">
        <p class="column-title" style="margin-top:1.5rem">PROFESSIONAL SERVICE</p>
        <div id="service-grid" class="service-grid">
          <p class="loading">Loading...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren · VF</p>
  </footer>

  <script src="../js/data/awards.js"></script>
  <script>
(function() {
  var awardsGrid = document.getElementById('awards-grid');
  var serviceGrid = document.getElementById('service-grid');
  if (awardsGrid && AWARDS_DATA) {
    var keys = Object.keys(AWARDS_DATA);
    awardsGrid.innerHTML = keys.map(function(key) {
      var a = AWARDS_DATA[key];
      var html = '<article class="award-card' + (a.category === 'CHAMPION' ? ' highlight' : '') + '">' +
        '<p class="tag">' + a.category + '</p>' +
        '<h3>' + (a.url ? '<a href="' + a.url + '" target="_blank" rel="noreferrer">' + a.title + '</a>' : a.title) + '</h3>' +
        '<p class="time-inline">' + a.year + '</p>' +
        '<p>' + a.description + '</p>' +
      '</article>';
      return html;
    }).join('');
  }
  if (serviceGrid && SERVICE_DATA) {
    serviceGrid.innerHTML = SERVICE_DATA.map(function(s) {
      return '<div class="service-item"><strong>' + s.role + '</strong><p>' + s.description + '</p></div>';
    }).join('');
  }
})();
  </script>
  <script src="../js/components/nav.js"></script>
  <script src="../js/main.js?v=2"></script>
</body>
</html>
