<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Awards &amp; Recognition | Vicky Feliren — Microsoft Azure APAC Champion, Cambridge, UC Berkeley</title>
  <link rel="canonical" href="https://feliren88.github.io/pages/awards.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vicky Feliren">
  <meta property="og:title" content="Awards &amp; Recognition — Vicky Feliren">
  <meta property="og:description" content="Microsoft Azure Virtual Hackathon APAC Champion, University of Cambridge CamvsCovid Top 3, Cal Hacks UC Berkeley Best Community Track, Monash scholarship, IEEE peer reviewer.">
  <meta property="og:url" content="https://feliren88.github.io/pages/awards.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Awards — Vicky Feliren">
  <meta name="twitter:description" content="Microsoft Azure APAC Champion, University of Cambridge Top 3, Cal Hacks UC Berkeley, Monash scholarship, IEEE peer reviewer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
  <style>
    .awards-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .award-card.featured {
      grid-column: 1 / -1;
      padding: 1.4rem 1.8rem;
      border-color: rgba(119, 146, 175, 0.52);
    }
    .award-card.featured h3 {
      font-size: 1.25rem;
    }
    .award-card.featured > p.desc {
      font-size: 0.92rem;
      max-width: 56rem;
    }
    .award-card.featured .tag {
      font-size: 0.72rem;
    }
    @media (max-width: 600px) {
      .awards-grid {
        grid-template-columns: 1fr;
      }
      .award-card.featured {
        grid-column: 1;
      }
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary" id="main-nav"></nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">MILESTONES</p>
      <h1 class="section-title">Awards &amp; Honours</h1>

      <div id="awards-grid" class="awards-grid">
        <p class="loading">Loading awards...</p>
      </div>

      <div class="service-section">
        <p class="column-title" style="margin-top:2rem">PROFESSIONAL SERVICE</p>
        <div id="service-grid" class="service-grid">
          <p class="loading">Loading...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren &middot; VF</p>
  </footer>

  <script src="../js/data/awards.js"></script>
  <script>
(function() {
  var awardsGrid = document.getElementById('awards-grid');
  var serviceGrid = document.getElementById('service-grid');
  if (awardsGrid && AWARDS_DATA) {
    var keys = Object.keys(AWARDS_DATA);
    awardsGrid.innerHTML = keys.map(function(key) {
      var a = AWARDS_DATA[key];
      var classes = 'award-card';
      if (a.featured) classes += ' featured';
      if (a.category === 'CHAMPION') classes += ' highlight';
      var html = '<article class="' + classes + '">' +
        '<p class="tag">' + a.category + '</p>' +
        '<h3>' + (a.url ? '<a href="' + a.url + '" target="_blank" rel="noreferrer">' + a.title + '</a>' : a.title) + '</h3>' +
        '<p class="time-inline">' + a.year + '</p>' +
        '<p class="desc">' + a.description + '</p>' +
      '</article>';
      return html;
    }).join('');
  }
  if (serviceGrid && SERVICE_DATA) {
    serviceGrid.innerHTML = SERVICE_DATA.map(function(s) {
      return '<div class="service-item"><strong>' + s.role + '</strong><p>' + s.description + '</p></div>';
    }).join('');
  }
})();
  </script>
  <script src="../js/components/nav.js"></script>
  <script src="../js/main.js?v=2"></script>
</body>
</html>
