<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vicky Feliren - Applied Scientist, Multimodal AI, Vision-Language Models, Remote Sensing.">
  <title>Awards | Vicky Feliren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary">
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="experience.html">Work</a>
      <a href="publications.html">Research</a>
      <a href="awards.html" class="is-active">Recognition</a>
      <a href="thoughts.html">Writings</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">MILESTONES</p>
      <h2 class="section-title">Awards & Honours</h2>

      <div class="awards-grid" id="awards-grid">
        <!-- Awards rendered by JavaScript from js/data/awards.js -->
      </div>

      <div class="service-section">
        <p class="column-title" style="margin-top:1.5rem">PROFESSIONAL SERVICE</p>
        <div class="service-grid" id="service-grid">
          <!-- Service entries rendered by JavaScript from js/data/awards.js -->
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren · VF</p>
  </footer>

  <script src="../js/data/awards.js"></script>
  <script src="../js/main.js?v=2"></script>
  <script>
    /**
     * Renders awards from AWARDS_DATA to the DOM
     */
    (function() {
      var awardsGrid = document.getElementById('awards-grid');
      if (!awardsGrid || typeof AWARDS_DATA === 'undefined') return;

      var html = '';
      var keys = Object.keys(AWARDS_DATA);

      keys.forEach(function(key) {
        var award = AWARDS_DATA[key];
        var highlight = key === 'microsoft-azure-hackathon' ? ' highlight' : '';
        html += '<article class="award-card' + highlight + '">';
        html += '<p class="tag">' + award.category + '</p>';
        
        if (award.url) {
          html += '<h3><a href="' + award.url + '" target="_blank" rel="noreferrer">' + award.title + '</a></h3>';
        } else {
          html += '<h3>' + award.title + '</h3>';
        }
        
        html += '<p class="time-inline">' + award.year + '</p>';
        html += '<p>' + award.description + '</p>';
        html += '</article>';
      });

      awardsGrid.innerHTML = html;
    })();

    /**
     * Renders service entries from SERVICE_DATA to the DOM
     */
    (function() {
      var serviceGrid = document.getElementById('service-grid');
      if (!serviceGrid || typeof SERVICE_DATA === 'undefined') return;

      var html = '';

      SERVICE_DATA.forEach(function(service) {
        html += '<div class="service-item">';
        html += '<strong>' + service.role + '</strong>';
        
        if (service.urls && service.urls.length > 0) {
          var linkHtml = service.urls.map(function(url) {
            var name = url.match(/:\/\/([^/]+)/)[1].replace('www.', '').split('.')[0];
            return '<a href="' + url + '" target="_blank" rel="noreferrer">' + name + '</a>';
          }).join(', ');
          html += '<p>' + linkHtml + ' — ' + service.description.split(' — ')[1] + '</p>';
        } else {
          html += '<p>' + service.description + '</p>';
        }
        
        html += '</div>';
      });

      serviceGrid.innerHTML = html;
    })();
  </script>
</body>
</html>
