<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="About Vicky Feliren - Applied Scientist">
  <title>About | Vicky Feliren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
  <style>
    .about-hero { font-size: 1.25rem; line-height: 1.7; max-width: 44rem; }
    .about-hero p { margin-bottom: 1.2rem; }
    .about-hero strong { color: var(--accent); }
    .about-hero a { color: var(--text); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
    .about-hero a:hover { color: var(--accent); }
    .about-section { margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid var(--line); }
    .about-section h3 { font-size: 1.1rem; color: var(--accent); margin-bottom: 0.8rem; }
    .about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    .about-card { padding: 1.2rem; border: 1px solid var(--line); border-radius: 8px; }
    .about-card h4 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.5rem; }
    .about-card p { font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary" id="main-nav"></nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">WHO I AM</p>
      <h2 class="section-title">About Vicky</h2>

      <div id="about-hero" class="about-hero">
        <p class="loading">Loading...</p>
      </div>

      <div id="about-sections">
        <p class="loading">Loading...</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren · VF</p>
  </footer>

  <script src="../js/data/about.js"></script>
  <script>
(function() {
  var heroContainer = document.getElementById('about-hero');
  var sectionsContainer = document.getElementById('about-sections');
  if (!ABOUT_DATA) return;
  if (heroContainer) {
    heroContainer.innerHTML = ABOUT_DATA.hero.map(function(p) { return '<p>' + p + '</p>'; }).join('');
  }
  if (sectionsContainer) {
    sectionsContainer.innerHTML = ABOUT_DATA.sections.map(function(section) {
      var html = '<div class="about-section"><h3>' + section.title + '</h3>';
      if (section.content) {
        html += '<p style="line-height:1.7;max-width:44rem">' + section.content + '</p>';
        html += '<p style="line-height:1.7;margin-top:1rem;color:var(--muted)">If you\'re working on something similar — or just want to talk shop — I\'d love to hear from you.</p>';
      }
      if (section.cards) {
        html += '<div class="about-grid">' + section.cards.map(function(card) {
          return '<div class="about-card"><h4>' + card.title + '</h4><p>' + card.description + '</p></div>';
        }).join('') + '</div>';
      }
      html += '</div>';
      return html;
    }).join('');
  }
})();
  </script>
  <script src="../js/components/nav.js"></script>
  <script src="../js/main.js?v=2"></script>
</body>
</html>
