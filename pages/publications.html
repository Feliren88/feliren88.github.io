<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vicky Feliren - Research contributions in Multimodal AI, Vision-Language Models, and Remote Sensing.">
  <title>Research | Vicky Feliren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary">
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="experience.html">Work</a>
      <a href="publications.html" class="is-active">Research</a>
      <a href="awards.html">Recognition</a>
      <a href="thoughts.html">Writings</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">RESEARCH ARCHIVE</p>
      <h2 class="section-title">Publications
        <a href="https://scholar.google.com/citations?user=R2LVQ7AAAAAJ&hl=en" target="_blank" rel="noreferrer" style="margin-left:0.75rem;font-size:0.82rem;color:var(--accent);text-decoration:none;font-weight:500;font-family:'Manrope',sans-serif">Google Scholar →</a>
      </h2>
      <p class="section-note">Selected research in multimodal AI, remote sensing, and geospatial analysis.</p>

      <div class="project-controls">
        <div class="filters" role="group" aria-label="Publication filters">
          <button class="filter is-active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="first-author">First Author</button>
          <button class="filter" type="button" data-filter="collab">Collaborative</button>
        </div>
        <p class="project-count"><span id="project-count">7</span> publications</p>
      </div>

      <div class="project-grid" id="publications-grid">
        <!-- Publications rendered by JavaScript from js/data/publications.js -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren · VF</p>
  </footer>

  <script src="../js/data/publications.js"></script>
  <script src="../js/main.js?v=2"></script>
  <script>
    /**
     * Renders publications from PUBLICATIONS_DATA to the DOM
     * Uses data-kind attribute to determine filter category
     */
    document.addEventListener('DOMContentLoaded', function() {
      var grid = document.getElementById('publications-grid');
      if (!grid || typeof PUBLICATIONS_DATA === 'undefined') return;
      if (grid.children.length > 0) return; // Already rendered

      var html = '';
      var keys = Object.keys(PUBLICATIONS_DATA);
      var count = 0;

      keys.forEach(function(key) {
        var pub = PUBLICATIONS_DATA[key];
        var dataKind = pub.tag.toLowerCase().indexOf('first author') > -1 ? 'first-author' : 'collab';
        html += '<article class="project-card reveal" data-kind="' + dataKind + '">';
        html += '<p class="tag">' + pub.tag + '</p>';
        html += '<h3>' + pub.title + '</h3>';
        html += '<p>' + pub.description + '</p>';
        html += '<span class="venue">' + pub.venue + '</span>';
        html += '<a href="' + pub.url + '" target="_blank" rel="noreferrer" class="paper-btn">Read Paper</a>';
        html += '<button class="card-toggle" type="button" aria-expanded="false">Abstract</button>';
        html += '<div class="card-expand">';
        html += '<p>' + pub.abstract + '</p>';
        html += '</div>';
        html += '</article>';
        count++;
      });

      grid.innerHTML = html;
      document.getElementById('project-count').textContent = count;
    });
  </script>
</body>
</html>
