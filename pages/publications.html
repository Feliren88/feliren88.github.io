<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vicky Feliren - Research Publications">
  <title>Research | Vicky Feliren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary" id="main-nav"></nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">RESEARCH ARCHIVE</p>
      <h2 class="section-title">Research <a href="https://scholar.google.com/citations?user=R2LVQ7AAAAAJ&hl=en" target="_blank" rel="noreferrer" style="margin-left:0.75rem;font-size:0.82rem;color:var(--accent);text-decoration:none;font-weight:500;font-family:'Manrope',sans-serif">Google Scholar →</a></h2>
      <p class="section-note">Selected research in multimodal AI, remote sensing, and geospatial analysis.</p>

      <div class="project-controls">
        <div class="filters" role="group" aria-label="Publication filters">
          <button class="filter is-active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="first-author">First Author</button>
          <button class="filter" type="button" data-filter="collab">Collaborative</button>
        </div>
        <p class="project-count"><span id="project-count">0</span> publications</p>
      </div>

      <div id="publications-container" class="project-grid">
        <p class="loading">Loading publications...</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren · VF</p>
  </footer>

  <script src="../js/data/publications.js"></script>
  <script>
(function() {
  function renderPublications(filter) {
    var container = document.getElementById('publications-container');
    var countEl = document.getElementById('project-count');
    var items = Object.keys(PUBLICATIONS_DATA).map(function(key) {
      var p = PUBLICATIONS_DATA[key];
      p._kind = key.indexOf('first-author') !== -1 || key.indexOf('flood') !== -1 || key.indexOf('plastic') !== -1 ? 'first-author' : 'collab';
      p._key = key;
      return p;
    });
    if (filter !== 'all') {
      items = items.filter(function(p) { return p._kind === filter; });
    }
    countEl.textContent = items.length;
    container.innerHTML = items.map(function(p) {
      var kind = p._kind === 'first-author' ? 'first-author' : 'collab';
      return '<article class="project-card reveal" data-kind="' + kind + '">' +
        '<p class="tag">' + p.tag + '</p>' +
        '<h3>' + p.title + '</h3>' +
        '<p>' + p.description + '</p>' +
        '<span class="venue">' + p.venue + '</span>' +
        (p.url ? '<a href="' + p.url + '" target="_blank" rel="noreferrer" class="paper-btn">Read Paper</a>' : '') +
        (p.abstract ? '<button class="card-toggle" type="button" aria-expanded="false">Abstract</button><div class="card-expand"><p>' + p.abstract + '</p></div>' : '') +
      '</article>';
    }).join('');
  }
  document.querySelectorAll('.filter').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter').forEach(function(b) { b.classList.remove('is-active'); });
      this.classList.add('is-active');
      renderPublications(this.dataset.filter);
    });
  });
  renderPublications('all');
})();
  </script>
  <script src="../js/components/nav.js"></script>
  <script src="../js/main.js?v=2"></script>
</body>
</html>
