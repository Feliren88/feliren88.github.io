<script>
(function() {
  var container = document.getElementById('thoughts-container');
  var MEDIUM_USER = 'feliren';
  var RSS2JSON_API = 'https://api.rss2json.com/v1/api.json?rss_url=https://medium.com/feed/@' + MEDIUM_USER;

  // Custom SEO descriptions — edit these to match your articles
  var DESCRIPTIONS = {
    'your-model-just-killed-someones-grandmother': 'Exploring why every production ML system needs conformal prediction for honest uncertainty quantification and safer deployments.',
    'the-art-of-letting-go-while-still-caring': 'Reflections on control, surrender, and finding strength in vulnerability through personal experience.',
    'meditation-7-days-no-phone-noble-silence': 'A data-driven researcher\'s journey into 7 days of silent meditation at Taman Brahma Bali Usada.',
    'my-initial-exploration-on-trustworthy-ai': 'First encounters with Trustworthy AI — bridging information theory and responsible machine learning.',
    'phoenix-protocol-rising-from-the-ashes-of-adversity': 'On resilience, reinvention, and learning to rise again after failure and loss.',
    'privacy-matters-your-data-your-power-your-responsibility': 'Discussing data synthesis, privacy-preserving analytics, and responsible data stewardship.',
    'mental-health-matters-please-take-care': 'A personal reflection on mental health awareness, self-care, and breaking the silence.',
    'a-strangers-guide-to-the-iu-concert': 'Reflections on fandom, culture, and music through the lens of an IU concert experience.'
  };

  function getSlug(title) {
    return title.toLowerCase()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/\s+/g, '-')
      .substring(0, 50);
  }

  function getDescription(item) {
    // Try to match by slug derived from title
    var slug = getSlug(item.title);
    for (var key in DESCRIPTIONS) {
      if (slug.indexOf(key) !== -1 || key.indexOf(slug.substring(0, 20)) !== -1) {
        return DESCRIPTIONS[key];
      }
    }
    // Fallback: clean the first sentence of the body
    return cleanFallback(item.description);
  }

  function cleanFallback(text) {
    if (!text) return '';
    var stripped = text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    // Remove noise prefixes
    stripped = stripped
      .replace(/^Generated by Gen AI tool\.?\s*/i, '')
      .replace(/^Photo taken by me\.?\s*/i, '')
      .replace(/^Content Warning:.*?\./i, '')
      .replace(/^Taman [^\.]+\.?\s*/i, '')
      .replace(/^A random [^.]+\.?\s*/i, '');
    
    var match = stripped.match(/^[^.!?]+[.!?]+/);
    var sentence = match ? match[0] : stripped;
    return sentence.length > 160 ? sentence.substring(0, 157) + '...' : sentence;
  }

  function formatDate(dateStr) {
    var date = new Date(dateStr);
    var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return months[date.getMonth()] + ' ' + date.getDate() + ', ' + date.getFullYear();
  }

  function renderArticle(item) {
    var summary = getDescription(item);
    
    return '<a class="thought-card" href="' + item.link + '" target="_blank" rel="noreferrer">' +
      '<span class="date">' + formatDate(item.pubDate) + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<p>' + summary + '</p>' +
      '<span class="read-more">Read on Medium →</span>' +
    '</a>';
  }

  fetch(RSS2JSON_API)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.status === 'ok' && data.items && data.items.length > 0) {
        container.innerHTML = data.items.slice(0, 10).map(renderArticle).join('');
      } else {
        container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)">No articles found. <a href="https://medium.com/@feliren" target="_blank" style="color:var(--accent)">View on Medium →</a></p>';
      }
    })
    .catch(function() {
      container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)">Could not load articles. <a href="https://medium.com/@feliren" target="_blank" style="color:var(--accent)">View on Medium →</a></p>';
    });
})();
</script>
