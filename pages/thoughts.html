<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vicky Feliren - Applied Scientist, Multimodal AI, Vision-Language Models, Remote Sensing.">
  <title>Thoughts | Vicky Feliren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
  <style>
    .thoughts-grid {
      margin-top: 0.95rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
    }
    .thought-card {
      display: block;
      text-decoration: none;
      padding: 0.88rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .thought-card:hover {
      border-color: rgba(119, 146, 175, 0.48);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    .thought-card .date {
      display: block;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 0.32rem;
    }
    .thought-card h3 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.3;
      transition: color 0.2s ease;
    }
    .thought-card:hover h3 {
      color: var(--accent);
    }
    .thought-card p {
      margin: 0.42rem 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.52;
    }
    .thought-card .read-more {
      display: inline-block;
      margin-top: 0.52rem;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
    }
    .medium-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: 0.5rem;
      color: #00aff4;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary">
      <a href="../index.html">Home</a>
      <a href="experience.html">Experience</a>
      <a href="skills.html">Skills</a>
      <a href="publications.html">Publications</a>
      <a href="awards.html">Awards</a>
      <a href="thoughts.html" class="is-active">Thoughts</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">WRITING</p>
      <h2 class="section-title">Thoughts
        <a class="medium-badge" href="https://medium.com/@feliren" target="_blank" rel="noreferrer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13.54 12a2.46 2.46 0 0 1-2.46 2.46 2.46 2.46 0 0 1-2.46-2.46A2.46 2.46 0 0 1 13.54 12a2.46 2.46 0 0 1 .23 1.47l-3.82 1.54a1.54 1.54 0 0 1-1.08-1.08l1.54-3.82A2.46 2.46 0 0 1 13.54 12zm-6.7 3.7a25.46 25.46 0 0 1 8.54-7.7l1.92 1.92a19.7 19.7 0 0 0-7.7 4.08 19.7 19.7 0 0 0-2.76 1.7zm9.9-8.7a22.7 22.7 0 0 1 7.7 7.7l-1.92 1.92a25.46 25.46 0 0 1-5.78-9.62z"/></svg>
          @feliren
        </a>
      </h2>
      <p class="section-note">Thoughts on life, philosophy, AI, research, and engineering from my Medium articles.</p>

      <div id="thoughts-container" class="thoughts-grid">
        <p class="loading">Loading articles...</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren &middot; VF</p>
  </footer>

  <script src="../js/main.js?v=2"></script>
<script>
(function() {
  var container = document.getElementById('thoughts-container');
  var MEDIUM_USER = 'feliren';
  var RSS2JSON_API = 'https://api.rss2json.com/v1/api.json?rss_url=https://medium.com/feed/@' + MEDIUM_USER;

  // Custom SEO descriptions — edit these to match your articles
  var DESCRIPTIONS = {
    'your-model-just-killed-someones-grandmother': 'Exploring why every production ML system needs conformal prediction for honest uncertainty quantification and safer deployments.',
    'the-art-of-letting-go-while-still-caring': 'Reflections on control, surrender, and finding strength in vulnerability through personal experience.',
    'meditation-7-days-no-phone-noble-silence': 'A data-driven researcher\'s journey into 7 days of silent meditation at Taman Brahma Bali Usada.',
    'my-initial-exploration-on-trustworthy-ai': 'First encounters with Trustworthy AI — bridging information theory and responsible machine learning.',
    'phoenix-protocol-rising-from-the-ashes-of-adversity': 'On resilience, reinvention, and learning to rise again after failure and loss.',
    'privacy-matters-your-data-your-power-your-responsibility': 'Discussing data synthesis, privacy-preserving analytics, and responsible data stewardship.',
    'mental-health-matters-please-take-care': 'A personal reflection on mental health awareness, self-care, and breaking the silence.',
    'a-strangers-guide-to-the-iu-concert': 'Reflections on fandom, culture, and music through the lens of an IU concert experience.'
  };

  function getSlug(title) {
    return title.toLowerCase()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/\s+/g, '-')
      .substring(0, 50);
  }

  function getDescription(item) {
    // Try to match by slug derived from title
    var slug = getSlug(item.title);
    for (var key in DESCRIPTIONS) {
      if (slug.indexOf(key) !== -1 || key.indexOf(slug.substring(0, 20)) !== -1) {
        return DESCRIPTIONS[key];
      }
    }
    // Fallback: clean the first sentence of the body
    return cleanFallback(item.description);
  }

  function cleanFallback(text) {
    if (!text) return '';
    var stripped = text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    stripped = stripped
      .replace(/^Generated by Gen AI tool\.?\s*/i, '')
      .replace(/^Photo taken by me\.?\s*/i, '')
      .replace(/^Content Warning:.*?\./i, '')
      .replace(/^Taman [^\.]+\.?\s*/i, '')
      .replace(/^A random [^.]+\.?\s*/i, '');
    
    var match = stripped.match(/^[^.!?]+[.!?]+/);
    var sentence = match ? match[0] : stripped;
    return sentence.length > 160 ? sentence.substring(0, 157) + '...' : sentence;
  }

  function formatDate(dateStr) {
    var date = new Date(dateStr);
    var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return months[date.getMonth()] + ' ' + date.getDate() + ', ' + date.getFullYear();
  }

  function renderArticle(item) {
    var summary = getDescription(item);
    
    return '<a class="thought-card" href="' + item.link + '" target="_blank" rel="noreferrer">' +
      '<span class="date">' + formatDate(item.pubDate) + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<p>' + summary + '</p>' +
      '<span class="read-more">Read on Medium →</span>' +
    '</a>';
  }

  fetch(RSS2JSON_API)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.status === 'ok' && data.items && data.items.length > 0) {
        container.innerHTML = data.items.slice(0, 10).map(renderArticle).join('');
      } else {
        container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)">No articles found. <a href="https://medium.com/@feliren" target="_blank" style="color:var(--accent)">View on Medium →</a></p>';
      }
    })
    .catch(function() {
      container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)">Could not load articles. <a href="https://medium.com/@feliren" target="_blank" style="color:var(--accent)">View on Medium →</a></p>';
    });
})();
</script>
</body>
</html>
