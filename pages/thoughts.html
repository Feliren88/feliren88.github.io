<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vicky Feliren - Applied Scientist, Multimodal AI, Vision-Language Models, Remote Sensing.">
  <title>Thoughts | Vicky Feliren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
  <style>
    .thoughts-grid {
      margin-top: 0.95rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
    }
    .thought-card {
      display: block;
      text-decoration: none;
      padding: 0.88rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .thought-card:hover {
      border-color: rgba(119, 146, 175, 0.48);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    .thought-card .date {
      display: block;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 0.32rem;
    }
    .thought-card h3 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.3;
      transition: color 0.2s ease;
    }
    .thought-card:hover h3 {
      color: var(--accent);
    }
    .thought-card p {
      margin: 0.42rem 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.52;
    }
    .thought-card .read-more {
      display: inline-block;
      margin-top: 0.52rem;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
    }
    .medium-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: 0.5rem;
      color: #00aff4;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary">
      <a href="../index.html">Home</a>
      <a href="experience.html">Experience</a>
      <a href="skills.html">Skills</a>
      <a href="publications.html">Publications</a>
      <a href="awards.html">Awards</a>
      <a href="thoughts.html" class="is-active">Thoughts</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">WRITING</p>
      <h2 class="section-title">Thoughts
        <a class="medium-badge" href="https://medium.com/@feliren" target="_blank" rel="noreferrer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13.54 12a2.46 2.46 0 0 1-2.46 2.46 2.46 2.46 0 0 1-2.46-2.46A2.46 2.46 0 0 1 13.54 12a2.46 2.46 0 0 1 .23 1.47l-3.82 1.54a1.54 1.54 0 0 1-1.08-1.08l1.54-3.82A2.46 2.46 0 0 1 13.54 12zm-6.7 3.7a25.46 25.46 0 0 1 8.54-7.7l1.92 1.92a19.7 19.7 0 0 0-7.7 4.08 19.7 19.7 0 0 0-2.76 1.7zm9.9-8.7a22.7 22.7 0 0 1 7.7 7.7l-1.92 1.92a25.46 25.46 0 0 1-5.78-9.62z"/></svg>
          @feliren
        </a>
      </h2>
      <p class="section-note">Thoughts on life, philosophy, AI, research, and engineering from my Medium articles.</p>

      <div class="project-controls">
        <div class="filters" role="group" aria-label="Category filters">
          <button class="filter is-active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="ai">AI</button>
          <button class="filter" type="button" data-filter="research">Research</button>
          <button class="filter" type="button" data-filter="philosophy">Philosophy</button>
          <button class="filter" type="button" data-filter="engineering">Engineering</button>
        </div>
        <p class="project-count"><span id="thought-count">0</span> articles</p>
      </div>

      <div id="thoughts-container" class="thoughts-grid">
        <p class="loading">Loading articles...</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren &middot; VF</p>
  </footer>

  <script src="../js/main.js?v=2"></script>
  <script>
    (function() {
      const container = document.getElementById('thoughts-container');
      const MEDIUM_USER = 'feliren';
      const RSS2JSON_API = 'https://api.rss2json.com/v1/api.json?rss_url=https://medium.com/feed/@' + MEDIUM_USER;

      function formatDate(dateStr) {
        const date = new Date(dateStr);
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        return months[date.getMonth()] + ' ' + date.getDate() + ', ' + date.getFullYear();
      }

      function truncate(text, maxLen) {
        if (!text) return '';
        const stripped = text.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        if (stripped.length <= maxLen) return stripped;
        return stripped.substring(0, maxLen).trim() + '...';
      }

      function getSummary(item) {
        const desc = item.description || '';
        const cleanDesc = desc.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        
        if (cleanDesc.length > 30) {
          return truncate(cleanDesc, 150);
        }
        return truncate(item.content, 150);
      }

      function renderArticle(item) {
        const categories = item.categories || [];
        const catLower = categories.map(function(c) { return c.toLowerCase(); });
        const primaryCat = catLower.length > 0 ? catLower[0] : 'general';
        
        let categoryTag = '';
        if (categories.length > 0) {
          categoryTag = '<span class="tag" style="margin:0 0 0.32rem;display:inline-block;border:1px solid rgba(119,146,175,0.42);border-radius:0.3rem;padding:0.15rem 0.35rem;color:var(--accent);font-size:0.64rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase">' + categories[0] + '</span>';
        }

        return '<a class="thought-card" href="' + item.link + '" target="_blank" rel="noreferrer" data-categories="' + catLower.join(' ') + '">' +
          categoryTag +
          '<span class="date">' + formatDate(item.pubDate) + '</span>' +
          '<h3>' + item.title + '</h3>' +
          '<p>' + getSummary(item) + '</p>' +
          '<span class="read-more">Read on Medium →</span>' +
        '</a>';
      }

      fetch(RSS2JSON_API)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var allCards = [];
          if (data.status === 'ok' && data.items && data.items.length > 0) {
            allCards = data.items.slice(0, 10).map(renderArticle);
            container.innerHTML = allCards.join('');
            document.getElementById('thought-count').textContent = data.items.length;
          } else {
            container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)">No articles found. <a href="https://medium.com/@feliren" target="_blank" style="color:var(--accent)">View on Medium →</a></p>';
          }
        })
        .catch(function() {
          container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)">Could not load articles. <a href="https://medium.com/@feliren" target="_blank" style="color:var(--accent)">View on Medium →</a></p>';
        });

      var thoughtFilterButtons = document.querySelectorAll('.thoughts-grid + .project-controls .filter');
      var thoughtCards = document.querySelectorAll('.thought-card');

      for (var i = 0; i < thoughtFilterButtons.length; i++) {
        thoughtFilterButtons[i].addEventListener('click', function() {
          for (var j = 0; j < thoughtFilterButtons.length; j++) {
            thoughtFilterButtons[j].classList.remove('is-active');
          }
          this.classList.add('is-active');
          var filter = this.getAttribute('data-filter');
          for (var k = 0; k < thoughtCards.length; k++) {
            var cats = thoughtCards[k].getAttribute('data-categories') || '';
            if (filter === 'all' || cats.indexOf(filter) !== -1) {
              thoughtCards[k].style.display = 'block';
            } else {
              thoughtCards[k].style.display = 'none';
            }
          }
        });
      }
    })();
  </script>
</body>
</html>
