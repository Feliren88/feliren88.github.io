<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vicky Feliren - Applied Scientist, Multimodal AI, Vision-Language Models, Remote Sensing.">
  <title>Contact | Vicky Feliren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary" id="main-nav"></nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">ESTABLISH LINK</p>
      <h2 class="section-title">Contact</h2>
      <p id="contact-intro" class="contact-intro">Loading...</p>

      <div id="contact-grid" class="contact-grid">
        <p class="loading">Loading...</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren &middot; VF</p>
  </footer>

  <script src="../js/data/contact.js"></script>
  <script>
(function() {
  var intro = document.getElementById('contact-intro');
  var grid = document.getElementById('contact-grid');
  if (!CONTACT_DATA) return;
  if (intro && CONTACT_DATA.intro) intro.textContent = CONTACT_DATA.intro;
  if (grid && CONTACT_DATA.links) {
    grid.innerHTML = CONTACT_DATA.links.map(function(link) {
      return '<a class="contact-card" href="' + link.url + '" target="_blank" rel="noreferrer"><span>' + link.label + '</span><strong>' + link.value + '</strong></a>';
    }).join('');
  }
})();
  </script>
  <script src="../js/components/nav.js"></script>
  <script src="../js/main.js?v=2"></script>
</body>
</html>
