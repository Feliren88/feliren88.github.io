<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vicky Feliren - Applied Scientist, Multimodal AI, Vision-Language Models, Remote Sensing.">
  <title>Experience | Vicky Feliren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="../index.html">VF</a>
    <nav class="nav" aria-label="Primary">
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Expertise</a>
      <a href="experience.html" class="is-active">Work</a>
      <a href="publications.html">Research</a>
      <a href="awards.html">Recognition</a>
      <a href="thoughts.html">Writings</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="section reveal">
      <p class="eyebrow">CAREER TRAJECTORY</p>
      <h2 class="section-title">Experience & Education</h2>

      <div class="split-grid">
        <div>
          <p class="column-title">WORK EXPERIENCE</p>
          <ol class="timeline" id="work-experience-list">
            <!-- Work experience rendered by JavaScript from js/data/experience.js -->
          </ol>
        </div>

        <div>
          <p class="column-title">EDUCATION</p>
          <ol class="timeline short" id="education-list">
            <!-- Education rendered by JavaScript from js/data/experience.js -->
          </ol>

          <p class="column-title" style="margin-top:1.2rem">PATENT</p>
          <ol class="timeline short" id="patents-list">
            <!-- Patents rendered by JavaScript from js/data/experience.js -->
          </ol>

          <p class="column-title" style="margin-top:1.2rem">TEACHING</p>
          <ol class="timeline short" id="teaching-list">
            <!-- Teaching rendered by JavaScript from js/data/experience.js -->
          </ol>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren · VF</p>
  </footer>

  <script src="../js/data/experience.js"></script>
  <script src="../js/main.js?v=2"></script>
  <script>
    /**
     * Renders work experience from WORK_EXPERIENCE_DATA to the DOM
     */
    (function() {
      var list = document.getElementById('work-experience-list');
      if (!list || typeof WORK_EXPERIENCE_DATA === 'undefined') return;

      var html = '';
      WORK_EXPERIENCE_DATA.forEach(function(item) {
        html += '<li>';
        html += '<p class="time">' + item.dates + '</p>';
        html += '<h3>' + item.title + '</h3>';
        html += '<p class="loc">' + item.location + '</p>';
        html += '<p>' + item.description + '</p>';
        html += '</li>';
      });
      list.innerHTML = html;
    })();

    /**
     * Renders education from EDUCATION_DATA to the DOM
     */
    (function() {
      var list = document.getElementById('education-list');
      if (!list || typeof EDUCATION_DATA === 'undefined') return;

      var html = '';
      EDUCATION_DATA.forEach(function(item) {
        html += '<li>';
        if (item.dates) {
          html += '<p class="time">' + item.dates + '</p>';
        }
        html += '<h3>' + item.title + '</h3>';
        html += '<p class="loc">' + item.location + '</p>';
        html += '<p>' + item.description + '</p>';
        html += '</li>';
      });
      list.innerHTML = html;
    })();

    /**
     * Renders patents from PATENTS_DATA to the DOM
     */
    (function() {
      var list = document.getElementById('patents-list');
      if (!list || typeof PATENTS_DATA === 'undefined') return;

      var html = '';
      PATENTS_DATA.forEach(function(item) {
        html += '<li>';
        html += '<p class="time">' + item.dates + '</p>';
        html += '<h3>' + item.title + '</h3>';
        html += '<p class="loc">' + item.location + '</p>';
        html += '<p>' + item.description + '</p>';
        html += '</li>';
      });
      list.innerHTML = html;
    })();

    /**
     * Renders teaching from TEACHING_DATA to the DOM
     */
    (function() {
      var list = document.getElementById('teaching-list');
      if (!list || typeof TEACHING_DATA === 'undefined') return;

      var html = '';
      TEACHING_DATA.forEach(function(item) {
        html += '<li>';
        html += '<p class="time">' + item.dates + '</p>';
        html += '<h3>' + item.title + '</h3>';
        html += '<p class="loc">' + item.location + '</p>';
        html += '<p>' + item.description + '</p>';
        html += '</li>';
      });
      list.innerHTML = html;
    })();
  </script>
</body>
</html>
