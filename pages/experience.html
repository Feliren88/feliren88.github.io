  <script>
(function() {
  function renderTimeline(containerId, data) {
    var container = document.getElementById(containerId);
    if (!container || !data || data.length === 0) return;
    container.innerHTML = data.map(function(item) {
      return '<li><p class="time">' + item.dates + '</p><h3>' + item.title + '</h3><p class="loc">' + item.location + '</p><p>' + item.description + '</p></li>';
    }).join('');
  }
  renderTimeline('work-experience-list', WORK_EXPERIENCE_DATA);
  renderTimeline('education-list', EDUCATION_DATA);
  renderTimeline('patents-list', PATENTS_DATA);
  renderTimeline('teaching-list', TEACHING_DATA);
})();
  </script>
