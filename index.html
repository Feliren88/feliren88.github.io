<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vicky Feliren — Applied Scientist working on trustworthy multimodal AI and cultural inclusion in vision-language systems. Published in IEEE, ACL, and Remote Sensing of Environment.">
  <title>Vicky Feliren | Stories & Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pointcloud-bg" aria-hidden="true"></canvas>

  <header class="topbar" id="site-header">
    <a class="brand" href="index.html">VF</a>
    <nav class="nav" aria-label="Primary" id="main-nav"></nav>
  </header>

  <main>
    <section class="section hero reveal">
      <div class="hero-copy">
        <p class="eyebrow" id="index-eyebrow">APPLIED SCIENTIST / MULTIMODAL AI / REMOTE SENSING</p>
        <h1 id="index-name">Vicky Feliren</h1>
        <p class="lead" id="index-lead1" style="font-size:1.32rem;line-height:1.5;max-width:42rem"></p>
        <p class="lead" id="index-lead2" style="font-size:1.08rem;margin-top:1.2rem;color:var(--muted)"></p>
        <div class="hero-actions" id="index-buttons"></div>
        <ul class="hero-meta" id="index-meta"></ul>
        <div class="bg-controls">
          <p>Background Point Cloud</p>
          <div class="shape-controls" role="group" aria-label="Point cloud shape">
            <button class="shape-btn is-active" type="button" data-shape="knot">Knot</button>
            <button class="shape-btn" type="button" data-shape="gyroid">Gyroid</button>
            <button class="shape-btn" type="button" data-shape="helix">Helix</button>
            <button class="shape-btn" type="button" data-shape="sphere">Sphere</button>
          </div>
          <div class="lab-foot">
            <span id="shape-label">Shape: Knot</span>
            <span id="point-count">Points: 2800</span>
            <span>Drag anywhere to orbit · Alt + Scroll to zoom</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Vicky Feliren · VF</p>
  </footer>

  <script src="js/data/index.js"></script>
  <script src="js/main.js?v=2"></script>
  <script>
(function() {
  var d = INDEX_DATA;
  if (!d) return;
  document.getElementById('index-eyebrow').textContent = d.eyebrow || '';
  document.getElementById('index-name').textContent = d.name || '';
  document.getElementById('index-lead1').textContent = d.lead1 || '';
  document.getElementById('index-lead2').textContent = d.lead2 || '';
  if (d.buttons) {
    document.getElementById('index-buttons').innerHTML = d.buttons.map(function(b) {
      return '<a class="btn btn-primary" href="' + b.href + '">' + b.label + '</a>';
    }).join('');
  }
  if (d.meta) {
    document.getElementById('index-meta').innerHTML = d.meta.map(function(m) {
      return '<li>' + m + '</li>';
    }).join('');
  }
})();
  </script>
  <script src="js/components/nav.js"></script>
</body>
</html>
